// Factory wire protocol.
//
// Transport: one WebSocket connection per client. Every binary frame carries
// exactly one message: ClientMessage from client to server, ServerMessage from
// server to client. Text frames are not part of the protocol.
//
// Handshake: the client's first message must be `hello`. The server answers
// with `welcome`, then sends `workspace` and, if an agent is selected, its
// `transcript`. On failure it sends `error` and closes the connection.
//
// Correlation: a client message that expects an answer carries a non-zero
// `id`, and the server echoes it in `reply_to` on `ack` or `error`. Messages
// the server sends on its own (events) have `reply_to = 0`.
//
// State lives in the backend (TENETS.md, tenet 7). Every client sees the same
// workspace, including which agent is selected. The server pushes a full
// `workspace` snapshot whenever any of it changes, and streams the selected
// agent's transcript.
//
// Compatibility: the backend and frontend update independently, so new
// versions must keep talking to old ones. Only add fields and messages; never
// renumber, retype or reuse a field number. A change that breaks this rule
// needs a new protocol version.
syntax = "proto3";

package factory.v1;

message ClientMessage {
  uint64 id = 1;
  oneof body {
    Hello hello = 2;
    CreateProject create_project = 3;
    CreateAgent create_agent = 4;
    UpdateAgent update_agent = 5;
    SelectAgent select_agent = 6;
    SendMessage send_message = 7;
    StopAgent stop_agent = 8;
    StartLogin start_login = 9;
    AnswerLogin answer_login = 10;
    CancelLogin cancel_login = 11;
    SignOut sign_out = 12;
    DeleteAgent delete_agent = 13;
    DeleteProject delete_project = 14;
    UpdateProject update_project = 15;
    UpdateSettings update_settings = 16;
    RestoreSettings restore_settings = 17;
    InstallUpdate install_update = 18;
    FocusProject focus_project = 19;
    ExpandFolder expand_folder = 20;
    ShowAllFiles show_all_files = 21;
    OpenPanel open_panel = 22;
    ArrangeAgent arrange_agent = 23;
    SetAgentCollapsed set_agent_collapsed = 24;
    RunCommand run_command = 25;
    CreateFolder create_folder = 26;
    UpdateFolder update_folder = 27;
    DeleteFolder delete_folder = 28;
    SetFolderCollapsed set_folder_collapsed = 29;
    SetHighlights set_highlights = 30;
    StopTask stop_task = 31;
    ChangeMonitor change_monitor = 32;
    CreatePairing create_pairing = 33;
    UnpairDevice unpair_device = 34;
    SetRemoteAccess set_remote_access = 35;
    FetchApp fetch_app = 36;
    ListFolders list_folders = 37;
    DecideProposal decide_proposal = 38;
    MoveAccount move_account = 39;
    ClearBuildCache clear_build_cache = 40;
    ReadFile read_file = 41;
    SetLayout set_layout = 42;
    UpdateAccount update_account = 43;
    // The vault (Settings → Secrets). The backend makes it by itself, and
    // the person's requests need no proof: see VaultProof.
    CreateVault create_vault = 44;
    UnlockVault unlock_vault = 45;
    LockVaultSession lock_vault_session = 46;
    CreateSecret create_secret = 47;
    UpdateSecret update_secret = 48;
    DeleteSecret delete_secret = 49;
    GrantSecret grant_secret = 50;
    RevokeSecret revoke_secret = 51;
    RevealSecret reveal_secret = 52;
    PreviewEnv preview_env = 53;
    ImportEnv import_env = 54;
    DecideSecretRequest decide_secret_request = 55;
    ListSecretUses list_secret_uses = 56;
    ChangePassphrase change_passphrase = 57;
    NewRecoveryKey new_recovery_key = 58;
    SetVaultLockedMode set_vault_locked_mode = 59;
    // This Claktory's sign-in at claktory.com (#116): see ClaktoryAccount.
    AccountSignIn account_sign_in = 60;
    AccountVerify account_verify = 61;
    AccountResend account_resend = 62;
    AccountSignOut account_sign_out = 63;
    SetAccountService set_account_service = 64;
    ShowRecoveryKey show_recovery_key = 65;
    // Pairing a device: allowing or turning away the device that used a
    // code, and cancelling a code (see PendingDevice).
    ApproveDevice approve_device = 66;
    DenyDevice deny_device = 67;
    CancelPairing cancel_pairing = 68;
    // Earlier entries of a transcript (see Transcript.has_earlier).
    LoadEntries load_entries = 69;
    // Uploading a file for an agent, in chunks (see StartUpload).
    StartUpload start_upload = 70;
    UploadChunk upload_chunk = 71;
    FinishUpload finish_upload = 72;
    CancelUpload cancel_upload = 73;
    // Comments on files (see Thread).
    ListThreads list_threads = 74;
    CreateThread create_thread = 75;
    ReplyThread reply_thread = 76;
    EditComment edit_comment = 77;
    DeleteComment delete_comment = 78;
    SetThreadStatus set_thread_status = 79;
    ReaddressThread readdress_thread = 80;
    ReattachThread reattach_thread = 81;
    SendComments send_comments = 82;
    DecideSuggestion decide_suggestion = 83;
    // The project whose files this connection shows on their own (the
    // iPhone's Files page).
    WatchFiles watch_files = 84;
    // Connecting a service (Cloudflare, AWS) to the vault: see Connector.
    StartConnect start_connect = 90;
    FinishConnect finish_connect = 91;
    CancelConnect cancel_connect = 92;
    DismissConnectProposal dismiss_connect_proposal = 93;
    ListConnectChoices list_connect_choices = 94;
    DeriveSecret derive_secret = 95;
    DisconnectService disconnect_service = 96;
    SetZoom set_zoom = 97;
    // The person uses one of an account's usage resets (see UsageReset).
    UseUsageReset use_usage_reset = 98;
    // The usage breakdown for a time range, on demand; answered with
    // UsageReport.
    LoadUsage load_usage = 99;
  }
}

message ServerMessage {
  uint64 reply_to = 1;
  oneof body {
    Welcome welcome = 2;
    Error error = 3;
    Ack ack = 4;
    Workspace workspace = 5;
    Transcript transcript = 6;
    EntryUpdate entry = 7;
    EntryDelta delta = 8;
    Explorer explorer = 9;
    ExtensionView extension_view = 10;
    QueuedMessages queued_messages = 11;
    Highlight highlight = 12;
    // The answer to CreatePairing, to the asker only.
    PairingCode pairing_code = 13;
    // The answer to FetchApp, to the asker only.
    AppChunk app_chunk = 14;
    // The answer to ListFolders, to the asker only.
    FolderList folder_list = 15;
    // The answer to ReadFile, to the asker only.
    FileContent file_content = 16;
    // The answer, to the asker only, to UnlockVault, ChangePassphrase,
    // DeleteSecret, GrantSecret, SetVaultLockedMode and LockVaultSession;
    // always 0 now (see VaultSession).
    VaultSession vault_session = 20;
    // The answer to RevealSecret, to the asker only.
    SecretValue secret_value = 21;
    // The answer to PreviewEnv, to the asker only.
    EnvPreview env_preview = 22;
    // The answer to CreateVault and NewRecoveryKey, to the asker only.
    RecoveryKey recovery_key = 23;
    // The answer to ListSecretUses, to the asker only.
    SecretUses secret_uses = 24;
    // To a device's Hello, with its pairing code's token, while it waits for
    // the person to allow it (see PendingDevice).
    PairingPending pairing_pending = 25;
    // The answer to LoadEntries, to the asker only.
    EntryPage entry_page = 26;
    // Instead of Workspace, to an app that asked for patches in Hello: what
    // changed since the last Workspace or WorkspacePatch it was sent.
    WorkspacePatch workspace_patch = 27;
    // The answers to StartUpload and UploadChunk, and to FinishUpload, to the
    // asker only.
    UploadProgress upload_progress = 28;
    UploadedFile uploaded_file = 29;
    // Every thread on a file: the answer to ListThreads, to the asker only,
    // and to everyone whenever a thread on it changes.
    ThreadList thread_list = 30;
    // To everyone, when a file shown in a pane changes.
    FileChanged file_changed = 31;
    // The answer to CreateThread, to the asker only: the new thread.
    Thread thread = 32;
    // The answer to StartConnect, to the asker only: what to open.
    ConnectStarted connect_started = 34;
    // The answer to ListConnectChoices, to the asker only.
    ConnectChoices connect_choices = 35;
    // The answer to UseUsageReset, to the asker only.
    UsageResetAnswer usage_reset_answer = 36;
    // The answer to LoadUsage, to the asker only.
    UsageReport usage_report = 37;
  }
}

// ---- Handshake ----

message Hello {
  uint32 protocol_version = 1;
  string client_version = 2;
  // The device's token from its pairing code (`factory://…?t=<token>`),
  // through the private tunnel (iroh); on the loopback port (7420) it isn't
  // needed.
  string token = 3;
  // What kind of device this is, so agents can fit their replies to it
  // (shorter on a phone). Its name the backend knows: the paired device's,
  // or this computer's for its own app. Unspecified from apps before it.
  DeviceKind device_kind = 4;
  // The app applies WorkspacePatch: after the first whole Workspace, the
  // backend sends only what changed. Apps before it get whole Workspaces.
  bool workspace_patches = 5;
}

enum DeviceKind {
  DEVICE_KIND_UNSPECIFIED = 0;
  // A computer at a desk: an iMac, a Mac mini or Studio, a desktop PC.
  DEVICE_KIND_DESKTOP = 1;
  // A laptop: a MacBook.
  DEVICE_KIND_LAPTOP = 2;
  DEVICE_KIND_PHONE = 3;
  DEVICE_KIND_TABLET = 4;
}

// Where the person sent a message from: the device their app ran on.
message SentFrom {
  // The paired device's name (Settings → Devices), or this computer's name
  // (its Computer Name on a Mac) for the app running on it.
  string device_name = 1;
  // As the app said in Hello; unspecified from apps before it.
  DeviceKind kind = 2;
}

message Welcome {
  uint32 protocol_version = 1;
  string server_version = 2;
  // Through the tunnel, the paired device this connection is (see
  // RemoteAccess.devices), so the app can mark it "This device"; "local" for
  // this machine's own app (its code from <data folder>/remote/local-pairing);
  // empty on the loopback port.
  string device_id = 3;
  // This Claktory's name and color (see Settings), to show before the first
  // Workspace.
  string name = 4;
  string color = 5;
}

// Pairs a new device with this Factory. Answered with PairingCode. Refused
// while remote access is off (RemoteAccess.on).
message CreatePairing {
  // What the device is called, e.g. "Laptop".
  string name = 1;
  // No longer used: devices reach this machine through the tunnel, by its
  // endpoint id (RemoteAccess.endpoint_id), wherever they are.
  string host = 2;
}

// A new device's pairing code. Sent only to the client that asked, once:
// Factory keeps only a hash of the key in it.
message PairingCode {
  // factory://?t=<token>&name=<this machine>&e=<endpoint id>[&r=<relay
  // URL>…]: what the device pastes or scans to connect, through the tunnel.
  // e= is the backend's iroh endpoint id (what iroh's EndpointId parses);
  // each r= a relay it can be reached through (percent-encoded). Until it's
  // first used it expires (PairedDevice.code_expires_ms); the first device
  // to connect with it binds its key to it, and no other key can use it.
  // That device gets in once the person allows it (PendingDevice).
  string code = 1;
  // The new device's id in RemoteAccess.devices.
  string device_id = 2;
}

// Unpairs a device: it can't connect any more, and its open connections
// close. Answered with Ack.
message UnpairDevice {
  string device_id = 1;
}

// Allows a device that's waiting (RemoteAccess.pending_devices): it's
// paired, and its waiting connection gets Welcome. Answered with Ack;
// ERROR_CODE_NOT_FOUND when no device with that id is waiting (its code
// expired or was cancelled meanwhile).
message ApproveDevice {
  string device_id = 1;
}

// Turns away a device that's waiting: its code stops working, the device is
// forgotten (make a new code to pair it), and its waiting connection gets
// ERROR_CODE_UNAUTHORIZED. Answered with Ack; ERROR_CODE_NOT_FOUND when no
// device with that id is waiting.
message DenyDevice {
  string device_id = 1;
}

// Cancels a pairing code that hasn't let a device in yet, when the person
// closes Add a device: the code stops working and the device is forgotten
// (a device waiting with it is turned away). A code exists only while the
// person is pairing: this, or its 10 minutes running out, ends it. Answered
// with Ack, also when the device is already gone; a device already allowed
// stays paired.
message CancelPairing {
  string device_id = 1;
}

// The answer to a device's Hello while it waits to be allowed. The
// connection stays open: Welcome follows (replying to the Hello) once the
// person allows it, or Error ERROR_CODE_UNAUTHORIZED, with why, once it's
// turned away, cancelled or its code expires. Meanwhile the device shows
// PendingDevice.number, worked out on its own side.
message PairingPending {
  // Its id in RemoteAccess.devices.
  string device_id = 1;
  // The name it was given when its code was made.
  string name = 2;
  // The name of the computer Claktory runs on, which asks the person
  // (RemoteAccess.machine).
  string machine = 3;
  // When its code stops working, in ms since 1970.
  int64 expires_ms = 4;
}

// Turns remote access (devices on other machines reaching this Factory
// through the private tunnel) on or off, in config.json's `remote`. Answered
// with Ack.
message SetRemoteAccess {
  bool on = 1;
  // No longer used (there's no listening port); kept in config.json.
  uint32 port = 2;
  // No longer used; kept in config.json.
  optional string listen = 3;
  // The relays to use, as URLs (config.json `remote.relays`), when
  // set_relays; empty for the default ones (RemoteAccess.relays).
  repeated string relays = 4;
  bool set_relays = 5;
}

// Remote access: devices on other machines connecting to this Factory,
// through the private tunnel (iroh): end-to-end encrypted, by the backend's
// key, directly or through a relay that can't read it. Factory listens on no
// port for them.
message RemoteAccess {
  // config.json has `remote`: paired devices may connect. Off, only this
  // machine's app can (the tunnel then binds to 127.0.0.1 only).
  bool on = 1;
  // No longer used (config.json's `remote.port` is kept, unused).
  uint32 port = 2;
  // No longer used.
  string listen = 3;
  // The tunnel can't run, and why; empty while all's well.
  string error = 4;
  // No longer used (there's no certificate to pin): empty.
  string fingerprint = 5;
  // No longer used: empty.
  repeated string addresses = 6;
  repeated PairedDevice devices = 7;
  // This machine's name ("mac-mini"), which pairing codes give until the
  // Claktory is renamed (Settings.name).
  string machine = 8;
  // This backend's iroh endpoint id, as pairing codes give it (e=).
  string endpoint_id = 9;
  // The relays it uses while on: config.json's `remote.relays`, or the
  // default ones (n0's for now) when that's empty.
  repeated string relays = 10;
  // config.json sets its own relays (relays are those); false for the
  // default ones.
  bool custom_relays = 11;
  // The relay it's connected to now (its home relay), and whether it is;
  // empty and false while off or offline.
  string home_relay = 12;
  bool relay_connected = 13;
  // Devices that used a pairing code and wait for the person to allow them,
  // oldest first. Each is also in `devices`, with its code_expires_ms.
  repeated PendingDevice pending_devices = 14;
}

// A device that connected with a pairing code and waits to be allowed: a
// code lets a device in only once the person allows it, on a device that's
// already in (ApproveDevice), or turns it away (DenyDevice). Only the first
// device to use a code asks; any other is turned away. The new device shows
// the same number (see `number`), so the person can tell it's theirs and
// not one that copied the code.
message PendingDevice {
  // Its id in RemoteAccess.devices (PairingCode.device_id).
  string device_id = 1;
  // The name it was given when its code was made.
  string name = 2;
  // What it says it is, from its Hello.
  DeviceKind kind = 3;
  // Four digits, e.g. "0427", that the new device shows too. Both sides
  // work it out: SHA-256 of the UTF-8 text "claktory pairing\n" + this
  // Claktory's endpoint id (the code's e=, lowercase hex) + "\n" + the
  // device's own endpoint id (lowercase hex) + "\n" + the SHA-256 of the
  // code's token (t=, the SHA-256 of its text) in lowercase hex; its first
  // four bytes as a big-endian unsigned number, modulo 10000, with leading
  // zeros. For example, with endpoint ids of 64 "a"s and 64 "b"s and the
  // token "0123456789abcdef": "0722".
  string number = 4;
  // When it asked, in ms since 1970.
  int64 requested_ms = 5;
  // When its code stops working, and it's turned away, unless allowed.
  int64 expires_ms = 6;
}

// How a device's connection travels.
enum DevicePath {
  // Not connected.
  DEVICE_PATH_NONE = 0;
  // Straight between the two machines (the same machine, a LAN, or a hole
  // punched through the NATs).
  DEVICE_PATH_DIRECT = 1;
  // Through a relay, end-to-end encrypted.
  DEVICE_PATH_RELAYED = 2;
}

message PairedDevice {
  string id = 1;
  string name = 2;
  // When it was paired, in ms since 1970.
  int64 paired_ms = 3;
  // When it last connected; 0 if it never has.
  int64 last_seen_ms = 4;
  // It's connected now.
  bool connected = 5;
  // The IP address it last connected from; empty if it never has, or when
  // only a relay carried it.
  string last_address = 6;
  // How it's connected now; NONE when it isn't.
  DevicePath path = 7;
  // Its pairing code hasn't been used yet and stops working at this time
  // (ms since 1970); 0 once a device has used it. Past it, the device can't
  // connect: pair it again.
  int64 code_expires_ms = 8;
}

// ---- Requests (client → server). Each is answered with `ack` or `error`. ----

// Creates a project. Its folder is named after it, inside Factory's
// workspace folder, and is created if it doesn't exist. Clients send only the
// name; `path` is for callers that need a specific folder.
message CreateProject {
  string name = 1;
  string path = 2;
}

// Creates an agent and selects it. An empty `project_id` puts it in the
// workspace, outside any project. Empty `model` or `effort` means the Factory
// default.
message CreateAgent {
  string project_id = 1;
  string name = 2;
  // The agent's prompt: instructions added to its system prompt.
  string prompt = 3;
  string model = 4;
  string effort = 5;
  // One of the agent colors (see Agent.color); empty lets Factory pick.
  string color = 6;
  // One of its project's folders (Project.folders) to work in; empty for the
  // project's own folder.
  string folder_id = 7;
  // What it does, shown with its name (see Agent.role); empty for none.
  string role = 8;
}

// Changes an agent's settings. Unset fields stay as they are. Takes effect
// from the agent's next step (its next model call), mid-run too; what's
// display only (color, placeholder, avatar) at once.
message UpdateAgent {
  string agent_id = 1;
  optional string name = 2;
  optional string prompt = 3;
  optional string model = 4;
  optional string effort = 5;
  // Moves the agent to another project; empty moves it to the workspace. Its
  // conversation goes with it, and it works in the new folder from its next
  // step.
  optional string project_id = 6;
  // One of the agent colors (see Agent.color).
  optional string color = 7;
  // Changes one of the agent's extensions.
  ExtensionChange extension = 8;
  // What its message box says when empty (see Agent.placeholder); empty
  // goes back to "Message <name>".
  optional string placeholder = 9;
  // Deprecated and ignored: agents work in their project's folders
  // (folder_id) instead.
  optional string folder = 10;
  // The project folder it works in (see Agent.folder_id): one of its
  // project's folders, or empty for the project's own folder. Moving the agent
  // to another project without this puts it in that project's own folder.
  optional string folder_id = 11;
  // Its character's body shape (see Agent.avatar_shape); empty goes back to
  // automatic. Display only, like color.
  optional string avatar_shape = 12;
  // Unused: characters no longer have faces, and this is ignored.
  optional string avatar_face = 13;
  // What it does (see Agent.role); empty clears it.
  optional string role = 14;
}

// Turns an extension on or off for an agent, and/or sets one of its options.
message ExtensionChange {
  // The extension's id, e.g. "agents".
  string id = 1;
  // Turns it on or off; unset leaves it as it is.
  optional bool enabled = 2;
  // The option to set to `value`; empty sets none.
  string option_id = 3;
  OptionValue value = 4;
}

// Selects the agent every client shows. The server answers with that agent's
// `transcript`.
message SelectAgent {
  string agent_id = 1;
}

// Gives an agent a message. If it's busy, the message waits for the current
// run to finish.
message SendMessage {
  string agent_id = 1;
  string text = 2;
  // Made up by the app for this send, so it can show the message at once and
  // match it to the queued message and transcript entry it becomes, which
  // carry it (QueuedMessage.client_id, UserText.client_id). Optional.
  string client_id = 3;
  // Files uploaded for this agent (UploadedFile.attachment, as answered),
  // which the message carries; with any, `text` may be empty. Each must be in
  // the agent's uploads folder and still there, or the message is refused.
  repeated Attachment attachments = 4;
}

// A file the person attached to a message: uploaded to the agent's uploads
// folder on the machine Claktory runs on, for the agent to move where it
// belongs.
message Attachment {
  // Where it's stored: <data folder>/agents/<agent id>/uploads/<yyyy-mm-dd>/<name>.
  string path = 1;
  // Its name as stored: the file's own, with " 2", " 3"… before the
  // extension when the day's folder already has one so named.
  string name = 2;
  // In bytes.
  uint64 size = 3;
  // Its type as the app gave it, such as "image/png"; may be empty.
  string mime = 4;
}

// Starts (or resumes) uploading a file for an agent: answered with
// UploadProgress, saying how much the backend has (0 for a new upload).
// Then UploadChunk from that offset, each answered with UploadProgress, and
// FinishUpload, answered with UploadedFile. A connection that drops can
// resume with the same `upload_id` and file while the backend runs; after a
// restart of the backend it starts again from 0. Refused (with an error
// saying why) for a file over 2 GB, an agent that doesn't exist, or a disk
// without room for it and 1 GB to spare.
message StartUpload {
  // Made up by the app, unique for the file being uploaded.
  string upload_id = 1;
  string agent_id = 2;
  // The file's name; only its last part is kept.
  string name = 3;
  // Its whole size in bytes.
  uint64 size = 4;
  // Its type, such as "image/png"; optional.
  string mime = 5;
}

// Part of an upload's file, from `offset`, which must be how much the backend
// has (UploadProgress.received). At most 1 MiB each.
message UploadChunk {
  string upload_id = 1;
  uint64 offset = 2;
  bytes data = 3;
}

// The whole file is sent: the backend checks its SHA-256 (hex; optional),
// stores it and answers with UploadedFile. Refused if any of it is missing
// or the hash differs, and the upload is gone.
message FinishUpload {
  string upload_id = 1;
  string sha256 = 2;
}

// Abandons an upload; what the backend had of it is deleted.
message CancelUpload {
  string upload_id = 1;
}

// Stops the agent's current run.
message StopAgent {
  string agent_id = 1;
}

// Deletes an agent and its conversation. A running agent is stopped first.
message DeleteAgent {
  string agent_id = 1;
}

// Removes a project and deletes its agents. The project's folder and its files
// are left alone.
message DeleteProject {
  string project_id = 1;
}

// Adds a folder to a project (see Project.folders). An empty `path` puts it
// in the project's folder, named after it. The folder is created if missing.
message CreateFolder {
  string project_id = 1;
  string name = 2;
  // Absolute; anywhere on the machine (a repository elsewhere, say).
  string path = 3;
}

// Renames a project's folder, or points it at another folder on disk (files
// aren't moved). Unset fields stay as they are.
message UpdateFolder {
  string project_id = 1;
  string folder_id = 2;
  optional string name = 3;
  optional string path = 4;
}

// Removes a folder from its project. Its agents go to the project's own
// folder; no files are deleted.
message DeleteFolder {
  string project_id = 1;
  string folder_id = 2;
}

// Renames a project. Its folder keeps its name.
message UpdateProject {
  string project_id = 1;
  optional string name = 2;
  // Archives the project (true) or brings it back (false); see
  // Project.archived.
  optional bool archived = 3;
}

// Changes Factory-wide settings. Unset fields stay as they are. An empty
// `default_effort` picks one the default model accepts.
message UpdateSettings {
  optional string default_model = 1;
  optional string default_effort = 2;
  optional uint64 compact_at_tokens = 3;
  // The Resources alerts' thresholds (see Settings); cpu_percent 0 turns its
  // alert off. Percentages run 1 to 100.
  optional uint32 ram_percent = 4;
  optional uint32 disk_free_gb = 5;
  optional uint32 disk_free_percent = 6;
  optional uint32 cpu_percent = 7;
  // The sidebar's and the right panel's widths (see Settings); 0 for the
  // app's default. Negative or not finite is refused.
  optional double sidebar_width = 8;
  optional double panel_width = 9;
  // The build caches' budget (see Settings); 0 never clears them. Negative
  // is refused.
  optional double build_cache_gb = 11;
  // The user's first name (see Settings); "" removes it.
  optional string user_name = 10;
  // Unused: requests need no vault passphrase. Still kept in config.json.
  optional uint32 vault_unlock_minutes = 20;
  // See Settings.
  optional bool idle_compaction = 23;
  optional bool idle_compaction_short_cache = 24;
  // Sets one provider's or model's cache lifetime: ttl "5m" or "1h"; "" goes
  // back to the default (its provider's, or the provider's own).
  CacheTtl cache_ttl = 25;
  // This Claktory's name (see Settings); "" goes back to this computer's.
  optional string name = 26;
  // This Claktory's color (see Settings), one of the palette; "" goes back to
  // its default.
  optional string color = 27;
}

// Replaces a settings file that has an error (`Workspace.config_error`) with
// the settings Factory is still using. The broken file is kept next to it as
// config.broken.json.
message RestoreSettings {}

// Installs `Workspace.latest_release`: Factory swaps in its new backend and
// restarts (the connection drops and comes back). With `app_path`, the app
// bundle at that path on Factory's computer is replaced too and reopened once
// the app quits, so the app quits after the ack. From a device on another
// machine `app_path` is ignored: its app updates itself (see FetchApp).
message InstallUpdate {
  string app_path = 1;
}

// Asks for a chunk of the app of release `version` (Workspace.latest_release),
// for an app on another machine to update itself: it fetches the archive
// chunk by chunk, checks its size and SHA-256, unpacks it, sends
// InstallUpdate (with no app_path) and swaps itself. Answered with AppChunk,
// or an Error (NOT_FOUND) saying why this Factory can't send that app (no
// such release, no app in it, packing or downloading it failed).
message FetchApp {
  string version = 1;
  // Where the chunk starts, in bytes: 0 first, then the end of the last.
  uint64 offset = 2;
}

// A chunk of a release's app archive: a gzipped tar with the app bundle at
// its top level. The archive is made the first time any app asks for it;
// until it's ready, the answer is only `version` and `preparing`.
message AppChunk {
  string version = 1;
  uint64 offset = 2;
  // min(1 MiB, size - offset) bytes of the archive from `offset`.
  bytes data = 3;
  // The whole archive's size in bytes, and its SHA-256 (hex).
  uint64 size = 4;
  string sha256 = 5;
  // The bundle at the archive's top level: "Factory.app", or "Factory
  // Dev.app" for the dev Factory.
  string app_name = 6;
  // The archive is still being made (on a Linux machine, downloaded): ask
  // again in a second or two.
  bool preparing = 7;
}

// Lists the folders in a folder of the machine Factory runs on, so an app on
// another machine can pick a project's folder there by browsing. Answered
// with FolderList, or an Error (INVALID_REQUEST) saying why it can't be
// listed: not a full path, doesn't exist, isn't a folder, permission denied.
message ListFolders {
  // An absolute path, or one starting at the home folder: "" or "~" for the
  // home folder itself, "~/code" below it. ".." and links are resolved.
  string path = 1;
}

message FolderList {
  // The folder listed, as a full path with links and ".." resolved.
  string path = 1;
  // Its parent folder; empty at "/".
  string parent = 2;
  // The folders in it (links to folders too; files are left out), sorted by
  // name, case aside.
  repeated FolderEntry folders = 3;
  // The home folder of the user Factory runs as, for a Home button.
  string home = 4;
  // There were more than 5,000 folders; only the first 5,000 are listed.
  bool truncated = 5;
}

message FolderEntry {
  string name = 1;
  // Its name starts with ".": a hidden folder, which pickers usually hide.
  bool hidden = 2;
}

// Focuses a project: clients show only it, with its folder in the explorer.
// If the selected agent isn't in it, its first agent is selected (or none).
// An empty `project_id` leaves focus.
message FocusProject {
  string project_id = 1;
}

// Opens or closes a folder in a project's explorer. `path` is relative to the
// root it's in, with "/" between names.
message ExpandFolder {
  string project_id = 1;
  string path = 2;
  bool expanded = 3;
  // The root: empty for the project's own folder, else one of its folders
  // (Project.folders, Explorer.folders).
  string folder_id = 4;
  // Or an agent's own checkout (ExplorerRoot.agent_id); folder_id is empty then.
  string agent_id = 5;
}

// Shows a project's files on this connection (an Explorer for it comes, and
// again whenever it changes) until another WatchFiles or the connection
// closes, answered with Ack. An empty project_id watches none.
message WatchFiles {
  string project_id = 1;
}

// Shows the files the project's .factoryignore hides, or hides them again.
message ShowAllFiles {
  string project_id = 1;
  bool show_all = 2;
}

// Moves an agent in the sidebar: to a place among its siblings, under another
// agent, or into another project. Its children (and theirs) come with it.
// Refused, with nothing changed, if an id is unknown or it would be placed
// under itself or one of its own children.
message ArrangeAgent {
  string agent_id = 1;
  // The agent to nest it under; empty for the top level. In another project,
  // that moves it to that project.
  string parent_id = 2;
  // The sibling to place it before; empty to place it last.
  string before_id = 3;
  // Moves it to this project ("" for the workspace) at the top level or under
  // `parent_id`, which must then be in that project. Unset keeps its project,
  // or takes `parent_id`'s.
  optional string project_id = 4;
  // Puts it in this folder of its (new) project (see Agent.folder_id; "" for
  // the project's own folder), in the same step. Unset keeps its folder, or
  // the project's own folder when it moves to another project.
  optional string folder_id = 5;
}

// Folds an agent's children away in the sidebar, or shows them.
message SetAgentCollapsed {
  string agent_id = 1;
  bool collapsed = 2;
}

// Turns highlights (Workspace.highlights) on or off for this Factory.
message SetHighlights {
  bool on = 1;
}

// Stops an agent's background task (its whole process group). The agent gets
// the usual event that it finished, "stopped by the person".
message StopTask {
  string agent_id = 1;
  // Its id, such as "task-3".
  string task_id = 2;
}

// Pauses, resumes or cancels one of an agent's monitors (the Monitors
// panel's buttons), as the person. Pause and cancel stop a watch's command;
// resume picks up from now: a time monitor that came due meanwhile fires
// once. Refused (INVALID_REQUEST) when the monitor's state doesn't allow it,
// such as resuming an active one or changing an ended one.
message ChangeMonitor {
  string agent_id = 1;
  // Its number: 3 for m3.
  uint32 monitor_id = 2;
  MonitorAction action = 3;
}

// Clears one build cache now (a `DiskUsage` of kind "build_cache", by its
// `path`): moved aside at once, deleted in the background; the agents
// working there hear of it at their next run. Answered with Ack, or an error
// saying why not: it isn't a build cache Factory knows, or an agent is
// working there, or a build is running in it.
message ClearBuildCache {
  string path = 1;
}

// The person approves or dismisses an agent's proposal to Rivet (a
// `Proposal` entry in `agent_id`'s transcript), answered with Ack. Approved,
// Rivet gets it as the person's own message: `comment` (if any), a blank
// line, "<Agent> (<role>) proposes:" and the proposal. Either way the agent
// is told. An error when it's no longer pending, or when approving and
// there's no Rivet or Rivet has no model (it stays pending).
message DecideProposal {
  string agent_id = 1;
  string proposal_id = 2;
  bool approve = 3;
  // What the person adds for Rivet; may be empty.
  string comment = 4;
}

enum MonitorAction {
  MONITOR_ACTION_UNSPECIFIED = 0;
  MONITOR_ACTION_PAUSE = 1;
  MONITOR_ACTION_RESUME = 2;
  MONITOR_ACTION_CANCEL = 3;
}

// Folds a project folder's agents away in the sidebar, or shows them.
message SetFolderCollapsed {
  string project_id = 1;
  string folder_id = 2;
  bool collapsed = 3;
}

// Runs one of the agent's slash commands (`Agent.commands`), as the person
// typing "/<name> <args>" in its message box. A command that can't run now
// is an INVALID_REQUEST error whose message can be shown as it is.
message RunCommand {
  string agent_id = 1;
  // "clear", without the slash.
  string name = 2;
  // What follows the name, trimmed; empty if nothing.
  string args = 3;
}

// Reads a file on Factory's machine, for a viewer: the app may be on another
// machine. Answered to the asker only with FileContent (whose `error` says
// why it couldn't be read), never with Error.
message ReadFile {
  // Absolute, or from the home folder ("~/notes.md").
  string path = 1;
  // At most this many bytes; 0 for the default. Text is read up to 2 MB and
  // images up to 20 MB, whatever is asked; videos (and any read from an
  // offset) 8 MB at a time.
  uint64 max_bytes = 2;
  // Read from this byte: a video is played a range at a time (offset 0, 8 MB,
  // 16 MB…, until offset + data's length is the size). Videos up to 2 GB,
  // and other files read from an offset too; larger ones come back with
  // `error`.
  uint64 offset = 3;
}

message FileContent {
  // As asked, with "~" expanded.
  string path = 1;
  // Sniffed from its content and extension: "text/plain", "text/markdown",
  // "application/json", "image/png", "image/jpeg", "image/gif",
  // "image/webp", "video/mp4", "video/quicktime", "video/webm",
  // "application/pdf", "application/octet-stream"…
  string mime = 2;
  // The whole file's size in bytes.
  uint64 size = 3;
  // Its bytes from `offset`, up to the limit.
  bytes data = 4;
  // `data` isn't the whole file: only its start, or a range of it.
  bool truncated = 5;
  // When it was last changed, in ms since 1970.
  int64 modified_ms = 6;
  // Why it couldn't be read ("No such file: …", "… is a folder", "Can't
  // read …: permission denied"); empty when it was. The rest is empty then.
  string error = 7;
  // The whole file's SHA-256, in lowercase hex. Text and images read from
  // the start leave it empty when `truncated`; videos and reads from an
  // offset always have it, the same for every range of one version of the
  // file. A thread made on this content says it in
  // CreateThread.version_sha256.
  string sha256 = 8;
  // Where `data` starts in the file: ReadFile.offset.
  uint64 offset = 9;
}

// Sets an agent's layout (`Agent.layout`) for every device, answered with
// Ack. Refused unless it has exactly one "chat" leaf, at most 12 leaves,
// unique non-empty ids, and splits of two or more children with as many
// positive weights (or none). An unset root, or a lone chat leaf, goes back
// to just the conversation.
message SetLayout {
  string agent_id = 1;
  ViewNode root = 2;
}

// A pane of an agent's main area, or a split of several.
message ViewNode {
  // Unique within the layout; the app keeps a pane by it.
  string id = 1;
  oneof node {
    ViewSplit split = 2;
    ViewLeaf leaf = 3;
  }
}

message ViewSplit {
  ViewAxis axis = 1;
  repeated ViewNode children = 2;
  // Each child's share, as many as children; empty for equal shares.
  repeated double weights = 3;
}

// ROW: children side by side, left to right; COLUMN: top to bottom.
enum ViewAxis {
  VIEW_AXIS_UNSPECIFIED = 0;
  VIEW_AXIS_ROW = 1;
  VIEW_AXIS_COLUMN = 2;
}

message ViewLeaf {
  // "chat" (the conversation, which every layout has once and can't be
  // closed), "text" or "image"; more kinds will come (pdf, documents,
  // dashboards, extension panels). An app that doesn't know a kind shows
  // that it can't show it here.
  string kind = 1;
  // The file it shows, absolute; empty for "chat".
  string path = 2;
  // What its tab or header says: the file's name, unless set otherwise.
  string title = 3;
}

// Opens an extension's panel beside an agent (`Agent.open_panel`); an empty id
// closes it. Each agent keeps its own.
message OpenPanel {
  string extension_id = 1;
  // The agent; empty for the selected one.
  string agent_id = 2;
}

// ---- Comments ----

// A comment thread on a file, made in a viewer pane by the person or with an
// agent's comments tools. Threads belong to files, not panes: the same file
// shows the same threads wherever it's open. Each is addressed to one agent.
message Thread {
  // "t-41": unique in this Claktory.
  string id = 1;
  // The agent it's addressed to.
  string agent_id = 2;
  // The file, absolute.
  string path = 3;
  // The space its selectors were made in: "text" (the file's own text, in a
  // plain view or a file that isn't Markdown), "markdown" (a Markdown file's
  // formatted view) or "image".
  string kind = 4;
  // The file's SHA-256 (hex) that `selectors`, `source` and `rendered` refer
  // to: ThreadList.version_sha256 while the file exists.
  string version_sha256 = 5;
  // Where it is, as W3C Web Annotation selectors (each a JSON object with a
  // "type"): TextQuoteSelector {exact, prefix, suffix} and
  // TextPositionSelector {start, end} (UTF-16 code units) in its kind's text
  // for text files, FragmentSelector {conformsTo: "media-frags", value:
  // "xywh=percent:x,y,w,h"} for images. Kept up to date as the file changes,
  // for text files.
  repeated Selector selectors = 6;
  ThreadStatus status = 7;
  AnchorState anchor = 8;
  // Where it is in the file's text now; unset when DETACHED and for images.
  TextAnchor source = 9;
  // The same range in the plain text of a Markdown file's formatted view;
  // set for Markdown files only (and unset when DETACHED). Find `exact` in
  // the rendered text, nearest `start`.
  TextAnchor rendered = 10;
  // The text it was made on, as quoted then (`exact` of the first TextQuoteSelector):
  // for "text changed since this comment" and the Detached group.
  string original_exact = 11;
  // Oldest first; the first is the one that opened it.
  repeated ThreadComment comments = 12;
  int64 created_ms = 13;
  // When a comment, its status or its address last changed.
  int64 updated_ms = 14;
  // A change to its text, proposed by the person or an agent; unset for none.
  Suggestion suggestion = 15;
}

// A proposed replacement for a thread's text (a text file's), which the
// person accepts (Claktory makes the change) or rejects with
// DecideSuggestion; an agent may also make the person's change itself.
message Suggestion {
  // What replaces the text, as the file has it (Markdown in a Markdown file);
  // empty to delete it.
  string replacement = 1;
  // The agent who suggested it; empty for the person.
  string author_agent_id = 2;
  SuggestionDecision decision = 3;
}

enum SuggestionDecision {
  // Not decided yet.
  SUGGESTION_DECISION_UNSPECIFIED = 0;
  SUGGESTION_DECISION_ACCEPTED = 1;
  SUGGESTION_DECISION_REJECTED = 2;
}

message Selector {
  // One selector, a JSON object with a "type".
  string json = 1;
}

enum ThreadStatus {
  THREAD_STATUS_UNSPECIFIED = 0;
  THREAD_STATUS_OPEN = 1;
  THREAD_STATUS_RESOLVED = 2;
}

enum AnchorState {
  ANCHOR_STATE_UNSPECIFIED = 0;
  // On the text it was made on.
  ANCHOR_STATE_ANCHORED = 1;
  // Found again, but the text there changed since (see original_exact).
  ANCHOR_STATE_MOVED = 2;
  // Not found in the file any more (or the file is gone); kept, never
  // dropped. ReattachThread puts it on new text.
  ANCHOR_STATE_DETACHED = 3;
  // An image thread on a file that changed since: it may still be right.
  ANCHOR_STATE_OUTDATED = 4;
}

// A range of text: in a file's own text (Thread.source), or in the plain text
// of a Markdown file's formatted view (Thread.rendered).
message TextAnchor {
  // UTF-16 code units, end exclusive.
  int32 start = 1;
  int32 end = 2;
  // The text in the range, and up to 32 characters before and after it.
  string exact = 3;
  string prefix = 4;
  string suffix = 5;
  // The file's lines it spans, from 1; 0 in Thread.rendered.
  int32 first_line = 6;
  int32 last_line = 7;
}

message ThreadComment {
  // "c-97": unique in this Claktory.
  string id = 1;
  // The agent who wrote it; empty for the person.
  string author_agent_id = 2;
  // Markdown.
  string body = 3;
  int64 created_ms = 4;
  // When the person last edited it; 0 if never.
  int64 edited_ms = 5;
  // The person's comment, not sent to the agent yet (SendComments sends it).
  // Agents never see drafts.
  bool draft = 6;
}

// Asks for every thread on a file, open and resolved: answered with
// ThreadList. Ask when a viewer opens it (and after reconnecting); after
// that, a ThreadList comes whenever a thread on it changes.
message ListThreads {
  // Absolute, or from the home folder.
  string path = 1;
}

message ThreadList {
  // Absolute.
  string path = 1;
  // The file's SHA-256 (hex) now, which its text threads' anchors refer to;
  // empty when it's gone or too big to comment on.
  string version_sha256 = 2;
  repeated Thread threads = 3;
}

// A file shown in an agent's pane changed: read it again.
message FileChanged {
  string path = 1;
  // Its SHA-256 now (hex); empty when it's gone.
  string sha256 = 2;
  // The agent whose write_file or edit_file changed it; empty when it was
  // changed some other way (a command, another app).
  string by_agent_id = 3;
}

// The person starts a thread, answered with the new Thread (or an Error whose
// message can be shown as it is, such as "The text changed; select it
// again."). It's a draft until sent, unless send_now.
message CreateThread {
  // The agent it's addressed to.
  string agent_id = 1;
  string path = 2;
  // "text", "markdown" or "image" (see Thread.kind).
  string kind = 3;
  // FileContent.sha256 of the content the selection was made on. When the
  // file changed since, the thread is put on the same text in the file as it
  // is now, or refused if it isn't there any more.
  string version_sha256 = 4;
  // "text": TextQuoteSelector and TextPositionSelector in the file's text.
  // "markdown": TextQuoteSelector (and TextPositionSelector, if known) in the
  // formatted view's plain text. "image": a FragmentSelector.
  repeated Selector selectors = 5;
  // The first comment, Markdown; not empty, unless it suggests a change
  // (then a comment with an empty body carries it until it's sent).
  string body = 6;
  // Send it to the agent now, alone, rather than as a draft.
  bool send_now = 7;
  // A replacement the person suggests for the text (text and Markdown only;
  // see Suggestion).
  optional string suggestion = 8;
}

// The person replies on a thread, answered with Ack: a draft until sent,
// unless send_now. Replying reopens a resolved thread.
message ReplyThread {
  string thread_id = 1;
  string body = 2;
  bool send_now = 3;
}

// Changes one of the person's comments, answered with Ack. One already sent
// stays as the agent read it in its conversation; it sees the change the
// next time it lists the thread.
message EditComment {
  string comment_id = 1;
  string body = 2;
}

// Deletes one of the person's comments, answered with Ack. A thread left
// with no comments is deleted with it.
message DeleteComment {
  string comment_id = 1;
}

// Resolves or reopens a thread, answered with Ack.
message SetThreadStatus {
  string thread_id = 1;
  bool resolved = 2;
}

// Addresses a thread to another agent, answered with Ack. Its drafts go to
// that agent when sent.
message ReaddressThread {
  string thread_id = 1;
  string agent_id = 2;
}

// Puts a thread on a new selection (of a DETACHED one, say), answered with
// Ack; the fields mean what they do in CreateThread.
message ReattachThread {
  string thread_id = 1;
  string kind = 2;
  string version_sha256 = 3;
  repeated Selector selectors = 4;
}

// Sends the person's drafts on a file to the agent they're addressed to, as
// one message it reads as an event; answered with Ack.
message SendComments {
  string agent_id = 1;
  // Absolute; empty for every file.
  string path = 2;
}

// Accepts a thread's suggestion (Claktory replaces the text with it in the
// file, and resolves the thread) or rejects it (resolves it unchanged),
// answered with Ack. Accepting is refused, with an Error whose message can be
// shown as it is, when the text changed since the suggestion was made
// (Thread.anchor isn't ANCHORED). The agent who suggested it is told.
message DecideSuggestion {
  string thread_id = 1;
  bool accept = 2;
}

// ---- Sign-in ----
//
// One sign-in runs at a time, shown to every client as `Workspace.login`.
// Starting one cancels any other. The flow is driven by the provider: it may
// publish a URL to open, a device code to enter, or ask a question
// (`LoginFlow.prompt`) that the client answers with `AnswerLogin`.
//
// Browser sign-in: the client that started it opens `LoginFlow.url`. If the
// browser runs on the backend's machine, the provider's redirect reaches the
// backend and sign-in finishes by itself. Otherwise the user pastes the code
// or the address the browser landed on, as the answer to the `CODE` prompt
// that waits alongside.

// Starts signing in to a provider with one of its `Provider.methods`.
message StartLogin {
  string provider_id = 1;
  string method_id = 2;
  // Signs in to another account of the provider, keeping the ones signed in
  // (a second Claude subscription, say). False signs in as before: the
  // account replaces the first one, unless it's one already signed in, which
  // is signed in again.
  bool add_account = 3;
}

// Answers `LoginFlow.prompt`: the pasted code or redirect address, the secret,
// the text, or the chosen option's id.
message AnswerLogin {
  string text = 1;
}

// Cancels the sign-in in progress, or dismisses one that failed.
message CancelLogin {}

// Removes the credential Factory stored for a provider.
message SignOut {
  string provider_id = 1;
  // The account to sign out of (`Account.id`); empty signs out of all of the
  // provider's accounts.
  string account_id = 2;
}

// Moves one of a provider's accounts to `position` (0 is first) in the
// order requests try them: the first with capacity is used. Answered with Ack.
message MoveAccount {
  string provider_id = 1;
  string account_id = 2;
  uint32 position = 3;
}

// Changes one of a provider's accounts. Answered with Ack.
message UpdateAccount {
  string provider_id = 1;
  string account_id = 2;
  // A name for it, such as "Work credits"; empty goes back to the one
  // Factory gives it (an API key's last characters). Unset leaves it.
  optional string label = 3;
  // Try it again now: an API key out of credit (`Account.out_of_credit`)
  // gets requests again, as if topped up.
  bool retry = 4;
}

// Uses one of an account's usage resets (`ProviderUsage.resets`), only ever
// at the person's word. Answered with UsageResetAnswer, then the account's
// usage is read again and reaches everyone with Workspace. An Error when the
// account or the reset isn't there (any more) or a reset is already being
// used on the account.
message UseUsageReset {
  string provider_id = 1;
  string account_id = 2;
  // `UsageReset.id`.
  string reset_id = 3;
}

// ---- Server → client ----

message Ack {}

message UsageResetAnswer {
  // A limit was reset.
  bool reset = 1;
  // What happened, a sentence or two to show as is: "Your 5-hour limit is
  // reset. 1 five-hour reset left.", or why nothing was used. A failure on
  // the way is an answer too, since the reset may have gone through.
  string message = 2;
  // Where the person can use the reset on the provider's own site, when it
  // refused Claktory's request or couldn't be reached
  // ("https://clau.de/reset"); empty otherwise.
  string fallback_url = 3;
}

message Error {
  ErrorCode code = 1;
  string message = 2;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  // The client speaks a protocol version the server doesn't. Connection closes.
  ERROR_CODE_UNSUPPORTED_PROTOCOL_VERSION = 1;
  // The first message wasn't `hello`. Connection closes.
  ERROR_CODE_HANDSHAKE_REQUIRED = 2;
  // A frame couldn't be decoded as a ClientMessage.
  ERROR_CODE_MALFORMED_MESSAGE = 3;
  // A valid message of a kind this server doesn't know (sent by a newer client).
  ERROR_CODE_UNKNOWN_MESSAGE = 4;
  // The request named a project, agent or provider that doesn't exist.
  ERROR_CODE_NOT_FOUND = 5;
  // The request's fields are invalid (empty name, unknown model, ...).
  ERROR_CODE_INVALID_REQUEST = 6;
  // The server failed to carry out a valid request (e.g. couldn't write a file).
  ERROR_CODE_INTERNAL = 7;
  // On the remote listener: the device's token isn't one of a paired device
  // (never paired, or unpaired since). Connection closes.
  ERROR_CODE_UNAUTHORIZED = 8;
  // The vault is locked (locked mode, after the backend restarted; only a
  // vault the person gave a key of their own can be): UnlockVault first.
  ERROR_CODE_VAULT_LOCKED = 9;
  // No longer sent: requests need no vault passphrase.
  ERROR_CODE_PROOF_REQUIRED = 10;
  // The passphrase (or recovery key) is wrong. Answered after a second's
  // delay.
  ERROR_CODE_WRONG_PROOF = 11;
  // The secret isn't granted to that agent (RevokeSecret).
  ERROR_CODE_NOT_GRANTED = 12;
  // The account service asks to wait (too many codes or tries); the
  // message says how long.
  ERROR_CODE_RATE_LIMITED = 13;
  // The account service can't be reached (or answered something Claktory
  // can't trust); the message says which. Claktory keeps working.
  ERROR_CODE_UNREACHABLE = 14;
}

// Everything the sidebar and headers need. Sent in full after `welcome` and
// whenever any part changes.
//
// The workspace is Factory's own folder. Each project is a folder inside it,
// and agents work in their project's folder, or in the workspace folder when
// they aren't in a project.
message Workspace {
  repeated Project projects = 1;
  repeated Agent agents = 2;
  // Models from providers Factory has credentials for.
  repeated Model models = 3;
  // Empty when no agent is selected.
  string selected_agent_id = 4;
  // Set when the config file on disk has an error; the last valid config stays
  // in effect until it's fixed.
  string config_error = 5;
  // Every provider Factory can use, signed in or not.
  repeated Provider providers = 6;
  // The sign-in in progress; unset when there is none.
  LoginFlow login = 7;
  Settings settings = 8;
  // This backend's build, e.g. "2026.11.18-1652"; "dev" for an unstamped build.
  // Versions of stamped builds sort in release order.
  string version = 9;
  // The newest release published for this Factory (scripts/release.sh); empty
  // when there is none. An app or backend older than it should update.
  string latest_release = 10;
  // The focused project; empty when none is. Its explorer follows as Explorer.
  string focused_project_id = 11;
  // Set when the last update's backend didn't start and Factory went back to
  // the one before; says which versions and why.
  string update_error = 12;
  // The backend in `latest_release`. Older than `latest_release` when the
  // release only changed the app: installing it doesn't restart the backend.
  string latest_backend = 13;
  // The color a new agent gets unless the person picks one: the one least
  // like any agent's color, so agents stay easy to tell apart.
  string next_agent_color = 14;
  // Every extension Factory has, whether or not any agent uses it.
  repeated Extension extensions = 15;
  // The selected agent's `Agent.open_panel`, for older apps; empty when no
  // agent is selected or its panel is closed.
  string open_panel = 16;
  // The person wants highlights shown (see Highlight). Factory sends them
  // either way; when this is off, the app doesn't show them.
  bool highlights = 17;
  // What changed in each version, newest first, from the changelog of the
  // newest release (`latest_release`): every version up to it, so the app can
  // show what an update brings (the versions newer than `version`) and what
  // the running one brought. Empty when there's no release or it has no
  // changelog. Only a dev release has an unreleased entry, first.
  repeated ChangelogVersion changelog = 18;
  // Devices on other machines: whether they can connect, and which are paired.
  RemoteAccess remote = 19;
  // The vault's state and its secrets' metadata, never values.
  VaultState vault = 20;
  // This Claktory's sign-in at claktory.com: the same on every device.
  ClaktoryAccount account = 21;
  // How this Claktory is arranged, for the Map: computed here, laid out by
  // the app.
  ClaktoryMap map = 22;
}

// A Workspace as a change to the last one this app was sent (a Workspace or
// a WorkspacePatch), so a busy Claktory doesn't resend everything each time
// one thing changes. The first state after connecting is always a whole
// Workspace; a patch only ever follows one.
message WorkspacePatch {
  // The new Workspace, but with what didn't change left out. Each field
  // numbered in `kept` is as it was: take it from the last one. Any other
  // field is as here, empty if it isn't set.
  //
  // `agents` is always the whole list, in order. An agent in `kept_agents`
  // carries only its id: take it from the last one. One in
  // `kept_agent_fields` carries only what changed (see there). Any other is
  // whole, as here.
  Workspace workspace = 1;
  // Workspace field numbers (e.g. 18 for `changelog`) unchanged since the
  // last one. Never 2 (`agents`).
  repeated uint32 kept = 2;
  // Ids of the agents unchanged since the last one.
  repeated string kept_agents = 3;
  // Agents that changed in only some fields (their status, say): in
  // `workspace.agents` each carries its id and the fields that changed. Take
  // the fields numbered in `kept` from the last one.
  repeated KeptFields kept_agent_fields = 4;
}

// Which of an agent's fields are unchanged since the last Workspace.
message KeptFields {
  // The agent's id.
  string id = 1;
  // Agent field numbers (e.g. 4 for `prompt`); never 1 (`id`).
  repeated uint32 kept = 2;
}

message ChangelogVersion {
  // e.g. "2026.11.18-2123"; empty for the unreleased entry.
  string version = 1;
  // When it was released (the time in its version), in ms since 1970; 0 for
  // the unreleased entry.
  int64 released = 2;
  // In the changelog's order.
  repeated ChangelogItem items = 3;
  // Changes not in a release yet (dev releases only).
  bool unreleased = 4;
}

message ChangelogItem {
  ChangelogKind kind = 1;
  // The change without its "Added"/"Changed:"/"Fixed:" prefix, starting with
  // a capital, e.g. "The Tasks panel lists background tasks".
  string text = 2;
  // The line as written, e.g. "Added the Tasks panel…".
  string raw = 3;
}

enum ChangelogKind {
  // A line with none of the prefixes.
  CHANGELOG_KIND_OTHER = 0;
  CHANGELOG_KIND_ADDED = 1;
  CHANGELOG_KIND_CHANGED = 2;
  CHANGELOG_KIND_FIXED = 3;
}

// Parts of the app to make glow briefly, so the person sees what happened or
// what an agent is pointing at. Transient: never stored or sent again, and
// only to the clients connected now.
message Highlight {
  repeated HighlightTarget targets = 1;
  // A short caption an agent gave (AGENT kind); may be empty.
  string text = 2;
  // The agent it came from: the sender of a message, or the agent that
  // called the highlight tool.
  string from_agent_id = 3;
  HighlightKind kind = 4;
}

// What to highlight. Kinds the app doesn't know are skipped. `kind` and `id`:
//
// - "agent": an agent's id (its sidebar row)
// - "project": a project's id
// - "checklist_item": "<agent id>#<item number>", e.g. "backend#4"
// - "extension": "<agent id>/<extension id>", that extension's icon for the agent, e.g. "backend/checklist"
// - "settings", "marketplace": the sidebar's buttons; `id` is empty
message HighlightTarget {
  string kind = 1;
  string id = 2;
}

enum HighlightKind {
  HIGHLIGHT_KIND_UNSPECIFIED = 0;
  // An agent messaged another (agents_send): targets[0] is the sender's
  // "agent" target, targets[1] the recipient's.
  HIGHLIGHT_KIND_MESSAGE = 1;
  // An agent asked for it with its highlight tool.
  HIGHLIGHT_KIND_AGENT = 2;
}

// A capability agents can have, such as messaging other agents. Each agent
// has it on or off (`Agent.extensions`), with its own option values.
message Extension {
  string id = 1;
  string name = 2;
  string description = 3;
  // Agents have it unless it's turned off for them.
  bool default_enabled = 4;
  repeated ExtensionOption options = 5;
  // A Lucide icon name, e.g. "users".
  string icon = 6;
  // For an instance of an extension (a named second use of it, on or off on
  // its own, such as "memory:factory", Factory's manual as a read-only
  // memory): the extension it belongs to, e.g. "memory". Its `id` is
  // "<base>:<name>" and works wherever an extension id does: AgentExtension,
  // ExtensionChange, OpenPanel, Agent.open_panel and ExtensionView. Empty for
  // an extension itself. Instances have no options and come right after
  // their extension.
  string base = 7;
  // Admin agents (Messaging's `admin` option, such as Rivet) have it unless
  // it's turned off for them; other agents only once it's turned on. Set for
  // instances and for extensions alike (Resources is one).
  bool admin_default = 8;
}

message ExtensionOption {
  string id = 1;
  // e.g. "Other agents can message it".
  string label = 2;
  string description = 3;
  // A SWITCH's default.
  bool default_value = 4;
  ExtensionOptionKind kind = 5;
  // AGENTS: the agent's own project's agents always count, whether listed or
  // not; show them checked and greyed, as "in its project".
  bool includes_project = 6;
}

enum ExtensionOptionKind {
  EXTENSION_OPTION_KIND_UNSPECIFIED = 0;
  // On or off: `OptionValue.on`.
  EXTENSION_OPTION_KIND_SWITCH = 1;
  // A list of agents: `OptionValue.agent_ids`.
  EXTENSION_OPTION_KIND_AGENTS = 2;
}

message OptionValue {
  // For a SWITCH.
  bool on = 1;
  // For an AGENTS list: agent ids.
  repeated string agent_ids = 2;
}

// An extension as one agent has it, with its options' effective values.
message AgentExtension {
  string id = 1;
  bool enabled = 2;
  // Every option of the extension, by option id.
  map<string, OptionValue> options = 3;
}

// What an extension's panel shows for an agent. Sent when the selected agent
// has the extension in `Workspace.open_panel` enabled, and again whenever it
// changes; a client shows it only while it matches the open panel and the
// selected agent.
message ExtensionView {
  string extension_id = 1;
  string agent_id = 2;
  string title = 3;
  oneof body {
    Checklist checklist = 10;
    Memory memory = 11;
    Messaging messaging = 12;
    Tasks tasks = 13;
    Monitors monitors = 14;
    Database database = 15;
    Resources resources = 16;
  }
}

// A database's tables, read only: the agent's own (extension "database"),
// or Factory's records (instance "database:factory").
message Database {
  // By name; empty when it has none yet.
  repeated DatabaseTable tables = 1;
  // Where the file is, for the person who wants to open it elsewhere.
  string path = 2;
}

message DatabaseTable {
  string name = 1;
  // A view rather than a table.
  bool view = 2;
  uint64 rows = 3;
  repeated DatabaseColumn columns = 4;
}

// How the machine and Factory use its resources (the Resources extension),
// sampled every minute; disk use is measured every 20 minutes.
message Resources {
  Machine machine = 1;
  // Factory's processes, biggest first: its backend, supervisor and app, and
  // agents' background tasks, monitors' watches and commands running now.
  repeated ResourceProcess factory = 2;
  // The machine's other processes using the most memory.
  repeated ResourceProcess others = 3;
  // What Factory's data takes (its home folder, then by part), then each
  // project's folders.
  repeated DiskUsage disk = 4;
  // The last hour's samples, oldest first.
  repeated ResourceSample history = 5;
  // When `machine` and the processes were sampled, and when the disk was
  // last measured (0 until it has been), in ms since 1970.
  int64 sampled = 6;
  int64 measured = 7;
  // The alerts in effect now, as the agents were told them.
  repeated string alerts = 8;
}

message Machine {
  // How busy all its processors are, 0 to 100.
  double cpu_percent = 1;
  uint32 cores = 2;
  // In bytes.
  uint64 memory_total = 3;
  uint64 memory_used = 4;
  uint64 swap_total = 5;
  uint64 swap_used = 6;
  // The volumes Factory uses.
  repeated Volume volumes = 7;
}

message Volume {
  // Where it's mounted, e.g. "/" or "/Volumes/Work".
  string mount = 1;
  // In bytes.
  uint64 total = 2;
  uint64 available = 3;
  // What of Factory's is on it: "Factory's data", then project names.
  repeated string uses = 4;
}

// A process of Factory's (with what it started) or another one.
message ResourceProcess {
  // "Factory's backend", "Supervisor", "App", "task-3 npm run dev",
  // "Monitor m2 tail -f app.log", "Commands running now", or another
  // process's name, such as "Docker".
  string label = 1;
  // backend, supervisor, app, task, monitor, command or other.
  string kind = 2;
  // The agent a task, monitor or command is of; empty otherwise.
  string agent_id = 3;
  // Its main process (a task's or monitor's process group).
  uint32 pid = 4;
  // How many processes it counts.
  uint32 processes = 5;
  // Over the last minute; 100 is one processor busy.
  double cpu_percent = 6;
  // Resident memory, in bytes.
  uint64 memory = 7;
}

message DiskUsage {
  // "Factory's data", "Releases", an agent's or project's name, a folder's.
  string label = 1;
  // home, releases, agent, project or folder; among an agent's, project's
  // or folder's parts, "build_cache" for each build cache in it (its
  // checkout's, or the folder's), which ClearBuildCache clears by `path`.
  string kind = 2;
  // The agent's or project's id.
  string id = 3;
  string path = 4;
  // In bytes. Checkouts are copy-on-write clones: their bytes are counted
  // in full though they share most of them.
  uint64 bytes = 5;
  // An agent's: its conversations, task logs, database and checkout, and its
  // checkout's build caches; a project's or folder's: its build caches.
  repeated DiskUsage parts = 6;
  // The walk took too long and stopped: `bytes` is at least this.
  bool partial = 7;
}

message ResourceSample {
  int64 time = 1;
  double cpu_percent = 2;
  uint64 memory_used = 3;
  uint64 swap_used = 4;
  // All of Factory's processes together.
  uint64 factory_memory = 5;
}

message DatabaseColumn {
  string name = 1;
  // As declared, e.g. "INTEGER"; may be empty.
  string type = 2;
}

// Whom an agent can message and who can message it, by the same rule as its
// tools. Names, colors and status come from the workspace's agents.
message Messaging {
  // Agent ids it can message, in sidebar order.
  repeated string reaches = 1;
  // Agent ids that can message it, in sidebar order.
  repeated string reached_by = 2;
}

// An agent's checklist: everything the person asked for, oldest first.
message Checklist {
  repeated ChecklistItem items = 1;
}

message ChecklistItem {
  // Small and per agent: #1, #2…
  uint32 id = 1;
  string text = 2;
  ChecklistStatus status = 3;
  // The agent id of who's on it; empty when unassigned.
  string owner = 4;
  // When it was added and last changed, in ms since 1970.
  int64 created = 5;
  int64 updated = 6;
  // What happened to it, oldest first.
  repeated ChecklistUpdate log = 7;
  // While it's blocked: the latest note made since it last became blocked
  // (what it waits on), the note's own text. Empty otherwise.
  string note = 8;
}

message ChecklistUpdate {
  // ms since 1970.
  int64 time = 1;
  // e.g. "Added", "Done: shipped", "Owner: frontend", or a note.
  string text = 2;
  // The agent id of who made it; empty for the person.
  string author = 3;
}

enum ChecklistStatus {
  CHECKLIST_STATUS_UNSPECIFIED = 0;
  CHECKLIST_STATUS_OPEN = 1;
  CHECKLIST_STATUS_IN_PROGRESS = 2;
  CHECKLIST_STATUS_DONE = 3;
  CHECKLIST_STATUS_DROPPED = 4;
  // Waiting on the person or something outside; still outstanding.
  CHECKLIST_STATUS_BLOCKED = 5;
}

// An agent's own memory: the person's preferences it learned and its
// knowledge notes. Only that agent reads and writes it.
message Memory {
  // By id.
  repeated MemoryPreference preferences = 1;
  // By slug.
  repeated MemoryNote notes = 2;
  // Newest first, the last 50.
  repeated MemoryChange changes = 3;
  // Factory's manual (instance "memory:factory"): notes only, which are
  // Factory's own docs; nothing is learned or changed, so there are no
  // preferences or changes.
  bool read_only = 4;
}

message MemoryPreference {
  // Small and per agent: #1, #2…; never reused.
  uint32 id = 1;
  // What the person wants or doesn't, e.g. "Don't propose paid CI".
  string rule = 2;
  // Why, e.g. "everything runs locally in Factory".
  string why = 3;
  // When it was added and last changed, in ms since 1970.
  int64 learned = 4;
  int64 updated = 5;
}

message MemoryNote {
  // a-z, 0-9 and -, e.g. "deploy-quirks".
  string slug = 1;
  // One line, up to 150 characters.
  string summary = 2;
  // Markdown.
  string body = 3;
  // ms since 1970.
  int64 created = 4;
  int64 updated = 5;
}

message MemoryChange {
  // ms since 1970.
  int64 time = 1;
  // The agent id of who made it; empty for the person.
  string actor = 2;
  MemoryChangeKind kind = 3;
  // Set for preference changes.
  uint32 preference_id = 4;
  // Set for note changes.
  string note_slug = 5;
  // A preference's rule (the old one when removed); a note's summary.
  string text = 6;
}

enum MemoryChangeKind {
  MEMORY_CHANGE_KIND_UNSPECIFIED = 0;
  MEMORY_CHANGE_KIND_PREFERENCE_ADDED = 1;
  MEMORY_CHANGE_KIND_PREFERENCE_CHANGED = 2;
  MEMORY_CHANGE_KIND_PREFERENCE_REMOVED = 3;
  MEMORY_CHANGE_KIND_NOTE_WRITTEN = 4;
  MEMORY_CHANGE_KIND_NOTE_EDITED = 5;
  MEMORY_CHANGE_KIND_NOTE_REMOVED = 6;
}

// The background tasks an agent can see (its own, or every agent's with
// see_all or admin): running ones first, newest first, then the 20 that
// ended most recently.
message Tasks {
  repeated BackgroundTask tasks = 1;
}

message BackgroundTask {
  // Per agent: "task-3".
  string id = 1;
  // The agent that started it.
  string agent_id = 2;
  string command = 3;
  // When it started and ended, in ms since 1970; ended is 0 while it runs.
  int64 started = 4;
  int64 ended = 5;
  bool running = 6;
  // How it ended: "exit 0", "exit 1", "signal SIGKILL", "timed out",
  // "stopped by Rivet", "stopped by the person"…; empty while it runs.
  string status = 7;
  // The absolute path of its output log.
  string log_path = 8;
  // The last lines of its output (about 20).
  string log_tail = 9;
}

// An agent's monitors: what will prompt it later, and what else will.
message Monitors {
  // Its monitors, oldest first: active, paused and failed ones, and ones that
  // ended in the last week.
  repeated Monitor monitors = 1;
  // What else will wake it, one line each, e.g. "task-3 (background task) —
  // wakes you when it exits", "checklist reminder — on: …".
  repeated string builtins = 2;
}

message Monitor {
  // Small and per agent: 3 for m3; never reused.
  uint32 id = 1;
  string name = 2;
  // What the agent is told when it fires.
  string prompt = 3;
  // What it waits for, in words, e.g. "every 1h", "check `make test` every
  // 5m, fires on failure", "files src/**/*.rs".
  string when = 4;
  // "at", "every", "cron", "check", "files" or "watch".
  string kind = 5;
  MonitorState state = 6;
  // Why it's paused or ended, e.g. "by the person", "by coordinator", "its
  // until passed"; may be empty.
  string reason = 7;
  // When it next fires or checks, in ms since 1970; 0 when it has no time
  // (files, watch, or not active).
  int64 next_due = 8;
  // When it last fired, in ms since 1970; 0 if it never has.
  int64 last_fired = 9;
  uint32 fires = 10;
  // When it ends on its own, in ms since 1970; 0 for never.
  int64 until = 11;
  // It ends after this many fires; 0 for no limit.
  uint32 max_fires = 12;
  // It fires only while the agent is idle.
  bool idle_only = 13;
  // The agent id of who set it; empty for the person.
  string created_by = 14;
  // ms since 1970.
  int64 created = 15;
}

enum MonitorState {
  MONITOR_STATE_UNSPECIFIED = 0;
  MONITOR_STATE_ACTIVE = 1;
  MONITOR_STATE_PAUSED = 2;
  // It ended on its own: once, until or max fires.
  MONITOR_STATE_DONE = 3;
  MONITOR_STATE_CANCELLED = 4;
  // It stopped working (its command kept failing or couldn't start, its
  // watch kept exiting or its log grew too big); `reason` says why. It can
  // be resumed.
  MONITOR_STATE_ERROR = 5;
}

message Settings {
  // Model for new agents that don't choose one: "<provider>/<model id>".
  string default_model = 1;
  string default_effort = 2;
  // Agents' contexts are compacted when they reach this many tokens.
  uint64 compact_at_tokens = 3;
  // When agents with the Resources extension are told the machine runs low
  // (config.json's `resources`), as in effect: memory used above this
  // percentage for a few minutes; a volume Factory uses with less free than
  // disk_free_gb GB or disk_free_percent of it, whichever is smaller; the
  // processors busier than cpu_percent for several minutes, 0 when that
  // alert is off.
  uint32 ram_percent = 4;
  uint32 disk_free_gb = 5;
  uint32 disk_free_percent = 6;
  uint32 cpu_percent = 7;
  // How wide the person dragged the sidebar and the right panel (the
  // extension panel), in logical pixels, the same on every device
  // (config.json's `display`); 0 for the app's default. The app keeps them
  // in its own range.
  double sidebar_width = 8;
  double panel_width = 9;
  // GB the build caches of one agent's checkout, or of one project folder,
  // may take (config.json's `resources.build_cache_gb`, 25 unless changed):
  // over it, Factory clears them while nothing works there. 0: never.
  double build_cache_gb = 11;
  // The user's first name, which agents call them by (config.json's
  // `user.name`); empty when not given, and agents say "the person".
  string user_name = 10;
  // Unused: requests need no vault passphrase (config.json's
  // `vault.unlock_minutes`, 5 unless changed).
  uint32 vault_unlock_minutes = 20;
  // An idle agent compacts its conversation just before its prompt cache
  // expires, so coming back to it later doesn't pay to cache the whole long
  // conversation again (config.json's `compaction.idle`, on unless changed).
  // Only for a cache Claktory knows the lifetime of (an hour: after 54
  // minutes idle; 5 minutes: only with `idle_compaction_short_cache`), and a
  // conversation of at least 150,000 tokens on a 200,000-token model (75% of
  // a smaller window, at most 200,000 on a larger one).
  bool idle_compaction = 23;
  // Also compact after 4 minutes idle when the cache lasts 5 minutes
  // (config.json's `compaction.idle_short_cache`, off unless changed). Far
  // more often than with an hour's cache.
  bool idle_compaction_short_cache = 24;
  // How long each provider's or model's prompt cache is asked to last, as
  // set (config.json's `prompt_cache`); what isn't listed asks for the
  // provider's default. See Provider.cache_ttl for what applies.
  repeated CacheTtl cache_ttls = 25;
  // This Claktory's name, the same on every device (config.json's `name`):
  // this computer's name (as RemoteAccess.machine) until someone renames it.
  string name = 26;
  // This Claktory's color, one of the agents' palette (see Agent.color),
  // the same on every device (config.json's `color`). Until someone picks
  // one, a color that stays the same for this Claktory, chosen from its key.
  string color = 27;
  // How much each device zooms the whole app (config.json's `display.zoom`),
  // by device id as Welcome.device_id gives it: "local" for this machine's
  // own app, which a connection on the loopback port without a token (an
  // empty Welcome.device_id) also counts as. 1.0 is actual size, which a
  // device not listed has; 0.5 to 2.0. Each device's own, since each has its
  // own screen; set with SetZoom.
  map<string, double> zoom = 28;
}

// How long a provider's (or one model's) prompt cache is asked to last.
message CacheTtl {
  // A provider id ("anthropic") or a model id ("anthropic/claude-opus-4-8"),
  // which wins over its provider's.
  string key = 1;
  // "5m" or "1h". An hour costs more to write the cache (2× input instead of
  // 1.25× on Anthropic) and keeps it through longer breaks.
  string ttl = 2;
}

message Provider {
  string id = 1;
  string name = 2;
  // How Factory is signed in, e.g. "Anthropic (Claude Pro/Max)" or
  // "ANTHROPIC_API_KEY". Empty when it isn't.
  string signed_in_with = 3;
  // Factory stored this credential and `SignOut` removes it. False for
  // credentials from the environment.
  bool can_sign_out = 4;
  // Ways to sign in, in the provider's order of preference.
  repeated LoginMethod methods = 5;
  // How much of its usage limits the signed-in subscription has used. Unset
  // when the provider isn't signed in or has no usage limits (API keys). Set
  // as soon as a subscription signs in, with no windows and `updated` 0 until
  // the first read lands.
  ProviderUsage usage = 6;
  // The signed-in subscription's plan as the provider names it, such as
  // "Claude Max 20x" or "ChatGPT Pro". Empty when it isn't signed in with a
  // subscription, or the plan hasn't been read or the provider doesn't say.
  string plan = 7;
  // Every account signed in to it, in the order requests try them. The fields
  // above describe the first, as before several accounts could be signed in.
  repeated Account accounts = 8;
  // How long its prompt cache is asked to last now, "5m" or "1h" (models with
  // their own setting may differ; see Settings.cache_ttls). Empty when
  // Claktory can't choose it for this provider and doesn't know how long it
  // lasts: its agents never compact while idle.
  string cache_ttl = 9;
}

// One account signed in to a provider, such as one of two Claude
// subscriptions. Requests go to the first account with capacity; when one
// reaches its usage limit they carry on with the next.
message Account {
  // Made by Factory, stable for as long as the account is signed in.
  string id = 1;
  // Who it is: a subscription's email, as the provider says (empty until
  // known); an API key's name, given with `UpdateAccount.label`, or else
  // its last characters ("sk-…a1b2"); a key from the environment, the
  // variable's name.
  string label = 2;
  // Its plan, such as "Claude Max 20x"; "API key" for a key; empty when
  // unknown.
  string plan = 3;
  // How much of its usage limits it has used; unset when it has none to read.
  ProviderUsage usage = 4;
  // Factory stored it and `SignOut` removes it (false for an API key from the
  // environment).
  bool can_sign_out = 5;
  // Requests go to it now.
  bool in_use = 6;
  // It reached a usage limit: requests skip it until then, in ms since 1970;
  // 0 when it has capacity.
  int64 exhausted_until = 7;
  // An API key that ran out of credit: requests skip it until it's tried
  // again, by itself every hour or with `UpdateAccount.retry`. Its
  // `exhausted_until` stays 0, since nothing says when it gets credit.
  bool out_of_credit = 8;
  // How it's signed in: the `LoginMethod` id, "oauth" (a subscription or
  // OAuth account) or "api_key" (a key, stored or from the environment).
  string method_id = 9;
}

message ProviderUsage {
  // The provider's limits; the one with id "weekly" (all models, per week) is
  // the headline.
  repeated UsageWindow windows = 1;
  // When usage was last read, in ms since 1970; 0 if it never was.
  int64 updated = 2;
  // Why the latest read failed; empty when it worked. `windows` and `updated`
  // then still hold the last good read, if there was one.
  string error = 3;
  // The usage resets the account has left, read with its usage (kept from
  // the last good read, like `windows`); empty when it has none or the
  // provider offers none. Only the person uses one, with UseUsageReset.
  repeated UsageReset resets = 4;
}

// Some of an account's usage resets, all of one kind: each refills some of
// its limits now, once.
message UsageReset {
  // The provider's id for it, given back in `UseUsageReset.reset_id`; may be
  // empty (the provider then picks one of the account's resets).
  string id = 1;
  // What it is, shown as is: "Fable reset", "5-hour reset", "Weekly reset",
  // "Full reset"; ChatGPT's own title for it, or else "Full reset".
  string label = 2;
  // What using it does, a sentence: "Refills your 5-hour limit."
  string detail = 3;
  // How many of these are left: 1 or more (spent ones aren't listed).
  uint32 left = 4;
  // How many it came with; 0 when the provider doesn't say.
  uint32 total = 5;
  // When the first of them expires, in ms since 1970; 0 when they don't.
  int64 expires_at = 6;
  // The provider says it can be used now. The person may still try one that
  // isn't: the provider's answer says what happened.
  bool usable = 7;
  // Why it can't be used now, a sentence ("It works only at a usage
  // limit."); empty when `usable`.
  string unavailable = 8;
  // The `UsageWindow` ids it refills ("five_hour", "weekly",
  // "weekly_fable"…); empty when the provider doesn't say.
  repeated string window_ids = 9;
}

// One usage limit, such as the weekly or the 5-hour one.
message UsageWindow {
  // "weekly", "five_hour", "weekly_opus", "weekly_sonnet", ...
  string id = 1;
  // Shown as is, e.g. "Weekly", "5-hour", "Weekly (Opus)".
  string label = 2;
  // 0-100.
  double used_percent = 3;
  // When the window resets, in ms since 1970; 0 if unknown.
  int64 resets_at = 4;
}

message LoginMethod {
  // "oauth" or "api_key".
  string id = 1;
  // e.g. "Anthropic (Claude Pro/Max)", "Anthropic API key".
  string label = 2;
}

message LoginFlow {
  string provider_id = 1;
  string method_id = 2;
  // Open this to sign in.
  string url = 3;
  // What to do with `url`.
  string instructions = 4;
  // Device-code sign-in: enter `user_code` at `verification_url`.
  string user_code = 5;
  string verification_url = 6;
  // Latest status message from the provider.
  string progress = 7;
  // A question waiting for `AnswerLogin`; unset when none.
  LoginPrompt prompt = 8;
  // Sign-in failed. The flow stays until `CancelLogin` dismisses it.
  string error = 9;
}

message LoginPrompt {
  LoginPromptKind kind = 1;
  string message = 2;
  string placeholder = 3;
  // For `SELECT`.
  repeated LoginOption options = 4;
}

enum LoginPromptKind {
  LOGIN_PROMPT_KIND_UNSPECIFIED = 0;
  LOGIN_PROMPT_KIND_TEXT = 1;
  // Hide what's typed (API keys).
  LOGIN_PROMPT_KIND_SECRET = 2;
  // Pick one of `options`; answer with its id.
  LOGIN_PROMPT_KIND_SELECT = 3;
  // Paste the authorization code or the full address the browser was
  // redirected to. Waits next to `LoginFlow.url`: only needed when the
  // redirect can't reach the backend.
  LOGIN_PROMPT_KIND_CODE = 4;
}

message LoginOption {
  string id = 1;
  string label = 2;
}

message Project {
  string id = 1;
  string name = 2;
  // Absolute path of the project's folder.
  string path = 3;
  // Folders inside the project, each where some of its agents work (see
  // Agent.folder_id). In the person's order.
  repeated ProjectFolder folders = 4;
  // Archived: put away, with nothing deleted. Its agents stay in
  // Workspace.agents with their conversations, checklists, memory and
  // files, but don't run: one that was working is stopped, and messages and
  // events for them wait, queued, until the project is unarchived. Their
  // monitors pause, other agents can't message them, and the Map leaves the
  // project out. Unarchived, all of that resumes as it was.
  bool archived = 5;
}

// A folder that some of a project's agents work in. It only scopes where they
// work: messaging and everything else stay project-wide.
message ProjectFolder {
  // Unique within the project.
  string id = 1;
  string name = 2;
  // Absolute; may be outside the project's folder.
  string path = 3;
  // Its agents are folded away in the sidebar.
  bool collapsed = 4;
}

message Agent {
  string id = 1;
  // Empty for an agent in the workspace, outside any project.
  string project_id = 2;
  string name = 3;
  // The agent's prompt: instructions added to its system prompt.
  string prompt = 4;
  // "<provider>/<model id>", e.g. "anthropic/claude-opus-5-5".
  string model = 5;
  // Reasoning effort: one of the model's `efforts`.
  string effort = 6;
  AgentStatus status = 7;
  // Tokens the agent's context held after its last model call.
  uint64 context_tokens = 8;
  // The context is compacted when it reaches this many tokens.
  uint64 compact_at_tokens = 9;
  // Messages waiting for the current run to finish.
  uint32 queued_messages = 10;
  // `model` can run now: its provider is signed in. When false the agent has
  // no model, and the app says so instead of showing `model`.
  bool model_available = 11;
  // The agent's color, which marks its messages and its bar: "blue",
  // "violet", "green", "pink", "teal", "amber", "red" or "slate".
  string color = 12;
  // A run of the agent finished (or failed) since the person last opened it:
  // there's something to look at. Selecting the agent clears it; a run that
  // ends while the agent is selected, or that was stopped, doesn't set it.
  bool unseen = 13;
  // One per extension in `Workspace.extensions`, in that order.
  repeated AgentExtension extensions = 14;
  // The agent it's nested under in the sidebar, in the same project or
  // workspace; empty at the top level. Purely visual. Agents come in sidebar
  // order: within a project (or the workspace), siblings in list order.
  string parent_id = 15;
  // Its children are folded away in the sidebar.
  bool collapsed = 16;
  // The slash commands the person can run for this agent, in the order to
  // offer them.
  repeated SlashCommand commands = 17;
  // What its message box says when empty, e.g. what the agent is for. Empty
  // means the app shows "Message <name>". Display only.
  string placeholder = 18;
  // Deprecated, always empty: see folder_id.
  string folder = 19;
  // The project folder it works in (one of Project.folders); empty when it
  // works in the project's own folder (or the workspace). Its file tools write
  // only there; it reads the whole project.
  string folder_id = 20;
  // The extension whose panel is open beside this agent, as the person left
  // it; empty when none is (or that extension is off for it). The selected
  // agent's panel content arrives as `ExtensionView`, sent again whenever the
  // selection changes.
  string open_panel = 21;
  // Its character, drawn in `color` with the same eyes as every agent: its
  // shape, one of "circle", "square", "triangle", "diamond", "pentagon" or
  // "hexagon" (catalog order; an automatic one is character_seed % 6). The
  // one chosen in its settings, or else one picked from its id, so renaming,
  // moving or reordering it never changes it.
  string avatar_shape = 22;
  // Unused: characters no longer have faces, so it's always empty.
  string avatar_face = 23;
  // A number from its id (32-bit FNV-1a of the id), the same on every device
  // and for good: offsets its animation so agents don't blink together.
  uint32 character_seed = 24;
  // What its character shows now. Factory decides it; the app only draws it.
  CharacterMood character_mood = 25;
  // When `character_mood` became what it is, in ms since 1970; unchanged
  // while the mood stays. A mood that changes while the app shows the agent
  // may play its one-time entry; one already in place when the app connects
  // doesn't.
  int64 character_mood_since_ms = 26;
  // The shape chosen in its settings; absent when it's automatic. It may be
  // one this Factory doesn't know (such as an organic shape of before), in
  // which case `avatar_shape` is automatic.
  optional string avatar_shape_override = 27;
  // Unused: characters no longer have faces, so it's always absent.
  optional string avatar_face_override = 28;
  // What the agent does, such as "Coordinator" or "Copywriter", shown
  // fainter beside or under its name, which is its identity (often a human
  // first name, "Mike"). Other agents see it with the name too
  // ("Mike (Coordinator)"). Empty when it has none.
  string role = 29;
  // How the agent's main area is laid out: its conversation and the viewers
  // open beside it (SetLayout, the show tool). Unset: just its conversation.
  ViewNode layout = 30;
  // The default prompt the agent can go back to, as this version of
  // Claktory ships it, with its placeholders ({{user}}…); empty when it has
  // none (only Rivet has one). While `prompt` equals it, the prompt follows
  // the default: a new version's default replaces it. To go back to the
  // default, set the prompt to this text (UpdateAgent).
  string default_prompt = 31;
}

// What an agent's character shows. The first that applies wins: working or
// thinking (it's running), no model, failed, news, asleep, idle.
enum CharacterMood {
  CHARACTER_MOOD_UNSPECIFIED = 0;
  // Nothing going on; none of the below.
  CHARACTER_MOOD_IDLE = 1;
  // A run is active and no tool is running: a model reply, compaction,
  // retries, setup.
  CHARACTER_MOOD_THINKING = 2;
  // A run is active and a tool (not a background task) is running.
  CHARACTER_MOOD_WORKING = 3;
  // Not running, and something new since the person last opened it
  // (Agent.unseen).
  CHARACTER_MOOD_NEWS = 4;
  // Not running, and its last run failed (an error it didn't recover from;
  // not a stop). Shows even while selected or unseen, until it next runs or
  // is cleared.
  CHARACTER_MOOD_FAILED = 5;
  // Not running, and its model can't run (Agent.model_available is false).
  CHARACTER_MOOD_NO_MODEL = 6;
  // Idle for 15 minutes or more. Only a look: it wakes at once for anything.
  CHARACTER_MOOD_ASLEEP = 7;
}

message SlashCommand {
  // "clear", without the slash.
  string name = 1;
  // One line, e.g. "Start a new conversation".
  string description = 2;
  // What it takes after its name, e.g. "<instructions>"; empty if nothing.
  string args_hint = 3;
}

enum AgentStatus {
  AGENT_STATUS_UNSPECIFIED = 0;
  AGENT_STATUS_IDLE = 1;
  AGENT_STATUS_WORKING = 2;
}

message Model {
  // "<provider>/<model id>".
  string id = 1;
  string name = 2;
  uint64 context_window = 3;
  // Reasoning efforts the model accepts, weakest first.
  repeated string efforts = 4;
}

// The selected agent's whole transcript, oldest entry first.
message Transcript {
  string agent_id = 1;
  // The latest entries only: at most 200, and at most about 256 KB encoded
  // (at least one, however big), starting at a model response's first entry.
  // Older ones come with LoadEntries.
  repeated Entry entries = 2;
  // There are entries before the first of `entries`.
  bool has_earlier = 3;
}

// Earlier entries of an agent's transcript, answered with EntryPage to the
// asker only. NOT_FOUND for an unknown agent, INVALID_REQUEST when
// `before_seq` is beyond the end.
message LoadEntries {
  string agent_id = 1;
  // Entries before this seq (exclusive): the seq of the first entry the app
  // holds.
  uint64 before_seq = 2;
  // Without `from_seq`: the latest entries before `before_seq`, cut as
  // Transcript's are, at most `limit` (0 for 200; 1000 at most).
  uint32 limit = 3;
  // Every entry from this seq up to `before_seq`, uncut: to jump to an older
  // entry and keep what the app holds one run with no gaps.
  optional uint64 from_seq = 4;
}

// The answer to LoadEntries: entries oldest first.
message EntryPage {
  string agent_id = 1;
  repeated Entry entries = 2;
  // There are entries before the first of `entries`.
  bool has_earlier = 3;
}

// What waits for the selected agent, not yet taken by it. Sent on connect,
// when an agent is selected, and whenever its queue changes; empty when
// nothing waits. A message the agent takes leaves the list and arrives in
// the transcript as usual.
message QueuedMessages {
  string agent_id = 1;
  // Oldest first.
  repeated QueuedMessage messages = 2;
}

message QueuedMessage {
  // Its id in factory.db's messages.
  int64 id = 1;
  // "person", "agent", "task" or "factory".
  string source = 2;
  // Who it's from, for events: the agent's name (with its project when it's
  // in another one), a task's id, "Factory". Empty for the person.
  string sender = 3;
  // The sending agent's id, or the task's. Empty for the person.
  string sender_id = 4;
  // The whole text, as the agent will read it.
  string text = 5;
  // ms since 1970.
  int64 created = 6;
  // One line for people, for events that have one (a task that finished,
  // Factory restarted); empty otherwise, then show `text`.
  string summary = 7;
  // The person's: the device it was sent from (see UserText.sent_from).
  SentFrom sent_from = 8;
  // The person's: SendMessage.client_id, as sent; empty without one.
  string client_id = 9;
  // The person's: the files it carries (see Attachment).
  repeated Attachment attachments = 10;
}

// Adds an entry or replaces the one with the same `seq`.
message EntryUpdate {
  string agent_id = 1;
  Entry entry = 2;
}

// Appends streamed text to an entry: `text` for assistant text and thinking.
message EntryDelta {
  string agent_id = 1;
  uint64 seq = 2;
  string text = 3;
}

message Entry {
  // Position in the transcript; unique per agent and never reused.
  uint64 seq = 1;
  int64 timestamp_ms = 2;
  oneof kind {
    UserText user = 3;
    AssistantText assistant = 4;
    Thinking thinking = 5;
    ToolCall tool_call = 6;
    Compaction compaction = 7;
    Notice notice = 8;
    Event event = 9;
    Proposal proposal = 11;
    // An agent asks for a secret (its secrets_request tool): see SecretRequest.
    SecretRequest secret_request = 12;
    // An agent proposes connecting a service (its
    // secrets_propose_connection tool): see ConnectProposal.
    ConnectProposal connect_proposal = 13;
  }
  // The model response it came from: the same for every entry one response
  // produced (its thinking, text and tool calls), the seq of the first of
  // them. 0 for entries that don't come from a response (the person's
  // messages, events, notices, compaction dividers).
  uint64 reply = 10;
}

// Something other than the person prompting the agent: Factory itself,
// another agent, a background task that finished, or a monitor. The model
// reads it as a message tagged with where it's from; the app shows it as an
// event, never as the person's.
message Event {
  EventSource source = 1;
  // Who it's from: "Factory", the sending agent's name, the task's id, or the
  // monitor's name.
  string from = 2;
  // The sending agent's id, for AGENT; the task's id, for TASK; the
  // monitor's id ("m3"), for MONITOR.
  string from_id = 3;
  // One line for people; empty when `text` is meant to be shown as it is.
  string summary = 4;
  string text = 5;
}

// A message the agent proposed for Rivet, the admin agent, which only the
// person can message: shown in the proposing agent's conversation, after the
// propose_to_rivet call, for the person to approve (with a comment) or
// dismiss with DecideProposal. The entry is sent again when it's decided.
message Proposal {
  // Unique in this Factory; what DecideProposal names.
  string id = 1;
  // What the agent proposes, written to stand alone for Rivet.
  string text = 2;
  ProposalState state = 3;
  // The person's comment on approving; empty otherwise.
  string comment = 4;
  // When it was approved or dismissed, in ms since 1970; 0 while pending.
  int64 decided_at_ms = 5;
}

enum ProposalState {
  PROPOSAL_STATE_UNSPECIFIED = 0;
  PROPOSAL_STATE_PENDING = 1;
  PROPOSAL_STATE_APPROVED = 2;
  PROPOSAL_STATE_DISMISSED = 3;
}

enum EventSource {
  EVENT_SOURCE_UNSPECIFIED = 0;
  EVENT_SOURCE_FACTORY = 1;
  EVENT_SOURCE_AGENT = 2;
  EVENT_SOURCE_TASK = 3;
  // One of the agent's monitors fired: `from` is its name, `from_id` its id
  // ("m3").
  EVENT_SOURCE_MONITOR = 4;
}

message UserText {
  string text = 1;
  // The device it was sent from; unset for messages from before it, and for
  // those Claktory sent for the person (an approved proposal to Rivet).
  SentFrom sent_from = 2;
  // SendMessage.client_id, as sent; empty without one, and for messages from
  // before it.
  string client_id = 3;
  // The files the message carries (see Attachment); `text` may be empty
  // when it has any.
  repeated Attachment attachments = 4;
}

// How much of an upload the backend has, in bytes: where the next
// UploadChunk starts.
message UploadProgress {
  string upload_id = 1;
  uint64 received = 2;
}

// An upload finished and stored: attach it to a message (SendMessage).
message UploadedFile {
  string upload_id = 1;
  Attachment attachment = 2;
}

message AssistantText {
  string text = 1;
}

message Thinking {
  string text = 1;
}

message ToolCall {
  string call_id = 1;
  string name = 2;
  // The call's arguments as pretty-printed JSON. While the model is still
  // writing them (PENDING), the raw JSON written so far, which may be cut off
  // anywhere; empty until it starts.
  string input = 3;
  // What the tool returned, or its output so far while it runs.
  string output = 4;
  ToolCallState state = 5;
  // When the tool began running and when it ended, in ms since 1970; 0 until
  // it starts, and ended is 0 while it runs. Show a running call's elapsed
  // time from `started`: no updates are sent just for the clock.
  int64 started = 6;
  int64 ended = 7;
  // bash only: when it will be stopped, in ms after `started` (its timeout).
  // 0 for no timeout (run_in_background) and for other tools.
  uint64 timeout_ms = 8;
  // What the tool returned for the app to draw its view from, as JSON: ids,
  // names, counts, paths, links (docs/EXTENSIONS.md, "Its view in the
  // conversation"). Each tool has its own shape; keys are only ever added.
  // Empty while the call runs, and for a tool that returns none ("{}" and
  // null are sent as empty).
  string details = 9;
}

enum ToolCallState {
  TOOL_CALL_STATE_UNSPECIFIED = 0;
  // The model is still writing the call.
  TOOL_CALL_STATE_PENDING = 1;
  TOOL_CALL_STATE_RUNNING = 2;
  TOOL_CALL_STATE_DONE = 3;
  TOOL_CALL_STATE_FAILED = 4;
}

// The context was summarized to make room; everything above this entry is
// history the model now sees only through `summary`.
message Compaction {
  string summary = 1;
  uint64 tokens_before = 2;
  // Compacted while the agent was idle, just before its prompt cache
  // expired (Settings.idle_compaction), not because the context was full or
  // on request.
  bool idle = 3;
}

// Something the harness reports rather than the model: errors, stops.
message Notice {
  string text = 1;
  NoticeLevel level = 2;
}

enum NoticeLevel {
  NOTICE_LEVEL_UNSPECIFIED = 0;
  NOTICE_LEVEL_INFO = 1;
  NOTICE_LEVEL_ERROR = 2;
}

// A project's folder as a tree, flattened into the rows to show: a folder's
// children follow it when it's expanded. Folders come before files, each
// sorted by name. One is sent for each project whose files are open: the
// focused project's, those shown in a pane of any agent's layout (a ViewLeaf
// of kind "files" whose path is the project's id), and the one a connection
// watches (WatchFiles). Each comes after the Workspace on connect, and again
// whenever its tree changes, including when agents change files. The focused
// project's comes last, and again after any other's (for apps that keep only
// the last one).
message Explorer {
  string project_id = 1;
  // Whether files .factoryignore hides are shown (as `hidden` rows).
  bool show_all = 2;
  repeated FileEntry entries = 3;
  // Set when the folder can't be read; `entries` is empty then.
  string error = 4;
  // One per folder of the project (Project.folders), in that order, each
  // listed like the project's own folder above. The app shows the project's
  // own folder as a root too when it has entries or there are no folders.
  // Then one per agent in the project with its own checkout, in sidebar
  // order (ExplorerRoot.agent_id set).
  repeated ExplorerRoot folders = 5;
}

// One of the project's folders in the explorer, or an agent's own checkout
// (the Own checkout extension). The app labels a folder with its name from
// Project.folders, and a checkout as the agent's ("Backend's checkout").
message ExplorerRoot {
  // Empty for an agent's checkout.
  string folder_id = 1;
  // Absolute.
  string path = 2;
  // Relative to `path`; listed as Explorer.entries are, with the folder's
  // own .factoryignore.
  repeated FileEntry entries = 3;
  // Set when the folder can't be read; `entries` is empty then.
  string error = 4;
  // An agent's own checkout: the agent's id, and its branch
  // ("factory/backend"). The path is where in the checkout the agent works.
  string agent_id = 5;
  string branch = 6;
}

message FileEntry {
  // Relative to the project folder, with "/" between names.
  string path = 1;
  string name = 2;
  // 0 for the project folder's own entries.
  uint32 depth = 3;
  bool is_dir = 4;
  bool expanded = 5;
  // Matched by .factoryignore; only sent when `show_all` is on.
  bool hidden = 6;
}

// The vault: secrets (API keys, tokens, credentials files) agents use
// without seeing them. A secret holds one or more variables, each set in
// the environment of the commands an agent runs with it (or written to a
// private file whose path is set). Only the person creates the vault,
// grants, reveals and deletes, proving it with the vault passphrase.

// Part of the Workspace: the same on every device. Metadata only.
message VaultState {
  // There's a vault: the backend makes one when it starts, so false only
  // when it couldn't. Without one, everything else is empty.
  bool exists = 1;
  // The backend holds the vault's key now. False only in locked mode, until
  // the person unlocks it after the backend started (UnlockVault); agents
  // can't use secrets meanwhile.
  bool unlocked = 2;
  // No key is kept on disk: the vault opens only with the passphrase (or the
  // recovery key) after each start of the backend. Off (always, unless the
  // person gave it a key of their own and turned it on): it opens by itself.
  bool locked_mode = 3;
  // By name.
  repeated SecretInfo secrets = 4;
  // Agents' requests still waiting for the person, oldest first. Each is also
  // an entry in its agent's conversation.
  repeated SecretRequest requests = 5;
  // The services Claktory can connect (Settings → Secrets → Add), the same
  // for every Claktory of this version.
  repeated Connector connectors = 6;
  // Agents' proposals to connect a service still waiting for the person,
  // oldest first. Each is also an entry in its agent's conversation.
  repeated ConnectProposal proposals = 7;
  // Connections being made, or just ended (for 10 minutes, or until
  // CancelConnect): every device sees how they go, never a URL or code.
  repeated ConnectFlow flows = 8;
}

message SecretInfo {
  string id = 1;
  // How agents name it (bash's `secrets`), such as "AWS". Unique.
  string name = 2;
  // What it is and what it's for; agents read it.
  string description = 3;
  repeated SecretVariable variables = 4;
  // The agents that may use it, by when they were granted it.
  repeated SecretGrant grants = 5;
  int64 created_ms = 6;
  int64 updated_ms = 7;
  // Counts up each time its values change.
  uint32 version = 8;
  // The last agent that used it, and when; empty and 0 if none has.
  string last_used_by = 9;
  int64 last_used_ms = 10;
  // What the person should know, such as "MY_PIN is too short to hide in
  // agents' output".
  repeated string warnings = 11;
  // The agent that saved it (a key it made itself); empty when the person
  // added it.
  string owner_agent_id = 12;
  // Set when it's a connected service (StartConnect): its tokens stay with
  // the backend, so it has no variables and is given to no one; agents get
  // secrets made from it (DeriveSecret).
  SecretConnection connection = 13;
  // Set when it was made from a connection (DeriveSecret).
  SecretExport export = 14;
}

message SecretVariable {
  // The environment variable, such as AWS_SECRET_ACCESS_KEY.
  string name = 1;
  // The value's last 4 characters, to tell values apart ("••••3f9a"); empty
  // when the value is shorter than 12 characters.
  string hint = 2;
  // The value is written to a private file, and `name` holds its path (as
  // KUBECONFIG or GOOGLE_APPLICATION_CREDENTIALS expect).
  bool file = 3;
}

message SecretGrant {
  string agent_id = 1;
  int64 granted_ms = 2;
  // How many of the agent's background tasks running now got this secret:
  // what RevokeSecret's stop_running_tasks would stop.
  uint32 running_tasks = 3;
}

// A variable with its value, in requests from the app and in SecretValue.
message SecretEntry {
  string variable = 1;
  string value = 2;
  // See SecretVariable.file.
  bool file = 3;
}

// No longer needed: the person's requests come from their app, signed in to
// the backend as one of their devices, and agents can't make them. Leave it
// out. Only a vault in locked mode, still locked, takes its passphrase or
// recovery key here to open it, as UnlockVault does.
message VaultProof {
  string passphrase = 1;
}

// Unused: the backend makes the vault by itself when it starts. Refused
// with ERROR_CODE_INVALID_REQUEST (there's one already).
message CreateVault {
  string passphrase = 1;
  // See VaultState.locked_mode.
  bool locked_mode = 2;
}

// Opens a vault in locked mode after a restart. `passphrase` may be the
// recovery key.
message UnlockVault {
  string passphrase = 1;
}

// Unused: there's no unlocked window any more. Answered with VaultSession 0.
message LockVaultSession {}

// Adds a secret, granted to no one. No proof needed.
message CreateSecret {
  string name = 1;
  string description = 2;
  repeated SecretEntry entries = 3;
}

// Changes a secret's name and description, and with `entries`, replaces its
// variables and values (a new version). Empty `entries`: values unchanged.
// No proof needed: agents granted it are told it changed.
message UpdateSecret {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated SecretEntry entries = 4;
}

message DeleteSecret {
  string id = 1;
  VaultProof proof = 2;
}

message GrantSecret {
  string id = 1;
  string agent_id = 2;
  VaultProof proof = 3;
}

// No proof needed: it only takes access away. The agent is told.
message RevokeSecret {
  string id = 1;
  string agent_id = 2;
  // Also stops the agent's background tasks that got the secret.
  bool stop_running_tasks = 3;
}

message RevealSecret {
  string id = 1;
  VaultProof proof = 2;
}

// Reads a pasted .env: answered with the variables found, without values.
message PreviewEnv {
  string text = 1;
}

// Adds what a pasted .env holds: one secret named `name` with every
// variable, or with `one_per_variable` one secret per variable, named after
// it. No proof needed.
message ImportEnv {
  string text = 1;
  string name = 2;
  string description = 3;
  bool one_per_variable = 4;
}

// Grants (approve) or dismisses an agent's secret request. To give one of
// the vault's secrets, `secret_id` names it. To add a new one, `entries`
// hold its variables and values, and `name` and `description` its name and
// description (empty: the request's), and it's made and given. A request
// from before agents described what they need, naming a secret, is given
// that secret when neither is set. The agent is told only what it got.
message DecideSecretRequest {
  string agent_id = 1;
  string request_id = 2;
  bool approve = 3;
  VaultProof proof = 4;
  repeated SecretEntry entries = 5;
  // Told to the agent; may be empty.
  string comment = 6;
  // An existing secret to give (SecretInfo.id).
  string secret_id = 7;
  // A new secret's name and description.
  string name = 8;
  string description = 9;
}

// Who used a secret and when, newest first; `id` empty for every secret.
message ListSecretUses {
  string id = 1;
  // 0 for 100.
  uint32 limit = 2;
}

// For a vault with a key of the person's own: `old_passphrase` is the
// passphrase or the recovery key. The new one has 8 characters at least.
// Answered with VaultSession.
message ChangePassphrase {
  string old_passphrase = 1;
  string new_passphrase = 2;
}

// A recovery key, a key of the person's own that opens the vault too; it
// replaces the last one, which stops working. Answered with RecoveryKey.
message NewRecoveryKey {
  VaultProof proof = 1;
}

// Turns locked mode on (the key kept on disk is deleted) or off (it's kept
// again). On needs a key of the person's own (a passphrase or recovery
// key) first. Answered with VaultSession.
message SetVaultLockedMode {
  bool locked_mode = 1;
  VaultProof proof = 2;
}

// Unused: always 0, and never sent unasked any more. Requests need no
// VaultProof, so there's no unlocked window to show.
message VaultSession {
  int64 unlocked_until_ms = 1;
}

message SecretValue {
  string id = 1;
  repeated SecretEntry entries = 2;
  // Unused: always 0.
  int64 unlocked_until_ms = 3;
}

message EnvPreview {
  repeated SecretVariable variables = 1;
  // Duplicates, empty values, values too short to hide in agents' output,
  // lines that couldn't be read (by line number, never with their text).
  repeated string warnings = 2;
}

// Shown once: the person keeps it, to open the vault when the passphrase is
// forgotten or the key on disk is lost.
message RecoveryKey {
  string key = 1;
  // Unused: always 0.
  int64 unlocked_until_ms = 2;
}

message SecretUses {
  repeated SecretUse uses = 1;
}

message SecretUse {
  string secret_id = 1;
  string secret_name = 2;
  int64 time_ms = 3;
  // "use" (an agent's command got it), "reveal" (the person saw it in the
  // app), "grant", "revoke".
  string kind = 4;
  // The agent; for reveal, grant and revoke, the one concerned, if any.
  string agent_id = 5;
  // The background task that got it; empty for a command run in the
  // foreground.
  string task_id = 6;
  // The command's first line (uses), the device (reveals), or for grants
  // and revokes the admin agent's id that made them (empty: the person).
  string detail = 7;
}

// An agent's request (secrets_request), shown in its conversation after the
// call, for the person to grant or dismiss with DecideSecretRequest. The
// entry is sent again when it's decided. Agents don't know which secrets
// the vault holds: they describe what they need in `new_secret` (a name,
// what it's for and the variables they expect), and the person gives an
// existing secret or adds one. Requests from before that name an existing
// secret in `secret_id`.
message SecretRequest {
  string id = 1;
  // The agent that asked.
  string agent_id = 2;
  // Only in requests from before agents described what they need: the
  // existing secret it asked for. Empty otherwise.
  string secret_id = 3;
  // What it asks for, in a word: the name it gave (new_secret.name), or the
  // existing secret's.
  string secret_name = 4;
  // What it needs: a name, what it's for (which service, what access) and
  // the variables it expects (no values). Prefills a new secret, if the
  // person adds one. Unset only in requests that name an existing secret.
  NewSecret new_secret = 5;
  // Why it needs it, in the agent's words.
  string reason = 6;
  SecretRequestState state = 7;
  // When it was decided, or expired, in ms since 1970; 0 while pending.
  int64 decided_ms = 8;
  // The person's comment; may be empty.
  string comment = 9;
  // GRANTED: the secret given, which may be another than the one described.
  string given_secret_id = 10;
  string given_secret_name = 11;
}

message NewSecret {
  string name = 1;
  string description = 2;
  repeated SecretVariable variables = 3;
}

enum SecretRequestState {
  SECRET_REQUEST_STATE_UNSPECIFIED = 0;
  SECRET_REQUEST_STATE_PENDING = 1;
  SECRET_REQUEST_STATE_GRANTED = 2;
  SECRET_REQUEST_STATE_DISMISSED = 3;
  // Left unanswered too long (12 hours, or 10 of the agent's runs): it can't
  // be answered any more, and the agent was told. decided_ms says when.
  SECRET_REQUEST_STATE_EXPIRED = 4;
}

// This Claktory's account at claktory.com, or at the service in
// config.json's `account.service`. Signing in is the backend's, not a
// device's: one sign-in, and every device that connects shows it.
message ClaktoryAccount {
  ClaktoryAccountState state = 1;
  // The email it's signed in with, or that the code went to.
  string email = 2;
  // The service's address, such as "https://account.claktory.com".
  string service = 3;
  // This Claktory's name there, as sent at sign-in (the computer's name).
  string name = 4;
  // When the service last answered, in ms since 1970; 0 if it never has.
  int64 last_contact_ms = 5;
  // What went wrong with the last call to the service, in words for the
  // person ("claktory.com can't be reached; Claktory tries again by
  // itself"); empty when it worked.
  string problem = 6;
  // AWAITING_CODE: when the code stops working, in ms since 1970.
  int64 code_expires_ms = 7;
  // Exactly what this Claktory last sent the service, as JSON, for "What
  // claktory.com receives": its sign-in (the request that emails the code)
  // and its check-in. The machine token, signatures and codes travel beside
  // them and aren't shown; empty before the first.
  string last_sign_in_json = 8;
  string last_check_in_json = 9;
  // When each was sent, in ms since 1970; 0 before the first.
  int64 last_sign_in_ms = 10;
  int64 last_check_in_ms = 11;
}

enum ClaktoryAccountState {
  CLAKTORY_ACCOUNT_STATE_UNSPECIFIED = 0;
  // Not signed in: AccountSignIn.
  CLAKTORY_ACCOUNT_STATE_SIGNED_OUT = 1;
  // A code was emailed: AccountVerify, or AccountResend.
  CLAKTORY_ACCOUNT_STATE_AWAITING_CODE = 2;
  CLAKTORY_ACCOUNT_STATE_SIGNED_IN = 3;
  // Removed at claktory.com: it keeps running, but after a restart its
  // secrets open only with the recovery key, until it signs in again.
  CLAKTORY_ACCOUNT_STATE_REVOKED = 4;
}

// Emails a code to sign this Claktory in. Answered with Ack once it's sent;
// ERROR_CODE_RATE_LIMITED or ERROR_CODE_UNREACHABLE when it can't be.
message AccountSignIn {
  string email = 1;
}

// The emailed code. Answered with Ack once signed in, when the vault is
// protected by the account (and its recovery key made). A wrong code is
// ERROR_CODE_WRONG_PROOF, its message saying how many tries are left; an
// expired one ERROR_CODE_INVALID_REQUEST.
message AccountVerify {
  string code = 1;
}

// Emails a new code to the same address. Answered with Ack.
message AccountResend {}

// Signs out: no more check-ins, and back to SIGNED_OUT. The vault stays as
// it is, unlocked while Claktory runs. Answered with Ack.
message AccountSignOut {}

// The account service to use; empty for claktory.com's. Only while signed
// out. Answered with Ack.
message SetAccountService {
  string url = 1;
}

// The vault's recovery key, to note down. Answered with RecoveryKey, to the
// asker only; logged in the vault's uses.
message ShowRecoveryKey {}

// How this Claktory is arranged: where agents are, whom they can message,
// which secrets they have, what data they read and write, and their
// extensions that grant reach or power. Computed by the backend from the
// same rules agents follow, so the app only lays it out. Nodes are sorted by
// id and edges by from_id, to_id and kind, so the same Claktory gives the
// same map.
message ClaktoryMap {
  repeated MapNode nodes = 1;
  repeated MapEdge edges = 2;
}

message MapNode {
  // Unique in the map and the same every time: "workspace",
  // "project:<project id>", "folder:<project id>/<folder id>",
  // "agent:<agent id>", "secret:<secret id>", "data:records" (Claktory's
  // records) and "data:agent:<agent id>" (an agent's own database).
  string id = 1;
  MapNodeKind kind = 2;
  // A name to show: the agent's, project's, folder's or secret's;
  // "Workspace", "Claktory's records", or "<agent name>'s database".
  string label = 3;
  // A line about it: an agent's role, a project's, folder's or database's
  // path, a secret's description; may be empty.
  string detail = 4;
  // The node it sits under, as in the sidebar: a folder under its project,
  // an agent under the agent it's nested under, else its folder, else its
  // project, else the workspace; an agent's database under the agent.
  // Empty at the top: the workspace, projects, admin agents (wherever they
  // are), secrets and Claktory's records.
  string parent_id = 5;
  // An admin agent: sees and messages every agent.
  bool admin = 6;
  // An agent's color (Agent.color); empty for other nodes.
  string color = 7;
  // An agent's extensions that grant reach or power, in a fixed order.
  repeated MapBadge badges = 8;
  // The id of what it stands for, to open it: the agent's, project's,
  // folder's (within project_id) or secret's id; for an agent's database,
  // the agent's. Empty for the workspace and Claktory's records.
  string ref_id = 9;
  // The project a folder or an agent (or its database) is in; empty
  // otherwise.
  string project_id = 10;
}

enum MapNodeKind {
  MAP_NODE_KIND_UNSPECIFIED = 0;
  // The workspace folder: agents in no project.
  MAP_NODE_KIND_WORKSPACE = 1;
  MAP_NODE_KIND_PROJECT = 2;
  // One of a project's folders.
  MAP_NODE_KIND_FOLDER = 3;
  MAP_NODE_KIND_AGENT = 4;
  // A secret in the vault (its name, never values).
  MAP_NODE_KIND_SECRET = 5;
  // A database: an agent's own, or Claktory's records.
  MAP_NODE_KIND_DATA = 6;
}

// An extension an agent has on that grants reach or power.
message MapBadge {
  // Stable: "agents:admin" (sees and messages every agent), "secrets:give"
  // (gives secrets to agents), "tasks:see_all" (sees and stops every
  // agent's tasks), "web", "tree" (own checkout: lands on the main branch),
  // "database", "database:factory" (Claktory's records), "memory:factory"
  // (the Claktory manual: can change Claktory's settings).
  string key = 1;
  // To show, e.g. "Web".
  string label = 2;
  // An icon name, as Extension.icon.
  string icon = 3;
}

message MapEdge {
  // Node ids.
  string from_id = 1;
  string to_id = 2;
  MapEdgeKind kind = 3;
  // MESSAGES only: each can message the other. Such a pair is one edge,
  // from the lower id.
  bool both_ways = 4;
}

enum MapEdgeKind {
  MAP_EDGE_KIND_UNSPECIFIED = 0;
  // An agent can message another (and see it): same project, its "also"
  // list, or an admin agent.
  MAP_EDGE_KIND_MESSAGES = 1;
  // From a secret to an agent that has it.
  MAP_EDGE_KIND_SECRET = 2;
  // From an agent to a folder of its project it can read but not change
  // (the project's own folder is the project's node), or to Claktory's
  // records.
  MAP_EDGE_KIND_READS = 3;
  // From an agent to the folder it works in (the workspace's, a project's
  // or a project folder's node), or to its own database.
  MAP_EDGE_KIND_WRITES = 4;
}

// ---- Connecting services (one-click secrets; docs/CONNECTORS.md) ----
//
// The person connects a service's account (Cloudflare, AWS) by approving
// Claktory on the service's own site: the app opens the page, catches where
// the browser comes back and hands it to the backend (StartConnect,
// FinishConnect), which signs in itself and keeps the tokens in the vault as
// a connection (SecretInfo.connection). A connection is given to no one:
// agents get secrets made from it with narrower access (DeriveSecret,
// SecretInfo.export), given as any other.

// A service Claktory can connect.
message Connector {
  // "cloudflare", "aws".
  string id = 1;
  string name = 2;
  // What a connection gives, one sentence.
  string description = 3;
  // The access to ask for, one preselected.
  repeated ConnectorAccess accesses = 4;
  // What to ask the person before connecting (AWS: the access portal URL
  // and region), sent in StartConnect.fields.
  repeated ConnectorField fields = 5;
  ConnectorFlowKind flow = 6;
  // BROWSER: where the browser may come back to, "{port}" any port; the app
  // makes a receiver for one and sends it, port filled in, as
  // StartConnect.redirect_uri: "http://127.0.0.1:{port}/oauth/cloudflare"
  // (a loopback listener on a Mac), "com.claktory.app:/oauth/cloudflare"
  // (ASWebAuthenticationSession; com.claktory.app.dev for Claktory Dev).
  repeated string redirect_uris = 7;
  // The variables an agent given a secret made from it gets.
  repeated string variables = 8;
  // What the person needs first, one or two sentences; empty if nothing.
  string setup_note = 9;
  // Where to read about it; empty if nowhere.
  string setup_url = 10;
  // PASTE: the service's page that makes the token, with what it needs
  // filled in, as ConnectStarted.url also gives it.
  string token_url = 11;
}

message ConnectorAccess {
  string id = 1;
  // "Deploy websites".
  string label = 2;
  // What it lets Claktory do, a sentence for the person.
  string why = 3;
  // Exactly what's asked of the service: scopes or permissions.
  repeated string scopes = 4;
  bool preselected = 5;
}

message ConnectorField {
  // The key in StartConnect.fields: "start_url", "region".
  string id = 1;
  string label = 2;
  string placeholder = 3;
  string hint = 4;
  bool optional = 5;
}

enum ConnectorFlowKind {
  CONNECTOR_FLOW_KIND_UNSPECIFIED = 0;
  // The app opens the service's page and catches where the browser comes
  // back (FinishConnect).
  CONNECTOR_FLOW_KIND_BROWSER = 1;
  // The app opens a page with a code filled in; the backend asks the service
  // until the person approves. No FinishConnect.
  CONNECTOR_FLOW_KIND_DEVICE = 2;
  // The app opens the service's page that makes a token (ConnectStarted.url)
  // and asks the person to paste the token it shows, sent in
  // FinishConnect.token. The app never shows it again nor keeps it.
  CONNECTOR_FLOW_KIND_PASTE = 3;
}

// An agent's proposal to connect a service (secrets_propose_connection),
// shown in its conversation after the call and at the top of Settings →
// Secrets while it waits. The person connects it (StartConnect with its id)
// or dismisses it (DismissConnectProposal); the entry is sent again then.
// The connection made for it is given to no one, the agent included: an
// admin agent such as Rivet checks it against the proposal and gives the
// agent a secret made from it with the least access the work needs.
message ConnectProposal {
  string id = 1;
  // The agent that proposes it.
  string agent_id = 2;
  // One of VaultState.connectors.
  string connector_id = 3;
  // The ConnectorAccess it asks for; empty for the preselected one.
  string access_id = 4;
  // What it's for, in the agent's words.
  string purpose = 5;
  // The access it needs, in the agent's words: permissions, and what on
  // (zones, accounts, roles).
  string access = 6;
  // Why it needs it.
  string reason = 7;
  ConnectProposalState state = 8;
  int64 created_ms = 9;
  // When it was connected or dismissed; 0 while pending.
  int64 decided_ms = 10;
  // The person's comment on dismissing; may be empty.
  string comment = 11;
  // CONNECTED: the connection made for it.
  string secret_id = 12;
  string secret_name = 13;
  // The exact permissions it asks for, where the service takes them (AWS):
  // each an Allow statement. The connection is made with exactly these, and
  // the backend refuses one that reaches more. Empty for the others.
  repeated PolicyStatement statements = 14;
  // AWS: the region it's for ("eu-central-1"); empty for the others.
  string region = 15;
}

// One Allow statement of a permissions policy (AWS IAM): the actions, on the
// resources, under the condition.
message PolicyStatement {
  // "ec2:RunInstances", "s3:GetObject"; wildcards as IAM takes them
  // ("ec2:Describe*").
  repeated string actions = 1;
  // ARNs, or "*" (for actions that take no resource).
  repeated string resources = 2;
  // IAM's Condition block as compact JSON, such as
  // {"StringEquals":{"aws:RequestedRegion":"eu-central-1"}}; empty for
  // none. Shown to the person as it is.
  string condition = 3;
}

enum ConnectProposalState {
  CONNECT_PROPOSAL_STATE_UNSPECIFIED = 0;
  CONNECT_PROPOSAL_STATE_PENDING = 1;
  CONNECT_PROPOSAL_STATE_CONNECTED = 2;
  CONNECT_PROPOSAL_STATE_DISMISSED = 3;
}

// Starts connecting a service. The flow belongs to the device that asked:
// only it can finish it, and unpairing it, or a restart of the backend, ends
// it. The connection is named after the service and account ("Cloudflare
// (matt@example.com)"); UpdateSecret renames it (name and description only).
message StartConnect {
  string connector_id = 1;
  // One of its accesses; empty for the preselected one.
  string access_id = 2;
  // Its fields' values, by ConnectorField.id.
  map<string, string> fields = 3;
  // The proposal it answers; empty if none.
  string proposal_id = 4;
  // BROWSER: the receiver the app made, one of the connector's
  // redirect_uris with the port filled in. Empty for DEVICE.
  string redirect_uri = 5;
  // A connection to connect again in place (it needs reconnecting, say);
  // empty for a new one. The account must be the same.
  string secret_id = 6;
}

message ConnectStarted {
  string flow_id = 1;
  // The page to open: the service's sign-in (BROWSER), its verification
  // page with the code filled in (DEVICE), or its page that makes a token
  // (PASTE).
  string url = 2;
  // DEVICE: the code that page shows, for the person to check.
  string user_code = 3;
  // When the flow ends if not finished, in ms since 1970.
  int64 expires_ms = 4;
}

// Where the browser came back to (BROWSER): the whole URL, as it is, with
// its code and state or the service's error. Or the token the person
// pasted (PASTE). Only the device that started the flow can finish it.
message FinishConnect {
  string flow_id = 1;
  string callback_url = 2;
  // PASTE: the token, as pasted. The backend checks it with the service
  // before keeping it; one the service doesn't accept leaves the flow
  // WAITING with ConnectFlow.error saying why, to paste another.
  string token = 3;
}

// Stops a flow, or removes an ended one from VaultState.flows.
message CancelConnect {
  string flow_id = 1;
}

message ConnectFlow {
  string id = 1;
  string connector_id = 2;
  // The device it was started on.
  string device_name = 3;
  ConnectFlowState state = 4;
  // FAILED: why, a sentence for the person. WAITING (PASTE): why the token
  // pasted last didn't work; empty before one is.
  string error = 5;
  // CONNECTED: the connection (SecretInfo.id).
  string secret_id = 6;
  // The proposal it answers; empty if none.
  string proposal_id = 7;
  int64 started_ms = 8;
  int64 expires_ms = 9;
}

enum ConnectFlowState {
  CONNECT_FLOW_STATE_UNSPECIFIED = 0;
  // Waiting for the person, in the browser (PASTE: for the token; `error`
  // says why the last one pasted didn't work).
  CONNECT_FLOW_STATE_WAITING = 1;
  // Signing in with what the browser brought back (PASTE: checking the
  // token with the service).
  CONNECT_FLOW_STATE_EXCHANGING = 2;
  // Reading the account and what was granted.
  CONNECT_FLOW_STATE_CHECKING = 3;
  CONNECT_FLOW_STATE_CONNECTED = 4;
  CONNECT_FLOW_STATE_FAILED = 5;
  CONNECT_FLOW_STATE_EXPIRED = 6;
  CONNECT_FLOW_STATE_CANCELLED = 7;
}

message DismissConnectProposal {
  string proposal_id = 1;
  string comment = 2;
}

// A connected service's account, as the service said it was granted.
message SecretConnection {
  string connector_id = 1;
  // Whose: "matt@example.com", "d-1234567890 (us-east-1)".
  string account = 2;
  // What it can do, sentences.
  repeated string access = 3;
  // Exactly what the service granted.
  repeated string scopes = 4;
  // What it reaches: "Cloudflare account Acme", "AWS 123456789012 · ReadOnly".
  repeated string resources = 5;
  ConnectionStatus status = 6;
  // NEEDS_RECONNECT: why, a sentence.
  string problem = 7;
  // When it needs connecting again, in ms since 1970; 0 if unknown.
  int64 expires_ms = 8;
  // When its tokens were last refreshed or checked.
  int64 checked_ms = 9;
  // The proposal it was made for; empty if none.
  string proposal_id = 10;
}

enum ConnectionStatus {
  CONNECTION_STATUS_UNSPECIFIED = 0;
  CONNECTION_STATUS_READY = 1;
  // The service no longer accepts it: connect again (StartConnect.secret_id).
  CONNECTION_STATUS_NEEDS_RECONNECT = 2;
}

// A secret made from a connection, with narrower access.
message SecretExport {
  // The connection (SecretInfo.id).
  string connection_id = 1;
  // What it can do, sentences.
  repeated string access = 2;
  // Exactly: the service's permissions.
  repeated string permissions = 3;
  // What on: accounts, zones, roles.
  repeated string resources = 4;
  // When it stops working, in ms since 1970; 0 if never. Claktory renews it
  // before then while the connection lasts.
  int64 expires_ms = 5;
  // Each command gets a fresh short-lived credential (AWS).
  bool per_use = 6;
}

// What a secret can be made of from a connection (accounts, zones, roles,
// permissions), and the rules for picking (ConnectChoices.rules).
message ListConnectChoices {
  string secret_id = 1;
}

message ConnectChoices {
  string secret_id = 1;
  repeated ConnectChoice choices = 2;
  // How to pick, a sentence or two for the person: "Pick one account, at
  // least one permission, and zones of that account (none: all of them)."
  string rules = 3;
}

message ConnectChoice {
  // "account", "zone", "role", "permission".
  string kind = 1;
  // What DeriveSecret takes.
  string id = 2;
  string label = 3;
  // The choice it belongs to (a zone's or role's account); empty if none.
  string parent = 4;
  // Permissions: what it allows, a sentence.
  string why = 5;
}

// Makes a secret from a connection, given to no one yet (GrantSecret).
message DeriveSecret {
  // The connection.
  string secret_id = 1;
  // The new secret's name and description.
  string name = 2;
  string description = 3;
  // ConnectChoice ids.
  repeated string permissions = 4;
  repeated string resources = 5;
  // When it should stop working, in ms since 1970; 0 for the connector's
  // default (renewed before then while the connection lasts).
  int64 expires_ms = 6;
}

// Sets how much this device zooms the whole app (Settings.zoom): the
// device this connection is, never another. 1.0, or 0, is actual size;
// otherwise 0.5 to 2.0 (finite), or it's refused. Answered with Ack.
message SetZoom {
  double zoom = 1;
}

// Removes a connection and the secrets made from it.
message DisconnectService {
  string secret_id = 1;
  // Also revoke it at the service. Tokens made from it are deleted at the
  // service either way, where it can.
  bool revoke = 2;
}

// ---- Usage ----

// Asks for the tokens agents' model calls used in a time range, by provider,
// model, account and agent, for the Usage pane: not in the Workspace, asked
// again to refresh. Calls are counted per UTC hour, so the range's ends are
// rounded down to whole hours.
message LoadUsage {
  // From, in ms since 1970; 0 for since the first call counted.
  int64 since_ms = 1;
  // To, exclusive; 0 for now.
  int64 until_ms = 2;
  // The series' step: a whole number of hours, such as 3600000 or 86400000;
  // 0 for no series. At most 5,000 buckets.
  int64 bucket_ms = 3;
  // Where the person's days start (minutes east of UTC), for day buckets.
  int32 utc_offset_minutes = 4;
}

message UsageReport {
  // The range as applied: for all time, the first counted call's hour.
  int64 since_ms = 1;
  int64 until_ms = 2;
  // One per provider × model × account × agent with any use in the range;
  // every grouping of them adds up.
  repeated UsageRow rows = 3;
  // Every bucket of the range, empty ones too, oldest first.
  repeated UsageBucket series = 4;
  // When counting by agent (and account) began: earlier use has agent_id and
  // account_id ""; 0 if nothing's been counted by agent yet.
  int64 agents_since_ms = 5;
}

message UsageRow {
  // "anthropic".
  string provider_id = 1;
  // "claude-opus-4-5", as the provider named it.
  string model = 2;
  // The provider account that answered (Account.id); "" when unknown.
  string account_id = 3;
  // Its label as Settings shows it (an email, a key's name); "" when unknown
  // or signed out.
  string account_label = 4;
  // "" for calls from before agents were counted.
  string agent_id = 5;
  // The agent's name at its latest counted call, so a deleted one still
  // reads right.
  string agent_name = 6;
  UsageTokens tokens = 7;
  // Model calls.
  uint64 requests = 8;
}

message UsageTokens {
  uint64 input = 1;
  uint64 output = 2;
  uint64 cache_read = 3;
  uint64 cache_write = 4;
}

message UsageBucket {
  int64 start_ms = 1;
  // All providers together.
  UsageTokens tokens = 2;
}
