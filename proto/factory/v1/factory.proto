// The person read these alerts (Alert.id): they opened one, or tapped Got
// it. Each leaves Workspace.alerts for History (NEEDS_YOU_RECORD_KIND_ALERT,
// outcome READ, decided_ms when, answered_on this connection's device).
// Ids already read or unknown are skipped. Ack.
// Pins `agent_id` before the pin `before_id` (empty, or one not pinned:
// last); an agent pinned already moves there. Refused for an agent outside
// projects (it's at the top already) and for one in an archived project.
message PinAgent {
  string agent_id = 1;
  string before_id = 2;
}

// Unpins `agent_id`; one not pinned is no change.
message UnpinAgent {
  string agent_id = 1;
}

message ReadAlerts {
  repeated string ids = 1;
}

// An alert kept in Needs you until the person reads it (ReadAlerts): an
// agent's notify_person, or Claktory's own (its disk can't be written, the
// machine runs short with no admin agent to take it, a newer model with no
// admin agent to switch to it). Kept whatever became of its notification:
// sent, held by quiet hours or the hourly cap, or not sent at all (alerts
// turned off, the agent's Notify me set to Never, no device that shows
// them). Not a question: it never counts toward an agent's waiting cards.
message Alert {
  string id = 1;
  // The agent that sent it; empty for Claktory's own.
  string agent_id = 2;
  // Who it's from as it was sent: the agent's name then (kept after the
  // agent is renamed or deleted), or this Claktory's name for its own.
  string from_name = 3;
  // What it says, in its agent's words (Claktory's for its own): title a
  // short line (at most 120 characters), text a sentence or two more (at
  // most 300; may be empty). Both empty when `withheld`.
  string title = 4;
  string text = 5;
  // Its agent marked it urgent.
  bool urgent = 6;
  // When it was sent, in ms since 1970.
  int64 sent_ms = 7;
  // Its agent had read a web page or another Claktory's words when it sent
  // it, so what it says may be a stranger's: its words aren't kept here, as
  // its notification said only who. Show "<from_name> sent you an alert",
  // and that it's in their conversation.
  bool withheld = 8;
  // The notify_person call's entry in its agent's conversation, to open it
  // there; 0 for Claktory's own, or when it isn't found.
  uint64 seq = 9;
}

// A new group at the end of the project's (Workspace.pipe_groups).
message CreatePipeGroup {
  string project_id = 1;
  // One line, at most 80 characters; unique among the project's groups,
  // whatever the case.
  string name = 2;
  // A pipe of the project to move into it at once (New group… from a
  // pipe's menu); empty for none.
  string pipe_id = 3;
}

message RenamePipeGroup {
  string group_id = 1;
  string name = 2;
}

// Deletes a group: its pipes stay, outside any group.
message DeletePipeGroup {
  string group_id = 1;
}

// Moves a pipe into a group of its own project, or out of any (group_id
// empty).
message SetPipeGroup {
  string pipe_id = 1;
  string group_id = 2;
}

// Folds a group away or opens it, the same on every device.
message SetPipeGroupCollapsed {
  string group_id = 1;
  bool collapsed = 2;
}

// A named row in the sidebar gathering some of a project's pipes (#359,
// Workspace.pipe_groups; Pipe.group_id says which). Arrangement only.
message PipeGroup {
  string id = 1;
  string project_id = 2;
  string name = 3;
  // Folded away, on every device.
  bool collapsed = 4;
  // Its place among the project's groups, 0 first: the order they were
  // made.
  uint32 position = 5;
  // ms since 1970.
  int64 created_ms = 6;
}

// A website shared over pipes (pipe-port-sharing.md): one on this computer
// that this Claktory shares (mine), or one another Claktory shares with
// this one over a pipe (theirs). It reaches only each pipe's pinned peer
// while that pipe is open: a paused pipe's share waits and works again on
// resume; a pipe closed, or whose other side became another account, ends
// it on that pipe for good. Pipe messages go first: its traffic is held to
// a rate (about 25 MB/s direct, 5 MB/s relayed, 64 connections at once).
message PipeShare {
  // This Claktory's id for it (the other side has its own).
  string id = 1;
  // This side shares it; false: another Claktory shares it with this one.
  bool mine = 2;
  // What it's called. Theirs: the other side's words; show them plain,
  // never as a link.
  string name = 3;
  // Mine: the port on this computer it shares. Theirs: the sharer's
  // number, which this side's address uses when it's free here.
  uint32 port = 4;
  // Mine: the pipes it reaches now, open or not (group_id's pipes when it
  // follows a group). Theirs: the one pipe it came over.
  repeated string pipe_ids = 5;
  // Mine: the group it follows: a pipe moved into the group gets it too,
  // one moved out stops getting it. Empty when it's shared with chosen
  // pipes (pipe_ids).
  string group_id = 6;
  // ms since 1970.
  int64 created_ms = 7;
  // It can be used now. Mine: at least one of its pipes is open. Theirs:
  // its pipe is open.
  bool live = 8;
  // Theirs: where it opens in this computer's browser,
  // "http://s-<random>.localhost:<port>/", the same for as long as it
  // lasts (Copy address copies it). Known from when it arrives.
  string address = 9;
  // Theirs: the same at "http://127.0.0.1:<port>/", for a browser that
  // can't open *.localhost addresses (Safari).
  string fallback_address = 10;
  // Theirs: this computer serves it now. From its first Open, it stays up
  // for as long as the share lasts, across restarts.
  bool listening = 11;
  // Theirs: why this computer can't serve it, in a sentence ("Port 3000 is
  // in use on this Mac."); empty when it can.
  string listener_problem = 12;
  // Theirs: the person hid it (HidePipeShare).
  bool hidden = 13;
  // Theirs: not opened yet from this Claktory, on any device: the app
  // makes it stand out until it is (W2).
  bool unopened = 14;
  // When it stops being shared (#46), ms since 1970; 0: not until it's
  // stopped. Mine: this Claktory stops it then, as Stop does. Theirs: when
  // its sharer said it ends, to show ("Ends in 3 hours"); the sharer ends
  // it.
  int64 expires_ms = 15;
  // Theirs: when this computer last couldn't reach the website for its
  // browser (Claktory's own "couldn't be reached" page), ms since 1970; 0
  // when nothing failed since the last request that went through. Kept
  // while Claktory runs.
  int64 last_failure_ms = 16;
  // Theirs: what that page said, for the person ("Nothing is listening on
  // port 3000 on Ana's Mac."); empty with last_failure_ms 0.
  string last_failure = 17;
}

// Shares a website on this computer (Share a website… in a pipe's or a
// group's settings) with the pipes named, or with a group's. Answered with
// the Workspace, or an Error saying why for the person ("Port 7420 is
// Claktory's own.").
message SharePipeWebsite {
  // A port on this computer, 1 to 65535; never one of Claktory's own.
  uint32 port = 1;
  // One line, at most 80 characters: what the other side sees it called.
  string name = 2;
  // Open pipes to share it with; or
  repeated string pipe_ids = 3;
  // a group: it reaches the group's pipes and follows the group.
  string group_id = 4;
  // How long it lasts from now, in seconds, at most a year (#46); 0: until
  // it's stopped, as from an app before this. The app offers 1 hour, 24
  // hours (its default), 7 days and Never.
  int64 lasts_s = 5;
}

// Changes how long a share of this side's lasts, counted from now (#46,
// Change end…): lasts_s as in SharePipeWebsite, 0 for until it's stopped.
// The other side is told the new end. Answered with the Workspace, or an
// Error saying why ("That website isn't shared any more.").
message SetPipeShareExpiry {
  string share_id = 1;
  int64 lasts_s = 2;
}

// Stops a share of this side's on every pipe at once: its connections end
// now, and each pipe's other side is told.
message StopPipeShare {
  string share_id = 1;
}

// Opens a share another Claktory shares with this one (theirs): starts
// this computer's server for it if it isn't up, and answers
// PipeShareOpened.
message OpenPipeShare {
  string share_id = 1;
}

// The address to open, once: it carries a code good for a minute that
// signs this browser in to the share. Open one in the default browser:
// `url` (*.localhost), or `fallback_url` (127.0.0.1) where that browser
// can't open *.localhost addresses (Safari).
message PipeShareOpened {
  string share_id = 1;
  string url = 2;
  string fallback_url = 3;
}

// Hides a share another Claktory shares with this one, or shows it again.
message HidePipeShare {
  string share_id = 1;
  bool hidden = 2;
}

// Whether a port could be shared, before Share: answered with
// PipeSharePort.
message CheckPipeSharePort {
  uint32 port = 1;
}

message PipeSharePort {
  uint32 port = 1;
  // Something on this computer answers on it now.
  bool listening = 2;
  // Why it can't be shared, in a sentence ("Port 7420 is Claktory's
  // own."); empty when it can.
  string problem = 3;
  // The person's program listening on it on Claktory's computer: its
  // executable's name only ("node"), never its arguments or path. Empty,
  // with pid 0, when none of theirs does, or Claktory can't tell (another
  // user's program, no lsof).
  string program = 4;
  uint32 pid = 5;
  // The pipes this port is shared with already (Pipe.id), live: sharing it
  // with one of them again is refused, so the form says so.
  repeated string shared_pipe_ids = 6;
}

message ServerMessage {
  uint64 reply_to = 1;
  oneof body {
    Welcome welcome = 2;
    Error error = 3;
    Ack ack = 4;
    Workspace workspace = 5;
    Transcript transcript = 6;
    EntryUpdate entry = 7;
    EntryDelta delta = 8;
    Explorer explorer = 9;
    ExtensionView extension_view = 10;
    QueuedMessages queued_messages = 11;
    Highlight highlight = 12;
    // The answer to CreatePairing, to the asker only.
    PairingCode pairing_code = 13;
    // The answer to FetchApp, to the asker only.
    AppChunk app_chunk = 14;
    // The answer to ListFolders, to the asker only.
    FolderList folder_list = 15;
    // The answer to ReadFile, to the asker only.
    FileContent file_content = 16;
    // The answer, to the asker only, to UnlockVault, ChangePassphrase,
    // DeleteSecret, GrantSecret, SetVaultLockedMode and LockVaultSession;
    // always 0 now (see VaultSession).
    VaultSession vault_session = 20;
    // The answer to RevealSecret, to the asker only.
    SecretValue secret_value = 21;
    // The answer to PreviewEnv, to the asker only.
    EnvPreview env_preview = 22;
    // The answer to CreateVault and NewRecoveryKey, to the asker only.
    RecoveryKey recovery_key = 23;
    // The answer to ListSecretUses, to the asker only.
    SecretUses secret_uses = 24;
    // To a device's Hello, with its pairing code's token, while it waits for
    // the person to allow it (see PendingDevice).
    PairingPending pairing_pending = 25;
    // The answer to LoadEntries, to the asker only.
    EntryPage entry_page = 26;
    // Instead of Workspace, to an app that asked for patches in Hello: what
    // changed since the last Workspace or WorkspacePatch it was sent.
    WorkspacePatch workspace_patch = 27;
    // The answers to StartUpload and UploadChunk, and to FinishUpload, to the
    // asker only.
    UploadProgress upload_progress = 28;
    UploadedFile uploaded_file = 29;
    // Every thread on a file: the answer to ListThreads, to the asker only,
    // and to everyone whenever a thread on it changes.
    ThreadList thread_list = 30;
    // To everyone, when a file shown in a pane changes.
    FileChanged file_changed = 31;
    // The answer to CreateThread, to the asker only: the new thread.
    Thread thread = 32;
    // The answer to StartConnect, to the asker only: what to open.
    ConnectStarted connect_started = 34;
    // The answer to ListConnectChoices, to the asker only.
    ConnectChoices connect_choices = 35;
    // The answer to UseUsageReset, to the asker only.
    UsageResetAnswer usage_reset_answer = 36;
    // The answer to LoadUsage, to the asker only.
    UsageReport usage_report = 37;
    // The answer to InstallLocalApp without `approve`, to the asker only.
    AppPermissions app_permissions = 38;
    // An agent asks the app the person is using to open a screen.
    OpenScreen open_screen = 39;
    // Pipes: to the asker only (PipeInvite, PipeInvitePreview,
    // PipeMessagePage), or to every client showing the pipe (PipeTranscript,
    // PipeMessageUpdate).
    PipeInvite pipe_invite = 40;
    PipeInvitePreview pipe_invite_preview = 41;
    PipeTranscript pipe_transcript = 42;
    PipeMessageUpdate pipe_message_update = 43;
    PipeMessagePage pipe_message_page = 44;
    // Chats: to every client while the chat is selected (ChatTranscript,
    // ChatEntryUpdate, ChatEntryDelta, ChatQueuedMessages), or to the asker
    // only (ChatEntryPage, the answer to LoadChatEntries).
    ChatTranscript chat_transcript = 45;
    ChatEntryUpdate chat_entry = 46;
    ChatEntryDelta chat_delta = 47;
    ChatEntryPage chat_entry_page = 48;
    ChatQueuedMessages chat_queued_messages = 49;
    // App views, only to the connections that opened the surface:
    // AppSurface is the answer to OpenAppView, and comes again whenever the
    // surface's state changes; AppViewUpdate carries each change to what it
    // shows.
    AppSurface app_surface = 51;
    AppViewUpdate app_view_update = 52;
    // To every client: something the person should hear of (see Notify).
    Notify notify = 50;
    // The answer to CheckRecoveryKey, to the asker only.
    RecoveryKeyCheck recovery_key_check = 53;
    // The answer to ListNeedsYouHistory, to the asker only.
    NeedsYouHistory needs_you_history = 54;
    // The answer to ListQuietCopies, to the asker only.
    QuietCopies quiet_copies = 55;
    // Browser control, only to the connection a session is bound to (never
    // to every client): a command for its Chrome, and the session's end.
    BrowserCommand browser_command = 56;
    BrowserEnded browser_ended = 57;
    // The answer to ListBrowserLog, to the asker only.
    BrowserLog browser_log = 58;
    // The answer to ReadInkBlob, to the asker only.
    InkBlobData ink_blob_data = 59;
    // The ink layers on a file: the answer to ListInkLayers, and to every
    // client again whenever one of them changes.
    InkLayerList ink_layer_list = 60;
    // The answer to SaveInkLayer, to the asker only.
    InkLayerSaved ink_layer_saved = 61;
    // Where this device was reading: after Welcome when it keeps anything
    // (none means nothing), and to every connection of this device whenever
    // it changes. Never another device's.
    Presentation presentation = 62;
    // The answer to CreateSketch, to the asker only.
    SketchCreated sketch_created = 63;
    // The answer to DmLeafOfferRequest, to the asker only.
    DmLeafOffer dm_leaf_offer = 64;
    // The answer to ListPipeReports, to the asker only.
    PipeReportPage pipe_report_page = 65;
    // The answer to ReportReply, to the asker only.
    ReplyReport reply_report = 66;
    // The answer to SearchConversation, to the asker only.
    ConversationMatches conversation_matches = 67;
    // What a TranscribeAudio heard, to the connection that asked only.
    AudioTranscribed audio_transcribed = 68;
    // The answer to UndoAppAccessChange, to the asker only.
    AppAccessUndone app_access_undone = 69;
    // The answer to ListAppFiles, to the asker only.
    AppFiles app_files = 70;
    // The answer to ListMonitors, to the asker only.
    MonitorList monitor_list = 71;
    // The answer to ListMonitorHistory, to the asker only.
    MonitorHistory monitor_history = 72;
    // To every client: some agent's monitors changed (one was added,
    // fired, checked, paused, ended, or its agent's Monitors were turned on
    // or off). A client showing the overview or a history asks again.
    MonitorsChanged monitors_changed = 73;
    // The answer to ListBranches, to the asker only.
    Branches branches = 74;
    // The answer to OpenPipeShare, to the asker only.
    PipeShareOpened pipe_share_opened = 78;
    // The answer to CheckPipeSharePort, to the asker only.
    PipeSharePort pipe_share_port = 79;
    // Direct messages from the home (#451): the answer to DmSend and
    // DmFollow, and what a following connection is sent as it arrives.
    DmFeed dm_feed = 80;
    // The home's state: the answer to DmRoutes, and sent to following
    // connections when it changes.
    DmHome dm_home = 81;
    // The answer to GetHistoryOverview, to the asker only.
    HistoryOverview history_overview = 82;
    // The answer to GetHistoryEvents; and, to a connection watching
    // (WatchHistory), each new event as it happens (reply_to 0).
    HistoryEvents history_events = 83;
    // To a connection watching: the overview changed; ask for it again.
    HistoryChanged history_changed = 84;
    // Claktory's browser (#435), only to the connection watching it
    // (WatchAgentBrowser): never in the Workspace, to agents or pipes.
    AgentBrowserFrame agent_browser_frame = 85;
    AgentBrowserClipboard agent_browser_clipboard = 86;
    AgentBrowserViewMoved agent_browser_view_moved = 87;
    // The answer to ListErrandLog, to the asker only.
    ErrandLog errand_log = 88;
    // The answer to ListTimeZones, to the asker only.
    TimeZones time_zones = 89;
    // The answer to ShowRecoveryCodes, to the asker only: never in the
    // Workspace, a conversation or a patch.
    RecoveryCodes recovery_codes = 92;
    // The answer to VouchDevice, to the asker only.
    DeviceVouched device_vouched = 91;
  }
  // Resuming the Workspace on reconnect (#378), only to an app whose Hello
  // has workspace_patches. On a message carrying a Workspace or a
  // WorkspacePatch: the revision it brings the app to, opaque
  // ("<process random>-<counter>"): send it back in Hello.workspace_revision
  // to resume from it.
  string workspace_revision = 75;
  // On a WorkspacePatch: the revision it applies to (the previous
  // workspace_revision on this connection, or Hello's for the first one
  // after Welcome). If it isn't the one the app holds, the app drops what
  // it holds and reconnects for a whole Workspace. Empty on a whole one.
  string workspace_base_revision = 76;
  // Resuming the conversation shown on reconnect (#413, #378's second step).
  // On a Transcript, and on each EntryUpdate and EntryDelta of the agent it's
  // for: the revision of that agent's conversation the message brings the
  // app to, opaque ("<process random>-<counter>"). Keep the latest applied,
  // with its agent, and send both back in Hello.transcript_agent_id and
  // transcript_revision. Empty on others (a chat's, a pipe's).
  string transcript_revision = 77;
  // For the conversation this connection watches (WatchTranscript, #514),
  // not the one selected: its snapshot (Transcript, ChatTranscript or
  // PipeTranscript) and its agent's or chat's EntryUpdate, EntryDelta,
  // ChatEntryUpdate and ChatEntryDelta, to this connection only. Keep them
  // apart from the selected conversation's, which comes as before (both,
  // when it's the same one). No transcript_revision: after a reconnect,
  // send WatchTranscript again. A watched pipe's PipeMessageUpdate is the
  // one every connection gets (untagged), routed by its pipe_id.
  bool watched = 90;
}

// ---- Handshake ----

message Hello {
  uint32 protocol_version = 1;
  string client_version = 2;
  // The device's token from its pairing code (`factory://…?t=<token>`),
  // through the private tunnel (iroh); on the loopback port (7420) it isn't
  // needed.
  string token = 3;
  // What kind of device this is, so agents can fit their replies to it
  // (shorter on a phone). Its name the backend knows: the paired device's,
  // or this computer's for its own app. Unspecified from apps before it.
  DeviceKind device_kind = 4;
  // The app applies WorkspacePatch: after the first whole Workspace, the
  // backend sends only what changed. Apps before it get whole Workspaces.
  bool workspace_patches = 5;
  // This device's own name, as its owner knows it: a Mac's Computer Name
  // ("Matt's MacBook"), an iPhone's name. A device whose pairing code was
  // made without a name (`factoryd pair --no-wait`) takes it when it first
  // uses the code. Empty from apps before it.
  string device_name = 6;
  // A device assertion: claktory.com's word, signed with its key, that the
  // device with this connection's tunnel key is signed in to an account
  // (claktory-account API.md, "Devices"). Through the tunnel only. With no
  // token, the device found this Claktory through its account (discovery):
  // it's let in only if the account is this Claktory's, and then waits for
  // Allow (PairingPending.discovered), unless it's the first device of a
  // Claktory signed in less than 30 minutes ago. With a pairing code's token,
  // a matching account takes the place of Allow. From a paired device, it
  // confirms the device as the owner's. Empty when the device has none.
  string assertion = 7;
  // This app can sign in to the account and confirm (`assertion`,
  // ConfirmDevice). Versions before #527 S3 started a device's deadline to
  // confirm only once it connected with an app that can; there are no
  // deadlines now, and it's no longer read.
  bool can_confirm = 8;
  // The device's system: "ios", "ipados", "android", "macos", "linux" or
  // "windows". Kept with the paired device and counted, never named, in
  // the account's check-in (#119). Empty from apps before it.
  string platform = 9;
  // The revision of the Workspace the app holds from this Claktory, exactly
  // as it applied it (ServerMessage.workspace_revision; #378), or empty.
  // While the backend still has it for this device (the last few it was
  // sent, for 6 hours, in this process), the first Workspace after Welcome
  // is a WorkspacePatch against it, even one where nothing changed;
  // otherwise a whole Workspace, as without it. Only with workspace_patches.
  string workspace_revision = 10;
  // The agent whose conversation the app holds, and the revision of it it
  // last applied (ServerMessage.transcript_revision), to resume it (#413).
  // When that agent is still the one shown and the backend can tell what
  // changed since, the Transcript after Welcome has `resumed` and only the
  // entries added or changed since; otherwise it's the latest page, as when
  // they're empty (older apps).
  string transcript_agent_id = 11;
  string transcript_revision = 12;
}

enum DeviceKind {
  DEVICE_KIND_UNSPECIFIED = 0;
  // A computer at a desk: an iMac, a Mac mini or Studio, a desktop PC.
  DEVICE_KIND_DESKTOP = 1;
  // A laptop: a MacBook.
  DEVICE_KIND_LAPTOP = 2;
  DEVICE_KIND_PHONE = 3;
  DEVICE_KIND_TABLET = 4;
}

// Where the person sent a message from: the device their app ran on.
message SentFrom {
  // The paired device's name (Settings → Devices), or this computer's name
  // (its Computer Name on a Mac) for the app running on it.
  string device_name = 1;
  // As the app said in Hello; unspecified from apps before it.
  DeviceKind kind = 2;
}

message Welcome {
  uint32 protocol_version = 1;
  string server_version = 2;
  // Through the tunnel, the paired device this connection is (see
  // RemoteAccess.devices), so the app can mark it "This device"; "local" for
  // this machine's own app (its code from <data folder>/remote/local-pairing);
  // empty on the loopback port.
  string device_id = 3;
  // This Claktory's name and color (see Settings), to show before the first
  // Workspace.
  string name = 4;
  string color = 5;
  // Versions before #527 S3 gave a device a deadline to confirm it's the
  // owner's; there are none now, so this is always 0.
  int64 confirm_by_ms = 6;
}

// Pairs a new device with this Factory. Answered with PairingCode. Refused
// while remote access is off (RemoteAccess.on).
message CreatePairing {
  // What the device is called, e.g. "Laptop".
  string name = 1;
  // No longer used: devices reach this machine through the tunnel, by its
  // endpoint id (RemoteAccess.endpoint_id), wherever they are.
  string host = 2;
}

// A new device's pairing code: the answer to CreatePairing or
// ShowPairingCode. Sent only to the client that asked; Factory keeps only a
// hash of the key in it on disk (and, for ShowPairingCode, the code in
// memory while it waits).
message PairingCode {
  // factory://?t=<token>&name=<this machine>&e=<endpoint id>[&r=<relay
  // URL>…]: what the device pastes or scans to connect, through the tunnel.
  // e= is the backend's iroh endpoint id (what iroh's EndpointId parses);
  // each r= a relay it can be reached through (percent-encoded). Until it's
  // first used it expires (PairedDevice.code_expires_ms); the first device
  // to connect with it binds its key to it, and no other key can use it.
  // That device gets in once the person allows it (PendingDevice).
  string code = 1;
  // The new device's id in RemoteAccess.devices.
  string device_id = 2;
  // The same code as a link, for its QR code:
  // https://claktory.com/pair#t=<token>&name=…, `code`'s query after the
  // `#`. A phone's camera opens it in Claktory (a Universal Link or App
  // Link), or without the app on Claktory's page, which offers it in the
  // store; the fragment never reaches the page's server. The app reads the
  // fragment and checks it exactly as it does `code`. Empty until Claktory's
  // page is ready for it, and from a backend before it: show `code`.
  string link = 3;
}

// Unpairs a device: it can't connect any more, and its open connections
// close. Answered with Ack.
message UnpairDevice {
  string device_id = 1;
}

// Allows a device that's waiting (RemoteAccess.pending_devices): it's
// paired, and its waiting connection gets Welcome. Answered with Ack;
// ERROR_CODE_NOT_FOUND when no device with that id is waiting (its code
// expired or was cancelled meanwhile).
message ApproveDevice {
  string device_id = 1;
  // The four digits the person typed, read off the new device
  // (PendingDevice.number), so only someone who can see that device allows
  // it (#352 P4). A wrong number is refused with ERROR_CODE_INVALID_REQUEST
  // saying how many tries are left; the third wrong one turns the device
  // away, as DenyDevice does. Empty is refused as a wrong number isn't:
  // it asks for the digits.
  string number = 2;
  // From `factoryd allow` (a tool on this computer): it ran on a terminal,
  // so a person compared the digits and the device is confirmed by its
  // Allow (#527 S3); false from a program, whose device then shows the
  // owner's assertion before it connects. Apps leave it false: who asks
  // decides for them (this computer's own app, or a confirmed device,
  // confirms; an unconfirmed device doesn't).
  bool from_terminal = 3;
}

// Takes a device's Allow off Needs you (RemoteAccess.allow_notices) on every
// device (#527 S3). Answered with Ack, also when it's gone already.
message DismissAllowNotice {
  string device_id = 1;
}

// Turns away a device that's waiting: its code stops working, the device is
// forgotten (make a new code to pair it), and its waiting connection gets
// ERROR_CODE_UNAUTHORIZED. Answered with Ack; ERROR_CODE_NOT_FOUND when no
// device with that id is waiting.
message DenyDevice {
  string device_id = 1;
}

// The code of an agent's DevicePairing that's WAITING, for the person's app
// to show as a QR code and with Copy code. Answered with PairingCode, to the
// asker only; ERROR_CODE_NOT_FOUND once the pairing no longer waits (a
// device used its code, or it ended). Asked again, it gives the same code;
// after the backend restarts (it keeps codes only in memory) a new one,
// which replaces the code shown before.
message ShowPairingCode {
  // DevicePairing.id.
  string pairing_id = 1;
}

// Cancels a pairing code that hasn't let a device in yet, when the person
// closes Add a device: the code stops working and the device is forgotten
// (a device waiting with it is turned away). A code exists only while the
// person is pairing: this, or its 10 minutes running out, ends it. Answered
// with Ack, also when the device is already gone; a device already allowed
// stays paired.
message CancelPairing {
  string device_id = 1;
}

// The answer to a device's Hello while it waits to be allowed. The
// connection stays open: Welcome follows (replying to the Hello) once the
// person allows it, or Error ERROR_CODE_UNAUTHORIZED, with why, once it's
// turned away, cancelled or its code expires. Meanwhile the device shows
// PendingDevice.number, worked out on its own side.
message PairingPending {
  // Its id in RemoteAccess.devices.
  string device_id = 1;
  // The name it was given when its code was made.
  string name = 2;
  // The name of the computer Claktory runs on, which asks the person
  // (RemoteAccess.machine).
  string machine = 3;
  // When its code stops working, in ms since 1970.
  int64 expires_ms = 4;
  // It came without a code, through its account (Hello.assertion with no
  // token): it waits for Allow on another device, or `factoryd allow` on the
  // machine. Its four digits are PendingDevice.number's, worked out with the
  // SHA-256 of the assertion (the text sent in Hello) in place of the token's.
  bool discovered = 5;
}

// Turns remote access (devices on other machines reaching this Factory
// through the private tunnel) on or off, in config.json's `remote`. Answered
// with Ack.
message SetRemoteAccess {
  bool on = 1;
  // No longer used (there's no listening port); kept in config.json.
  uint32 port = 2;
  // No longer used; kept in config.json.
  optional string listen = 3;
  // The relays to use, as URLs (config.json `remote.relays`), when
  // set_relays; empty for the default ones (RemoteAccess.relays).
  repeated string relays = 4;
  bool set_relays = 5;
}

// Remote access: devices on other machines connecting to this Factory,
// through the private tunnel (iroh): end-to-end encrypted, by the backend's
// key, directly or through a relay that can't read it. Factory listens on no
// port for them.
message RemoteAccess {
  // config.json has `remote`: paired devices may connect. Off, only this
  // machine's app can (the tunnel then binds to 127.0.0.1 only).
  bool on = 1;
  // No longer used (config.json's `remote.port` is kept, unused).
  uint32 port = 2;
  // No longer used.
  string listen = 3;
  // The tunnel can't run, and why; empty while all's well.
  string error = 4;
  // No longer used (there's no certificate to pin): empty.
  string fingerprint = 5;
  // No longer used: empty.
  repeated string addresses = 6;
  repeated PairedDevice devices = 7;
  // This machine's name ("mac-mini"), which pairing codes give until the
  // Claktory is renamed (Settings.name).
  string machine = 8;
  // This backend's iroh endpoint id, as pairing codes give it (e=).
  string endpoint_id = 9;
  // The relays it uses while on: config.json's `remote.relays`, or the
  // default ones (n0's for now) when that's empty.
  repeated string relays = 10;
  // config.json sets its own relays (relays are those); false for the
  // default ones.
  bool custom_relays = 11;
  // The relay it's connected to now (its home relay), and whether it is;
  // empty and false while off or offline.
  string home_relay = 12;
  bool relay_connected = 13;
  // Devices that used a pairing code and wait for the person to allow them,
  // oldest first. Each is also in `devices`, with its code_expires_ms.
  repeated PendingDevice pending_devices = 14;
  // Allows not yet dismissed, oldest first (#527 S3). A removed device's
  // goes with it.
  repeated AllowNotice allow_notices = 15;
}

// A device that connected with a pairing code and waits to be allowed: a
// code lets a device in only once the person allows it, on a device that's
// already in (ApproveDevice), or turns it away (DenyDevice). Only the first
// device to use a code asks; any other is turned away. The new device shows
// the same number (see `number`), so the person can tell it's theirs and
// not one that copied the code.
message PendingDevice {
  // Its id in RemoteAccess.devices (PairingCode.device_id).
  string device_id = 1;
  // The name it was given when its code was made.
  string name = 2;
  // What it says it is, from its Hello.
  DeviceKind kind = 3;
  // Four digits, e.g. "0427", that the new device shows too. Both sides
  // work it out: SHA-256 of the UTF-8 text "claktory pairing\n" + this
  // Claktory's endpoint id (the code's e=, lowercase hex) + "\n" + the
  // device's own endpoint id (lowercase hex) + "\n" + the SHA-256 of the
  // code's token (t=, the SHA-256 of its text) in lowercase hex; its first
  // four bytes as a big-endian unsigned number, modulo 10000, with leading
  // zeros. For example, with endpoint ids of 64 "a"s and 64 "b"s and the
  // token "0123456789abcdef": "0722".
  string number = 4;
  // When it asked, in ms since 1970.
  int64 requested_ms = 5;
  // When its code stops working, and it's turned away, unless allowed.
  int64 expires_ms = 6;
  // It showed a valid device assertion for this Claktory's account: it's
  // signed in as the owner ("signed in as you").
  bool signed_in = 7;
  // It came without a code, through its account (PairingPending.discovered);
  // `number` uses its assertion in place of the token.
  bool discovered = 8;
}

// How a device's connection travels.
enum DevicePath {
  // Not connected.
  DEVICE_PATH_NONE = 0;
  // Straight between the two machines (the same machine, a LAN, or a hole
  // punched through the NATs).
  DEVICE_PATH_DIRECT = 1;
  // Through a relay, end-to-end encrypted.
  DEVICE_PATH_RELAYED = 2;
}

message PairedDevice {
  string id = 1;
  string name = 2;
  // When it was paired, in ms since 1970.
  int64 paired_ms = 3;
  // When it last connected; 0 if it never has.
  int64 last_seen_ms = 4;
  // It's connected now.
  bool connected = 5;
  // The IP address it last connected from; empty if it never has, or when
  // only a relay carried it.
  string last_address = 6;
  // How it's connected now; NONE when it isn't.
  DevicePath path = 7;
  // Its pairing code hasn't been used yet and stops working at this time
  // (ms since 1970); 0 once a device has used it. Past it, the device can't
  // connect: pair it again.
  int64 code_expires_ms = 8;
  // It's the owner's: it showed a valid device assertion for this
  // Claktory's account, or the person confirmed it from a confirmed device
  // (ConfirmDevice.device_id), or it was allowed with its digits by a
  // person (#527 S3: on this computer's own app, on a confirmed device, or
  // at a terminal), or before Allows were recorded (allowed_by "before").
  // Always true for this computer's own app. One that isn't (let in by a
  // program, or by a device not confirmed itself) is turned away with
  // ERROR_CODE_SIGN_IN_REQUIRED while this Claktory is signed in, until it
  // shows the owner's assertion; the person can confirm or remove it from
  // another device.
  bool confirmed = 9;
  // Versions before #527 S3 gave a 7-day grace to confirm; there are no
  // deadlines now, so this is always 0.
  int64 confirm_by_ms = 10;
  // It gets notifications pushed to it while it isn't connected: it
  // registered with the push relay (RegisterNotifications).
  bool notifications = 11;
  // Its system as its app last said (Hello.platform): "ios", "ipados",
  // "android", "macos", "linux" or "windows". Empty when it never sent one
  // (an app from before, or one that hasn't connected yet).
  string platform = 12;
  // Its app's version as it last said (Hello.client_version), e.g.
  // "v0.1.19"; empty when it never sent one.
  string app_version = 13;
  // The update on offer would leave it behind: its app_version and the
  // backend in it (Workspace.latest_backend, newer than this one) are both
  // numbered and on different lines (their first two numbers, as the app's
  // own compatibility check reads them), so its app can't connect until
  // it's updated too. False when no new backend is on offer, or either
  // version isn't numbered.
  bool update_leaves_behind = 14;
  // How it was let in (#527 S3), for Settings → Devices: when, in ms since
  // 1970 (0 when no time was kept), and by what:
  // "device": a device allowed it with its digits; allowed_by_device_id is
  //   its id ("local" for this computer's own app) and allowed_by_name its
  //   name then.
  // "terminal": `factoryd pair`, or `factoryd allow` on a terminal.
  // "program": `factoryd allow` from a program, with no terminal.
  // "first_device": the first device through the account, within 30
  //   minutes of this Claktory signing in.
  // "before": allowed before Allows were recorded.
  // Empty when it got in otherwise (a code and the owner's account).
  int64 allowed_ms = 15;
  string allowed_by = 16;
  string allowed_by_device_id = 17;
  string allowed_by_name = 18;
  // When it was last turned away, in ms since 1970, and why; 0 and empty
  // once it gets in again. "other_account": it showed it's signed in to
  // another account than this Claktory's (#527 S4), a stolen phone, say.
  // Settings → Devices shows "Turned away: now signed in to another
  // account · <time>".
  int64 turned_ms = 19;
  string turned_why = 20;
}

// An Allow the person should know of (#527 S3): "<device> can now use
// <Claktory>", in Needs you on their devices until one dismisses it
// (DismissAllowNotice). Apps hide it on the device that allowed it
// (allowed_by_device_id equal to Welcome.device_id). Never the digits.
message AllowNotice {
  // The allowed device (PairedDevice.id), which is also this notice's id,
  // and its name.
  string device_id = 1;
  string device_name = 2;
  // As PairedDevice's: "device", "terminal" or "program".
  string allowed_by = 3;
  string allowed_by_device_id = 4;
  string allowed_by_name = 5;
  int64 allowed_ms = 6;
}

// ---- Requests (client → server). Each is answered with `ack` or `error`. ----

// Creates a project. Its folder is named after it, inside Factory's
// workspace folder, and is created if it doesn't exist. Clients send only the
// name; `path` is for callers that need a specific folder.
message CreateProject {
  string name = 1;
  string path = 2;
}

// Creates an agent and selects it. An empty `project_id` puts it in the
// workspace, outside any project. Empty `model` or `effort` means the Factory
// default.
message CreateAgent {
  string project_id = 1;
  string name = 2;
  // The agent's prompt: instructions added to its system prompt.
  string prompt = 3;
  string model = 4;
  string effort = 5;
  // One of the agent colors (see Agent.color); empty lets Factory pick.
  string color = 6;
  // One of its project's folders (Project.folders) to work in; empty for the
  // project's own folder.
  string folder_id = 7;
  // What it does, shown with its name (see Agent.role); empty for none.
  string role = 8;
  // The agent it reports to (see Agent.lead_id); empty for none. Refused
  // (INVALID_REQUEST) unless it's in the same project or an admin agent.
  string lead_id = 9;
}

// Changes an agent's settings. Unset fields stay as they are. Takes effect
// from the agent's next step (its next model call), mid-run too; what's
// display only (color, placeholder, avatar) at once.
message UpdateAgent {
  string agent_id = 1;
  optional string name = 2;
  optional string prompt = 3;
  optional string model = 4;
  optional string effort = 5;
  // Moves the agent to another project; empty moves it to the workspace. Its
  // conversation goes with it, and it works in the new folder from its next
  // step.
  optional string project_id = 6;
  // One of the agent colors (see Agent.color).
  optional string color = 7;
  // Changes one of the agent's extensions.
  ExtensionChange extension = 8;
  // What its message box says when empty (see Agent.placeholder); empty
  // goes back to "Message <name>".
  optional string placeholder = 9;
  // Deprecated and ignored: agents work in their project's folders
  // (folder_id) instead.
  optional string folder = 10;
  // The project folder it works in (see Agent.folder_id): one of its
  // project's folders, or empty for the project's own folder. Moving the agent
  // to another project without this puts it in that project's own folder.
  optional string folder_id = 11;
  // Its character's body shape (see Agent.avatar_shape); empty goes back to
  // automatic. Display only, like color.
  optional string avatar_shape = 12;
  // Unused: characters no longer have faces, and this is ignored.
  optional string avatar_face = 13;
  // What it does (see Agent.role); empty clears it.
  optional string role = 14;
  // The agent it reports to (see Agent.lead_id); empty for none. Refused
  // (INVALID_REQUEST) unless it's another agent, in the same project or an
  // admin agent, that doesn't report to this one, directly or through
  // others. Moving the agent to another project drops a lead that no
  // longer fits; the agents that report to it move with it.
  optional string lead_id = 15;
  // The model a step its model refused is retried on (see
  // Agent.fallback_model); empty falls back to the Claktory-wide default
  // (Settings.default_fallback_model).
  optional string fallback_model = 16;
  // Whether it notifies the person (see Agent.notify).
  optional NotifyMode notify = 17;
}

// Turns an extension on or off for an agent, and/or sets one of its options.
message ExtensionChange {
  // The extension's id, e.g. "agents".
  string id = 1;
  // Turns it on or off; unset leaves it as it is.
  optional bool enabled = 2;
  // The option to set to `value`; empty sets none.
  string option_id = 3;
  OptionValue value = 4;
}

// Selects the agent every client shows. The server answers with that agent's
// `transcript`.
message SelectAgent {
  string agent_id = 1;
}

// Gives an agent a message. If it's busy, the message waits for the current
// run to finish.
message SendMessage {
  string agent_id = 1;
  string text = 2;
  // Made up by the app for this send, so it can show the message at once and
  // match it to the queued message and transcript entry it becomes, which
  // carry it (QueuedMessage.client_id, UserText.client_id). Optional.
  // Sent again with the same client_id for the same agent (#401: its answer
  // was lost on a weak connection), it's answered with Ack and delivered
  // only once, whatever became of the first (queued, read, a voice message
  // transcribed or failed), even after a restart. The same holds for
  // SendChatMessage, and for CreateChat with text (the chat it made is
  // selected again; no second chat). Use a new client_id for each message.
  string client_id = 3;
  // Files uploaded for this agent (UploadedFile.attachment, as answered),
  // which the message carries; with any, `text` may be empty. Each must be in
  // the agent's uploads folder and still there, or the message is refused.
  repeated Attachment attachments = 4;
  // A voice message: attachments[0] is a recording (AAC in .m4a, 16 kHz
  // mono from the apps; WAV, MP3, FLAC, Ogg Vorbis also read), up to 30
  // minutes. `text` is empty, or what the person typed or pasted to go with
  // it (#425), and the attachments after the first are files sent with it,
  // as in any message. It waits in the queue (QueuedMessage.transcription)
  // while this Claktory transcribes it, then the agent gets one message:
  // the typed text first, then the words heard after "Voice note: " (see
  // UserText.typed). Failed, it keeps the typed text; RetryVoiceMessage and
  // DiscardVoiceMessage work as for any. Refused while the speech model is
  // ABSENT or UNSUPPORTED (Workspace.speech_model): the app asks the person
  // and sends InstallSpeechModel first.
  bool voice = 5;
  // A reply on a checklist item (ChecklistItem.id), from Needs you or the
  // Checklist panel; 0 for none. The agent reads which item it's about, and
  // the item's history keeps the text as the person's (author empty); the
  // item's status doesn't change. `text` is required, and `voice` is false.
  // Refused, with the reason, for an item that isn't there, or when
  // `agent_id` is neither the checklist's agent nor the item's owner.
  uint32 checklist_item = 6;
  // Whose checklist `checklist_item` is on: an agent's id; empty for
  // `agent_id`'s own. Set it to WaitingItem's agent when sending to the
  // item's owner.
  string checklist_agent_id = 7;
}

// An item of an agent's checklist that a message of the person's replies
// on (SendMessage.checklist_item).
message ChecklistItemRef {
  // Whose checklist it's on; never empty.
  string agent_id = 1;
  // ChecklistItem.id on that checklist.
  uint32 id = 2;
  // Its text when the message was sent: the reference still reads after
  // the item changes or is gone.
  string text = 3;
}

// A file the person attached to a message: uploaded to the agent's uploads
// folder on the machine Claktory runs on, for the agent to move where it
// belongs.
message Attachment {
  // Where it's stored: <data folder>/agents/<agent id>/uploads/<yyyy-mm-dd>/<name>.
  string path = 1;
  // Its name as stored: the file's own, with " 2", " 3"… before the
  // extension when the day's folder already has one so named.
  string name = 2;
  // In bytes.
  uint64 size = 3;
  // Its type as the app gave it, such as "image/png"; may be empty.
  string mime = 4;
}

// Starts (or resumes) uploading a file for an agent: answered with
// UploadProgress, saying how much the backend has (0 for a new upload).
// Then UploadChunk from that offset, each answered with UploadProgress, and
// FinishUpload, answered with UploadedFile. A connection that drops can
// resume with the same `upload_id` and file while the backend runs; after a
// restart of the backend it starts again from 0. One that finished within
// the hour (#401: its UploadedFile lost on a weak connection) answers with
// all of it received; its FinishUpload then answers as it did, storing
// nothing twice. Refused (with an error
// saying why) for a file over 2 GB, an agent that doesn't exist, or a disk
// without room for it and 1 GB to spare.
message StartUpload {
  // Made up by the app, unique for the file being uploaded.
  string upload_id = 1;
  // The agent it's for; or a chat's id (Chat.id) for a voice message's
  // recording, an audio type up to 100 MB (SendChatMessage.voice).
  string agent_id = 2;
  // The file's name; only its last part is kept.
  string name = 3;
  // Its whole size in bytes.
  uint64 size = 4;
  // Its type, such as "image/png"; optional (required for ink).
  string mime = 5;
  // What it's for: a file for an agent (the default), or an ink blob.
  UploadPurpose purpose = 6;
}

// What an upload is for.
enum UploadPurpose {
  // A file attached to a message for `agent_id`, stored in its uploads.
  UPLOAD_PURPOSE_AGENT = 0;
  // An ink blob: an iPad drawing ("drawing.pkdrawing",
  // "application/x-pencilkit", at most 8 MiB) or a PNG ("image/png": a
  // preview, at most 4 MiB, or a review item's context image, at most
  // 3 MiB and 2048 px on its long edge, checked when a thread names it).
  // `agent_id` is empty. Kept privately, by its SHA-256, where no agent's
  // tools reach, until the person sends it; FinishUpload must carry the
  // hash, and answers UploadedFile.blob_sha256.
  UPLOAD_PURPOSE_INK = 1;
  // A recording to transcribe for the person (TranscribeAudio): AAC in .m4a
  // ("audio/mp4"), 16 kHz mono, at most 10 minutes and 16 MiB. `agent_id`
  // is empty. Kept privately, where no agent's tools reach, only until a
  // TranscribeAudio takes it, or an hour; then it's deleted. FinishUpload
  // answers UploadedFile with neither an attachment nor a blob hash.
  UPLOAD_PURPOSE_DICTATION = 2;
}

// Part of an upload's file, from `offset`, which must be how much the backend
// has (UploadProgress.received). At most 1 MiB each.
message UploadChunk {
  string upload_id = 1;
  uint64 offset = 2;
  bytes data = 3;
}

// The whole file is sent: the backend checks its SHA-256 (hex; optional),
// stores it and answers with UploadedFile. Refused if any of it is missing
// or the hash differs, and the upload is gone. Sent again for an upload that
// finished within the hour, it answers with the same UploadedFile.
message FinishUpload {
  string upload_id = 1;
  string sha256 = 2;
}

// Abandons an upload; what the backend had of it is deleted (one that
// finished stays where it was stored, and is no longer answered again).
message CancelUpload {
  string upload_id = 1;
}

// Stops the agent's current run.
message StopAgent {
  string agent_id = 1;
}

// Deletes an agent and its conversation. A running agent is stopped first.
message DeleteAgent {
  string agent_id = 1;
}

// Removes a project and deletes its agents. The project's folder and its files
// are left alone.
message DeleteProject {
  string project_id = 1;
}

// Adds a folder to a project (see Project.folders). An empty `path` puts it
// in the project's folder, named after it. The folder is created if missing.
message CreateFolder {
  string project_id = 1;
  string name = 2;
  // Absolute; anywhere on the machine (a repository elsewhere, say).
  string path = 3;
}

// Renames a project's folder, points it at another folder on disk (files
// aren't moved), or moves it in the project's list. Unset fields stay as
// they are.
message UpdateFolder {
  string project_id = 1;
  string folder_id = 2;
  optional string name = 3;
  optional string path = 4;
  // Moves the folder in its project's list (Project.folders, the sidebar's
  // order): before the folder with this id, or last with "". Unset leaves
  // the order as it is; its own id changes nothing.
  optional string before_id = 5;
}

// Removes a folder from its project. Its agents go to the project's own
// folder; no files are deleted.
message DeleteFolder {
  string project_id = 1;
  string folder_id = 2;
}

// Renames a project. Its folder keeps its name.
message UpdateProject {
  string project_id = 1;
  optional string name = 2;
  // Archives the project (true) or brings it back (false); see
  // Project.archived.
  optional bool archived = 3;
  // Moves the project in the projects list (Workspace.projects, the
  // sidebar's order, the same on every device): before the project with
  // this id, or last with "". Unset leaves the order as it is; its own id
  // changes nothing. Archived projects keep their place. INVALID_REQUEST
  // when `before_id` names no project ("The list changed while you were
  // dragging. Try again.").
  optional string before_id = 4;
}

// Changes Factory-wide settings. Unset fields stay as they are. An empty
// `default_effort` picks one the default model accepts.
message UpdateSettings {
  optional string default_model = 1;
  optional string default_effort = 2;
  optional uint64 compact_at_tokens = 3;
  // The Resources alerts' thresholds (see Settings); cpu_percent 0 turns its
  // alert off. Percentages run 1 to 100.
  optional uint32 ram_percent = 4;
  optional uint32 disk_free_gb = 5;
  optional uint32 disk_free_percent = 6;
  optional uint32 cpu_percent = 7;
  // The sidebar's and the right panel's widths (see Settings); 0 for the
  // app's default. Negative or not finite is refused.
  optional double sidebar_width = 8;
  optional double panel_width = 9;
  // The build caches' budget (see Settings); 0 never clears them. Negative
  // is refused.
  optional double build_cache_gb = 11;
  // The user's first name (see Settings); "" removes it.
  optional string user_name = 10;
  // Unused: requests need no vault passphrase. Still kept in config.json.
  optional uint32 vault_unlock_minutes = 20;
  // See Settings.
  optional bool idle_compaction = 23;
  optional bool idle_compaction_short_cache = 24;
  // Sets one provider's or model's cache lifetime: ttl one of the provider's
  // Provider.cache_ttl_choices ("5m" or "1h" on Anthropic; "30m" or "12h" on
  // OpenAI); "" goes back to the default (its provider's, or the provider's
  // own).
  CacheTtl cache_ttl = 25;
  // This Claktory's name (see Settings); "" goes back to this computer's.
  optional string name = 26;
  // This Claktory's color (see Settings), one of the palette; "" goes back to
  // its default.
  optional string color = 27;
  // See Settings; "" for none.
  optional string default_fallback_model = 30;
  // Folds the sidebar's Projects or Chats section away, or opens it (see
  // Workspace.projects_collapsed and chats_collapsed).
  optional bool projects_collapsed = 31;
  optional bool chats_collapsed = 32;
  // See Settings: 1 to 11, else refused; 0 goes back to the default.
  optional uint32 max_open_panes = 33;
  // Replaces the notification settings (see Settings.notifications) when
  // set. A relay that isn't an https URL is refused.
  NotificationSettings notifications = 34;
  // Settings → Checklist's intervals (#282): each field 0 leaves that one as
  // it is; any other value is 15 to 10080 minutes, else the whole request is
  // refused.
  optional ChecklistSettings checklist = 35;
  // Changes only the notification settings that are set, checked as
  // `notifications` is (B4): what the app sends for one switch, so two
  // devices changing different ones don't undo each other.
  optional NotificationSettingsChange notification_change = 36;
  // Settings.when_app_quits (friend bug #27); UNSPECIFIED is refused. Also
  // answers Onboarding.when_app_quits.
  optional QuitMode when_app_quits = 37;
  // Settings.resource_alerts_to_admins (friend bug #54).
  optional bool resource_alerts_to_admins = 38;
  // The agents chosen to hear the Resources alerts, in place of those
  // chosen before; empty clears them. Each must be an agent (NOT_FOUND
  // otherwise, naming the id), and Resources is turned on for those that
  // have it off, in the same change.
  optional AgentIds resource_alert_agents = 39;
}

// Replaces a settings file that has an error (`Workspace.config_error`) with
// the settings Factory is still using. The broken file is kept next to it as
// config.broken.json.
message RestoreSettings {}

// Installs `Workspace.latest_release`: Factory swaps in its new backend and
// restarts (the connection drops and comes back). With `app_path`, the app
// bundle at that path on Factory's computer is replaced too and reopened once
// the app quits, so the app quits after the ack. From a device on another
// machine `app_path` is ignored: its app updates itself (see FetchApp).
message InstallUpdate {
  string app_path = 1;
}

// Asks for a chunk of the app of release `version` (Workspace.latest_release),
// for an app on another machine to update itself: it fetches the archive
// chunk by chunk, checks its size and SHA-256, unpacks it, sends
// InstallUpdate (with no app_path) and swaps itself. Answered with AppChunk,
// or an Error (NOT_FOUND) saying why this Factory can't send that app (no
// such release, no app in it, packing or downloading it failed).
message FetchApp {
  string version = 1;
  // Where the chunk starts, in bytes: 0 first, then the end of the last.
  uint64 offset = 2;
  // The most the chunk may hold, in bytes (#408): smaller pieces for a slow
  // link, so each answer comes well within the connection's ping. 0 (older
  // apps): 1 MiB. Never more than 1 MiB, whatever is asked.
  uint64 max_bytes = 3;
}

// A chunk of a release's app archive: a gzipped tar with the app bundle at
// its top level. The archive is made the first time any app asks for it;
// until it's ready, the answer is only `version` and `preparing`.
message AppChunk {
  string version = 1;
  uint64 offset = 2;
  // min(FetchApp.max_bytes, 1 MiB, size - offset) bytes of the archive from
  // `offset` (1 MiB when max_bytes is 0).
  bytes data = 3;
  // The whole archive's size in bytes, and its SHA-256 (hex).
  uint64 size = 4;
  string sha256 = 5;
  // The bundle at the archive's top level: "Factory.app", or "Factory
  // Dev.app" for the dev Factory.
  string app_name = 6;
  // The archive is still being made (on a Linux machine, downloaded): ask
  // again in a second or two.
  bool preparing = 7;
}

// Lists the folders in a folder of the machine Factory runs on, so an app on
// another machine can pick a project's folder there by browsing. Answered
// with FolderList, or an Error (INVALID_REQUEST) saying why it can't be
// listed: not a full path, doesn't exist, isn't a folder, permission denied.
message ListFolders {
  // An absolute path, or one starting at the home folder: "" or "~" for the
  // home folder itself, "~/code" below it. ".." and links are resolved.
  string path = 1;
}

message FolderList {
  // The folder listed, as a full path with links and ".." resolved.
  string path = 1;
  // Its parent folder; empty at "/".
  string parent = 2;
  // The folders in it (links to folders too; files are left out), sorted by
  // name, case aside.
  repeated FolderEntry folders = 3;
  // The home folder of the user Factory runs as, for a Home button.
  string home = 4;
  // There were more than 5,000 folders; only the first 5,000 are listed.
  bool truncated = 5;
}

message FolderEntry {
  string name = 1;
  // Its name starts with ".": a hidden folder, which pickers usually hide.
  bool hidden = 2;
}

// Focuses a project: clients show only it, with its folder in the explorer.
// If the selected agent isn't in it, its first agent is selected (or none).
// An empty `project_id` leaves focus.
message FocusProject {
  string project_id = 1;
}

// Opens or closes a folder in a project's explorer. `path` is relative to the
// root it's in, with "/" between names.
message ExpandFolder {
  string project_id = 1;
  string path = 2;
  bool expanded = 3;
  // The root: empty for the project's own folder, else one of its folders
  // (Project.folders, Explorer.folders).
  string folder_id = 4;
  // Or an agent's own checkout (ExplorerRoot.agent_id); folder_id is empty then.
  string agent_id = 5;
}

// Shows a project's files on this connection (an Explorer for it comes, and
// again whenever it changes) until another WatchFiles or the connection
// closes, answered with Ack. An empty project_id watches none.
message WatchFiles {
  string project_id = 1;
}

// Shows the files the project's .factoryignore hides, or hides them again.
message ShowAllFiles {
  string project_id = 1;
  bool show_all = 2;
}

// Moves an agent in the sidebar: to a place among its siblings, under another
// agent, or into another project. Its children (and theirs) come with it.
// Nesting is the lead: under another agent, the agent reports to it
// (Agent.lead_id), refused as UpdateAgent.lead_id is; at the top level, a
// lead in the same place is cleared, and an admin agent's from elsewhere
// kept. Among the same parent's agents, only the order changes. Refused, with
// nothing changed, if an id is unknown or it would be placed under itself or
// one of its own children.
message ArrangeAgent {
  string agent_id = 1;
  // The agent to nest it under; empty for the top level. In another project,
  // that moves it to that project.
  string parent_id = 2;
  // The sibling to place it before; empty to place it last.
  string before_id = 3;
  // Moves it to this project ("" for the workspace) at the top level or under
  // `parent_id`, which must then be in that project. Unset keeps its project,
  // or takes `parent_id`'s.
  optional string project_id = 4;
  // Puts it in this folder of its (new) project (see Agent.folder_id; "" for
  // the project's own folder), in the same step. Unset keeps its folder, or
  // the project's own folder when it moves to another project.
  optional string folder_id = 5;
}

// Folds an agent's children away in the sidebar, or shows them.
message SetAgentCollapsed {
  string agent_id = 1;
  bool collapsed = 2;
}

// Turns highlights (Workspace.highlights) on or off for this Factory.
message SetHighlights {
  bool on = 1;
}

// Stops an agent's background task (its whole process group). The agent gets
// the usual event that it finished, "stopped by the person".
message StopTask {
  string agent_id = 1;
  // Its id, such as "task-3".
  string task_id = 2;
}

// Pauses, resumes or cancels one of an agent's monitors (the Monitors
// panel's buttons), as the person. Pause and cancel stop a watch's command;
// resume picks up from now: a time monitor that came due meanwhile fires
// once. Refused (INVALID_REQUEST) when the monitor's state doesn't allow it,
// such as resuming an active one or changing an ended one.
message ChangeMonitor {
  string agent_id = 1;
  // Its number: 3 for m3.
  uint32 monitor_id = 2;
  MonitorAction action = 3;
}

// Clears one build cache now (a `DiskUsage` of kind "build_cache", by its
// `path`): moved aside at once, deleted in the background; the agents
// working there hear of it at their next run. Answered with Ack, or an error
// saying why not: it isn't a build cache Factory knows, or an agent is
// working there, or a build is running in it.
message ClearBuildCache {
  string path = 1;
}

// The person approves or dismisses an agent's proposal to Rivet (a
// `Proposal` entry in `agent_id`'s transcript), answered with Ack. Approved,
// Rivet gets it as the person's own message: `comment` (if any), a blank
// line, "<Agent> (<role>) proposes:" and the proposal. Either way the agent
// is told. An error when it's no longer pending, or when approving and
// there's no Rivet or Rivet has no model (it stays pending).
message DecideProposal {
  string agent_id = 1;
  string proposal_id = 2;
  bool approve = 3;
  // What the person adds for Rivet; may be empty.
  string comment = 4;
  // Set instead of agent_id for a chat's proposal (Chat.id).
  string chat_id = 5;
  // Submit (#370): `comment` is the person's answer, neither an approval
  // nor a dismissal; needed. Rivet gets the proposal with it as what to do
  // ("Matt answered X's proposal: …. Do what Matt says; the proposal is
  // for context"), and the proposer is told it was answered so. The
  // proposal closes APPROVED with Proposal.replied. `approve` is ignored.
  bool reply = 6;
  // The proposal's version the person decided (Proposal.revision, #428),
  // checked as AnswerAsk.revision is: another is refused with "This card
  // changed. Look at it again."; left out, refused only within 30 seconds
  // of a change.
  optional uint32 revision = 7;
}

enum MonitorAction {
  MONITOR_ACTION_UNSPECIFIED = 0;
  MONITOR_ACTION_PAUSE = 1;
  MONITOR_ACTION_RESUME = 2;
  MONITOR_ACTION_CANCEL = 3;
}

// Folds a project folder's agents away in the sidebar, or shows them.
message SetFolderCollapsed {
  string project_id = 1;
  string folder_id = 2;
  bool collapsed = 3;
}

// Runs one of the agent's slash commands (`Agent.commands`), as the person
// typing "/<name> <args>" in its message box. A command that can't run now
// is an INVALID_REQUEST error whose message can be shown as it is.
message RunCommand {
  string agent_id = 1;
  // "clear", without the slash.
  string name = 2;
  // What follows the name, trimmed; empty if nothing.
  string args = 3;
}

// Reads a file on Factory's machine, for a viewer: the app may be on another
// machine. Answered to the asker only with FileContent (whose `error` says
// why it couldn't be read), never with Error.
message ReadFile {
  // Absolute, or from the home folder ("~/notes.md").
  string path = 1;
  // At most this many bytes; 0 for the default. Text is read up to 2 MB and
  // images up to 20 MB, whatever is asked; videos and PDFs (and any read
  // from an offset) 8 MB at a time.
  uint64 max_bytes = 2;
  // Read from this byte: a video is played a range at a time (offset 0, 8 MB,
  // 16 MB…, until offset + data's length is the size), and a PDF read whole
  // the same way. Videos up to 2 GB, PDFs up to 64 MB ("This PDF is too big
  // to open here (80 MB)."), and other files read from an offset up to 2 GB;
  // larger ones come back with `error`.
  uint64 offset = 3;
  // The whole file's SHA-256 (FileContent.sha256 of an earlier range), so a
  // file read a range at a time comes from one version: when the file's is
  // now different, the answer has `error` "changed" and no data, and the app
  // reads it again from offset 0. Empty: read whatever is there.
  string expected_sha256 = 4;
  // A preview, sized for this screen (#379): its physical pixels, portrait
  // (width <= height). A preview fits it either way round, its long side
  // within preview_height and its short side within preview_width, only
  // ever scaled down. FileContent.preview says whether one came, and
  // expected_sha256, offset and max_bytes then mean the original's version
  // and the preview's bytes. Both 0 (older apps): the original, as before.
  uint32 preview_width = 5;
  uint32 preview_height = 6;
  // With preview_width/height, a PDF over 5 MB: this page (1 is the first)
  // as an image sized for the screen (#379), to show while the PDF itself
  // loads. FileContent.page_count says how many it has. 0: no page.
  uint32 preview_page = 7;
}

message FileContent {
  // As asked, with "~" expanded.
  string path = 1;
  // Sniffed from its content and extension: "text/plain", "text/markdown",
  // "application/json", "image/png", "image/jpeg", "image/gif",
  // "image/webp", "video/mp4", "video/quicktime", "video/webm",
  // "application/pdf", "application/octet-stream"…
  string mime = 2;
  // The whole file's size in bytes.
  uint64 size = 3;
  // Its bytes from `offset`, up to the limit.
  bytes data = 4;
  // `data` isn't the whole file: only its start, or a range of it.
  bool truncated = 5;
  // When it was last changed, in ms since 1970.
  int64 modified_ms = 6;
  // Why it couldn't be read ("No such file: …", "… is a folder", "Can't
  // read …: permission denied"), or "changed" when it's no longer the
  // version ReadFile.expected_sha256 names; empty when it was. The rest is
  // empty then.
  string error = 7;
  // The whole file's SHA-256, in lowercase hex. Text and images read from
  // the start leave it empty when `truncated`; videos and reads from an
  // offset always have it, the same for every range of one version of the
  // file. A thread made on this content says it in
  // CreateThread.version_sha256.
  string sha256 = 8;
  // Where `data` starts in the file: ReadFile.offset.
  uint64 offset = 9;
  // A preview asked with ReadFile.preview_width/height (#379): whether this
  // is one. With FILE_PREVIEW_MADE, mime, size, data, truncated and offset
  // are the preview's (an image as WebP), while sha256 and modified_ms stay
  // the original's: the version comments and ink key on, and that
  // expected_sha256 names.
  FilePreview preview = 10;
  // FILE_PREVIEW_MADE: the preview's size in pixels.
  uint32 pixel_width = 11;
  uint32 pixel_height = 12;
  // FILE_PREVIEW_MADE: the original's size in bytes, for "Original (3.3 MB)".
  uint64 original_size = 13;
  // FILE_PREVIEW_MADE, an image: the original's size in pixels as it shows
  // (turned as its EXIF orientation says), the box the preview is laid out
  // in. 0 when unknown.
  uint32 original_pixel_width = 14;
  uint32 original_pixel_height = 15;
  // A PDF page's preview (ReadFile.preview_page): how many pages the PDF
  // has. original_pixel_width/height are then the page's size in PDF
  // points, turned as it shows.
  uint32 page_count = 16;
}

// Whether a FileContent is a preview (#379).
enum FilePreview {
  // The original: no preview was asked, or none was needed (small enough,
  // it fits the screen already, a preview wouldn't be smaller, a GIF, or a
  // PDF of 5 MB or less, which comes as its first range as before).
  FILE_PREVIEW_NONE = 0;
  // A preview, smaller than the original: the app says so and offers the
  // original. Saving and sharing read the original.
  FILE_PREVIEW_MADE = 1;
  // A preview was asked and would have been made, but this Claktory can't
  // make one (a video on Linux without ffmpeg, a PDF's page off a Mac): the
  // original came, and the app says "No preview on this Claktory". For a
  // PDF's page (ReadFile.preview_page), none of the PDF's bytes come, only
  // its size and version: the app loads the PDF by its own requests.
  FILE_PREVIEW_UNAVAILABLE = 2;
}

// Sets an agent's layout (`Agent.layout`) for every device, answered with
// Ack. Refused unless it has exactly one "chat" leaf, at most 12 leaves,
// unique non-empty ids, and splits of two or more children with as many
// positive weights (or none). An unset root, or a lone chat leaf, goes back
// to just the conversation.
// The person opened the pane `pane_id` of the agent's layout (on the phone,
// from its list of open files): its ViewLeaf.opened_ms becomes now, on every
// device, as when an agent shows its file again. NOT_FOUND for an unknown
// agent; INVALID_REQUEST for a pane the layout doesn't have.
message PaneOpened {
  string agent_id = 1;
  string pane_id = 2;
}

// Takes the agent's conversation back to right before the entry `seq`,
// which must still have `timestamp_ms` (friend bug #9): right before it
// for a message the agent was given (the person's or an event); for one of
// the agent's replies (assistant text or thinking), right before the next
// message it was given, so the whole run stays. What came after is set
// aside as another version (Branch). A working agent stops first; what's
// queued for it stays. Cards from the part set aside close, and the agent
// gets a quiet note from Claktory (an ordinary quiet Factory event) with
// what that part did. The agent's Transcript is sent again, and
// Agent.branches counts the new version. Ack carries nothing: going back
// to one of the person's own messages, the app puts its text and
// attachments back in the box itself. INVALID_REQUEST, with a message to
// show as it is: not a point it can go back to (a tool call, the very
// first message, a reply nothing came after), or the entry changed;
// NOT_FOUND: an unknown agent.
message ForkConversation {
  string agent_id = 1;
  uint64 seq = 2;
  int64 timestamp_ms = 3;
}

// The agent's other versions, answered with Branches to the asker only.
message ListBranches {
  string agent_id = 1;
}

// Makes `branch_id` the agent's conversation; the one it's in now is set
// aside as another version, from where the two part. Stops, closes cards,
// notes and resends as ForkConversation does. Answered with Ack;
// NOT_FOUND for an unknown agent or a version that isn't there any more.
message SwitchBranch {
  string agent_id = 1;
  string branch_id = 2;
}

// Deletes the version `branch_id` of the agent's conversation. Answered
// with Ack; NOT_FOUND as SwitchBranch.
message DeleteBranch {
  string agent_id = 1;
  string branch_id = 2;
}

// An agent's other versions of its conversation, the latest set aside first.
message Branches {
  string agent_id = 1;
  repeated Branch branches = 2;
}

// Another version of an agent's conversation.
message Branch {
  // What SwitchBranch and DeleteBranch take.
  string id = 1;
  // The first words of the first message the person wrote in it ("Look at
  // the scheduler again…"), or "From 14:02" when they wrote none.
  string label = 2;
  // When it was set aside.
  int64 set_aside_ms = 3;
  // When it parts from the conversation it was set aside from: the time of
  // the message it went back to.
  int64 forked_at_ms = 4;
  // How many messages it has past that point (the agent's replies and what
  // it was given; not tools' results).
  uint32 messages = 5;
  // Who set it aside: empty for the person, else an agent's id.
  string made_by = 6;
}

message SetLayout {
  string agent_id = 1;
  ViewNode root = 2;
  // The pane shown in focus, filling the whole window: the id of a leaf of
  // `root` sets it (refused if `root` has no such leaf), "" clears it. Left
  // out, the focus stays as it is while `root` still has that pane, and is
  // cleared when it doesn't (closing the focused pane ends focus), so
  // callers that don't deal with focus never change it.
  optional string focus = 3;
}

// A pane of an agent's main area, or a split of several.
message ViewNode {
  // Unique within the layout; the app keeps a pane by it.
  string id = 1;
  oneof node {
    ViewSplit split = 2;
    ViewLeaf leaf = 3;
  }
}

message ViewSplit {
  ViewAxis axis = 1;
  repeated ViewNode children = 2;
  // Each child's share, as many as children; empty for equal shares.
  repeated double weights = 3;
}

// ROW: children side by side, left to right; COLUMN: top to bottom.
enum ViewAxis {
  VIEW_AXIS_UNSPECIFIED = 0;
  VIEW_AXIS_ROW = 1;
  VIEW_AXIS_COLUMN = 2;
}

message ViewLeaf {
  // "chat" (the conversation, which every layout has once and can't be
  // closed), "text", "image", "video" or "pdf" (read whole with ReadFile's
  // ranges and expected_sha256); more kinds will come (documents,
  // dashboards, extension panels). An app that doesn't know a kind shows
  // that it can't show it here.
  string kind = 1;
  // The file it shows, absolute; empty for "chat".
  string path = 2;
  // What its tab or header says: the file's name, unless set otherwise.
  // For kind "app", the view's title, which apps that can't show app views
  // put in the pane that says so.
  string title = 3;
  // Kind "app", a pane showing an app's view (see OpenAppView): the app
  // (AppInfo.id), the view (AppViewSpec.id; empty for the app's first) and
  // its params (a JSON object, or empty).
  string app_id = 4;
  string view = 5;
  string params = 6;
  // When it was opened, ms since the epoch: when the person or an agent
  // added it, or an agent showed its file again (show doesn't open a file
  // twice). 0 for panes from before it was kept. The backend sets it; it's
  // ignored in SetLayout.
  int64 opened_ms = 7;
}

// Opens an extension's panel beside an agent (`Agent.open_panel`); an empty id
// closes it. Each agent keeps its own.
message OpenPanel {
  string extension_id = 1;
  // The agent; empty for the selected one.
  string agent_id = 2;
}

// ---- Comments ----

// A comment thread on a file, made in a viewer pane by the person or with an
// agent's comments tools. Threads belong to files, not panes: the same file
// shows the same threads wherever it's open. Each is addressed to one agent.
message Thread {
  // "t-41": unique in this Claktory.
  string id = 1;
  // The agent it's addressed to.
  string agent_id = 2;
  // The file, absolute.
  string path = 3;
  // The space its selectors were made in: "text" (the file's own text, in a
  // plain view or a file that isn't Markdown), "markdown" (a Markdown file's
  // formatted view), "image", "video" or "pdf".
  string kind = 4;
  // The file's SHA-256 (hex) that `selectors`, `source` and `rendered` refer
  // to: ThreadList.version_sha256 while the file exists.
  string version_sha256 = 5;
  // Where it is, as W3C Web Annotation selectors (each a JSON object with a
  // "type"): TextQuoteSelector {exact, prefix, suffix} and
  // TextPositionSelector {start, end} (UTF-16 code units) in its kind's text
  // for text files, FragmentSelector {conformsTo: "media-frags", value:
  // "xywh=percent:x,y,w,h"} for images, and for PDFs a FragmentSelector
  // {conformsTo: "http://tools.ietf.org/rfc/rfc8118", value: "page=N"}
  // refinedBy a ClaktoryPageRegion {version: 1, box: "crop", rotation (0, 90,
  // 180 or 270), units: "normalized", origin: "top_left_unrotated", x, y, w,
  // h}, all four in 0..1 with x+w and y+h at most 1, and N from 1 to 2000.
  // Kept up to date as the file changes, for text files; an image's, a
  // video's or a PDF's stay as made, OUTDATED while the file is another.
  repeated Selector selectors = 6;
  ThreadStatus status = 7;
  AnchorState anchor = 8;
  // Where it is in the file's text now; unset when DETACHED and for images.
  TextAnchor source = 9;
  // The same range in the plain text of a Markdown file's formatted view;
  // set for Markdown files only (and unset when DETACHED). Find `exact` in
  // the rendered text, nearest `start`.
  TextAnchor rendered = 10;
  // The text it was made on, as quoted then (`exact` of the first TextQuoteSelector):
  // for "text changed since this comment" and the Detached group.
  string original_exact = 11;
  // Oldest first; the first is the one that opened it.
  repeated ThreadComment comments = 12;
  int64 created_ms = 13;
  // When a comment, its status or its address last changed.
  int64 updated_ms = 14;
  // A change to its text, proposed by the person or an agent; unset for none.
  Suggestion suggestion = 15;
}

// A proposed replacement for a thread's text (a text file's), which the
// person accepts (Claktory makes the change) or rejects with
// DecideSuggestion; an agent may also make the person's change itself.
message Suggestion {
  // What replaces the text, as the file has it (Markdown in a Markdown file);
  // empty to delete it.
  string replacement = 1;
  // The agent who suggested it; empty for the person.
  string author_agent_id = 2;
  SuggestionDecision decision = 3;
}

enum SuggestionDecision {
  // Not decided yet.
  SUGGESTION_DECISION_UNSPECIFIED = 0;
  SUGGESTION_DECISION_ACCEPTED = 1;
  SUGGESTION_DECISION_REJECTED = 2;
}

message Selector {
  // One selector, a JSON object with a "type".
  string json = 1;
}

enum ThreadStatus {
  THREAD_STATUS_UNSPECIFIED = 0;
  THREAD_STATUS_OPEN = 1;
  THREAD_STATUS_RESOLVED = 2;
}

enum AnchorState {
  ANCHOR_STATE_UNSPECIFIED = 0;
  // On the text it was made on.
  ANCHOR_STATE_ANCHORED = 1;
  // Found again, but the text there changed since (see original_exact).
  ANCHOR_STATE_MOVED = 2;
  // Not found in the file any more (or the file is gone); kept, never
  // dropped. ReattachThread puts it on new text.
  ANCHOR_STATE_DETACHED = 3;
  // An image thread on a file that changed since: it may still be right.
  ANCHOR_STATE_OUTDATED = 4;
}

// A range of text: in a file's own text (Thread.source), or in the plain text
// of a Markdown file's formatted view (Thread.rendered).
message TextAnchor {
  // UTF-16 code units, end exclusive.
  int32 start = 1;
  int32 end = 2;
  // The text in the range, and up to 32 characters before and after it.
  string exact = 3;
  string prefix = 4;
  string suffix = 5;
  // The file's lines it spans, from 1; 0 in Thread.rendered.
  int32 first_line = 6;
  int32 last_line = 7;
}

message ThreadComment {
  // "c-97": unique in this Claktory.
  string id = 1;
  // The agent who wrote it; empty for the person.
  string author_agent_id = 2;
  // Markdown.
  string body = 3;
  int64 created_ms = 4;
  // When the person last edited it; 0 if never.
  int64 edited_ms = 5;
  // The person's comment, not sent to the agent yet (SendComments sends it).
  // Agents never see drafts.
  bool draft = 6;
  // The person's ink this comment carries (a review item from the iPad);
  // unset for none. Shown to the person's devices only: agents never see it
  // or a draft, and get only the copies Send makes (InkItem.published_*).
  InkItem ink = 7;
}

// A review item: ink the person drew on a file, carried by one of their
// comments (the comment's body is the question). It refers to an ink layer
// at a frozen revision, with the context image the iPad made of it.
message InkItem {
  // The ink layer (InkLayer.id) and the revision it was drawn on, which must
  // be on the thread's file at the thread's version_sha256.
  string ink_layer_id = 1;
  uint32 layer_revision = 2;
  // Where on the layer's surface, normalized (0..1 from the top left of the
  // page as stored, unrotated, or of the image); unset for an excerpt.
  NormalizedRect region = 3;
  // The context image: required.
  InkComposite context = 4;
  // The excerpt's text, for ink on an excerpt of a text or Markdown file.
  string excerpt_text = 5;
  // The person's handwriting as the iPad read it; unset when not read.
  RecognizedText recognized = 6;
  // Set by the backend when the comment is sent (and only then): the copy
  // of the context image in the agent's uploads, and the JSON beside it
  // describing the item. Empty until sent; ignored in requests.
  string published_context_path = 7;
  string published_manifest_path = 8;
}

// A review item's context image: an ink blob (a PNG of at most 3 MiB and
// 2048 px on its long edge), uploaded with UPLOAD_PURPOSE_INK.
message InkComposite {
  string sha256 = 1;
  // As the blob is: checked against it.
  uint64 bytes = 2;
  uint32 pixel_width = 3;
  uint32 pixel_height = 4;
  // What part of the surface it shows, normalized as InkItem.region.
  NormalizedRect region = 5;
  // Six numbers: from the image's pixels to the document's space.
  repeated double crop_to_document_transform = 6;
}

// A rectangle in 0..1 from the top left: x+w and y+h at most 1.
message NormalizedRect {
  double x = 1;
  double y = 2;
  double w = 3;
  double h = 4;
}

// Handwriting read on the iPad.
message RecognizedText {
  string text = 1;
  // The layer revision it was read from.
  uint32 layer_revision = 2;
  // Such as "en-US".
  repeated string languages = 3;
  string recognizer_version = 4;
}

// Asks for every thread on a file, open and resolved: answered with
// ThreadList. Ask when a viewer opens it (and after reconnecting); after
// that, a ThreadList comes whenever a thread on it changes.
message ListThreads {
  // Absolute, or from the home folder.
  string path = 1;
}

message ThreadList {
  // Absolute.
  string path = 1;
  // The file's SHA-256 (hex) now, which its text threads' anchors refer to;
  // empty when it's gone or too big to comment on.
  string version_sha256 = 2;
  repeated Thread threads = 3;
}

// A file shown in an agent's pane changed: read it again.
message FileChanged {
  string path = 1;
  // Its SHA-256 now (hex); empty when it's gone.
  string sha256 = 2;
  // The agent whose write_file or edit_file changed it; empty when it was
  // changed some other way (a command, another app).
  string by_agent_id = 3;
}

// The person starts a thread, answered with the new Thread (or an Error whose
// message can be shown as it is, such as "The text changed; select it
// again."). It's a draft until sent, unless send_now.
message CreateThread {
  // The agent it's addressed to.
  string agent_id = 1;
  string path = 2;
  // "text", "markdown", "image", "video" or "pdf" (see Thread.kind).
  string kind = 3;
  // FileContent.sha256 of the content the selection was made on. When the
  // file changed since, the thread is put on the same text in the file as it
  // is now, or refused if it isn't there any more.
  string version_sha256 = 4;
  // "text": TextQuoteSelector and TextPositionSelector in the file's text.
  // "markdown": TextQuoteSelector (and TextPositionSelector, if known) in the
  // formatted view's plain text. "image": a FragmentSelector. "pdf": a page
  // FragmentSelector refined by a ClaktoryPageRegion (see Thread.selectors).
  repeated Selector selectors = 5;
  // The first comment, Markdown; not empty, unless it suggests a change
  // (then a comment with an empty body carries it until it's sent).
  string body = 6;
  // Send it to the agent now, alone, rather than as a draft.
  bool send_now = 7;
  // A replacement the person suggests for the text (text and Markdown only;
  // see Suggestion).
  optional string suggestion = 8;
  // Ink this first comment carries: a review item. Refused, with an Error
  // whose message can be shown as it is, unless its layer exists at that
  // revision on this file at version_sha256, its regions are in range and
  // its context image is uploaded and within its limits. With ink, `body`
  // may be empty.
  InkItem ink = 9;
}

// The person replies on a thread, answered with Ack: a draft until sent,
// unless send_now. Replying reopens a resolved thread.
message ReplyThread {
  string thread_id = 1;
  string body = 2;
  bool send_now = 3;
  // A second review item on the thread, checked as CreateThread.ink is
  // against the thread's version_sha256. With ink, `body` may be empty.
  InkItem ink = 4;
}

// Changes one of the person's comments, answered with Ack. One already sent
// stays as the agent read it in its conversation; it sees the change the
// next time it lists the thread.
message EditComment {
  string comment_id = 1;
  string body = 2;
}

// Deletes one of the person's comments, answered with Ack. A thread left
// with no comments is deleted with it.
message DeleteComment {
  string comment_id = 1;
}

// Resolves or reopens a thread, answered with Ack.
message SetThreadStatus {
  string thread_id = 1;
  bool resolved = 2;
}

// Addresses a thread to another agent, answered with Ack. Its drafts go to
// that agent when sent.
message ReaddressThread {
  string thread_id = 1;
  string agent_id = 2;
}

// Puts a thread on a new selection (of a DETACHED one, say), answered with
// Ack; the fields mean what they do in CreateThread.
message ReattachThread {
  string thread_id = 1;
  string kind = 2;
  string version_sha256 = 3;
  repeated Selector selectors = 4;
}

// Sends the person's drafts on a file to the agent they're addressed to, as
// one message it reads as an event; answered with Ack. Sending is what
// publishes ink: each review item's context image, and a JSON describing
// it, are copied into the agent's uploads (InkItem.published_*), never
// before.
message SendComments {
  string agent_id = 1;
  // Absolute; empty for every file.
  string path = 2;
  // Only these threads' drafts ("t-41"); empty for all of them. Each must be
  // addressed to `agent_id`.
  repeated string thread_ids = 3;
  // Made up by the app, unique per send: sending again with the same id
  // answers Ack and delivers nothing twice.
  string client_batch_id = 4;
}

// Accepts a thread's suggestion (Claktory replaces the text with it in the
// file, and resolves the thread) or rejects it (resolves it unchanged),
// answered with Ack. Accepting is refused, with an Error whose message can be
// shown as it is, when the text changed since the suggestion was made
// (Thread.anchor isn't ANCHORED). The agent who suggested it is told.
message DecideSuggestion {
  string thread_id = 1;
  bool accept = 2;
  // The person's comment, told as theirs ("Matt's note: …") to the agent
  // that suggested it, or, for the person's own suggestion, to the agent
  // the thread is for. May be empty; 2,000 characters at most.
  string comment = 3;
  // Submit (#370): `comment` is the person's reply, needed; `accept` is
  // ignored. It's sent at once as their reply on the thread (as ReplyThread
  // with send_now), and the suggestion stays open, undecided.
  bool reply = 4;
}

// ---- Sign-in ----
//
// One sign-in runs at a time, shown to every client as `Workspace.login`.
// Starting one cancels any other. The flow is driven by the provider: it may
// publish a URL to open, a device code to enter, or ask a question
// (`LoginFlow.prompt`) that the client answers with `AnswerLogin`.
//
// Browser sign-in: the client that started it opens `LoginFlow.url`. If the
// browser runs on the backend's machine, the provider's redirect reaches the
// backend and sign-in finishes by itself. Otherwise the user pastes the code
// or the address the browser landed on, as the answer to the `CODE` prompt
// that waits alongside.

// Starts signing in to a provider with one of its `Provider.methods`.
message StartLogin {
  string provider_id = 1;
  string method_id = 2;
  // Signs in to another account of the provider, keeping the ones signed in
  // (a second Claude subscription, say). False signs in as before: the
  // account replaces the first one, unless it's one already signed in, which
  // is signed in again.
  bool add_account = 3;
}

// Answers `LoginFlow.prompt`: the pasted code or redirect address, the secret,
// the text, or the chosen option's id.
message AnswerLogin {
  string text = 1;
}

// Cancels the sign-in in progress, or dismisses one that failed.
message CancelLogin {}

// Removes the credential Factory stored for a provider.
message SignOut {
  string provider_id = 1;
  // The account to sign out of (`Account.id`); empty signs out of all of the
  // provider's accounts.
  string account_id = 2;
}

// Moves one of a provider's accounts to `position` (0 is first) in the
// order requests try them: the first with capacity is used. Answered with Ack.
message MoveAccount {
  string provider_id = 1;
  string account_id = 2;
  uint32 position = 3;
}

// Changes one of a provider's accounts. Answered with Ack.
message UpdateAccount {
  string provider_id = 1;
  string account_id = 2;
  // A name for it, such as "Work credits"; empty goes back to the one
  // Factory gives it (an API key's last characters). Unset leaves it.
  optional string label = 3;
  // Try it again now: an API key out of credit (`Account.out_of_credit`)
  // gets requests again, as if topped up.
  bool retry = 4;
}

// Uses one of an account's usage resets (`ProviderUsage.resets`), only ever
// at the person's word. Answered with UsageResetAnswer, then the account's
// usage is read again and reaches everyone with Workspace. An Error when the
// account or the reset isn't there (any more) or a reset is already being
// used on the account.
message UseUsageReset {
  string provider_id = 1;
  string account_id = 2;
  // `UsageReset.id`.
  string reset_id = 3;
}

// Picks new colours for the person's avatar: the pair they chose
// (`choice`), or, with `choice` unset, a random pair always different from
// the one it had (a chosen pair is forgotten then, so later shuffles keep
// working). Answered with Ack; the new avatar reaches every device with
// Workspace.
message ShuffleAvatar {
  // An index into Person.avatar_choices, to pick that pair; out of range
  // is refused. Unset shuffles, as before.
  optional int32 choice = 1;
}

// ---- Server → client ----

message Ack {}

message UsageResetAnswer {
  // A limit was reset.
  bool reset = 1;
  // What happened, a sentence or two to show as is: "Your 5-hour limit is
  // reset. 1 five-hour reset left.", or why nothing was used. A failure on
  // the way is an answer too, since the reset may have gone through.
  string message = 2;
  // Where the person can use the reset on the provider's own site, when it
  // refused Claktory's request or couldn't be reached
  // ("https://clau.de/reset"); empty otherwise.
  string fallback_url = 3;
}

message Error {
  ErrorCode code = 1;
  string message = 2;
  // With ERROR_CODE_MOVED: where this Claktory went, for the screen the old
  // computer's app shows instead of the Claktory.
  MovedAway moved = 3;
  // With ERROR_CODE_OTHER_ACCOUNT: this device was let in here before, and
  // is now signed in to a different account than this Claktory's (signing
  // in with that one again lets it back in); false for a device this
  // Claktory never let in, which only a pipe can work with.
  bool other_account_before = 4;
}

// A Claktory that moved to another computer, as the copy left behind
// (`<home>/moved.json`) says. It answers every Hello with ERROR_CODE_MOVED
// and this.
message MovedAway {
  // The computer it moved to, and its system ("macos", "linux"); both
  // empty after a move by file.
  string to = 1;
  string to_os = 2;
  // When it moved, ms since 1970.
  int64 at_ms = 3;
  // This computer, as the move named it.
  string machine = 4;
  // When the copy left here was deleted (DeleteMovedCopy, or factoryd
  // export --delete-moved); 0 while it's kept.
  int64 deleted_ms = 5;
}

// Deletes the copy a Claktory that moved away left on this computer, for
// good: everything of it but the workspace and project folders inside its
// home (docs/MOVE.md). Only a Claktory in moved mode takes it, and only from
// this computer's own app: on the loopback port, after a Hello with the
// local pairing code's token. Answered with Ack, or Error saying why.
message DeleteMovedCopy {
  // What the person typed to confirm: it must be "delete".
  string typed_word = 1;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  // The client speaks a protocol version the server doesn't. Connection closes.
  ERROR_CODE_UNSUPPORTED_PROTOCOL_VERSION = 1;
  // The first message wasn't `hello`. Connection closes.
  ERROR_CODE_HANDSHAKE_REQUIRED = 2;
  // A frame couldn't be decoded as a ClientMessage.
  ERROR_CODE_MALFORMED_MESSAGE = 3;
  // A valid message of a kind this server doesn't know (sent by a newer client).
  ERROR_CODE_UNKNOWN_MESSAGE = 4;
  // The request named a project, agent or provider that doesn't exist.
  ERROR_CODE_NOT_FOUND = 5;
  // The request's fields are invalid (empty name, unknown model, ...).
  ERROR_CODE_INVALID_REQUEST = 6;
  // The server failed to carry out a valid request (e.g. couldn't write a file).
  ERROR_CODE_INTERNAL = 7;
  // On the remote listener: the device's token isn't one of a paired device
  // (never paired, or unpaired since). Connection closes.
  ERROR_CODE_UNAUTHORIZED = 8;
  // The vault is locked (locked mode, after the backend restarted; only a
  // vault the person gave a key of their own can be): UnlockVault first.
  ERROR_CODE_VAULT_LOCKED = 9;
  // No longer sent: requests need no vault passphrase.
  ERROR_CODE_PROOF_REQUIRED = 10;
  // The passphrase (or recovery key) is wrong. Answered after a second's
  // delay.
  ERROR_CODE_WRONG_PROOF = 11;
  // The secret isn't granted to that agent (RevokeSecret).
  ERROR_CODE_NOT_GRANTED = 12;
  // The account service asks to wait (too many codes or tries); the
  // message says how long.
  ERROR_CODE_RATE_LIMITED = 13;
  // The account service can't be reached (or answered something Claktory
  // can't trust); the message says which. Claktory keeps working.
  ERROR_CODE_UNREACHABLE = 14;
  // Hello refused: this device has to show a (fresh) device assertion. A
  // paired device not confirmed as the owner's (let in by a program, say:
  // PairedDevice.confirmed), a device that found this Claktory through its
  // account with an assertion missing, or one whose assertion doesn't
  // verify (expired, for another key).
  // The app signs in to the account (or gets a new assertion) and connects
  // again. Connection closes.
  ERROR_CODE_SIGN_IN_REQUIRED = 15;
  // This Claktory moved to another computer (Error.moved says where); the
  // copy left here runs nothing.
  ERROR_CODE_MOVED = 16;
  // Hello refused (#527 S4): this Claktory is signed in to an account, and
  // the device's assertion is for another one. A Claktory is one person's:
  // to work with someone else's agents, open a pipe. The message says
  // whether the device was let in here before. Connection closes.
  ERROR_CODE_OTHER_ACCOUNT = 17;
}

// Everything the sidebar and headers need. Sent in full after `welcome` and
// whenever any part changes.
//
// The workspace is Factory's own folder. Each project is a folder inside it,
// and agents work in their project's folder, or in the workspace folder when
// they aren't in a project.
message Workspace {
  repeated Project projects = 1;
  repeated Agent agents = 2;
  // Models from providers Factory has credentials for.
  repeated Model models = 3;
  // Empty when no agent is selected.
  string selected_agent_id = 4;
  // Set when the config file on disk has an error; the last valid config stays
  // in effect until it's fixed.
  string config_error = 5;
  // Every provider Factory can use, signed in or not.
  repeated Provider providers = 6;
  // The sign-in in progress; unset when there is none.
  LoginFlow login = 7;
  Settings settings = 8;
  // This backend's build, e.g. "2026.11.18-1652"; "dev" for an unstamped build.
  // Versions of stamped builds sort in release order.
  string version = 9;
  // The newest release published for this Factory (scripts/release.sh); empty
  // when there is none. An app or backend older than it should update.
  string latest_release = 10;
  // The focused project; empty when none is. Its explorer follows as Explorer.
  string focused_project_id = 11;
  // Set when the last update's backend didn't start and Factory went back to
  // the one before; says which versions and why.
  string update_error = 12;
  // The backend in `latest_release`. Older than `latest_release` when the
  // release only changed the app: installing it doesn't restart the backend.
  string latest_backend = 13;
  // The color a new agent gets unless the person picks one: the one least
  // like any agent's color, so agents stay easy to tell apart.
  string next_agent_color = 14;
  // Every extension Factory has, whether or not any agent uses it.
  repeated Extension extensions = 15;
  // The selected agent's `Agent.open_panel`, for older apps; empty when no
  // agent is selected or its panel is closed.
  string open_panel = 16;
  // The person wants highlights shown (see Highlight). Factory sends them
  // either way; when this is off, the app doesn't show them.
  bool highlights = 17;
  // What changed in each version, newest first, from the changelog of the
  // newest release (`latest_release`): every version up to it, so the app can
  // show what an update brings (the versions newer than `version`) and what
  // the running one brought. Empty when there's no release or it has no
  // changelog. Only a dev release has an unreleased entry, first.
  repeated ChangelogVersion changelog = 18;
  // Devices on other machines: whether they can connect, and which are paired.
  RemoteAccess remote = 19;
  // The vault's state and its secrets' metadata, never values.
  VaultState vault = 20;
  // This Claktory's sign-in at claktory.com: the same on every device.
  ClaktoryAccount account = 21;
  // How this Claktory is arranged, for the Map: computed here, laid out by
  // the app.
  ClaktoryMap map = 22;
  // The apps installed, by name.
  repeated AppInfo apps = 23;
  // The person this Claktory belongs to: their name and avatar, the same on
  // every device. Always set.
  Person person = 24;
  // This Claktory offers apps (AppInfo): Settings → Apps shows only then.
  // While false, `apps` is empty, the Map has none and their requests are
  // refused.
  bool apps_available = 25;
  // This Claktory's pipes, every state but deleted (see Pipe), oldest first.
  repeated Pipe pipes = 26;
  // The pipe every client shows in the main pane, in place of an agent's
  // conversation (SelectPipe); empty when an agent's is shown. SelectAgent
  // clears it.
  string selected_pipe_id = 27;
  // The speech model voice messages need (see SpeechModel).
  SpeechModel speech_model = 28;
  // The person's chats, most recent activity first (see Chat).
  repeated Chat chats = 29;
  // The chat every client shows in the main pane, in place of an agent's
  // conversation or a pipe (SelectChat, CreateChat); empty otherwise.
  // SelectAgent and SelectPipe clear it, and SelectChat clears
  // selected_pipe_id; selected_agent_id stays, for going back.
  string selected_chat_id = 30;
  // Moving this Claktory to another computer, from StartMove until it's
  // done, or failed and dismissed (CancelMove); unset when there's no move.
  // While the move is frozen (MOVE_PHASE_FROZEN and after), the backend
  // runs no Factory: its Workspace has only `move` and `version` set.
  Move move = 31;
  // The sidebar's Projects and Chats sections folded away, the same on every
  // device (UpdateSettings sets them); false, open, by default.
  bool projects_collapsed = 32;
  bool chats_collapsed = 33;
  // The system the backend runs on: "macos" or "linux", as a Move's
  // target_os spells it. Empty from a backend older than this field (and
  // in the frozen-move Workspace, which has only `move` and `version`):
  // leave out anything that assumes a platform then.
  string os = 34;
  // The app dock: the ids of the installed apps pinned there, in its order
  // (PinApp). The same on every device. Empty while `apps_available` is
  // false.
  repeated string pinned_apps = 35;
  // Browser control's sessions, pending, active and lately ended: a status
  // with no page data. The same on every device.
  repeated BrowserSession browser_sessions = 36;
  // Messages this Claktory's agents proposed to the person's friends,
  // waiting for the person's review (D4b), oldest first: for Needs you.
  // Empty outside the direct-messages preview.
  repeated DmSendWaiting dm_sends = 37;
  // What the last Check for updates found, kept current by the backend's own
  // checks afterwards. The same on every device.
  UpdateCheck update_check = 38;
  // Advanced diagnostics: whether they're on (SetDiagnostics), off by
  // default, and what's kept.
  Diagnostics diagnostics = 39;
  // The kinds of report a pipe can forward (PipeForward.type_ids): the
  // current version of each one that isn't deleted, built-in ones first
  // ("Bug report" and the starters), then the rest by name.
  repeated ReportSchema report_schemas = 40;
  // Claktory's own apps this release ships, signed with Claktory's pinned
  // publisher key and checked before they're listed (one that fails isn't),
  // that aren't installed or are newer than the version installed. Install
  // with InstallLocalApp.bundled. Empty while `apps_available` is false.
  repeated BundledApp bundled_apps = 41;
  // The ceilings a report type must stay within (SaveReportType), so the
  // editor clamps to them.
  ReportTypeRules report_type_rules = 42;
  // The providers agents and chats wait on, for a usage limit or for
  // credit (#343 U6): one Needs you item each, in the order their first
  // waiter is listed. Each notifies once when it appears (NOTIFY_KIND_NEEDS_YOU),
  // and counts once in the badge.
  repeated ProviderWait provider_waits = 43;
  // Keeping this Mac awake while agents work (KeepAwake).
  KeepAwake keep_awake = 44;
  // The projects' pipe groups (#359), each project's in their order
  // (PipeGroup.position). A project's pipe rows: its groups, each with its
  // pipes under it, then the pipes in none.
  repeated PipeGroup pipe_groups = 45;
  // Continue automatically (friend bug #8 A2; off unless the person turns
  // it on, in Settings → Providers): an agent or chat whose wait on a usage
  // limit starts, or goes on, while another provider can run its model is
  // switched there by itself, as ContinueOnAlternative would (that one
  // only, to its UsageWaitAlternative), and goes back as any switch does
  // (UsageSwitch.goes_back). Never for a wait on credit, a sign-in or
  // locked secrets. It spends on that provider without asking.
  bool usage_auto_continue = 46;
  // How this Claktory's backend runs on its Mac (friend bug #24): unset,
  // or state UNSPECIFIED, shows nothing.
  BackendService backend_service = 47;
  // Websites shared over pipes: those this Claktory shares, and those
  // other Claktories share with it. One stopped or ended is gone from it;
  // the pipes' chats keep the lines saying so.
  repeated PipeShare pipe_shares = 48;
  // Claktory's browser (#435): the one browser agents' errands use, on
  // this Claktory's computer (or its VM on a Mac). Unset from a backend
  // without it.
  AgentBrowser agent_browser = 49;
  // Errands, running and lately ended (the last 7 days), oldest first.
  repeated Errand errands = 50;
  // Alerts waiting for the person to read them (Alert): one Needs you item
  // each, until they open it or tap Got it (ReadAlerts). The newest 100,
  // oldest first; alerts_unread counts them all, and each counts in the
  // badge. Read ones are in History.
  repeated Alert alerts = 51;
  uint32 alerts_unread = 52;
}

// Claktory's background service on a Mac (friend bug #24): the LaunchAgent
// whose supervisor starts the backend at login, starts it again if it
// stops, undoes an update that fails and stops and starts it for a move.
message BackendService {
  BackendServiceState state = 1;
  // BY_HAND: a sentence for the person, as it is: what that means, and
  // what Restore does or how to repair the service.
  string reason = 2;
  // BY_HAND: RestoreBackendService can put the service back in charge.
  // Show it as a Needs you item with Restore (it asks nothing more; the
  // backend restarts once), and in Settings → General beside Move.
  bool can_restore = 3;
  // Restore was asked for: this backend stops in a moment, and the service
  // starts it again. Show "Restarting…" until the app reconnects.
  bool restoring = 4;
  // RUNNING under this Mac's background service: the Mac app on this Mac
  // can stop it (StopEngine) and start it (`factoryd install --start`),
  // so it shows the switch (friend bug #27). False everywhere else.
  bool can_stop = 5;
  // StopEngine was taken: it stops in a moment. Show "Stopping…" until the
  // connection closes.
  bool stopping = 6;
}

enum BackendServiceState {
  // Nothing to say: not a Mac, the dev Claktory, or one run elsewhere for
  // tests.
  BACKEND_SERVICE_STATE_UNSPECIFIED = 0;
  // Its service runs it, as installed.
  BACKEND_SERVICE_STATE_RUNNING = 1;
  // It was started some other way (by hand, in Terminal), so it doesn't
  // start again by itself if it stops or the Mac restarts, and it can't
  // stop and start itself to move to another computer.
  BACKEND_SERVICE_STATE_BY_HAND = 2;
}

// Puts Claktory's background service back in charge (BackendService
// can_restore): the backend stops, and the service starts it again. Ack,
// then the connection closes; refused, saying why, when it can't.
message RestoreBackendService {}

// Stops Claktory on this Mac (friend bug #27): its background service
// stops it and won't start it again, at login either, until the Mac app
// starts it (`factoryd install --start`). Agents' runs stop where they are
// and carry on at the next start, as after an update; monitors wait. Ack,
// then BackendService.stopping, then the connection closes. Only from the
// app on this Mac (a connection with this machine's token), and refused
// while an update is going in or on trial, or where BackendService.can_stop
// is false.
message StopEngine {
  // The app is quitting (⌘Q): stops only when Settings.when_app_quits is
  // STOP, and starts again when the app opens. False (the person's switch):
  // stops whatever the setting, and stays stopped when the app opens, until
  // the person starts it (`factoryd install --check` says held).
  bool quitting = 1;
}

// Agents and chats waiting on one provider's usage limit or credit
// (Workspace.provider_waits): what Needs you shows for them, all at once.
// Only waits another provider could carry (Agent.usage_wait with a usage
// limit or credit): never a wait to sign in, or for the secrets to unlock,
// which has its own item (VaultState.agents_waiting). The ways forward are
// on the waiters themselves: Try now is TryAgainNow with any of them (it
// wakes everyone waiting on the provider); a usage reset is UseUsageReset
// with one the provider's accounts list (Account.usage.resets); Continue on
// another provider is ContinueOnAlternative with the first waiter and
// all_waiting, from its usage_wait_alternative; when that's unset and its
// usage_wait_no_other_provider is true, signing in to another provider
// would let them carry on.
message ProviderWait {
  // The provider's id, as Provider.id: "anthropic", "openrouter".
  string provider_id = 1;
  // As the waits name it: "Claude", "ChatGPT", "OpenRouter".
  string provider_name = 2;
  // They wait for credit (an API key ran out of it), not for a limit to
  // reset: nothing ends it by itself.
  bool credit = 3;
  // The soonest any of them asks again by itself, in ms since 1970; 0 when
  // they wait for credit.
  int64 until_ms = 4;
  // Who waits: agents in Workspace.agents' order, then chats in
  // Workspace.chats' order. At least one of the two is never empty.
  repeated string agent_ids = 5;
  repeated string chat_ids = 6;
  // Claktory's words for the item: a title ("Claude usage limit reached",
  // "OpenRouter is out of credit") and a sentence saying who waits and
  // until when ("Rivet, Mike and 2 more wait until it resets at Fri
  // 18:00.", "Rivet waits until you add credit or another OpenRouter
  // account.").
  string title = 7;
  string text = 8;
}

// An app Claktory ships with this release (Workspace.bundled_apps).
message BundledApp {
  // As its manifest says: "charts".
  string id = 1;
  string name = 2;
  string description = 3;
  // A Lucide icon name.
  string icon = 4;
  // The bundled file's version.
  string version = 5;
  string publisher = 6;
  // The version installed, when an older one is: then it's an update.
  // Empty when it isn't installed.
  string installed_version = 7;
  // The person uninstalled it, so Claktory doesn't install it again by
  // itself: Install (InstallLocalApp with `bundled`) puts it back and
  // clears this. A bundled app that's neither installed nor uninstalled is
  // being installed, or couldn't be: Install works then too.
  bool uninstalled = 8;
}

// Checks for a newer release now, as Claktory does on its own every half
// hour: the online channel, when this build was published with one
// (downloading a newer release the usual way), and the releases on this
// computer. Asking again while a check or its download runs joins it; within
// 10 seconds of the last check, its answer stands.
message CheckForUpdates {}

// Advanced diagnostics: while on, the person's devices record what
// happens in areas Claktory knows trouble in (the first: "connection") and
// send it to this Claktory (SendDiagnostics), and the backend records its
// own side; this Claktory's agents read it (database:factory) to find out
// what went wrong. Off by default.
message Diagnostics {
  // On: devices and the backend record and keep diagnostics. Off, nothing
  // is recorded or kept.
  bool share = 1;
  // What's kept, a source each, the one heard from last first. Empty while
  // off.
  repeated DiagnosticsSource sources = 2;
  // How long events are kept, in days (14), and the most a source keeps
  // here, in bytes (4 MB): past either, its oldest go first.
  uint32 keep_days = 3;
  int64 source_limit_bytes = 4;
}

// What's kept from one source: a device of the person's, or this
// Claktory's backend.
message DiagnosticsSource {
  // "device:" and the paired device's id ("device:local" for this
  // computer's own app), or "backend" for this Claktory itself.
  string id = 1;
  // A device's name as it last sent; empty for the backend.
  string name = 2;
  // A device's kind; unspecified for the backend.
  DeviceKind kind = 3;
  // Its system and version as it last sent ("ios", "1.2.3"); the
  // backend's own.
  string platform = 4;
  string app_version = 5;
  uint32 events = 6;
  int64 bytes = 7;
  // Its oldest and newest event, by the source's clock, in ms since 1970.
  int64 oldest_ms = 8;
  int64 newest_ms = 9;
  // When it last added some, by this Claktory's clock.
  int64 received_ms = 10;
  // The same, by area ("connection"…), in name order.
  repeated DiagnosticsArea areas = 11;
}

message DiagnosticsArea {
  string area = 1;
  uint32 events = 2;
  int64 bytes = 3;
  int64 oldest_ms = 4;
  int64 newest_ms = 5;
}

message SetDiagnostics {
  // Turns diagnostics on or off; unset leaves them as they are. Turning
  // them off deletes everything kept.
  optional bool share = 1;
  // Deletes what's kept: of one source (source_id, a DiagnosticsSource's
  // id) or of every source when empty, and of one area or of every area
  // when empty. Whether they're on stays as it is.
  bool clear = 2;
  string source_id = 3;
  string area = 4;
}

message SendDiagnostics {
  // Oldest first, at most 2000 a request (send more in several). Events
  // older than 14 days are dropped.
  repeated DiagnosticEvent events = 1;
}

// One thing that happened, in one area. Never message content, names,
// addresses or codes. The backend adds the device, its kind, platform and
// app version (from its Hello) and when it arrived.
message DiagnosticEvent {
  // When, by the device's clock, in ms since 1970.
  int64 at_ms = 1;
  // Unique to the event within the app's install and increasing, not
  // necessarily by one: an event sent again (after a lost Ack) is kept
  // once, by device, area, seq and at_ms.
  uint64 seq = 2;
  // A short token, a-z 0-9 _ . (up to 40). For "connection": lifecycle,
  // network, connect, connected, welcome, disconnected, relay, error…
  string kind = 3;
  // One line, up to 500 characters, of key=value tokens such as
  // "path=relay ms=812 err=timeout net=wifi".
  string detail = 4;
  // How long it took (a connect attempt, a handshake); 0 when it doesn't
  // apply.
  int64 duration_ms = 5;
  // Goes up every time the app's process starts: a new session after a
  // force-quit or relaunch.
  uint64 session = 6;
  // What it's about: a short token, a-z 0-9 _ (up to 32). The first is
  // "connection"; empty is "general".
  string area = 7;
}

enum UpdateCheckState {
  // Nobody has checked since the backend started: show only the button.
  UPDATE_CHECK_STATE_NONE = 0;
  UPDATE_CHECK_STATE_CHECKING = 1;
  // Nothing newer than this backend is here, and the channel offers
  // nothing newer either. `version`: this backend's (Workspace.version).
  UPDATE_CHECK_STATE_UP_TO_DATE = 2;
  // A newer release, `version`, is downloading.
  UPDATE_CHECK_STATE_DOWNLOADING = 3;
  // A release newer than this backend, `version`, is here:
  // Workspace.latest_release. For UP_TO_DATE and READY alike, word the
  // answer by the app's own version, as the Update banner decides: an
  // app-only release this app already runs is "up to date" for it.
  UPDATE_CHECK_STATE_READY = 4;
  // The check couldn't finish; `error` says why, for the person.
  UPDATE_CHECK_STATE_FAILED = 5;
}

// Keeping the Mac Claktory runs on awake while agents work, so they carry
// on while the person is away. Never on by default: on a laptop it uses
// battery, and the person may not know. Only idle sleep is held off, and
// only while an agent works (or waits on usage to carry on); closing a
// laptop's lid still puts it to sleep.
message KeepAwake {
  // Claktory runs on a Mac and can keep it awake: show the setting.
  bool available = 1;
  // The Mac has a battery (a laptop).
  bool laptop = 2;
  // On: the person said yes, or it's a desktop Mac they haven't answered
  // for (a desktop is on by default, a laptop off until they say yes).
  bool on = 3;
  // The person answered, in the question or in Settings.
  bool answered = 4;
  // Ask now, as an item in Needs you: agents have worked on this laptop
  // and the person hasn't answered. Say agents keep working while the Mac
  // is plugged in with its lid open, and that Settings can change it; yes
  // and no are SetKeepAwake, and dismissing it is a no. Never on a desktop.
  bool ask = 5;
  // Held now: it's on, an agent works and the Mac is plugged in.
  bool holding = 6;
  // The Mac is plugged in now (always on a desktop; a laptop's power is
  // looked at every 30 seconds while it's on and agents work). It's never
  // held awake on battery.
  bool plugged_in = 7;
  // Keeping agents working with the lid closed (#371) can be offered: a
  // laptop on macOS 14 or later, in the real Claktory (never Claktory Dev).
  // Never on a desktop.
  bool lid_closed_available = 8;
  // Where it stands (LidClosedState): off unless the person turned it on,
  // from its own question, in the Mac app on that Mac.
  LidClosedState lid_closed = 9;
  // LID_CLOSED_FAILED: why, as macOS said it, for the person.
  string lid_closed_error = 10;
  // Claktory keeps the Mac awake with its lid closed now (LID_CLOSED_ON,
  // agents work and it's plugged in), so it doesn't sleep when the lid
  // closes. Never on battery.
  bool lid_closed_holding = 11;
  // LID_CLOSED_STUCK: what fixes it, a sentence to show as it is, naming
  // the Mac by this Claktory's name; a Terminal command in it is in
  // backticks ("In Terminal on Studio, run `sudo pmset -a disablesleep
  // 0`, or restart it."). Empty otherwise.
  string lid_closed_fix = 12;
  // The person's lid-closed setting is on, whatever lid_closed says
  // (STUCK included): what the switch shows. Turning it off is always
  // allowed.
  bool lid_closed_turned_on = 13;
}

// Keeping a laptop's agents working with its lid closed: a helper the Mac
// app installs (SMAppService, approved with an administrator password in
// System Settings → Login Items) stops the Mac from sleeping while agents
// work and it's plugged in, and lets go by itself on low battery, heat or
// the lid closed on battery.
enum LidClosedState {
  // The person hasn't turned it on, or turned it off.
  LID_CLOSED_OFF = 0;
  // No longer sent: the root helper it waited for is gone (#371's
  // redesign).
  LID_CLOSED_NEEDS_APPROVAL = 1;
  // Turned on: Claktory keeps the Mac awake with its lid closed while agents
  // work and it's plugged in (lid_closed_holding), and lets it sleep as soon
  // as it's unplugged.
  LID_CLOSED_ON = 2;
  // No longer sent: nothing is held on battery at all.
  LID_CLOSED_PAUSED_BATTERY = 3;
  // On, and let go: the Mac is too hot (held again 10 minutes after it
  // cools down).
  LID_CLOSED_PAUSED_HEAT = 4;
  // No longer sent: nothing is held on battery at all.
  LID_CLOSED_PAUSED_LID_ON_BATTERY = 5;
  // No longer sent (the helper is gone).
  LID_CLOSED_MISSING = 6;
  // No longer sent (the helper is gone).
  LID_CLOSED_OUTDATED = 7;
  // On, but macOS refused to keep the lid from sleeping the Mac:
  // lid_closed_error says why.
  LID_CLOSED_FAILED = 8;
  // The Mac can't sleep with its lid closed although Claktory isn't keeping
  // it awake: what Claktory set couldn't be undone, or an old SleepDisabled
  // setting is on. Before every other state, and sent whatever
  // lid_closed_available says; lid_closed_fix says what fixes it. Needs you
  // says so too, with one notification (thread "keep_awake").
  LID_CLOSED_STUCK = 9;
}

// What macOS answered the Mac app about the helper (SMAppService's status,
// or the failure of register or unregister), for what the setting shows.
// Holding comes only from the helper's own answer, never from this.
enum LidClosedRegistration {
  LID_CLOSED_REGISTRATION_UNKNOWN = 0;
  LID_CLOSED_REGISTRATION_ENABLED = 1;
  LID_CLOSED_REGISTRATION_REQUIRES_APPROVAL = 2;
  LID_CLOSED_REGISTRATION_NOT_REGISTERED = 3;
  LID_CLOSED_REGISTRATION_NOT_FOUND = 4;
  LID_CLOSED_REGISTRATION_FAILED = 5;
}

// The person turns keeping agents working with the lid closed on or off,
// in the Mac app on the Mac Claktory runs on, after its own question. Ack.
// Turning it on is refused from any other device ("Turn it on from the
// Mac."), and on a Mac that can't (KeepAwake.lid_closed_available); turning
// it off is taken from anywhere, and lets the Mac sleep at once.
message SetLidClosed {
  bool on = 1;
  // Ignored: what older Mac apps said of the helper, which is gone.
  LidClosedRegistration registration = 2;
  // Ignored, as registration.
  string error = 3;
}

// Reads a provider's model list from the provider now (friend bug #14), as
// Claktory does by itself every 12 hours while it's signed in. Answered
// with Ack once it's read and Workspace has the new list, or an Error with
// why it failed, the same sentence as Provider.models_fetch_error.
message RefreshModels {
  // The provider's id; empty for every provider whose list can be read
  // (Provider.models_fetchable).
  string provider_id = 1;
}

// The person opened a list of models (an agent's model picker, say) or
// Settings → Providers (friend bug #41): Claktory reads again what's stale,
// each model list read more than 15 minutes ago (Provider.models_fetched_ms)
// and each key's credit read more than a minute ago (Account.credit), and
// Workspace shows what it finds as it comes (Provider.models_fetching while
// a list is read). Answered with Ack at once, before anything is read. Send
// it each time one of them opens; asking often costs nothing.
message ProvidersShown {}

// Adds a model its provider's list doesn't have, by its id, once the
// provider says this sign-in has it and an agent can run on it (friend bug
// #14). Kept across restarts, and listed with Model.added. Answered with Ack
// once it's in Workspace.models (Ack too when it was already), or an Error
// with a sentence to show ("Anthropic has no model “claude-x” for this
// sign-in.", "Sign in to Anthropic first, in Settings → Providers."). An
// agent's model set to a model the list doesn't have (UpdateAgent,
// models_set) is checked and added the same way first.
message AddModel {
  // "<provider>/<model id>", such as "openrouter/google/gemini-4-neon".
  string model = 1;
}

// The person's answer to KeepAwake: keep the Mac awake while agents work,
// or not. Ack; KeepAwake.answered turns true.
message SetKeepAwake {
  bool on = 1;
}

message UpdateCheck {
  UpdateCheckState state = 1;
  string version = 2;
  // Why it failed (FAILED only), such as "Claktory couldn't reach the
  // update server.".
  string error = 3;
  // When it started (CHECKING, DOWNLOADING) or finished, in ms since 1970.
  int64 checked_ms = 4;
}

// A message an agent proposed in one of the person's direct-message
// conversations (dm_send), waiting for the person to approve it on their
// device or decline it, in the chat's review card. Never its text: the
// device loads the proposal from the account service, and only the device
// approves. It leaves Workspace.dm_sends once the person decides, the agent
// takes it back, it expires or it can't be sent any more.
message DmSendWaiting {
  // The account service's proposal id, which the review card loads.
  string proposal_id = 1;
  // The agent that proposed it.
  string agent_id = 2;
  // The conversation it would be sent in, for the app to open the chat.
  string conversation_id = 3;
  // The friend it would go to: the name they chose (it may be empty) and
  // the tag the service gave them, each on one line.
  string friend_name = 4;
  string friend_tag = 5;
  int64 created_ms = 6;
  // When it expires unless decided (3 days after it was proposed).
  int64 expires_ms = 7;
}

// The person a Claktory belongs to, as every device shows them.
message Person {
  // `user.name` (Settings.user_name); empty when not given.
  string name = 1;
  // Their avatar: a circle with these initials in white on a diagonal
  // gradient from `avatar_from` (top-left) to `avatar_to` (bottom-right).
  // "MS" for "Matt Smith", "M" for "Matt"; empty when there's no name (and
  // no email): draw a person glyph instead.
  string initials = 2;
  // "#RRGGBB": one of 12 pairs, from a seed kept in the backend, so the
  // avatar never changes by itself. ShuffleAvatar picks another.
  string avatar_from = 3;
  string avatar_to = 4;
  // Who they are beyond this Claktory, for signed devices and messaging
  // between Claktories later: "acct:<account id>@<service host>", and the
  // account's verified email. Empty unless this Claktory is signed in to
  // its account.
  string identity_id = 5;
  string email = 6;
  // The palette the avatar's colours come from: 12 pairs in a fixed order,
  // sent so the app never keeps a list of its own. ShuffleAvatar.choice is
  // an index into it.
  repeated AvatarColors avatar_choices = 7;
  // Which of `avatar_choices` the avatar shows now (avatar_from and
  // avatar_to are its colours).
  int32 avatar_choice = 8;
}

// One pair of the avatar palette (Person.avatar_choices).
message AvatarColors {
  // "#RRGGBB": the diagonal gradient's top-left and bottom-right.
  string from = 1;
  string to = 2;
  // Its name as people read it, for labels: "Indigo and violet", "Slate".
  string name = 3;
}

// A Workspace as a change to the last one this app was sent (a Workspace or
// a WorkspacePatch), so a busy Claktory doesn't resend everything each time
// one thing changes. The first state after connecting is always a whole
// Workspace; a patch only ever follows one.
message WorkspacePatch {
  // The new Workspace, but with what didn't change left out. Each field
  // numbered in `kept` is as it was: take it from the last one. Any other
  // field is as here, empty if it isn't set.
  //
  // `agents` is always the whole list, in order. An agent in `kept_agents`
  // carries only its id: take it from the last one. One in
  // `kept_agent_fields` carries only what changed (see there). Any other is
  // whole, as here.
  Workspace workspace = 1;
  // Workspace field numbers (e.g. 18 for `changelog`) unchanged since the
  // last one. Never 2 (`agents`).
  repeated uint32 kept = 2;
  // Ids of the agents unchanged since the last one.
  repeated string kept_agents = 3;
  // Agents that changed in only some fields (their status, say): in
  // `workspace.agents` each carries its id and the fields that changed. Take
  // the fields numbered in `kept` from the last one.
  repeated KeptFields kept_agent_fields = 4;
}

// Which of an agent's fields are unchanged since the last Workspace.
message KeptFields {
  // The agent's id.
  string id = 1;
  // Agent field numbers (e.g. 4 for `prompt`); never 1 (`id`).
  repeated uint32 kept = 2;
}

message ChangelogVersion {
  // e.g. "2026.11.18-2123"; empty for the unreleased entry.
  string version = 1;
  // When it was released (the time in its version), in ms since 1970; 0 for
  // the unreleased entry.
  int64 released = 2;
  // In the changelog's order.
  repeated ChangelogItem items = 3;
  // Changes not in a release yet (dev releases only).
  bool unreleased = 4;
}

message ChangelogItem {
  ChangelogKind kind = 1;
  // The change without its "Added"/"Changed:"/"Fixed:" prefix, starting with
  // a capital, e.g. "The Tasks panel lists background tasks".
  string text = 2;
  // The line as written, e.g. "Added the Tasks panel…".
  string raw = 3;
}

enum ChangelogKind {
  // A line with none of the prefixes.
  CHANGELOG_KIND_OTHER = 0;
  CHANGELOG_KIND_ADDED = 1;
  CHANGELOG_KIND_CHANGED = 2;
  CHANGELOG_KIND_FIXED = 3;
}

// Parts of the app to make glow briefly, so the person sees what happened or
// what an agent is pointing at. Transient: never stored or sent again, and
// only to the clients connected now.
message Highlight {
  repeated HighlightTarget targets = 1;
  // A short caption an agent gave (AGENT kind); may be empty.
  string text = 2;
  // The agent it came from: the sender of a message, or the agent that
  // called the highlight tool.
  string from_agent_id = 3;
  HighlightKind kind = 4;
}

// What to highlight. Kinds the app doesn't know are skipped. `kind` and `id`:
//
// - "agent": an agent's id (its sidebar row)
// - "project": a project's id
// - "checklist_item": "<agent id>#<item number>", e.g. "backend#4"
// - "extension": "<agent id>/<extension id>", that extension's icon for the agent, e.g. "backend/checklist"
// - "settings", "marketplace": the sidebar's buttons; `id` is empty
message HighlightTarget {
  string kind = 1;
  string id = 2;
}

// An agent asks to open a screen in the app (its show_screen tool). Sent to
// every app connected; each opens it only while it's the one the person is
// using (its window frontmost and focused, or on a phone in the
// foreground), never bringing itself forward, and answers ScreenOpened
// either way.
message OpenScreen {
  // Unique per call; ScreenOpened gives it back.
  string id = 1;
  // What to open, by kind and id. "settings": id a section ("profile",
  // "general", "account", "providers", "secrets", "apps", "defaults",
  // "devices", "resources", "display"), or empty for the top. "map",
  // "usage", "monitors" (every agent's monitors), "marketplace",
  // "changelog" (What's new): no id. "agent": an
  // agent's id, its conversation. "agent_settings": an agent's id, its
  // settings.
  HighlightTarget target = 2;
  // The agent that asked.
  string from_agent_id = 3;
}

// Whether this app showed OpenScreen `id`: `opened` when it did, false when
// it isn't the one in use.
message ScreenOpened {
  string id = 1;
  bool opened = 2;
}

enum HighlightKind {
  HIGHLIGHT_KIND_UNSPECIFIED = 0;
  // An agent messaged another (agents_send): targets[0] is the sender's
  // "agent" target, targets[1] the recipient's.
  HIGHLIGHT_KIND_MESSAGE = 1;
  // An agent asked for it with its highlight tool.
  HIGHLIGHT_KIND_AGENT = 2;
}

// A capability agents can have, such as messaging other agents. Each agent
// has it on or off (`Agent.extensions`), with its own option values.
message Extension {
  string id = 1;
  string name = 2;
  string description = 3;
  // Agents have it unless it's turned off for them.
  bool default_enabled = 4;
  repeated ExtensionOption options = 5;
  // A Lucide icon name, e.g. "users".
  string icon = 6;
  // For an instance of an extension (a named second use of it, on or off on
  // its own, such as "memory:factory", Factory's manual as a read-only
  // memory): the extension it belongs to, e.g. "memory". Its `id` is
  // "<base>:<name>" and works wherever an extension id does: AgentExtension,
  // ExtensionChange, OpenPanel, Agent.open_panel and ExtensionView. Empty for
  // an extension itself. Instances have no options and come right after
  // their extension.
  string base = 7;
  // Admin agents (Messaging's `admin` option, such as Rivet) have it unless
  // it's turned off for them; other agents only once it's turned on. Set for
  // instances and for extensions alike (Resources is one).
  bool admin_default = 8;
}

message ExtensionOption {
  string id = 1;
  // e.g. "Other agents can message it".
  string label = 2;
  string description = 3;
  // A SWITCH's default.
  bool default_value = 4;
  ExtensionOptionKind kind = 5;
  // AGENTS: the agent's own project's agents always count, whether listed or
  // not; show them checked and greyed, as "in its project".
  bool includes_project = 6;
  // CHOICE: what can be chosen, in the order to show them.
  repeated OptionChoice choices = 7;
  // CHOICE: the value in effect until someone chooses (one of `choices`).
  string default_choice = 8;
}

message OptionChoice {
  // What's kept in config.json and sent back in OptionValue.choice, e.g. "30m".
  string value = 1;
  // What to show, e.g. "Every 30 minutes".
  string label = 2;
}

enum ExtensionOptionKind {
  EXTENSION_OPTION_KIND_UNSPECIFIED = 0;
  // On or off: `OptionValue.on`.
  EXTENSION_OPTION_KIND_SWITCH = 1;
  // A list of agents: `OptionValue.agent_ids`.
  EXTENSION_OPTION_KIND_AGENTS = 2;
  // One of `ExtensionOption.choices`: `OptionValue.choice`.
  EXTENSION_OPTION_KIND_CHOICE = 3;
}

message OptionValue {
  // For a SWITCH.
  bool on = 1;
  // For an AGENTS list: agent ids.
  repeated string agent_ids = 2;
  // For a CHOICE: one of ExtensionOption.choices' values; set it through
  // ExtensionChange.value. Another value is refused.
  string choice = 3;
}

// An extension as one agent has it, with its options' effective values.
message AgentExtension {
  string id = 1;
  bool enabled = 2;
  // Every option of the extension, by option id.
  map<string, OptionValue> options = 3;
}

// What an extension's panel shows for an agent. Sent when the selected agent
// has the extension in `Workspace.open_panel` enabled, and again whenever it
// changes; a client shows it only while it matches the open panel and the
// selected agent.
message ExtensionView {
  string extension_id = 1;
  string agent_id = 2;
  string title = 3;
  oneof body {
    Checklist checklist = 10;
    Memory memory = 11;
    Messaging messaging = 12;
    Tasks tasks = 13;
    Monitors monitors = 14;
    Database database = 15;
    Resources resources = 16;
  }
}

// A database's tables, read only: the agent's own (extension "database"),
// or Factory's records (instance "database:factory").
message Database {
  // By name; empty when it has none yet.
  repeated DatabaseTable tables = 1;
  // Where the file is, for the person who wants to open it elsewhere.
  string path = 2;
}

message DatabaseTable {
  string name = 1;
  // A view rather than a table.
  bool view = 2;
  uint64 rows = 3;
  repeated DatabaseColumn columns = 4;
}

// How the machine and Factory use its resources (the Resources extension),
// sampled every minute; disk use is measured every 20 minutes.
message Resources {
  Machine machine = 1;
  // Factory's processes, biggest first: its backend, supervisor and app, and
  // agents' background tasks, monitors' watches and commands running now.
  repeated ResourceProcess factory = 2;
  // The machine's other processes using the most memory.
  repeated ResourceProcess others = 3;
  // What Factory's data takes (its home folder, then by part), then each
  // project's folders.
  repeated DiskUsage disk = 4;
  // The last hour's samples, oldest first.
  repeated ResourceSample history = 5;
  // When `machine` and the processes were sampled, and when the disk was
  // last measured (0 until it has been), in ms since 1970.
  int64 sampled = 6;
  int64 measured = 7;
  // The alerts in effect now, as the agents were told them.
  repeated string alerts = 8;
}

message Machine {
  // How busy all its processors are, 0 to 100.
  double cpu_percent = 1;
  uint32 cores = 2;
  // In bytes.
  uint64 memory_total = 3;
  uint64 memory_used = 4;
  uint64 swap_total = 5;
  uint64 swap_used = 6;
  // The volumes Factory uses.
  repeated Volume volumes = 7;
}

message Volume {
  // Where it's mounted, e.g. "/" or "/Volumes/Work".
  string mount = 1;
  // In bytes.
  uint64 total = 2;
  uint64 available = 3;
  // What of Factory's is on it: "Factory's data", then project names.
  repeated string uses = 4;
}

// A process of Factory's (with what it started) or another one.
message ResourceProcess {
  // "Factory's backend", "Supervisor", "App", "task-3 npm run dev",
  // "Monitor m2 tail -f app.log", "Commands running now", or another
  // process's name, such as "Docker".
  string label = 1;
  // backend, supervisor, app, task, monitor, command or other.
  string kind = 2;
  // The agent a task, monitor or command is of; empty otherwise.
  string agent_id = 3;
  // Its main process (a task's or monitor's process group).
  uint32 pid = 4;
  // How many processes it counts.
  uint32 processes = 5;
  // Over the last minute; 100 is one processor busy.
  double cpu_percent = 6;
  // Resident memory, in bytes.
  uint64 memory = 7;
}

message DiskUsage {
  // "Factory's data", "Releases", an agent's or project's name, a folder's.
  string label = 1;
  // home, releases, agent, project or folder; among an agent's, project's
  // or folder's parts, "build_cache" for each build cache in it (its
  // checkout's, or the folder's), which ClearBuildCache clears by `path`.
  string kind = 2;
  // The agent's or project's id.
  string id = 3;
  string path = 4;
  // In bytes. Checkouts are copy-on-write clones: their bytes are counted
  // in full though they share most of them.
  uint64 bytes = 5;
  // An agent's: its conversations, task logs, database and checkout, and its
  // checkout's build caches; a project's or folder's: its build caches.
  repeated DiskUsage parts = 6;
  // The walk took too long and stopped: `bytes` is at least this.
  bool partial = 7;
}

message ResourceSample {
  int64 time = 1;
  double cpu_percent = 2;
  uint64 memory_used = 3;
  uint64 swap_used = 4;
  // All of Factory's processes together.
  uint64 factory_memory = 5;
}

message DatabaseColumn {
  string name = 1;
  // As declared, e.g. "INTEGER"; may be empty.
  string type = 2;
}

// Whom an agent can message and who can message it, by the same rule as its
// tools. Names, colors and status come from the workspace's agents.
message Messaging {
  // Agent ids it can message, in sidebar order.
  repeated string reaches = 1;
  // Agent ids that can message it, in sidebar order.
  repeated string reached_by = 2;
}

// An agent's checklist: everything the person asked for, oldest first.
message Checklist {
  repeated ChecklistItem items = 1;
  // The person's goals: outcomes they declared, which items can serve
  // (ChecklistItem.goal). Oldest first, every status.
  repeated Goal goals = 2;
}

// A goal on an agent's checklist: an outcome the person wants, in their
// words ("get the Android app to a link I can share"), recorded by the
// person or by the agent from what the person said.
message Goal {
  // Small and per agent, apart from items' ids: G1, G2…
  uint32 id = 1;
  string text = 2;
  // OPEN, DONE or DROPPED.
  ChecklistStatus status = 3;
  // ms since 1970.
  int64 created = 4;
  int64 updated = 5;
  // What happened to it, oldest first; an empty author is the person.
  repeated ChecklistUpdate log = 6;
}

message ChecklistItem {
  // Small and per agent: #1, #2…
  uint32 id = 1;
  string text = 2;
  ChecklistStatus status = 3;
  // The agent id of who's on it; empty when unassigned.
  string owner = 4;
  // When it was added and last changed, in ms since 1970.
  int64 created = 5;
  int64 updated = 6;
  // What happened to it, oldest first.
  repeated ChecklistUpdate log = 7;
  // While it's blocked: the latest note made since it last became blocked
  // (what it waits on), the note's own text. Empty otherwise.
  string note = 8;
  // While it's blocked: what it waits on — "person" when it waits on the
  // person, else a few words naming the blocker. Empty otherwise, and on
  // blocked items from before this was kept.
  string blocked_on = 9;
  // While it's blocked: when it became so, ms since 1970; 0 otherwise
  // (and on blocked items from before this was kept).
  int64 blocked_since_ms = 10;
  // While it blocks on the person: whether the item's owning agent (its
  // owner, or this checklist's agent) has a question waiting for the
  // person (a pending ask_person). False otherwise: "blocked on the
  // person for 2 days and never asked" is blocked_on == "person",
  // has_pending_ask == false, and an old blocked_since_ms.
  bool has_pending_ask = 11;
  // The goal it serves (Goal.id on the same checklist); 0 for none.
  uint32 goal = 12;
  // While it's blocked (#279): what kind of thing it waits on;
  // UNSPECIFIED for an untyped block (blocked_on's words alone). blocked_on
  // stays filled for older apps: "person" for the person's kinds, and for
  // BLOCKED_KIND_ITEM the waited-on item's text as it is now.
  BlockedKind blocked_kind = 13;
  // Whom or what: an agent id (AGENT), or "agent#12" (ITEM: item 12 on that
  // agent's checklist). Empty otherwise.
  string blocked_ref = 14;
  // BLOCKED_KIND_EXTERNAL: when its owner is next told to check again, ms
  // (always set while it waits). CHECKLIST_STATUS_PARKED: when it resumes
  // (goes back to open, its owner told), ms; 0 for no set time.
  int64 retry_at_ms = 15;
  // The person's kinds: when Claktory has it asked again after the person
  // dismissed its question, ms (as long as it still waits on them); 0
  // while nothing was dismissed.
  int64 reask_at_ms = 16;
  // When the person last dismissed a question about it, ms; 0 if never.
  int64 dismissed_ms = 17;
}

// What a blocked checklist item waits on (#279).
enum BlockedKind {
  BLOCKED_KIND_UNSPECIFIED = 0;
  // A decision only the person can make.
  BLOCKED_KIND_PERSON_DECISION = 1;
  // Something only the person can do (sign in, pay, plug in).
  BLOCKED_KIND_PERSON_ACTION = 2;
  // Another checklist item (blocked_ref): it opens again by itself when
  // that one is done or dropped, and its owner is told.
  BLOCKED_KIND_ITEM = 3;
  // Another agent (blocked_ref).
  BLOCKED_KIND_AGENT = 4;
  // Something outside: its owner is told to check again at retry_at_ms,
  // then each time twice as long after.
  BLOCKED_KIND_EXTERNAL = 5;
}

message ChecklistUpdate {
  // ms since 1970.
  int64 time = 1;
  // e.g. "Added", "Done: shipped", "Owner: frontend", or a note.
  string text = 2;
  // The agent id of who made it; empty for the person.
  string author = 3;
}

enum ChecklistStatus {
  CHECKLIST_STATUS_UNSPECIFIED = 0;
  CHECKLIST_STATUS_OPEN = 1;
  CHECKLIST_STATUS_IN_PROGRESS = 2;
  CHECKLIST_STATUS_DONE = 3;
  CHECKLIST_STATUS_DROPPED = 4;
  // Waiting on the person or something outside; still outstanding.
  CHECKLIST_STATUS_BLOCKED = 5;
  // Ongoing or waiting its turn, with nothing to wait on (#279): still
  // outstanding, never nudged or asked whether it's still blocked; shown
  // apart from Blocked. It can resume at a set time (retry_at_ms).
  CHECKLIST_STATUS_PARKED = 6;
}

// An agent's own memory: the person's preferences it learned and its
// knowledge notes. Only that agent reads and writes it.
message Memory {
  // By id.
  repeated MemoryPreference preferences = 1;
  // By slug.
  repeated MemoryNote notes = 2;
  // Newest first, the last 50.
  repeated MemoryChange changes = 3;
  // Factory's manual (instance "memory:factory"): notes only, which are
  // Factory's own docs; nothing is learned or changed, so there are no
  // preferences or changes.
  bool read_only = 4;
}

message MemoryPreference {
  // Small and per agent: #1, #2…; never reused.
  uint32 id = 1;
  // What the person wants or doesn't, e.g. "Don't propose paid CI".
  string rule = 2;
  // Why, e.g. "everything runs locally in Factory".
  string why = 3;
  // When it was added and last changed, in ms since 1970.
  int64 learned = 4;
  int64 updated = 5;
}

message MemoryNote {
  // a-z, 0-9 and -, e.g. "deploy-quirks".
  string slug = 1;
  // One line, up to 150 characters.
  string summary = 2;
  // Markdown.
  string body = 3;
  // ms since 1970.
  int64 created = 4;
  int64 updated = 5;
}

message MemoryChange {
  // ms since 1970.
  int64 time = 1;
  // The agent id of who made it; empty for the person.
  string actor = 2;
  MemoryChangeKind kind = 3;
  // Set for preference changes.
  uint32 preference_id = 4;
  // Set for note changes.
  string note_slug = 5;
  // A preference's rule (the old one when removed); a note's summary.
  string text = 6;
}

enum MemoryChangeKind {
  MEMORY_CHANGE_KIND_UNSPECIFIED = 0;
  MEMORY_CHANGE_KIND_PREFERENCE_ADDED = 1;
  MEMORY_CHANGE_KIND_PREFERENCE_CHANGED = 2;
  MEMORY_CHANGE_KIND_PREFERENCE_REMOVED = 3;
  MEMORY_CHANGE_KIND_NOTE_WRITTEN = 4;
  MEMORY_CHANGE_KIND_NOTE_EDITED = 5;
  MEMORY_CHANGE_KIND_NOTE_REMOVED = 6;
}

// The background tasks an agent can see (its own, or every agent's with
// see_all or admin): running ones first, newest first, then the 20 that
// ended most recently.
message Tasks {
  repeated BackgroundTask tasks = 1;
}

message BackgroundTask {
  // Per agent: "task-3".
  string id = 1;
  // The agent that started it.
  string agent_id = 2;
  string command = 3;
  // When it started and ended, in ms since 1970; ended is 0 while it runs.
  int64 started = 4;
  int64 ended = 5;
  bool running = 6;
  // How it ended: "exit 0", "exit 1", "signal SIGKILL", "timed out",
  // "stopped by Rivet", "stopped by the person"…; empty while it runs.
  string status = 7;
  // The absolute path of its output log.
  string log_path = 8;
  // The last lines of its output (about 20).
  string log_tail = 9;
}

// An agent's monitors: what will prompt it later, and what else will.
message Monitors {
  // Its monitors, oldest first: active, paused and failed ones, and ones that
  // ended in the last week.
  repeated Monitor monitors = 1;
  // What else will wake it, one line each, e.g. "task-3 (background task) —
  // wakes you when it exits", "checklist reminder — on: …".
  repeated string builtins = 2;
}

message Monitor {
  // Small and per agent: 3 for m3; never reused.
  uint32 id = 1;
  string name = 2;
  // What the agent is told when it fires.
  string prompt = 3;
  // What it waits for, in words, e.g. "every 1h", "check `make test` every
  // 5m, fires on failure", "files src/**/*.rs".
  string when = 4;
  // "at", "every", "cron", "check", "files" or "watch".
  string kind = 5;
  MonitorState state = 6;
  // Why it's paused or ended, e.g. "by the person", "by coordinator", "its
  // until passed"; may be empty.
  string reason = 7;
  // When it next fires or checks, in ms since 1970; 0 when it has no time
  // (files, watch, or not active).
  int64 next_due = 8;
  // When it last fired, in ms since 1970; 0 if it never has.
  int64 last_fired = 9;
  uint32 fires = 10;
  // When it ends on its own, in ms since 1970; 0 for never.
  int64 until = 11;
  // It ends after this many fires; 0 for no limit.
  uint32 max_fires = 12;
  // It fires only while the agent is idle.
  bool idle_only = 13;
  // The agent id of who set it; empty for the person.
  string created_by = 14;
  // ms since 1970.
  int64 created = 15;
}

// ---- The Monitors overview ----

// Every agent's monitors, for the Monitors overview, by agent and then id.
// Answered with MonitorList. The filters combine; each left empty doesn't
// filter.
message ListMonitors {
  // Only this agent's.
  string agent_id = 1;
  // Only those of agents in this project.
  string project_id = 2;
  // Only monitors in these states. Empty: all but those that ended (done or
  // cancelled) more than a week ago, which are never listed.
  repeated MonitorState states = 3;
}

message MonitorList {
  repeated AgentMonitor monitors = 1;
}

// A monitor with the agent it wakes: monitors are numbered per agent, so
// agent_id and monitor.id together name one.
message AgentMonitor {
  string agent_id = 1;
  Monitor monitor = 2;
  // Why an active monitor doesn't run now, though it stays active and runs
  // again once that changes; UNSPECIFIED when it runs, or isn't active.
  MonitorHeld held = 3;
}

enum MonitorHeld {
  MONITOR_HELD_UNSPECIFIED = 0;
  // Its agent has the Monitors extension turned off.
  MONITOR_HELD_EXTENSION_OFF = 1;
  // Its agent's project is archived.
  MONITOR_HELD_PROJECT_ARCHIVED = 2;
}

// What happened to one monitor, newest first, a page at a time. Answered
// with MonitorHistory; an error (NOT_FOUND) when the agent has no such
// monitor.
message ListMonitorHistory {
  string agent_id = 1;
  // Its number: 3 for m3.
  uint32 monitor_id = 2;
  // Only events before this one (the last page's oldest seq); 0 for the
  // newest.
  uint64 before_seq = 3;
  // How many; 0 for 50, at most 200.
  uint32 limit = 4;
}

message MonitorHistory {
  string agent_id = 1;
  uint32 monitor_id = 2;
  repeated MonitorEvent events = 3;
  // There are older ones.
  bool more = 4;
}

// One thing that happened to a monitor. A fire is the monitor waking its
// agent with its prompt, not the agent's work on it being done.
message MonitorEvent {
  // Its place in the history, increasing; for paging.
  uint64 seq = 1;
  // ms since 1970.
  int64 time_ms = 2;
  MonitorEventKind kind = 3;
  // Who did it: an agent's id; empty for the person, or for Claktory (a
  // fire on schedule, an end on its own).
  string actor = 4;
  // In words: CREATED what it waits for ("every 6h"); FIRED what fired it
  // ("check matched \"ERROR\"", "fired by hand"); PAUSED, CANCELLED, DONE
  // and ERROR why ("by Matt", "its until passed", "its command kept
  // failing"). May be empty.
  string detail = 5;
}

enum MonitorEventKind {
  MONITOR_EVENT_KIND_UNSPECIFIED = 0;
  MONITOR_EVENT_KIND_CREATED = 1;
  MONITOR_EVENT_KIND_FIRED = 2;
  MONITOR_EVENT_KIND_PAUSED = 3;
  MONITOR_EVENT_KIND_RESUMED = 4;
  MONITOR_EVENT_KIND_CANCELLED = 5;
  MONITOR_EVENT_KIND_DONE = 6;
  MONITOR_EVENT_KIND_ERROR = 7;
}

// Some agent's monitors changed: see ServerMessage.monitors_changed.
message MonitorsChanged {}

enum MonitorState {
  MONITOR_STATE_UNSPECIFIED = 0;
  MONITOR_STATE_ACTIVE = 1;
  MONITOR_STATE_PAUSED = 2;
  // It ended on its own: once, until or max fires.
  MONITOR_STATE_DONE = 3;
  MONITOR_STATE_CANCELLED = 4;
  // It stopped working (its command kept failing or couldn't start, its
  // watch kept exiting or its log grew too big); `reason` says why. It can
  // be resumed.
  MONITOR_STATE_ERROR = 5;
}

message Settings {
  // Model for new agents that don't choose one: "<provider>/<model id>".
  string default_model = 1;
  string default_effort = 2;
  // Agents' contexts are compacted when they reach this many tokens.
  uint64 compact_at_tokens = 3;
  // When agents with the Resources extension are told the machine runs low
  // (config.json's `resources`), as in effect: memory used above this
  // percentage for a few minutes; a volume Factory uses with less free than
  // disk_free_gb GB or disk_free_percent of it, whichever is smaller; the
  // processors busier than cpu_percent for several minutes, 0 when that
  // alert is off.
  uint32 ram_percent = 4;
  uint32 disk_free_gb = 5;
  uint32 disk_free_percent = 6;
  uint32 cpu_percent = 7;
  // How wide the person dragged the sidebar and the right panel (the
  // extension panel), in logical pixels, the same on every device
  // (config.json's `display`); 0 for the app's default. The app keeps them
  // in its own range.
  double sidebar_width = 8;
  double panel_width = 9;
  // GB the build caches of one agent's checkout, or of one project folder,
  // may take (config.json's `resources.build_cache_gb`, 25 unless changed):
  // over it, Factory clears them while nothing works there. 0: never.
  double build_cache_gb = 11;
  // The user's first name, which agents call them by (config.json's
  // `user.name`); empty when not given, and agents say "the person".
  string user_name = 10;
  // Unused: requests need no vault passphrase (config.json's
  // `vault.unlock_minutes`, 5 unless changed).
  uint32 vault_unlock_minutes = 20;
  // An idle agent compacts its conversation just before its prompt cache
  // expires, so coming back to it later doesn't pay to cache the whole long
  // conversation again (config.json's `compaction.idle`, on unless changed).
  // Only for a cache Claktory knows the lifetime of (an hour: after 54
  // minutes idle; 5 minutes: only with `idle_compaction_short_cache`), and a
  // conversation of at least 150,000 tokens on a 200,000-token model (75% of
  // a smaller window, at most 200,000 on a larger one).
  bool idle_compaction = 23;
  // Also compact after 4 minutes idle when the cache lasts 5 minutes
  // (config.json's `compaction.idle_short_cache`, off unless changed). Far
  // more often than with an hour's cache.
  bool idle_compaction_short_cache = 24;
  // How long each provider's or model's prompt cache is asked to last, as
  // set (config.json's `prompt_cache`); what isn't listed asks for the
  // provider's default. See Provider.cache_ttl for what applies.
  repeated CacheTtl cache_ttls = 25;
  // This Claktory's name, the same on every device (config.json's `name`):
  // this computer's name (as RemoteAccess.machine) until someone renames it.
  string name = 26;
  // This Claktory's color, one of the agents' palette (see Agent.color),
  // the same on every device (config.json's `color`). Until someone picks
  // one, a color that stays the same for this Claktory, chosen from its key.
  string color = 27;
  // How much each device zooms the whole app (config.json's `display.zoom`),
  // by device id as Welcome.device_id gives it: "local" for this machine's
  // own app, which a connection on the loopback port without a token (an
  // empty Welcome.device_id) also counts as. 1.0 is actual size, which a
  // device not listed has; 0.5 to 2.0. Each device's own, since each has its
  // own screen; set with SetZoom.
  map<string, double> zoom = 28;
  // Where this Claktory's first run stands, the same on every device.
  Onboarding onboarding = 29;
  // "<provider>/<model id>" a refused step is retried on for agents that
  // name no fallback_model of their own; empty for none.
  string default_fallback_model = 30;
  // The most panes an agent's `show` (the Viewer extension) keeps open in
  // its layout (Agent.layout) at once, counting every pane but the
  // conversation, whoever opened it (config.json's `display.max_open_panes`):
  // 4 until changed, 1 to 11. Past it, show refuses until the person closes
  // one. The person's own layouts (SetLayout) aren't held to it: they take
  // up to 12 panes, the conversation included.
  uint32 max_open_panes = 31;
  // When Claktory notifies the person (Settings → Notifications).
  NotificationSettings notifications = 32;
  // How Claktory follows up on blocked checklist items (#282), as set:
  // each its default until changed. Kept in factory.db, not config.json.
  ChecklistSettings checklist = 33;
  // What happens to Claktory on this Mac when its app quits (friend bug
  // #27): KEEP_RUNNING until the person chooses (every Claktory from before
  // it), never UNSPECIFIED. Only matters where BackendService.can_stop.
  // Kept in factory.db.
  QuitMode when_app_quits = 34;
  // How many bytes of this Claktory's files each device keeps for its
  // viewers (#446), in config.json's `display.file_cache`, by device id as
  // Welcome.device_id gives it ("local" as for zoom). A device not listed
  // keeps 1 GB (1,000,000,000); a listed one 100 MB to 100 GB. Each
  // device's own; set with SetFileCache.
  map<string, uint64> file_cache = 35;
  // The devices in Needs you's focus mode (#514), by id as
  // Welcome.device_id gives it ("local" for this computer's app): the app
  // opens in focus mode when its own is here. Each device's own; set with
  // SetFocusMode. Kept in factory.db; a removed device leaves it.
  repeated string focus_mode = 36;
  // Who hears the Resources extension's alerts (friend bug #54; config.json's
  // `resources.alerts_to_admins` and `resources.alert_agents`): the admin
  // agents, while this is on (true unless changed), and the agents chosen.
  // With none told, Claktory notifies the person itself.
  bool resource_alerts_to_admins = 37;
  // Everyone who hears them, as in effect: the admin agents first (while
  // resource_alerts_to_admins is on), then the agents chosen, each once,
  // and whether it's told now. Show it; don't work it out.
  repeated ResourceAlertAgent resource_alert_agents = 38;
  // Agents pinned under Rivet in the sidebar, by id, in the person's
  // order: each in a project that isn't archived (deleting one, moving it
  // out of projects or archiving its project unpins it; moving it to
  // another project keeps its pin). The same on every device; set with
  // PinAgent and UnpinAgent, or by Rivet in config.json (pinned_agents).
  repeated string pinned_agents = 40;
}

// One agent that hears the Resources extension's alerts (Settings).
message ResourceAlertAgent {
  // Its id; an agent chosen that's gone keeps its id (held NO_AGENT).
  string agent_id = 1;
  // It's told of the next alert.
  bool told = 2;
  // Why it isn't told: UNSPECIFIED when it is.
  ResourceAlertHeld held = 3;
  // Listed as an admin agent (resource_alerts_to_admins), not chosen.
  bool admin = 4;
}

enum ResourceAlertHeld {
  RESOURCE_ALERT_HELD_UNSPECIFIED = 0;
  // Its Resources extension is off.
  RESOURCE_ALERT_HELD_RESOURCES_OFF = 1;
  // Its project is archived.
  RESOURCE_ALERT_HELD_ARCHIVED = 2;
  // Its model can't run.
  RESOURCE_ALERT_HELD_NO_MODEL = 3;
  // No agent has this id any more.
  RESOURCE_ALERT_HELD_NO_AGENT = 4;
}

// Agents, by id: a whole list, set as one.
message AgentIds {
  repeated string agent_ids = 1;
}

// What happens to Claktory on its Mac when the Mac app quits (friend bug
// #27).
enum QuitMode {
  QUIT_MODE_UNSPECIFIED = 0;
  // Agents keep working with the app closed, and Claktory starts by itself
  // when the person logs in.
  QUIT_MODE_KEEP_RUNNING = 1;
  // Claktory runs only while the app is open: quitting the app stops it
  // (StopEngine quitting), and nothing starts it at login; opening the app
  // starts it (`factoryd install --start`).
  QUIT_MODE_STOP = 2;
}

// Settings → Checklist (#282): how Claktory follows up on blocked checklist
// items, in minutes, each from 15 to 10080 (a week).
message ChecklistSettings {
  // A block on another agent or item, or an untyped one: its owner is
  // asked whether it's still blocked this long after it blocked, and as
  // often again while it stays so. 240 until changed.
  uint32 agent_blocked_minutes = 1;
  // The same for a wait on the person. 1440 until changed.
  uint32 person_blocked_minutes = 2;
  // A wait on something outside given no retry time: its owner is told to
  // check again this long after, then each time twice as long, at most a
  // day (or this, if longer). 120 until changed.
  uint32 external_retry_minutes = 3;
  // After the person dismisses a question about an item that still waits
  // on them, its owner asks again this long after, and as often, with no
  // limit on how many times. 1440 until changed.
  uint32 reask_minutes = 4;
  // A block this old is told to its owner's lead, once (never to the
  // person). 1440 until changed.
  uint32 overdue_minutes = 5;
}

// Where a new Claktory's first run stands. A Claktory from before it, or
// whose first run is over, has every step DONE.
message Onboarding {
  // "Connect a model": NEEDED on a Claktory that started with no model
  // available, until one is; SKIPPED once the person skips it
  // (SetOnboarding), until one is. The first time a model is available it
  // turns DONE by itself, and Rivet greets the person (an event from
  // Claktory starts it), moved first to a model that can run if its own
  // can't.
  OnboardingStep model = 1;
  // "When Claktory quits" (friend bug #27): NEEDED on a new Claktory that
  // its Mac's background service runs (BackendService.can_stop), until the
  // person answers (UpdateSettings.when_app_quits turns it DONE) or skips
  // it (SetOnboarding.skip_when_app_quits: SKIPPED, and it keeps running).
  // DONE everywhere else, and on every Claktory from before it.
  OnboardingStep when_app_quits = 2;
}

enum OnboardingStep {
  ONBOARDING_STEP_UNSPECIFIED = 0;
  ONBOARDING_STEP_NEEDED = 1;
  ONBOARDING_STEP_SKIPPED = 2;
  ONBOARDING_STEP_DONE = 3;
}

// Skips steps of the first run. Answered with Ack, also when the step is
// already skipped or done.
message SetOnboarding {
  // "Connect a model" (Onboarding.model): skipped until a model is available.
  bool skip_model = 1;
  // "When Claktory quits" (Onboarding.when_app_quits): skipped for good,
  // keeping Claktory running.
  bool skip_when_app_quits = 2;
}

// How long a provider's (or one model's) prompt cache is asked to last.
message CacheTtl {
  // A provider id ("anthropic") or a model id ("anthropic/claude-opus-4-8"),
  // which wins over its provider's.
  string key = 1;
  // "5m" or "1h" on Anthropic: an hour costs more to write the cache (2×
  // input instead of 1.25×) and keeps it through longer breaks. "30m" or
  // "12h" on OpenAI's models from GPT-5.6 on (2.5× instead of 1.25×).
  string ttl = 2;
}

message Provider {
  string id = 1;
  string name = 2;
  // How Factory is signed in, e.g. "Anthropic (Claude Pro/Max)" or
  // "ANTHROPIC_API_KEY". Empty when it isn't.
  string signed_in_with = 3;
  // Factory stored this credential and `SignOut` removes it. False for
  // credentials from the environment.
  bool can_sign_out = 4;
  // Ways to sign in, in the provider's order of preference.
  repeated LoginMethod methods = 5;
  // How much of its usage limits the signed-in subscription has used. Unset
  // when the provider isn't signed in or has no usage limits (API keys). Set
  // as soon as a subscription signs in, with no windows and `updated` 0 until
  // the first read lands.
  ProviderUsage usage = 6;
  // The signed-in subscription's plan as the provider names it, such as
  // "Claude Max 20x" or "ChatGPT Pro". Empty when it isn't signed in with a
  // subscription, or the plan hasn't been read or the provider doesn't say.
  string plan = 7;
  // Every account signed in to it, in the order requests try them. The fields
  // above describe the first, as before several accounts could be signed in.
  repeated Account accounts = 8;
  // How long its prompt cache is asked to last now, "5m" or "1h" (models with
  // their own setting may differ; see Settings.cache_ttls). Set only where
  // the choice is between those two (Anthropic), for apps before
  // cache_lifetime; see that for every provider.
  string cache_ttl = 9;
  // How long its prompt cache lasts now: "5m", "30m", "1h" or "12h" (models
  // with their own setting may differ; see Settings.cache_ttls). Its idle
  // conversations are summarized just before it runs out. Empty when
  // Claktory can't know it: its agents never compact while idle.
  string cache_lifetime = 10;
  // The lifetimes the person can choose for it (UpdateSettings.cache_ttl),
  // its default first, such as "5m" and "1h". Empty when there's no choice:
  // the app then shows cache_lifetime, if any, as it is.
  repeated string cache_ttl_choices = 11;
  // How many agents and chats have a model on this provider now (a
  // switched one where it runs now), idle or working.
  uint32 agents = 12;
  // When Claktory last read this provider's model list from the provider
  // itself, in ms since 1970 (friend bug #14). 0 when it never has: its
  // list is the one Claktory came with.
  uint64 models_fetched_ms = 13;
  // Why the last read of its model list failed, a sentence to show as it
  // is ("Anthropic couldn't be reached."). Empty when it worked or none was
  // tried. The list there was stays.
  string models_fetch_error = 14;
  // Its model list is being read now (RefreshModels, or the read every 12
  // hours).
  bool models_fetching = 15;
  // Its model list can be read from the provider now: it's signed in, at
  // the provider's own address. Refresh models is offered only then.
  bool models_fetchable = 16;
}

// One account signed in to a provider, such as one of two Claude
// subscriptions. Requests go to the first account with capacity; when one
// reaches its usage limit they carry on with the next.
message Account {
  // Made by Factory, stable for as long as the account is signed in.
  string id = 1;
  // Who it is: a subscription's email, as the provider says (empty until
  // known); an API key's name, given with `UpdateAccount.label`, or else
  // its last characters ("sk-…a1b2"); a key from the environment, the
  // variable's name.
  string label = 2;
  // Its plan, such as "Claude Max 20x"; "API key" for a key; empty when
  // unknown.
  string plan = 3;
  // How much of its usage limits it has used; unset when it has none to read.
  ProviderUsage usage = 4;
  // Factory stored it and `SignOut` removes it (false for an API key from the
  // environment).
  bool can_sign_out = 5;
  // Requests go to it now: the first with room, while an agent or chat has
  // a model on this provider that draws on its normal pool (on Anthropic,
  // any but Fable's; see fable_in_use).
  bool in_use = 6;
  // It reached a usage limit: requests skip it until then, in ms since 1970;
  // 0 when it has capacity.
  int64 exhausted_until = 7;
  // An API key that ran out of credit: requests skip it until it's tried
  // again, by itself every hour or with `UpdateAccount.retry`. Its
  // `exhausted_until` stays 0, since nothing says when it gets credit.
  bool out_of_credit = 8;
  // How it's signed in: the `LoginMethod` id, "oauth" (a subscription or
  // OAuth account) or "api_key" (a key, stored or from the environment).
  string method_id = 9;
  // The provider refused to refresh this sign-in: requests skip it until
  // the person signs in to it again (StartLogin with its provider, method
  // "oauth" and add_account, which replaces it in place and clears this).
  bool sign_in_again = 10;
  // What this key has to spend, as its provider says (OpenRouter, #343 U8):
  // read at sign-in, then every few minutes while agents work on it and
  // every half hour otherwise. Unset for a provider that doesn't say
  // (subscriptions, Anthropic and OpenAI keys) or before the first read.
  AccountCredit credit = 11;
  // Fable's own weekly pool (Anthropic) reached its limit on it: Fable
  // models' requests skip it until then, in ms since 1970; 0 when Fable has
  // room on it, and always on providers without that pool.
  int64 fable_exhausted_until = 12;
  // Fable models' requests go to it now: the first with room in Fable's
  // pool, while an agent or chat has a Fable model. As in_use, for that pool.
  bool fable_in_use = 13;
}

// An API key's spending, as its provider says (Account.credit). Amounts
// are in US dollars. OpenRouter tells a key only about the key: its own
// spending limit and what it spent, never the account's balance (that
// takes a management key), so a key with no limit shows today's spend
// alone.
message AccountCredit {
  // The key has a spending limit on the provider: `limit` and `left` hold
  // it. False: no limit is set on the key.
  bool limited = 1;
  // The limit, and what's left of it (zero or less: used up); both 0
  // without one.
  double limit = 2;
  double left = 3;
  // When the limit refills: "daily", "weekly" or "monthly" (UTC); empty
  // when it never does, or with no limit.
  string limit_reset = 4;
  // Spent with this key today, since 00:00 UTC.
  double spent_today = 5;
  // The provider's account never bought credit, so only free models run
  // on it (OpenRouter's is_free_tier).
  bool never_paid = 6;
  // Claktory's sentence when the key can't run paid models, for the
  // sign-in step and Settings → Providers: "This key has no credit yet.
  // Add credit at OpenRouter.", "This key's spending limit is used up.
  // Raise it at OpenRouter, or wait until it refills on Monday."; empty
  // when it can.
  string warning = 7;
  // When it was last read, in ms since 1970.
  int64 read_ms = 8;
  // Why the latest read failed, a sentence ("OpenRouter couldn't be
  // reached."); empty when it worked. The other fields then still hold the
  // last good read, if there was one (read_ms 0 if never).
  string error = 9;
}

message ProviderUsage {
  // The provider's limits; the one with id "weekly" (all models, per week) is
  // the headline.
  repeated UsageWindow windows = 1;
  // When usage was last read, in ms since 1970; 0 if it never was.
  int64 updated = 2;
  // Why the latest read failed; empty when it worked. `windows` and `updated`
  // then still hold the last good read, if there was one.
  string error = 3;
  // The usage resets the account has left, read with its usage (kept from
  // the last good read, like `windows`); empty when it has none or the
  // provider offers none. Only the person uses one, with UseUsageReset.
  repeated UsageReset resets = 4;
}

// Some of an account's usage resets, all of one kind: each refills some of
// its limits now, once.
message UsageReset {
  // The provider's id for it, given back in `UseUsageReset.reset_id`; may be
  // empty (the provider then picks one of the account's resets).
  string id = 1;
  // What it is, shown as is: "Fable reset", "5-hour reset", "Weekly reset",
  // "Full reset"; ChatGPT's own title for it, or else "Full reset".
  string label = 2;
  // What using it does, a sentence: "Refills your 5-hour limit."
  string detail = 3;
  // How many of these are left: 1 or more (spent ones aren't listed).
  uint32 left = 4;
  // How many it came with; 0 when the provider doesn't say.
  uint32 total = 5;
  // When the first of them expires, in ms since 1970; 0 when they don't.
  int64 expires_at = 6;
  // The provider says it can be used now. The person may still try one that
  // isn't: the provider's answer says what happened.
  bool usable = 7;
  // Why it can't be used now, a sentence ("It works only at a usage
  // limit."); empty when `usable`.
  string unavailable = 8;
  // The `UsageWindow` ids it refills ("five_hour", "weekly",
  // "weekly_fable"…); empty when the provider doesn't say.
  repeated string window_ids = 9;
}

// One usage limit, such as the weekly or the 5-hour one.
message UsageWindow {
  // "weekly", "five_hour", "weekly_opus", "weekly_sonnet", ...
  string id = 1;
  // Shown as is, e.g. "Weekly", "5-hour", "Weekly (Opus)".
  string label = 2;
  // 0-100.
  double used_percent = 3;
  // When the window resets, in ms since 1970; 0 if unknown.
  int64 resets_at = 4;
}

message LoginMethod {
  // "oauth" or "api_key".
  string id = 1;
  // e.g. "Anthropic (Claude Pro/Max)", "Anthropic API key".
  string label = 2;
}

message LoginFlow {
  string provider_id = 1;
  string method_id = 2;
  // Open this to sign in.
  string url = 3;
  // What to do with `url`.
  string instructions = 4;
  // Device-code sign-in: enter `user_code` at `verification_url`.
  string user_code = 5;
  string verification_url = 6;
  // Latest status message from the provider.
  string progress = 7;
  // A question waiting for `AnswerLogin`; unset when none.
  LoginPrompt prompt = 8;
  // Sign-in failed. The flow stays until `CancelLogin` dismisses it.
  string error = 9;
}

message LoginPrompt {
  LoginPromptKind kind = 1;
  string message = 2;
  string placeholder = 3;
  // For `SELECT`.
  repeated LoginOption options = 4;
}

enum LoginPromptKind {
  LOGIN_PROMPT_KIND_UNSPECIFIED = 0;
  LOGIN_PROMPT_KIND_TEXT = 1;
  // Hide what's typed (API keys).
  LOGIN_PROMPT_KIND_SECRET = 2;
  // Pick one of `options`; answer with its id.
  LOGIN_PROMPT_KIND_SELECT = 3;
  // Paste the authorization code or the full address the browser was
  // redirected to. Waits next to `LoginFlow.url`: only needed when the
  // redirect can't reach the backend.
  LOGIN_PROMPT_KIND_CODE = 4;
}

message LoginOption {
  string id = 1;
  string label = 2;
}

message Project {
  string id = 1;
  string name = 2;
  // Absolute path of the project's folder.
  string path = 3;
  // Folders inside the project, each where some of its agents work (see
  // Agent.folder_id). In the person's order.
  repeated ProjectFolder folders = 4;
  // Archived: put away, with nothing deleted. Its agents stay in
  // Workspace.agents with their conversations, checklists, memory and
  // files, but don't run: one that was working is stopped, and messages and
  // events for them wait, queued, until the project is unarchived. Their
  // monitors pause, other agents can't message them, and the Map leaves the
  // project out. Unarchived, all of that resumes as it was.
  bool archived = 5;
  // Where its new pipes forward their reports, from the start: each new
  // pipe takes it as its own PipeForward (revision 1). Unset or an empty
  // recipient: no one. Its revision is 0.
  PipeForward report_forward = 6;
}

// A folder that some of a project's agents work in. It only scopes where they
// work: messaging and everything else stay project-wide.
message ProjectFolder {
  // Unique within the project.
  string id = 1;
  string name = 2;
  // Absolute; may be outside the project's folder.
  string path = 3;
  // Its agents are folded away in the sidebar.
  bool collapsed = 4;
}

message Agent {
  string id = 1;
  // Empty for an agent in the workspace, outside any project.
  string project_id = 2;
  string name = 3;
  // The agent's prompt: instructions added to its system prompt.
  string prompt = 4;
  // "<provider>/<model id>", e.g. "anthropic/claude-opus-5-5".
  string model = 5;
  // Reasoning effort: one of the model's `efforts`.
  string effort = 6;
  AgentStatus status = 7;
  // Tokens the agent's context held after its last model call.
  uint64 context_tokens = 8;
  // The context is compacted when it reaches this many tokens.
  uint64 compact_at_tokens = 9;
  // Messages waiting for the current run to finish (quiet ones aside: see
  // quiet_waiting).
  uint32 queued_messages = 10;
  // `model` can run now: its provider is signed in. When false the agent has
  // no model, and the app says so instead of showing `model`.
  bool model_available = 11;
  // The agent's color, which marks its messages and its bar: "blue",
  // "violet", "green", "pink", "teal", "amber", "red" or "slate".
  string color = 12;
  // A run of the agent finished (or failed) since the person last opened it:
  // there's something to look at. Selecting the agent clears it; a run that
  // ends while the agent is selected, or that was stopped, doesn't set it.
  bool unseen = 13;
  // One per extension in `Workspace.extensions`, in that order.
  repeated AgentExtension extensions = 14;
  // The agent it's nested under in the sidebar: its lead (lead_id) when that
  // is in the same project or workspace; empty at the top level, including
  // for an agent led by an admin agent elsewhere. Agents come in sidebar
  // order: within a project (or the workspace), siblings in list order.
  string parent_id = 15;
  // Its children are folded away in the sidebar.
  bool collapsed = 16;
  // The slash commands the person can run for this agent, in the order to
  // offer them.
  repeated SlashCommand commands = 17;
  // What its message box says when empty, e.g. what the agent is for. Empty
  // means the app shows "Message <name>". Display only.
  string placeholder = 18;
  // Deprecated, always empty: see folder_id.
  string folder = 19;
  // The project folder it works in (one of Project.folders); empty when it
  // works in the project's own folder (or the workspace). Its file tools write
  // only there; it reads the whole project.
  string folder_id = 20;
  // The extension whose panel is open beside this agent, as the person left
  // it; empty when none is (or that extension is off for it). The selected
  // agent's panel content arrives as `ExtensionView`, sent again whenever the
  // selection changes.
  string open_panel = 21;
  // Its character, drawn in `color` with the same eyes as every agent: its
  // shape, one of "circle", "square", "triangle", "diamond", "pentagon" or
  // "hexagon" (catalog order; an automatic one is character_seed % 6). The
  // one chosen in its settings, or else one picked from its id, so renaming,
  // moving or reordering it never changes it.
  string avatar_shape = 22;
  // Unused: characters no longer have faces, so it's always empty.
  string avatar_face = 23;
  // A number from its id (32-bit FNV-1a of the id), the same on every device
  // and for good: offsets its animation so agents don't blink together.
  uint32 character_seed = 24;
  // What its character shows now. Factory decides it; the app only draws it.
  CharacterMood character_mood = 25;
  // When `character_mood` became what it is, in ms since 1970; unchanged
  // while the mood stays. A mood that changes while the app shows the agent
  // may play its one-time entry; one already in place when the app connects
  // doesn't.
  int64 character_mood_since_ms = 26;
  // The shape chosen in its settings; absent when it's automatic. It may be
  // one this Factory doesn't know (such as an organic shape of before), in
  // which case `avatar_shape` is automatic.
  optional string avatar_shape_override = 27;
  // Unused: characters no longer have faces, so it's always absent.
  optional string avatar_face_override = 28;
  // What the agent does, such as "Coordinator" or "Copywriter", shown
  // fainter beside or under its name, which is its identity (often a human
  // first name, "Mike"). Other agents see it with the name too
  // ("Mike (Coordinator)"). Empty when it has none.
  string role = 29;
  // How the agent's main area is laid out: its conversation and the viewers
  // open beside it (SetLayout, the show tool). Unset: just its conversation.
  ViewNode layout = 30;
  // The default prompt the agent can go back to, as this version of
  // Claktory ships it, with its placeholders ({{user}}…); empty when it has
  // none (only Rivet has one). While `prompt` equals it, the prompt follows
  // the default: a new version's default replaces it. To go back to the
  // default, set the prompt to this text (UpdateAgent).
  string default_prompt = 31;
  // The seqs of the entries in its conversation that wait for the person's
  // answer, oldest first: its pending SecretRequest, ConnectProposal,
  // Proposal (to Rivet), DevicePairing, SecretApproval and AskPerson
  // entries. Empty when nothing waits. The Workspace is
  // sent again whenever one is made, decided, withdrawn or expires.
  repeated uint64 waiting_seqs = 32;
  // The agent it reports to, its lead, which can read how it's set up (its
  // settings, extensions, secrets by name, monitors; never its tools):
  // another agent in its project, or an admin agent. Empty when it has none.
  // Admin agents lead every agent anyway, without it.
  string lead_id = 33;
  // Its run is held up because none of the accounts that can serve its model
  // can take a request now (all at their usage limit, or out of credit): what
  // it waits for, in one line, e.g. "Waiting for your Claude usage to reset
  // at Fri 18:00". Empty when it isn't held up. Meanwhile `status` stays
  // WORKING (its run is open; messages queue as usual, and Stop ends it), and
  // its character sleeps. It asks again by itself at `usage_wait_until_ms`, or
  // sooner when the person signs in (again) or out, adds an account, uses a
  // usage reset, tries a key again, messages it, changes its model or
  // chooses Try now (TryAgainNow), or the usage read sees room. Unrelated to
  // `waiting_seqs`, which are questions for the person.
  string usage_wait = 34;
  // When the agent asks again by itself, in ms since 1970 (the first account's
  // reset plus a few seconds' margin is when it actually does); 0 when it
  // waits for the person (out of credit) or isn't held up.
  int64 usage_wait_until_ms = 35;
  // What it has read in its current context that may hold a stranger's
  // instructions: it's "tainted" until /clear, and using a secret needs the
  // person's approval each time (SecretApproval). Since #346 only a web page
  // read through browser control counts, as "browser:<origin>"; reading a
  // pipe or a direct message marks no one (pipe ids here came from older
  // backends). Empty when it has read none.
  repeated string tainted_by_pipes = 36;
  // "<provider>/<model id>" a step this agent's model refused is retried on,
  // once per refused turn, the next step back on its own model; empty uses
  // the Claktory-wide default (Settings.default_fallback_model), and with
  // both empty a refusal just ends the step.
  string fallback_model = 37;
  // Quarantined for a pipe (Pipe.quarantined_ids): it can only read and
  // answer the pipe (pipe_read, pipe_send, pipe_status), read its inbox,
  // write in its outbox and ask the person. It has no commands, no other
  // files, no secrets, web or messaging, and no other extension's tools.
  // Only the person lifts it (UpdatePipe.quarantined).
  bool quarantined = 38;
  // The pipe this agent is bound to (Pipe.id): the liaison made for it,
  // shown in the pipe's row and view rather than with a row of its own, its
  // conversation streamed with the pipe's when the pipe is shown
  // (SelectPipe). Deleting the pipe deletes it, its conversation kept in the
  // pipe's folder (pipes/<pipe>/conversation in the project's). Empty for
  // every other agent, and once it's no longer one of the pipe's members.
  string pipe_id = 39;
  // The pane of `layout` shown in focus, filling the whole window, by its
  // ViewNode id; empty for none. The person sets it (SetLayout.focus); an
  // agent's show keeps it as it is, its new pane waiting behind.
  string layout_focus = 40;
  // Whether it notifies the person ("Notify me" in its settings).
  NotifyMode notify = 41;
  // Quiet copies it was sent that it hasn't read yet (see QuietCopy).
  uint32 unread_copies = 43;
  // Quiet messages waiting for its next wake (agents_send's `quiet`): they
  // don't wake it, and nothing else does on their account. They're in
  // QueuedMessages too, with `quiet`; queued_messages doesn't count them.
  uint32 quiet_waiting = 44;
  // It reads reports (a curator, pipes-automation.md §3): it keeps its own
  // database, Ask and its folder, and has no commands, web, secrets or
  // messaging. Only the person lifts it (SetReportReader). The pipes that
  // feed it are those whose forward names it (Pipe.forward.recipient_id).
  bool reads_reports = 45;
  // A liaison's model spending today (set only for an agent quarantined by
  // a pipe).
  ContainedSpend spend = 46;
  // ask_person questions Claktory refused today because this contained
  // agent (a liaison or a report reader) already asked 3 in the past hour:
  // the quiet count, with no card for each.
  uint32 held_asks = 47;
  // Its checklist's items blocked on the person (BLOCKED_KIND_PERSON_DECISION
  // or _ACTION, #279) that a question waiting for the person names
  // (ask_person's item), oldest first: one for each such question, with
  // where its card is (card_agent_id, card_seq). Needs you shows each item
  // only as that card, with the item for context. An item blocked on the
  // person with no question naming it (never asked, dismissed, or to be
  // asked again later) isn't here: it's the agent's to settle, and shows
  // only on its checklist (ChecklistItem). Before this, every such item
  // was here, and has_pending_ask told which had a card.
  repeated WaitingItem waiting_items = 42;
  // Set while it waits on a usage limit or on credit (`usage_wait`, never a
  // wait to sign in or for the secrets to unlock) and another signed-in
  // provider with room can run its model, or the closest one: what
  // ContinueOnAlternative would switch it to.
  UsageWaitAlternative usage_wait_alternative = 48;
  // It waits on a usage limit or on credit and no provider but its own is
  // signed in: signing in to another (such as OpenRouter) would let it carry
  // on now. False when another is signed in but can't run it.
  bool usage_wait_no_other_provider = 49;
  // It runs on another provider because of a ContinueOnAlternative: where
  // it came from, and whether that has room again (SwitchBack). Cleared
  // when it goes back, or when the person changes its model themselves.
  UsageSwitch usage_switch = 50;
  // How many other versions of its conversation it has (ListBranches):
  // the person took it back to an earlier message, or switched versions.
  // When it changes, or a fresh Transcript comes, a list on screen asks
  // again.
  uint32 branches = 51;
  // Contained for errands (#435): like a pipe's quarantined members, it
  // can't run commands, use the web or secrets, and messages only its
  // lead, with what it says fenced as untrusted; only a contained agent
  // can have the errands extension (Claktory's browser). Only the person
  // sets or lifts it (SetAgentContained), never its settings or an agent.
  bool contained = 52;
  // For its header (settings.md area 4 §8.9): its checklist's items not
  // done or dropped (open, in progress, blocked or parked); 0 when the
  // Checklist extension is off for it.
  uint32 checklist_open = 53;
  // Its background tasks running now; 0 when the Tasks extension is off
  // for it. Both change in Workspace as items and tasks do.
  uint32 tasks_running = 54;
}

// What an agent (or a chat) waiting on its provider's usage could continue
// on instead (Agent.usage_wait_alternative).
message UsageWaitAlternative {
  // The provider, for "Continue on OpenRouter".
  string provider_name = 1;
  // "<provider>/<model id>" it would run on, such as
  // "openrouter/anthropic/claude-opus-4.8".
  string model = 2;
  // The model's name, without OpenRouter's maker prefix: "Claude Opus 4.8".
  string model_name = 3;
  // The same model it runs on now (matched across providers by name, the
  // date left out); false when it's the closest one: the same family at the
  // newest version not above it, or else the nearest above.
  bool same_model = 4;
  // The effort it would run at: its own when the model has it, otherwise
  // the highest the model has below it, otherwise its lowest.
  string effort = 5;
  // `effort` isn't the one it runs at now.
  bool effort_changed = 6;
  // How many other agents and chats wait on the same provider and could
  // continue elsewhere too (ContinueOnAlternative.all_waiting).
  uint32 others_waiting = 7;
}

// Where an agent (or a chat) that continued on another provider came from
// (Agent.usage_switch). Kept across restarts.
message UsageSwitch {
  // The provider as its wait named it, for "Back to Claude".
  string provider_name = 1;
  // "<provider>/<model id>" and the model's name it ran on before.
  string model = 2;
  string model_name = 3;
  // That provider has an account with room again: SwitchBack can go.
  bool ready = 4;
  // How many other agents and chats switched from it are ready too
  // (SwitchBack.all).
  uint32 others_ready = 5;
  // It goes back by itself once that provider has room (friend bug #8 A1):
  // at its next step after an account has room and its last usage read has
  // no window at 100%. False when it went back by itself and reached the
  // limit again within 10 minutes: then it stays until that limit resets,
  // and only SwitchBack moves it sooner.
  bool goes_back = 6;
  // When that provider should have room again, in ms since 1970: the
  // earliest account's limit reset, or the reset of its last full window;
  // 0 when unknown or it has room now.
  int64 goes_back_at_ms = 7;
}

// Continue on another provider: an agent (or a chat, by its id) waiting on
// its provider's usage switches to its UsageWaitAlternative (model and
// effort), and carries on there from its next model call, its conversation
// kept, as with any model change. `all_waiting`: every agent and chat
// waiting on that provider switches too, each to its own alternative.
// INVALID_REQUEST, with a sentence to show, when it isn't waiting or there
// is no alternative any more; NOT_FOUND for an unknown agent or chat.
message ContinueOnAlternative {
  string agent_id = 1;
  bool all_waiting = 2;
  // With `all_waiting`: how many others the person saw waiting
  // (UsageWaitAlternative.others_waiting). When as many don't wait now,
  // nothing switches: INVALID_REQUEST, saying how many wait now. 0 checks
  // nothing (an app from before it).
  uint32 expected_others = 3;
}

// Back to the model and effort an agent (or a chat) had before it continued
// on another provider (Agent.usage_switch). `all`: every agent and chat
// switched from that provider and ready goes back too. INVALID_REQUEST
// when it wasn't switched; NOT_FOUND for an unknown agent or chat.
message SwitchBack {
  string agent_id = 1;
  bool all = 2;
  // With `all`: how many others the person saw ready to go back
  // (UsageSwitch.others_ready); as ContinueOnAlternative.expected_others.
  uint32 expected_others = 3;
}

// Workspace.usage_auto_continue, kept in factory.db.
message SetUsageAutoContinue {
  bool on = 1;
}

// A checklist item that waits on the person (Agent.waiting_items).
message WaitingItem {
  // ChecklistItem.id on this agent's checklist.
  uint32 item = 1;
  string text = 2;
  BlockedKind kind = 3;
  // When it became blocked, ms since 1970.
  int64 since_ms = 4;
  // When Claktory has it asked again after the person dismissed its
  // question; 0 while nothing was dismissed.
  int64 reask_at_ms = 5;
  // A question about it is waiting for the person (its card shows
  // instead). Always true now: only such items are listed.
  bool has_pending_ask = 6;
  // The agent on it (ChecklistItem.owner); empty for this agent itself.
  string owner = 7;
  // When the person last dismissed a question about it, ms; 0 if never.
  int64 dismissed_ms = 8;
  // Where the question about it is: the agent whose conversation has its
  // card (the item's owner, which asks about it), empty for the agent this
  // item is listed on; and the card's entry seq there, one of that agent's
  // waiting_seqs. 0 when that conversation isn't loaded: show no item on
  // any card then.
  string card_agent_id = 9;
  uint64 card_seq = 10;
}

// What an agent's character shows. The first that applies wins: working or
// thinking (it's running), no model, failed, news, asleep, idle.
enum CharacterMood {
  CHARACTER_MOOD_UNSPECIFIED = 0;
  // Nothing going on; none of the below.
  CHARACTER_MOOD_IDLE = 1;
  // A run is active and no tool is running: a model reply, compaction,
  // retries, setup.
  CHARACTER_MOOD_THINKING = 2;
  // A run is active and a tool (not a background task) is running.
  CHARACTER_MOOD_WORKING = 3;
  // Not running, and something new since the person last opened it
  // (Agent.unseen).
  CHARACTER_MOOD_NEWS = 4;
  // Not running, and its last run failed (an error it didn't recover from;
  // not a stop). Shows even while selected or unseen, until it next runs or
  // is cleared.
  CHARACTER_MOOD_FAILED = 5;
  // Not running, and its model can't run (Agent.model_available is false).
  CHARACTER_MOOD_NO_MODEL = 6;
  // Idle for 15 minutes or more, or running but waiting out its accounts'
  // usage limits (Agent.usage_wait). Only a look: it wakes at once for
  // anything.
  CHARACTER_MOOD_ASLEEP = 7;
}

message SlashCommand {
  // "clear", without the slash.
  string name = 1;
  // One line, e.g. "Start a new conversation".
  string description = 2;
  // What it takes after its name, e.g. "<instructions>"; empty if nothing.
  string args_hint = 3;
}

enum AgentStatus {
  AGENT_STATUS_UNSPECIFIED = 0;
  AGENT_STATUS_IDLE = 1;
  AGENT_STATUS_WORKING = 2;
}

message Model {
  // "<provider>/<model id>".
  string id = 1;
  string name = 2;
  uint64 context_window = 3;
  // Reasoning efforts the model accepts, weakest first.
  repeated string efforts = 4;
  // The model takes image input: an agent on it can look at image files
  // (read_image). From the provider catalog's input list, the same source
  // as the tool's gate.
  bool image_input = 5;
  // Added by its id (AddModel, or an agent's model set to it), as the
  // provider's list doesn't have it (friend bug #14).
  bool added = 6;
  // An agent on it can make images (#403: image_generate): on its sign-in
  // now, as Claktory reads it. Phase 1: a GPT model with image input,
  // signed in with ChatGPT on a plan that isn't Free. Read again whenever
  // the models or the plan are.
  bool image_output = 7;
}

// The selected agent's whole transcript, oldest entry first.
message Transcript {
  string agent_id = 1;
  // The latest entries only: at most 200, and at most about 256 KB encoded
  // (at least one, however big), starting at a model response's first entry.
  // Older ones come with LoadEntries.
  repeated Entry entries = 2;
  // There are entries before the first of `entries`.
  bool has_earlier = 3;
  // Resumed (#413; only after a Hello with transcript_revision): `entries`
  // are only those added or changed since the revision the app held, oldest
  // first, possibly none. Put each in place of the one with its seq, or add
  // it; keep the others, and `has_earlier` as it was. Otherwise the app
  // replaces what it held with `entries`.
  bool resumed = 4;
}

// Try now: an agent (or a chat, by its id) waiting out its accounts' usage
// limits (Agent.usage_wait) asks its provider again now, and so does every
// other agent waiting on that provider. Claktory forgets that the
// provider's accounts are spent and reads their usage again. If the
// provider still refuses, the wait comes back with its fresh reset time,
// for the cost of one refused request. INVALID_REQUEST when it isn't
// waiting, NOT_FOUND for an unknown agent or chat.
message TryAgainNow {
  string agent_id = 1;
}

// Earlier entries of an agent's transcript, answered with EntryPage to the
// asker only. NOT_FOUND for an unknown agent, INVALID_REQUEST when
// `before_seq` is beyond the end.
message LoadEntries {
  string agent_id = 1;
  // Entries before this seq (exclusive): the seq of the first entry the app
  // holds.
  uint64 before_seq = 2;
  // Without `from_seq`: the latest entries before `before_seq`, cut as
  // Transcript's are, at most `limit` (0 for 200; 1000 at most).
  uint32 limit = 3;
  // Every entry from this seq up to `before_seq`, uncut: to jump to an older
  // entry and keep what the app holds one run with no gaps.
  optional uint64 from_seq = 4;
}

// The answer to LoadEntries: entries oldest first.
message EntryPage {
  string agent_id = 1;
  repeated Entry entries = 2;
  // There are entries before the first of `entries`.
  bool has_earlier = 3;
}

// Finds text in a conversation: an agent's or a chat's, since its last
// /clear and not only what the app holds, or a pipe's timeline. Answered
// with ConversationMatches, to the asker only; NOT_FOUND for an unknown
// agent, chat or pipe, INVALID_REQUEST unless exactly one of them is set.
//
// Searched: the person's messages, the agent's replies, events (an agent's
// message's text; another event's summary, or its text without one) and the
// string values of tool calls' input (the command, path, query…), never
// their keys or name, then their output (the snippet is from the first of
// these the query occurs in). Not thinking, compaction summaries, notices or
// cards. In a pipe: each message's text and note.
message SearchConversation {
  string agent_id = 1;
  string chat_id = 2;
  // As typed: a plain substring, not a pattern, matched case-insensitively
  // with Unicode case folding. Empty or blank finds nothing; 500 characters
  // at most.
  string query = 3;
  // Matches in entries before this seq (exclusive), to page back; unset for
  // the newest.
  optional uint64 before_seq = 4;
  // Matching entries per page: 0 for 100, 500 at most.
  uint32 limit = 5;
  // A pipe: its own messages (PipeMessage seqs), not its liaison's
  // conversation.
  string pipe_id = 6;
}

message ConversationMatches {
  string query = 1;
  // Newest first, at most the request's limit.
  repeated ConversationMatch matches = 2;
  // Older matches remain: ask again with before_seq set to the last
  // match's seq.
  bool more = 3;
  // Occurrences of the query in the whole conversation, on the first page
  // only (before_seq unset), else 0; at most 1000, with total_capped set
  // when there are more.
  uint32 total = 4;
  bool total_capped = 5;
  // The request's, so an answer to an earlier search can be told apart.
  string agent_id = 6;
  string chat_id = 7;
  string pipe_id = 8;
  optional uint64 before_seq = 9;
}

// An entry (or a pipe message) the query occurs in.
message ConversationMatch {
  uint64 seq = 1;
  // About 80 characters of its text on one line, around its first
  // occurrence (about 25 characters in): runs of whitespace are one space,
  // and "…" marks where it's cut.
  string snippet = 2;
  // Each occurrence inside `snippet`: where it starts and how long it is, in
  // UTF-16 code units.
  repeated uint32 starts = 3;
  repeated uint32 lengths = 4;
  // Occurrences in the whole entry.
  uint32 hits = 5;
  // The entry's (or the pipe message's) time, ms since 1970: to merge a
  // pipe's matches with its liaison's.
  int64 timestamp_ms = 6;
}

// What waits for the selected agent, not yet taken by it. Sent on connect,
// when an agent is selected, and whenever its queue changes; empty when
// nothing waits. A message the agent takes leaves the list and arrives in
// the transcript as usual.
message QueuedMessages {
  string agent_id = 1;
  // Oldest first.
  repeated QueuedMessage messages = 2;
}

message QueuedMessage {
  // Its id in factory.db's messages.
  int64 id = 1;
  // "person", "agent", "task" or "factory".
  string source = 2;
  // Who it's from, for events: the agent's name (with its project when it's
  // in another one), a task's id, "Factory". Empty for the person.
  string sender = 3;
  // The sending agent's id, or the task's. Empty for the person.
  string sender_id = 4;
  // The whole text, as the agent will read it.
  string text = 5;
  // ms since 1970.
  int64 created = 6;
  // One line for people, for events that have one (a task that finished,
  // Factory restarted); empty otherwise, then show `text`.
  string summary = 7;
  // The person's: the device it was sent from (see UserText.sent_from).
  SentFrom sent_from = 8;
  // The person's: SendMessage.client_id, as sent; empty without one.
  string client_id = 9;
  // The person's: the files it carries (see Attachment).
  repeated Attachment attachments = 10;
  // A voice message (SendMessage.voice), while it's transcribed or after it
  // failed; unset for any other. `text` is empty until it's DONE (or the
  // typed text sent with it, `typed`), and attachments[0] is the recording.
  Transcription transcription = 11;
  // An agent's message sent quietly: it waits for the agent's next wake
  // and doesn't cause one (see Agent.quiet_waiting).
  bool quiet = 12;
  // The person's reply on a checklist item (see UserText.checklist_item).
  ChecklistItemRef checklist_item = 13;
  // A voice message sent with typed text (#425): what was typed. `text` is
  // the same while it's PENDING or FAILED, then the whole message as in
  // UserText.typed once it's DONE. Empty for any other message.
  string typed = 14;
}

// Adds an entry or replaces the one with the same `seq`.
message EntryUpdate {
  string agent_id = 1;
  Entry entry = 2;
}

// Appends streamed text to an entry: `text` for assistant text and thinking.
message EntryDelta {
  string agent_id = 1;
  uint64 seq = 2;
  string text = 3;
}

message Entry {
  // Position in the transcript; unique per agent and never reused.
  uint64 seq = 1;
  int64 timestamp_ms = 2;
  oneof kind {
    UserText user = 3;
    AssistantText assistant = 4;
    Thinking thinking = 5;
    ToolCall tool_call = 6;
    Compaction compaction = 7;
    Notice notice = 8;
    Event event = 9;
    Proposal proposal = 11;
    // An agent asks for a secret (its secrets_request tool): see SecretRequest.
    SecretRequest secret_request = 12;
    // An agent proposes connecting a service (its
    // secrets_propose_connection tool): see ConnectProposal.
    ConnectProposal connect_proposal = 13;
    // An agent adds a device for the person (its devices_add tool): see
    // DevicePairing.
    DevicePairing device_pairing = 14;
    // An agent wants to use a secret that needs the person's approval (see
    // SecretApproval).
    SecretApproval secret_approval = 15;
    // An agent blocked on something only the person can give asks them
    // (its ask_person tool): see AskPerson.
    AskPerson ask_person = 16;
    // An agent opens a card for the person to start a pipe (its
    // pipes_invite or pipes_accept tool): see PipeStart.
    PipeStart pipe_start = 18;
    // Rivet proposes giving an agent access to an app at the person's
    // account, such as their direct messages (its apps_propose_grant
    // tool): see AppGrantProposal.
    AppGrantProposal app_grant = 19;
    // Rivet proposes what one of Claktory's apps (Charts, say) may read and
    // which agents may use it (its apps_propose_access tool): see
    // AppAccessProposal.
    AppAccessProposal app_access = 20;
  }
  // The model response it came from: the same for every entry one response
  // produced (its thinking, text and tool calls), the seq of the first of
  // them. 0 for entries that don't come from a response (the person's
  // messages, events, notices, compaction dividers).
  uint64 reply = 10;
  // The person's message this answers: the seq of the latest UserText the
  // agent took before this text, set on the first assistant text that
  // follows it (while it streams too) and absent everywhere else. Check
  // presence, not 0: seq 0 is a real entry. It can point before a
  // compaction divider or an unloaded page. Replies to events and monitors
  // carry nothing.
  optional uint64 replied_to = 17;
  // A card (anything in Agent.waiting_seqs, or a chat's) the person
  // answered, approved, dismissed, declined or replied to from a device:
  // which one (#514), to say "Answered on Matt's iPhone" on another.
  // Unset while it waits, for one decided before this version, and for one
  // closed without the person (withdrawn, expired, resolved by its agent).
  AnsweredOn answered_on = 21;
}

// Something other than the person prompting the agent: Factory itself,
// another agent, a background task that finished, or a monitor. The model
// reads it as a message tagged with where it's from; the app shows it as an
// event, never as the person's.
message Event {
  EventSource source = 1;
  // Who it's from: "Factory", the task's id, the monitor's name, or, for
  // AGENT, the sender's signature as the model reads it: its name with its
  // role and, across projects, its project in parentheses ("Sam (Backend)",
  // "Ana (Frontend, Web Site)", "Rivet (admin)"), just the name with
  // neither. It's kept as it was when sent.
  string from = 2;
  // The sending agent's id, for AGENT; the task's id, for TASK; the
  // monitor's id ("m3"), for MONITOR.
  string from_id = 3;
  // One line for people; empty when `text` is meant to be shown as it is.
  string summary = 4;
  string text = 5;
  // PIPE: the pipe's messages it brings (PipeMessage.seq), so a view showing
  // the pipe's messages can leave this event out. Empty for other sources.
  repeated uint64 pipe_seqs = 6;
  // AGENT: the message's number in Claktory's records, the one the agent
  // reads (msg="…") and answers with; 0 for messages from before it (#285).
  uint64 message_id = 7;
  // AGENT: the messages to the sender it answers, by their numbers, as the
  // sender said and Claktory checked (each was sent to it).
  repeated uint64 reply_to_ids = 8;
  // AGENT: why it was sent, as the sender said: "handoff",
  // "decision_request", "decision" or "status"; empty when it didn't say.
  string intent = 9;
  // AGENT: sent quietly (agents_send's `quiet`): it didn't wake the agent,
  // and waited for its next wake, or its next step if it was working.
  bool quiet = 10;
}

// Asks for the quiet copies `agent_id` was sent, newest first: `limit` of
// them (20 when 0, 100 at most), older than the copy `before_id` when set.
// Listing them doesn't mark them read; only the agent reading them does.
message ListQuietCopies {
  string agent_id = 1;
  uint64 before_id = 2;
  uint32 limit = 3;
}

message QuietCopies {
  string agent_id = 1;
  repeated QuietCopy copies = 2;
  // Older ones remain.
  bool more = 3;
}

// A quiet copy (#285): an agent sent a message and asked Claktory to keep a
// copy for its lead (agents_send's copy_lead). The lead isn't woken by it:
// it hears how many came at its next step, and reads them with
// agents_copies. Never in the lead's conversation itself.
message QuietCopy {
  uint64 id = 1;
  // The sender's signature, as the lead would read it ("Mista (Backend)").
  string from = 2;
  string from_id = 3;
  string text = 4;
  int64 created_ms = 5;
  // The lead has read it (agents_copies).
  bool read = 6;
  // What the message answers, by the numbers of messages to the sender.
  repeated uint64 reply_to_ids = 7;
  // To whom the message itself went, by agent id.
  repeated string to_ids = 8;
  string intent = 9;
}

// A message the agent proposed for Rivet, the admin agent, which only the
// person can message: shown in the proposing agent's conversation, after the
// propose_to_rivet call, for the person to approve (with a comment) or
// dismiss with DecideProposal. The entry is sent again when it's decided.
message Proposal {
  // Unique in this Factory; what DecideProposal names.
  string id = 1;
  // What the agent proposes, written to stand alone for Rivet.
  string text = 2;
  ProposalState state = 3;
  // The person's comment on approving, or their answer (replied); empty
  // otherwise.
  string comment = 4;
  // When it was approved or dismissed, in ms since 1970; 0 while pending.
  int64 decided_at_ms = 5;
  // What the agent had read when it proposed (Agent.tainted_by_pipes): what
  // it proposes may come from someone else. Since #346 only a web page
  // (PipeTaint.kind "browser"); pipes on older proposals. Empty when it had
  // read none.
  repeated PipeTaint taint = 6;
  // Answered with a comment (DecideProposal.reply) rather than approved:
  // state is APPROVED (Rivet acts on it) and `comment` is the answer.
  // Shown as answered rather than approved.
  bool replied = 7;
  // The agent took it back (proposal_withdraw, #407) before the person
  // decided: it no longer applied. state is DISMISSED, decided_at_ms when it
  // was withdrawn, and `comment` empty. Shown as withdrawn by the agent,
  // with its reason, never as the person's dismissal; DecideProposal on it
  // is refused.
  bool withdrawn = 8;
  // withdrawn: why, in the agent's words (at most 300 characters); show it
  // as the agent's, never as Claktory's.
  string withdraw_reason = 9;
  // Which version of the proposal this is (#428): 1 as proposed, one more
  // each time its agent changes the text while it waits (proposal_update;
  // at most 10 times). As AskPerson.revision: redrawn in place, not counted
  // again, not notified again; DecideProposal.revision names the version
  // decided. 0 from a backend before #428: treat it as 1.
  uint32 revision = 10;
  // When its agent last changed it, in ms since 1970; 0 if it never did.
  int64 updated_ms = 11;
  // Why it changed it last, in the agent's words (at most 300 characters);
  // empty if it gave no reason.
  string update_reason = 12;
  // What it asks Rivet to give (propose_to_rivet's grants), resolved by
  // Claktory when it was proposed, in Claktory's words: show them under the
  // agent's text, apart from it, as what approving it also lets Rivet do,
  // each once, within a day, without a card of its own. Empty for most
  // proposals.
  repeated ProposalGrant grants = 13;
}

// Something an agent's proposal asks Rivet to give (propose_to_rivet's
// grants), resolved by Claktory when it was proposed. Approving the
// proposal lets Rivet make it once, within 24 hours, without a card of its
// own; anything broader, later or by a Rivet that has read from outside
// gets its card as before.
message ProposalGrant {
  // Claktory's sentence for it, as its own card would say it ("Charts
  // reads account-aggregates.csv in Ops", "Carne gets Charts: Edit
  // dashboards"). Claktory's words, never the agent's.
  string summary = 1;
  // Claktory's warnings, as that card would show them ("Charts can reach
  // api.example.com on the internet…"); empty for none.
  repeated string warnings = 2;
  // When Rivet made it on this approval, in ms since 1970; 0 while unused.
  int64 used_ms = 3;
}

// A device an agent adds for the person (an admin agent's devices_add tool,
// the Devices extension's), shown in the agent's conversation after the
// call: Add a device from Settings → Devices, started by the agent. The
// pairing code never enters the conversation: while the pairing is WAITING
// the app gets it with ShowPairingCode and shows it as a QR code, with Copy
// code and a Cancel (CancelPairing with device_id). A device that uses the
// code waits for the person to allow it like any other
// (RemoteAccess.pending_devices: "Allow … to connect?"). The entry is sent
// again whenever its state changes, and counts in Agent.waiting_seqs while
// WAITING or ASKING.
// A card an agent (Rivet) opens in its conversation for the person to start
// a pipe (#244), filled in from what the person told it; the agent never
// sees a code. INVITE: the person checks the project, name and purpose and
// makes the invite (CreatePipeInvite with start_id); its code comes back
// in that reply only, to copy or share. ACCEPT: the person pastes the code
// or link they were given (ReadPipeInvite shows whom it's from, not
// verified: keep that apart from the prefilled name, which is only the
// person's label), checks the project, name and purpose, and connects
// (AcceptPipeInvite with start_id). Either way both people then approve the
// pipe in its view, digits and all. Close it with DismissPipeStart. The
// entry is sent again when its state changes, and counts in
// Agent.waiting_seqs while WAITING; one left 24 hours is DISMISSED.
message PipeStart {
  // Unique in this Claktory: what start_id and DismissPipeStart name.
  string id = 1;
  // The agent that opened it.
  string agent_id = 2;
  PipeStartKind kind = 3;
  // Prefilled; the person can change each before going on.
  string project_id = 4;
  // ACCEPT: empty takes the inviter's name for the pipe.
  string name = 5;
  string purpose = 6;
  PipeStartState state = 7;
  // DONE: the pipe it made, to open from the card.
  string pipe_id = 8;
  // When it was done or dismissed, in ms since 1970; 0 while WAITING.
  int64 ended_ms = 9;
}

enum PipeStartKind {
  PIPE_START_KIND_UNSPECIFIED = 0;
  // Make an invite for someone else to accept.
  PIPE_START_KIND_INVITE = 1;
  // Accept an invite the person was given.
  PIPE_START_KIND_ACCEPT = 2;
}

enum PipeStartState {
  PIPE_START_STATE_UNSPECIFIED = 0;
  PIPE_START_STATE_WAITING = 1;
  // The person made the invite or connected with the code: pipe_id.
  PIPE_START_STATE_DONE = 2;
  // The person closed it, or it waited 24 hours.
  PIPE_START_STATE_DISMISSED = 3;
}

message DismissPipeStart {
  string agent_id = 1;
  string start_id = 2;
  // The person's comment, told to the card's agent as
  // theirs ("Matt's note: …"); may be empty. 2,000 characters at most.
  string comment = 3;
}

// Rivet's proposal to give an agent access to an app kept at the person's
// account (claktory.com), such as their direct messages: shown in Rivet's
// conversation after the call (app_grants_propose), and while PENDING its
// seq is in Rivet's Agent.waiting_seqs, so it shows in Needs you. Nothing
// is given until the person approves it (DecideAppGrant); then the account
// service makes the grant, and the entry is sent again with its state.
// Only Rivet proposes, never one that has read a web page, and only for an
// agent of this Claktory, which is named by id and by the incarnation it
// had when proposed: deleted and made again, it's another agent, and the
// proposal fails.
message AppGrantProposal {
  // Unique in this Claktory.
  string id = 1;
  // The app, as the account service names it: "dms".
  string app_id = 2;
  // What the card calls it: "Direct messages".
  string app_name = 3;
  // The agent it would let use the app.
  string agent_id = 4;
  // What it would let the agent do, in Claktory's words.
  repeated AppGrantScope scopes = 5;
  // What in the app it would reach, such as conversations; empty for an
  // app whose grants name nothing.
  repeated AppGrantResource resources = 6;
  // When the access would end, in ms since 1970; 0 for when the person
  // takes it back.
  int64 expires_ms = 7;
  // Why, in Rivet's words.
  string reason = 8;
  AppGrantState state = 9;
  int64 created_ms = 10;
  // When it was decided; 0 while PENDING.
  int64 decided_ms = 11;
  // The person's comment on deciding it, either way; may be empty.
  string comment = 12;
  // FAILED: why, in plain words (the agent was deleted since, the account
  // service refused it).
  string error = 13;
  // GRANTED: the account service's id for the grant, which revoking it
  // names.
  string grant_id = 14;
  // The agent it would give access has read something that may hold
  // someone else's instructions (Agent.tainted_by_pipes: since #346 a web
  // page; a pipe on older cards). Set when proposed and again when decided.
  // The card says so, loudest for dm.send.
  bool grantee_read_pipes = 15;
  // DECLINED by a reply (DecideAppGrant.reply): nothing was given, and
  // `comment` is what the person said instead. Shown as replied.
  bool replied = 16;
}

// Something a grant lets an agent do in an app.
message AppGrantScope {
  // As the account service names it: "dm.read".
  string id = 1;
  // What it means, for the card: "Read these conversations".
  string label = 2;
}

// Something in an app a grant reaches.
message AppGrantResource {
  // "conversation".
  string kind = 1;
  // The app's id for it.
  string id = 2;
  // What the card shows for it: its id while Claktory has no better name.
  string label = 3;
}

enum AppGrantState {
  APP_GRANT_STATE_UNSPECIFIED = 0;
  APP_GRANT_STATE_PENDING = 1;
  // The person approved it and the account service made the grant.
  APP_GRANT_STATE_GRANTED = 2;
  // The person declined it, or cleared Rivet's conversation while it
  // waited.
  APP_GRANT_STATE_DECLINED = 3;
  // Approved, but it couldn't be made: AppGrantProposal.error says why.
  APP_GRANT_STATE_FAILED = 4;
}

// The person's decision on an AppGrantProposal in Rivet's conversation.
// Answered with Ack once it's decided. Approved, the account service makes
// the grant first: while it can't be reached the request is refused and the
// card keeps waiting, to approve again later.
message DecideAppGrant {
  // Whose conversation shows it: Rivet's.
  string agent_id = 1;
  // The entry's seq.
  uint64 seq = 2;
  bool approve = 3;
  // The person's comment, told to Rivet as theirs ("Matt's note: …"),
  // with either answer; may be empty. 2,000 characters at most.
  string comment = 4;
  // Submit (#370): `comment` is the person's reply, needed; `approve` is
  // ignored. Nothing is given: the card
  // closes DECLINED with AppGrantProposal.replied, and Rivet gets the
  // comment to propose again with it in mind.
  bool reply = 5;
}

// Rivet's proposal of what an installed app may read and which agents may
// use it, for what the person wants (charted, say): shown in Rivet's
// conversation after the call (apps_set_access, when what it gives needs
// the person's approval; apps_propose_access before), and while PENDING its
// seq is in Rivet's Agent.waiting_seqs, so it shows in Needs you. Nothing
// is given until the person approves it (DecideAppAccess), and then
// exactly what it shows: the sources are added to what the app reads, and
// each agent gets its scopes, in place of those it had. Only Rivet
// proposes; one that has read a web page always makes a card.
message AppAccessProposal {
  // Unique in this Claktory.
  string id = 1;
  string app_id = 2;
  string app_name = 3;
  // The data it would let the app read, each as the app asks for it
  // (label, holds, private; granted false).
  repeated AppDataSource sources = 4;
  // The agents it would let use the app, each with its scopes
  // (AppInfo.scopes' ids).
  repeated AppGrant agents = 5;
  // Why, in Rivet's words: what the person wants to see.
  string reason = 6;
  AppGrantState state = 7;
  int64 created_ms = 8;
  // When it was decided; 0 while PENDING.
  int64 decided_ms = 9;
  // The person's comment on deciding it, either way; may be empty.
  string comment = 10;
  // FAILED: why, in plain words (the app was uninstalled or changed, an
  // agent was deleted).
  string error = 11;
  // The agents on it that have read something that may hold someone else's
  // instructions (Agent.tainted_by_pipes: since #346 a web page; a pipe on
  // older cards): the card warns.
  repeated string agents_read_pipes = 12;
  // What the person approves: DecideAppAccess sends it back, and an
  // approval of anything else is refused.
  string digest = 13;
  // The app as proposed, so the card reads the same once it's gone: its
  // publisher, tier and the hosts it may reach (none: no internet).
  string publisher = 14;
  AppTier tier = 15;
  repeated string hosts = 16;
  // Deprecated (#346): reading what an app reads marks no one, so this is
  // always empty from new backends. Older cards may still have it: the
  // agents that would read, through the app, messages another Claktory
  // wrote.
  repeated string agents_reading_pipes = 17;
  // The app's events each agent on it would hear (apps_set_access's
  // hears), in place of those it heard: one per event kind, with the
  // agents on the card that would hear it. Unlisted agents keep theirs.
  repeated AppSubscription subscriptions = 18;
  // Why this needed the person's approval rather than Rivet applying it,
  // each one of Claktory's sentences (never Rivet's words): "Charts can
  // reach example.com on the internet, so giving it data or agents needs
  // your approval." Show each one. When Rivet itself has read another
  // Claktory's words, that sentence ("Rivet has read messages from another
  // Claktory, which may hold someone else's instructions, …") is always the
  // first, so the app can set it apart; the rest follow in Claktory's order
  // (private data, the internet, then each agent). Empty on cards from
  // before (apps_propose_access).
  repeated string card_rules = 19;
  // DECLINED by a reply (DecideAppAccess.reply): nothing was given, and
  // `comment` is what the person said instead. Shown as replied.
  bool replied = 20;
}

// The person's decision on an AppAccessProposal in Rivet's conversation.
// Answered with Ack once it's decided; the entry comes back decided. An
// approval whose digest isn't the proposal's is refused and the card shown
// again.
message DecideAppAccess {
  // Whose conversation shows it: Rivet's.
  string agent_id = 1;
  // The entry's seq.
  uint64 seq = 2;
  bool approve = 3;
  // The person's comment, told to Rivet as theirs, with either answer; may
  // be empty. 2,000 characters at most.
  string comment = 4;
  // With `approve`: AppAccessProposal.digest, as the card showed it.
  string digest = 5;
  // Submit (#370): `comment` is the person's reply, needed; `approve` is
  // ignored. Nothing is given: the card
  // closes DECLINED with AppAccessProposal.replied, and Rivet gets the
  // comment to propose again with it in mind.
  bool reply = 6;
}

message DevicePairing {
  // Unique in this Claktory; what ShowPairingCode names.
  string id = 1;
  // The agent that started it.
  string agent_id = 2;
  // The device's id in RemoteAccess.devices (or pending_devices): what
  // CancelPairing names. A device added later may reuse it once this one
  // has ended.
  string device_id = 3;
  // What the device is called, e.g. "Laptop".
  string name = 4;
  DevicePairingState state = 5;
  // When its code stops working unless a device was allowed with it by
  // then, in ms since 1970.
  int64 expires_ms = 6;
  // When the device was added or the pairing ended, in ms since 1970; 0
  // while WAITING or ASKING.
  int64 ended_ms = 7;
  // What the device is, as the agent said when it started the pairing
  // (devices_add's kind): the card leads with scanning for a phone or
  // tablet and pasting for a computer. UNSPECIFIED when it didn't say:
  // the card offers both ways.
  DeviceKind kind = 8;
}

enum DevicePairingState {
  DEVICE_PAIRING_STATE_UNSPECIFIED = 0;
  // Its code waits to be scanned or pasted on the device.
  DEVICE_PAIRING_STATE_WAITING = 1;
  // A device used the code and waits for the person to allow it: it's in
  // RemoteAccess.pending_devices, by device_id.
  DEVICE_PAIRING_STATE_ASKING = 2;
  // The person allowed it: it's paired.
  DEVICE_PAIRING_STATE_ADDED = 3;
  // The person didn't allow the device that used the code.
  DEVICE_PAIRING_STATE_DENIED = 4;
  // Cancelled (from the card, Settings → Devices, or the agent) before a
  // device was allowed with it.
  DEVICE_PAIRING_STATE_CANCELLED = 5;
  // Its code ran out before a device was allowed with it.
  DEVICE_PAIRING_STATE_EXPIRED = 6;
}

enum ProposalState {
  PROPOSAL_STATE_UNSPECIFIED = 0;
  PROPOSAL_STATE_PENDING = 1;
  PROPOSAL_STATE_APPROVED = 2;
  PROPOSAL_STATE_DISMISSED = 3;
}

enum EventSource {
  EVENT_SOURCE_UNSPECIFIED = 0;
  EVENT_SOURCE_FACTORY = 1;
  EVENT_SOURCE_AGENT = 2;
  EVENT_SOURCE_TASK = 3;
  // One of the agent's monitors fired: `from` is its name, `from_id` its id
  // ("m3").
  EVENT_SOURCE_MONITOR = 4;
  // An app (see AppInfo): `from` is its name, `from_id` its id.
  EVENT_SOURCE_APP = 5;
  // A pipe's messages for its lead (see Pipe): `from` is the pipe's name
  // and the other Claktory's, `from_id` "pipe:<Pipe.id>".
  EVENT_SOURCE_PIPE = 6;
}

message UserText {
  string text = 1;
  // The device it was sent from; unset for messages from before it, and for
  // those Claktory sent for the person (an approved proposal to Rivet).
  SentFrom sent_from = 2;
  // SendMessage.client_id, as sent; empty without one, and for messages from
  // before it.
  string client_id = 3;
  // The files the message carries (see Attachment); `text` may be empty
  // when it has any.
  repeated Attachment attachments = 4;
  // Set when the person said it (a voice message, DONE): `text` is what was
  // heard, attachments[0] the recording, to play back.
  Transcription voice = 5;
  // A reply on a checklist item (SendMessage.checklist_item); unset for any
  // other message.
  ChecklistItemRef checklist_item = 6;
  // A voice message sent with typed text (#425): what the person typed or
  // pasted. `text` is then the whole message as the agent read it: this
  // text, a blank line, "Voice note: " and the words heard (`heard`), so an
  // app that doesn't know these fields still shows all of it. Show this
  // text, then the recording (attachments[0]) with `heard` as its words.
  // Empty for any other message, a voice message alone included.
  string typed = 7;
  // With `typed`: the words heard in the recording, alone.
  string heard = 8;
}

// A voice message's transcription.
message Transcription {
  TranscriptionState state = 1;
  // How long the recording is; 0 while PENDING until it's been read.
  uint64 duration_ms = 2;
  // FAILED: what went wrong, for people ("Didn't hear any speech.").
  string error = 3;
  // FAILED: for programs. no_model (the speech model couldn't be had),
  // download_failed, too_long, no_speech, decode_failed, unsupported_cpu,
  // timed_out (transcribing took over a minute more than the recording's
  // length), transcribe_failed.
  string error_code = 4;
  // The language heard, such as "pl", when the model says; often empty.
  string language = 5;
}

enum TranscriptionState {
  TRANSCRIPTION_STATE_UNSPECIFIED = 0;
  // Waiting for the speech model (Workspace.speech_model shows its
  // download) or being transcribed. The person's messages after it wait
  // behind it, so the agent reads them in the order they were sent; other
  // events don't.
  TRANSCRIPTION_STATE_PENDING = 1;
  TRANSCRIPTION_STATE_DONE = 2;
  // Not delivered, and not holding up the queue: RetryVoiceMessage or
  // DiscardVoiceMessage.
  TRANSCRIPTION_STATE_FAILED = 3;
}

// The speech model voice messages are transcribed with, on this Claktory's
// computer (not the device's).
message SpeechModel {
  SpeechModelState state = 1;
  // "Parakeet v3 (25 languages)".
  string name = 2;
  // DOWNLOADING: bytes so far, of `total`. READY: its size.
  uint64 bytes = 3;
  uint64 total = 4;
  // FAILED or UNSUPPORTED: why, for people.
  string error = 5;
  // The model's licence credit, to show where it's named (CC BY 4.0).
  string attribution = 6;
}

enum SpeechModelState {
  SPEECH_MODEL_STATE_UNSPECIFIED = 0;
  // Not downloaded: InstallSpeechModel, after asking the person (it's big:
  // `total`).
  SPEECH_MODEL_STATE_ABSENT = 1;
  SPEECH_MODEL_STATE_DOWNLOADING = 2;
  // Downloaded; its checksum is being checked.
  SPEECH_MODEL_STATE_VERIFYING = 3;
  SPEECH_MODEL_STATE_READY = 4;
  // The download failed (`error`); InstallSpeechModel tries again, from
  // where it stopped.
  SPEECH_MODEL_STATE_FAILED = 5;
  // This computer can't run speech recognition (`error`): grey the
  // microphone out.
  SPEECH_MODEL_STATE_UNSUPPORTED = 6;
}

// Starts (or resumes) downloading the speech model; Ack at once, progress
// in Workspace.speech_model. Refused when it's UNSUPPORTED or there isn't
// room for it.
message InstallSpeechModel {}

// Deletes the speech model, or stops its download. Voice messages waiting
// for it fail (no_model).
message RemoveSpeechModel {}

// Transcribes a FAILED voice message again.
message RetryVoiceMessage {
  // The agent's id, or a chat's (Chat.id).
  string agent_id = 1;
  // QueuedMessage.id.
  int64 message_id = 2;
}

// Drops a PENDING or FAILED voice message from the queue, undelivered; its
// recording stays in an agent's uploads, and is deleted from a chat's.
message DiscardVoiceMessage {
  // The agent's id, or a chat's (Chat.id).
  string agent_id = 1;
  // QueuedMessage.id.
  int64 message_id = 2;
}

// Transcribes a dictation (an UPLOAD_PURPOSE_DICTATION upload, finished) for
// the person to edit and send as text: nothing is delivered to any agent,
// and neither the recording nor its words are kept. Answered with Ack at
// once (an Error only without `request_id` or `upload_id`); every outcome,
// refusals too, comes as AudioTranscribed. Ahead of voice messages waiting
// to be transcribed. Never starts the model's download: the app asks the
// person and sends InstallSpeechModel first, as for voice messages.
message TranscribeAudio {
  // Made up by the app; AudioTranscribed carries it.
  string request_id = 1;
  // The dictation's StartUpload.upload_id. The upload is deleted once it's
  // transcribed or refused.
  string upload_id = 2;
}
// Asked again with the same request_id and upload_id (#401: from the next
// connection, after one dropped before its answer), it waits with the first
// for the words, or gets them at once once they're there, for an hour,
// without the upload being needed again. Kept in memory: after a restart,
// or an hour, the answer is no_recording.

// What a TranscribeAudio heard, sent to the connections that asked (the
// same request asked again from another connection is answered there too).
// A connection that dropped meanwhile gets it by asking again.
message AudioTranscribed {
  string request_id = 1;
  // The words heard; empty when `error` is set (and possibly when it isn't).
  string text = 2;
  // Empty when it worked; otherwise why not:
  //   no_model: the speech model is ABSENT or FAILED (Workspace.speech_model),
  //     or was removed while it waited;
  //   unsupported: it's UNSUPPORTED;
  //   too_long: the recording is over 10 minutes;
  //   no_speech: no speech was heard in it (silence); an app that doesn't
  //     know this code shows it as failed;
  //   no_recording: the upload isn't here (never finished, over an hour
  //     old, or from before a restart) and nothing was heard for this
  //     request: upload it again, with a new upload_id and request_id. An
  //     app that doesn't know this code shows it as failed;
  //   failed: anything else (a recording that can't be read, recognition
  //     failing, too many dictations waiting).
  string error = 3;
  // How long the recording is, once it was read; 0 otherwise.
  uint64 duration_ms = 4;
}

// How much of an upload the backend has, in bytes: where the next
// UploadChunk starts.
message UploadProgress {
  string upload_id = 1;
  uint64 received = 2;
}

// An upload finished and stored: attach it to a message (SendMessage).
message UploadedFile {
  string upload_id = 1;
  // For a file for an agent.
  Attachment attachment = 2;
  // For an ink blob: its SHA-256 (lowercase hex), which names it from now
  // on. It's stored once this arrives; finishing one already stored answers
  // the same at once.
  string blob_sha256 = 3;
}

// Reads an ink blob a drawing or review item refers to, from `offset`.
message ReadInkBlob {
  string sha256 = 1;
  uint64 offset = 2;
}

// Part of an ink blob, at most 1 MiB.
message InkBlobData {
  string sha256 = 1;
  uint64 offset = 2;
  // The whole blob's size.
  uint64 size = 3;
  bytes data = 4;
  // Empty, or "unknown": no drawing or review item refers to that blob.
  string error = 5;
}

message AssistantText {
  string text = 1;
}

message Thinking {
  string text = 1;
}

message ToolCall {
  string call_id = 1;
  string name = 2;
  // The call's arguments as pretty-printed JSON. While the model is still
  // writing them (PENDING), the raw JSON written so far, which may be cut off
  // anywhere; empty until it starts.
  string input = 3;
  // What the tool returned, or its output so far while it runs.
  string output = 4;
  ToolCallState state = 5;
  // When the tool began running and when it ended, in ms since 1970; 0 until
  // it starts, and ended is 0 while it runs. Show a running call's elapsed
  // time from `started`: no updates are sent just for the clock.
  int64 started = 6;
  int64 ended = 7;
  // bash only: when it will be stopped, in ms after `started` (its timeout).
  // 0 for no timeout (run_in_background) and for other tools.
  uint64 timeout_ms = 8;
  // What the tool returned for the app to draw its view from, as JSON: ids,
  // names, counts, paths, links (docs/EXTENSIONS.md, "Its view in the
  // conversation"). Each tool has its own shape; keys are only ever added.
  // Empty while the call runs, and for a tool that returns none ("{}" and
  // null are sent as empty).
  string details = 9;
}

enum ToolCallState {
  TOOL_CALL_STATE_UNSPECIFIED = 0;
  // The model is still writing the call.
  TOOL_CALL_STATE_PENDING = 1;
  TOOL_CALL_STATE_RUNNING = 2;
  TOOL_CALL_STATE_DONE = 3;
  TOOL_CALL_STATE_FAILED = 4;
}

// The context was summarized to make room; everything above this entry is
// history the model now sees only through `summary`.
message Compaction {
  string summary = 1;
  uint64 tokens_before = 2;
  // Compacted while the agent was idle, just before its prompt cache
  // expired (Settings.idle_compaction), not because the context was full or
  // on request.
  bool idle = 3;
}

// Something the harness reports rather than the model: errors, stops.
message Notice {
  string text = 1;
  NoticeLevel level = 2;
  // Set when a run ended because the model's provider refused its
  // credentials: a key it doesn't accept or revoked (a 401, or a 403 that
  // says so), or a sign-in whose token it won't refresh. Unset for every
  // other failure (rate and usage limits, credit, outages). `text` keeps the
  // provider's own words.
  CredentialsRefused refused = 3;
  // Set when this notice is the model refusing a step on safety grounds:
  // the policy area the model named, written out as people read it (such
  // as "cybersecurity" or "biology"), or "unspecified" when it named
  // none. Empty when the notice isn't a refusal. The app shows a refusal
  // as itself, not as a failure.
  string refusal_category = 4;
}

// Whose credentials a provider refused: what to sign in to again.
message CredentialsRefused {
  // The provider, as Provider.id.
  string provider_id = 1;
  // The account among the provider's, as Account.id ("env" for the
  // environment's key); empty when unknown.
  string account_id = 2;
  // How it signed in, as LoginMethod.id: "api_key" or "oauth"; empty when
  // unknown.
  string method_id = 3;
}

enum NoticeLevel {
  NOTICE_LEVEL_UNSPECIFIED = 0;
  NOTICE_LEVEL_INFO = 1;
  NOTICE_LEVEL_ERROR = 2;
}

// A project's folder as a tree, flattened into the rows to show: a folder's
// children follow it when it's expanded. Folders come before files, each
// sorted by name. One is sent for each project whose files are open: the
// focused project's, those shown in a pane of any agent's layout (a ViewLeaf
// of kind "files" whose path is the project's id), and the one a connection
// watches (WatchFiles). Each comes after the Workspace on connect, and again
// whenever its tree changes, including when agents change files. The focused
// project's comes last, and again after any other's (for apps that keep only
// the last one).
message Explorer {
  string project_id = 1;
  // Whether files .factoryignore hides are shown (as `hidden` rows).
  bool show_all = 2;
  repeated FileEntry entries = 3;
  // Set when the folder can't be read; `entries` is empty then.
  string error = 4;
  // One per folder of the project (Project.folders), in that order, each
  // listed like the project's own folder above. The app shows the project's
  // own folder as a root too when it has entries or there are no folders.
  // Then one per agent in the project with its own checkout, in sidebar
  // order (ExplorerRoot.agent_id set).
  repeated ExplorerRoot folders = 5;
}

// One of the project's folders in the explorer, or an agent's own checkout
// (the Own checkout extension). The app labels a folder with its name from
// Project.folders, and a checkout as the agent's ("Backend's checkout").
message ExplorerRoot {
  // Empty for an agent's checkout.
  string folder_id = 1;
  // Absolute.
  string path = 2;
  // Relative to `path`; listed as Explorer.entries are, with the folder's
  // own .factoryignore.
  repeated FileEntry entries = 3;
  // Set when the folder can't be read; `entries` is empty then.
  string error = 4;
  // An agent's own checkout: the agent's id, and its branch
  // ("factory/backend"). The path is where in the checkout the agent works.
  string agent_id = 5;
  string branch = 6;
}

message FileEntry {
  // Relative to the project folder, with "/" between names.
  string path = 1;
  string name = 2;
  // 0 for the project folder's own entries.
  uint32 depth = 3;
  bool is_dir = 4;
  bool expanded = 5;
  // Matched by .factoryignore; only sent when `show_all` is on.
  bool hidden = 6;
}

// The vault: secrets (API keys, tokens, credentials files) agents use
// without seeing them. A secret holds one or more variables, each set in
// the environment of the commands an agent runs with it (or written to a
// private file whose path is set). Only the person creates the vault,
// grants, reveals and deletes, proving it with the vault passphrase.

// Part of the Workspace: the same on every device. Metadata only.
message VaultState {
  // There's a vault: the backend makes one when it starts, so false only
  // when it couldn't. Without one, everything else is empty.
  bool exists = 1;
  // The backend holds the vault's key now. False only in locked mode, until
  // the person unlocks it after the backend started (UnlockVault); agents
  // can't use secrets meanwhile.
  bool unlocked = 2;
  // No key is kept on disk: the vault opens only with the passphrase (or the
  // recovery key) after each start of the backend. Off (always, unless the
  // person gave it a key of their own and turned it on): it opens by itself.
  bool locked_mode = 3;
  // By name.
  repeated SecretInfo secrets = 4;
  // Agents' requests still waiting for the person, oldest first. Each is also
  // an entry in its agent's conversation.
  repeated SecretRequest requests = 5;
  // The services Claktory can connect (Settings → Secrets → Add), the same
  // for every Claktory of this version.
  repeated Connector connectors = 6;
  // Agents' proposals to connect a service still waiting for the person,
  // oldest first. Each is also an entry in its agent's conversation.
  repeated ConnectProposal proposals = 7;
  // Connections being made, or just ended (for 10 minutes, or until
  // CancelConnect): every device sees how they go, never a URL or code.
  repeated ConnectFlow flows = 8;
  // An agent or chat has waited a minute or more for the vault to open, to
  // use a provider whose sign-ins are kept in it: Needs you offers to unlock
  // it with the recovery key (UnlockVault; nothing goes to claktory.com).
  // Only ever true while it's locked.
  bool agents_waiting = 9;
  // Why it's locked, in a sentence or two for people, shown as it is; the
  // Claktory account's problem when it has one. Empty while it's open.
  string locked_why = 10;
  // The vault holds a recovery key (made at sign-in, or by ShowRecoveryKey
  // or NewRecoveryKey) that the person hasn't confirmed they saved
  // (ConfirmRecoveryKey): Needs you shows "Save your recovery key" exactly
  // while it's true. A new recovery key makes it true again. Only ever true
  // while the vault is open.
  bool recovery_key_unconfirmed = 11;
}

message SecretInfo {
  string id = 1;
  // How agents name it (bash's `secrets`), such as "AWS". Unique.
  string name = 2;
  // What it is and what it's for; agents read it.
  string description = 3;
  repeated SecretVariable variables = 4;
  // The agents that may use it, by when they were granted it.
  repeated SecretGrant grants = 5;
  int64 created_ms = 6;
  int64 updated_ms = 7;
  // Counts up each time its values change.
  uint32 version = 8;
  // The last agent that used it, and when; empty and 0 if none has.
  string last_used_by = 9;
  int64 last_used_ms = 10;
  // What the person should know, such as "MY_PIN is too short to hide in
  // agents' output".
  repeated string warnings = 11;
  // The agent that saved it (a key it made itself); empty when the person
  // added it.
  string owner_agent_id = 12;
  // Set when it's a connected service (StartConnect): its tokens stay with
  // the backend, so it has no variables and is given to no one; agents get
  // secrets made from it (DeriveSecret).
  SecretConnection connection = 13;
  // Set when it was made from a connection (DeriveSecret).
  SecretExport export = 14;
  // Ask each time: every command that uses it waits for the person's Allow
  // (a SecretApproval card), which lets that exact command use it once. No
  // app can use it. Changed with SetSecretAskEachTime; never on a connected
  // service itself (only Claktory uses that), only on secrets made from it.
  bool ask_each_time = 15;
  // Where Claktory's browser may fill it (#435, browser_fill_secret): exact
  // https origins ("https://shop.example"), spelled as Chrome spells an
  // origin. Empty: it's filled nowhere. Changed with SetSecretSites.
  repeated string sites = 16;
}

message SecretVariable {
  // The environment variable, such as AWS_SECRET_ACCESS_KEY.
  string name = 1;
  // The value's last 4 characters, to tell values apart ("••••3f9a"); empty
  // when the value is shorter than 12 characters.
  string hint = 2;
  // The value is written to a private file, and `name` holds its path (as
  // KUBECONFIG or GOOGLE_APPLICATION_CREDENTIALS expect).
  bool file = 3;
}

message SecretGrant {
  string agent_id = 1;
  int64 granted_ms = 2;
  // How many of the agent's background tasks running now got this secret:
  // what RevokeSecret's stop_running_tasks would stop.
  uint32 running_tasks = 3;
  // Other names this agent's commands get the secret's values under, as
  // the request it answered asked (`CLOUDFLARE_API_TOKEN` → the secret's
  // `CF_CLAKTORY_DNS`); besides the secret's own names. Empty for most.
  map<string, string> aliases = 4;
  // The agent may only fill it into its sites (SecretInfo.sites) in
  // Claktory's browser: its commands and apps never get it.
  bool fill_only = 5;
}

// A variable with its value, in requests from the app and in SecretValue.
message SecretEntry {
  string variable = 1;
  string value = 2;
  // See SecretVariable.file.
  bool file = 3;
}

// No longer needed: the person's requests come from their app, signed in to
// the backend as one of their devices, and agents can't make them. Leave it
// out. Only a vault in locked mode, still locked, takes its passphrase or
// recovery key here to open it, as UnlockVault does.
message VaultProof {
  string passphrase = 1;
}

// Unused: the backend makes the vault by itself when it starts. Refused
// with ERROR_CODE_INVALID_REQUEST (there's one already).
message CreateVault {
  string passphrase = 1;
  // See VaultState.locked_mode.
  bool locked_mode = 2;
}

// Opens a vault in locked mode after a restart. `passphrase` may be the
// recovery key.
message UnlockVault {
  string passphrase = 1;
}

// Unused: there's no unlocked window any more. Answered with VaultSession 0.
message LockVaultSession {}

// Adds a secret, granted to no one. No proof needed.
message CreateSecret {
  string name = 1;
  string description = 2;
  repeated SecretEntry entries = 3;
  // Made with Ask each time on (SecretInfo.ask_each_time).
  bool ask_each_time = 4;
  // See SecretInfo.sites.
  repeated string sites = 5;
}

// Replaces where Claktory's browser may fill a secret (SecretInfo.sites);
// empty unbinds it. Answered with Ack; refused (INVALID_REQUEST, with the
// reason in words) for a site that isn't an exact https origin on the
// internet, more than 20, or a connected service itself.
message SetSecretSites {
  string id = 1;
  repeated string sites = 2;
}

// Turns Ask each time (SecretInfo.ask_each_time) on or off for a secret.
// Off needs the vault's proof, as GrantSecret does, since it lets agents'
// commands use it without asking; on needs none. Answered with Ack (or a
// VaultSession, like the other proven requests); refused for a connected
// service itself.
message SetSecretAskEachTime {
  string id = 1;
  bool ask_each_time = 2;
  VaultProof proof = 3;
}

// Changes a secret's name and description, and with `entries`, replaces its
// variables and values (a new version). Empty `entries`: values unchanged.
// No proof needed: agents granted it are told it changed.
message UpdateSecret {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated SecretEntry entries = 4;
}

message DeleteSecret {
  string id = 1;
  VaultProof proof = 2;
}

message GrantSecret {
  string id = 1;
  string agent_id = 2;
  VaultProof proof = 3;
  // Only to fill into its sites in Claktory's browser (SecretGrant.fill_only),
  // replacing a full grant the agent held.
  bool fill_only = 4;
}

// No proof needed: it only takes access away. The agent is told.
message RevokeSecret {
  string id = 1;
  string agent_id = 2;
  // Also stops the agent's background tasks that got the secret.
  bool stop_running_tasks = 3;
}

message RevealSecret {
  string id = 1;
  VaultProof proof = 2;
}

// Reads a pasted .env: answered with the variables found, without values.
message PreviewEnv {
  string text = 1;
}

// Adds what a pasted .env holds: one secret named `name` with every
// variable, or with `one_per_variable` one secret per variable, named after
// it. No proof needed.
message ImportEnv {
  string text = 1;
  string name = 2;
  string description = 3;
  bool one_per_variable = 4;
}

// Grants (approve) or dismisses an agent's secret request. To give one of
// the vault's secrets, `secret_id` names it. To add a new one, `entries`
// hold its variables and values, and `name` and `description` its name and
// description (empty: the request's), and it's made and given. A request
// from before agents described what they need, naming a secret, is given
// that secret when neither is set. The agent is told only what it got.
message DecideSecretRequest {
  string agent_id = 1;
  string request_id = 2;
  bool approve = 3;
  VaultProof proof = 4;
  repeated SecretEntry entries = 5;
  // Told to the agent; may be empty.
  string comment = 6;
  // An existing secret to give (SecretInfo.id).
  string secret_id = 7;
  // A new secret's name and description.
  string name = 8;
  string description = 9;
  // Giving an existing secret (`secret_id`) whose variables aren't the ones
  // the request named: the names the agent's commands also get, each the
  // value of one of the secret's variables (requested name → the secret's
  // variable, {"CLOUDFLARE_API_TOKEN": "CF_CLAKTORY_DNS"}). Kept with the
  // grant (SecretGrant.aliases).
  map<string, string> aliases = 10;
  // Give the existing secret with its own variable names only. With
  // neither this nor `aliases`, a single missing name and a single unused
  // variable are paired by themselves; any other mismatch is refused,
  // saying so.
  bool as_is = 11;
  // With `approve`: approve the need and pass the request to its admin
  // agent (SecretRequest.admin_agent_id), giving nothing yet. The request
  // becomes APPROVED and the admin agent is told what was approved; it
  // grants a matching secret or asks the person to add one. Refused when
  // no admin agent has Secrets (the request's admin_agent_id is empty; the
  // app offers the direct path instead).
  bool approve_only = 12;
  // A generate request (SecretRequest.generate), approved: whether the new
  // key asks the person each time it's used (SecretInfo.ask_each_time).
  // Unset is off (the card's default, by the person's decision); on, it
  // starts asking.
  // `name` renames it (also the key's comment); `comment` reaches the agent.
  optional bool ask_each_time = 13;
  // A password to generate: the length the person chose, between its
  // PasswordSpec's shortest and longest; 0 for the length asked.
  uint32 password_length = 14;
  // An import (SecretRequest.imports): delete each original file once it's
  // in the vault, if it's still the same file. A plain delete, not a
  // secure erase. Off unless the person turns it on.
  bool delete_originals = 15;
  // An import: give the new secret to the agent that asked. Off (the
  // default) gives it to no one.
  bool grant_to_asker = 16;
  // Submit (#370): `comment` is the person's reply, needed; nothing is
  // given and `approve` is ignored. The request closes DISMISSED with
  // SecretRequest.replied; the agent is told the reply, and an item it's
  // about counts as answered (no asking again).
  bool reply = 17;
}

// Who used a secret and when, newest first; `id` empty for every secret.
message ListSecretUses {
  string id = 1;
  // 0 for 100.
  uint32 limit = 2;
}

// For a vault with a key of the person's own: `old_passphrase` is the
// passphrase or the recovery key. The new one has 8 characters at least.
// Answered with VaultSession.
message ChangePassphrase {
  string old_passphrase = 1;
  string new_passphrase = 2;
}

// A recovery key, a key of the person's own that opens the vault too; it
// replaces the last one, which stops working. Answered with RecoveryKey.
message NewRecoveryKey {
  VaultProof proof = 1;
}

// Turns locked mode on (the key kept on disk is deleted) or off (it's kept
// again). On needs a key of the person's own (a passphrase or recovery
// key) first. Answered with VaultSession.
message SetVaultLockedMode {
  bool locked_mode = 1;
  VaultProof proof = 2;
}

// Unused: always 0, and never sent unasked any more. Requests need no
// VaultProof, so there's no unlocked window to show.
message VaultSession {
  int64 unlocked_until_ms = 1;
}

message SecretValue {
  string id = 1;
  repeated SecretEntry entries = 2;
  // Unused: always 0.
  int64 unlocked_until_ms = 3;
}

message EnvPreview {
  repeated SecretVariable variables = 1;
  // Duplicates, empty values, values too short to hide in agents' output,
  // lines that couldn't be read (by line number, never with their text).
  repeated string warnings = 2;
}

// Shown once: the person keeps it, to open the vault when the passphrase is
// forgotten or the key on disk is lost.
message RecoveryKey {
  string key = 1;
  // Unused: always 0.
  int64 unlocked_until_ms = 2;
}

message SecretUses {
  repeated SecretUse uses = 1;
}

message SecretUse {
  string secret_id = 1;
  string secret_name = 2;
  int64 time_ms = 3;
  // "use" (an agent's command got it), "reveal" (the person saw it in the
  // app), "grant", "revoke", "import" (the vault read it from files on this
  // computer: detail says which, their sizes and fingerprints, whom it was
  // given to and whether the originals were deleted; agent is who asked),
  // "keep" (recovery codes from an errand kept as this secret: detail says
  // why, from the person's Keep in Secrets or because their card closed
  // before they chose).
  string kind = 4;
  // The agent; for reveal, grant and revoke, the one concerned, if any.
  string agent_id = 5;
  // The background task that got it; empty for a command run in the
  // foreground.
  string task_id = 6;
  // The command's first line (uses), the device (reveals), or for grants
  // and revokes the admin agent's id that made them (empty: the person).
  string detail = 7;
}

// An agent's request (secrets_request), shown in its conversation after the
// call, for the person to grant or dismiss with DecideSecretRequest. The
// entry is sent again when it's decided. Agents don't know which secrets
// the vault holds: they describe what they need in `new_secret` (a name,
// what it's for and the variables they expect), and the person gives an
// existing secret or adds one. Requests from before that name an existing
// secret in `secret_id`.
message SecretRequest {
  string id = 1;
  // The agent that asked.
  string agent_id = 2;
  // Only in requests from before agents described what they need: the
  // existing secret it asked for. Empty otherwise.
  string secret_id = 3;
  // What it asks for, in a word: the name it gave (new_secret.name), or the
  // existing secret's.
  string secret_name = 4;
  // What it needs: a name, what it's for (which service, what access) and
  // the variables it expects (no values). Prefills a new secret, if the
  // person adds one. Unset only in requests that name an existing secret.
  NewSecret new_secret = 5;
  // Why it needs it, in the agent's words.
  string reason = 6;
  SecretRequestState state = 7;
  // When it was decided, expired or withdrawn, in ms since 1970; 0 while
  // pending.
  int64 decided_ms = 8;
  // The person's comment, or the agent's reason for withdrawing it; may be
  // empty.
  string comment = 9;
  // GRANTED: the secret given, which may be another than the one described.
  string given_secret_id = 10;
  string given_secret_name = 11;
  // When the agent last changed it (its description, reason or variables),
  // in ms since 1970; 0 if never.
  int64 updated_ms = 12;
  // APPROVED: when the person approved the need and passed it to the admin
  // agent, in ms since 1970; 0 otherwise.
  int64 approved_ms = 13;
  // The admin agent an approval passes it to (DecideSecretRequest's
  // approve_only), and, once approved, the one finding or collecting the
  // secret. Set when the request is made; empty when no admin agent has
  // Secrets, and the app then offers giving or adding a secret directly.
  string admin_agent_id = 14;
  // APPROVED: the admin agent asked the person to add this secret (its
  // secrets_collect): the add-secret card is open in its conversation,
  // prefilled from the request, and the values go straight into the vault.
  bool collecting = 15;
  // A key the agent asks the vault to generate (#252), by type:
  // "ssh-ed25519", or "password" (what it's made of in `password`; its one
  // variable holds the password itself, not a file unless asked). Empty for a request for a secret someone has. The card
  // offers Generate, never a values form or the admin agent; the vault
  // makes the keypair itself and seals the private half as the secret's
  // one file variable (new_secret.variables), so it never exists anywhere
  // else. new_secret.name is also the key's comment, in its public line.
  string generate = 16;
  // A generate request: the agent asked for the key to be given to no
  // one. Generated, it stays so (GENERATED); otherwise it goes to the
  // agent (GRANTED). The person can't widen it on the card.
  bool grant_to_nobody = 17;
  // GRANTED or GENERATED from a generate request: the key's public half,
  // in OpenSSH's one-line form ("ssh-ed25519 AAAA… <name>"). The private
  // half is never sent.
  string public_key = 18;
  // generate "password": what the vault will make (or made), as Claktory
  // read and checked it; never the password itself.
  PasswordSpec password = 19;
  // Files on this computer the agent asks the vault to import, each into
  // one file variable of a new secret: what Claktory read of each when
  // asked, never its contents. On approval factoryd reads each file
  // itself, checks it's the same file, unchanged, and seals its bytes
  // straight into the vault (binary files too). Empty for other requests.
  repeated SecretImport imports = 20;
  // The asking agent had read a web page when it asked (a pipe or a direct
  // message, before #346; as AppGrantProposal.grantee_read_pipes): what it
  // asks for may come from someone else.
  bool asker_read_pipes = 21;
  // Where the person makes it, as the agent gave it (#360, K3): an https
  // link to a public site (never an IP address, localhost or a local
  // name), with no user name, password or port, at most 2,000 characters,
  // its host in punycode; secrets_request refuses any other. Empty when the
  // agent gave none. Open it only on the person's tap.
  string link = 22;
  // The link's host, in ASCII (punycode): the only label for the link's
  // button ("Get it on github.com"), never words of the agent's.
  string link_host = 23;
  // At most one line (200 characters) of how to make it, in the agent's
  // words, with controls and hidden or reordering characters taken out:
  // show it as the agent's, quoted.
  string steps = 24;
  // The vault's secret that fits this request (K4): the one it named, else
  // one whose name is what it asks for (ignoring case), else one that sets
  // every variable it asks for; failing those, a connected service
  // (SecretInfo.connection) whose connector it names, which the admin
  // agent makes one from. Kept current as the vault changes while it
  // waits. Empty when nothing fits: the card is the prefilled form.
  string fitting_secret_id = 25;
  string fitting_secret_name = 26;
  // Where a generated key goes (K6): an owner/repo ("claktory/factory") or
  // a host, as the agent gave it; empty when it gave none or anything
  // else.
  string place = 27;
  // When the person said the generated key is in place
  // (SecretRequestDone), in ms since 1970; 0 until then.
  int64 done_ms = 28;
  // GRANTED: the secret given was added from the card, new, rather than
  // one the vault had.
  bool added = 29;
  // DISMISSED by a reply (DecideSecretRequest.reply): nothing was given,
  // and `comment` is what the person said instead. Shown as replied.
  bool replied = 30;
}

// The person put a generated key where it goes (K6's Done): the agent is
// told it's in place, and SecretRequest.done_ms is set. Only for a
// generated ssh key's request; Ack, and again (changing nothing) once done.
message SecretRequestDone {
  string agent_id = 1;
  string request_id = 2;
}

// A file an agent asks the vault to import (SecretRequest.imports). Holds
// no contents.
message SecretImport {
  // The file variable it goes in.
  string variable = 1;
  // Its canonical absolute path, exactly as Claktory resolved it, not
  // escaped: the card shows it in full, never shortened (no ~/), with
  // control, bidi and zero-width characters as visible \u{…}. Claktory refuses a path
  // through a symbolic link, so this is the file itself.
  string path = 2;
  // In bytes.
  int64 size = 3;
  int64 modified_ms = 4;
  // A short fingerprint of its contents, keyed with the vault's own key (so
  // it can't be used to guess them): "3f9a 21c0 7d44".
  string fingerprint = 5;
  // Where it is, when that's somewhere sensitive: "ssh", "gnupg", "aws",
  // "gcloud", "kube", "docker", "keychains", "browser", "netrc"; empty
  // otherwise.
  string sensitive = 6;
  // Why it can't be imported now (gone, or changed since it was asked
  // for), in Claktory's words; empty when it can.
  string problem = 7;
}

// A password the vault generates (SecretRequest.generate "password"): what
// it's drawn from and how long it is. Holds no secret. The vault draws each
// character uniformly from the alphabet with the system's random numbers;
// with require_each, it draws whole passwords again until every class is
// in. Claktory refuses anything weaker at request time: at least 16
// characters and 80 bits, or, when the service's maximum is lower, at least
// 12 characters and 72 bits; at most 256 characters.
message PasswordSpec {
  // Characters, as the request asked or the person chose (DecideSecretRequest.password_length).
  uint32 length = 1;
  // The classes it's drawn from, when `allowed` is empty: lowercase and
  // uppercase letters, digits, and symbols (!#$%&()*+,-./:;<=>?@[]^_{|}~:
  // printable ASCII without quotes, the backquote, the backslash or space).
  bool lowercase = 2;
  bool uppercase = 3;
  bool digits = 4;
  bool symbols = 5;
  // An explicit set to draw from instead (printable ASCII, no space), for a
  // service that refuses some characters.
  string allowed = 6;
  // Leaves out characters that look alike: 0 O o 1 l I |.
  bool avoid_similar = 7;
  // At least one character of each class asked for (or of each class
  // `allowed` holds).
  bool require_each = 8;
  // The most characters the service accepts; 0 when it didn't say.
  uint32 max_length = 9;
  // Computed by Claktory: how many characters it's drawn from, its
  // strength (length × log2 alphabet_size), the lengths the person may
  // choose (shortest–longest), and the bits each character adds.
  uint32 alphabet_size = 10;
  double bits = 11;
  uint32 shortest = 12;
  uint32 longest = 13;
  double bits_per_character = 14;
}

message NewSecret {
  string name = 1;
  string description = 2;
  repeated SecretVariable variables = 3;
}

enum SecretRequestState {
  SECRET_REQUEST_STATE_UNSPECIFIED = 0;
  SECRET_REQUEST_STATE_PENDING = 1;
  SECRET_REQUEST_STATE_GRANTED = 2;
  SECRET_REQUEST_STATE_DISMISSED = 3;
  // Left unanswered 12 hours since it was made or last changed: it can't be
  // answered any more, and the agent was told. decided_ms says when.
  SECRET_REQUEST_STATE_EXPIRED = 4;
  // The agent took it back (secrets_request_cancel): it can't be answered
  // any more. decided_ms says when, and `comment` holds the agent's reason,
  // if it gave one.
  SECRET_REQUEST_STATE_WITHDRAWN = 5;
  // The person approved the need (DecideSecretRequest.approve_only) and the
  // admin agent (`admin_agent_id`) finds a matching secret or collects a
  // new one. The card keeps its direct actions (give a secret, add one,
  // dismiss), so the person is never stuck on the admin agent. It doesn't
  // expire: only PENDING requests do.
  SECRET_REQUEST_STATE_APPROVED = 6;
  // A generate request (SecretRequest.generate) decided: the vault made the
  // key and gave it to no one, as the agent asked. given_secret_id and
  // given_secret_name name it, public_key is its public half.
  SECRET_REQUEST_STATE_GENERATED = 7;
}

// This Claktory's account at claktory.com, or at the service in
// config.json's `account.service`. Signing in is the backend's, not a
// device's: one sign-in, and every device that connects shows it.
message ClaktoryAccount {
  ClaktoryAccountState state = 1;
  // The email it's signed in with, or that the code went to.
  string email = 2;
  // The service's address, such as "https://account.claktory.com".
  string service = 3;
  // This Claktory's name there, as sent at sign-in (the computer's name).
  string name = 4;
  // When the service last answered, in ms since 1970; 0 if it never has.
  int64 last_contact_ms = 5;
  // What went wrong with the last call to the service, in words for the
  // person ("claktory.com can't be reached; Claktory tries again by
  // itself"); empty when it worked.
  string problem = 6;
  // AWAITING_CODE: when the code stops working, in ms since 1970.
  int64 code_expires_ms = 7;
  // Exactly what this Claktory last sent the service, as JSON, for "What
  // claktory.com receives": its sign-in (the request that emails the code)
  // and its check-in. The machine token, signatures and codes travel beside
  // them and aren't shown; empty before the first.
  string last_sign_in_json = 8;
  string last_check_in_json = 9;
  // When each was sent, in ms since 1970; 0 before the first.
  int64 last_sign_in_ms = 10;
  int64 last_check_in_ms = 11;
  // The first launch's sign-in step may be skipped (SkipAccountSignIn): this
  // Claktory existed before signing in was on, and it's SIGNED_OUT or
  // AWAITING_CODE. False in a Claktory made since, which asks until it's
  // signed in.
  bool skippable = 12;
  // AWAITING_CODE: the address the code email comes from, such as
  // "code@auth.claktory.com", so the person knows what to look for (in spam
  // too); empty when unknown.
  string code_from = 13;
}

enum ClaktoryAccountState {
  CLAKTORY_ACCOUNT_STATE_UNSPECIFIED = 0;
  // Not signed in: AccountSignIn.
  CLAKTORY_ACCOUNT_STATE_SIGNED_OUT = 1;
  // A code was emailed: AccountVerify, or AccountResend.
  CLAKTORY_ACCOUNT_STATE_AWAITING_CODE = 2;
  CLAKTORY_ACCOUNT_STATE_SIGNED_IN = 3;
  // Removed at claktory.com: it keeps running, but after a restart its
  // secrets open only with the recovery key, until it signs in again.
  CLAKTORY_ACCOUNT_STATE_REVOKED = 4;
  // Not signed in, and the person chose Not now on the sign-in step
  // (SkipAccountSignIn): the app doesn't ask again. Settings → Account
  // offers to sign in, as from SIGNED_OUT (AccountSignIn works from here).
  CLAKTORY_ACCOUNT_STATE_SKIPPED = 5;
}

// Emails a code to sign this Claktory in. Answered with Ack once it's sent;
// ERROR_CODE_RATE_LIMITED or ERROR_CODE_UNREACHABLE when it can't be.
message AccountSignIn {
  string email = 1;
}

// The emailed code. Answered with Ack once signed in, when the vault is
// protected by the account (and its recovery key made). A wrong code is
// ERROR_CODE_WRONG_PROOF, its message saying how many tries are left; an
// expired one ERROR_CODE_INVALID_REQUEST.
message AccountVerify {
  string code = 1;
}

// Emails a new code to the same address. Answered with Ack.
message AccountResend {}

// Signs out: no more check-ins, and back to SIGNED_OUT (SKIPPED once the
// sign-in step was skipped). The vault stays as it is, unlocked while
// Claktory runs. Answered with Ack.
message AccountSignOut {}

// Confirms a paired device as the owner's. With `assertion`: this device
// confirms itself (the assertion's device key must be this connection's
// tunnel key). With `device_id`: the person confirms another paired device
// from this one ("Confirm it's yours"), which must be confirmed itself or be
// this computer's own app (else ERROR_CODE_UNAUTHORIZED). Answered with Ack.
message ConfirmDevice {
  string assertion = 1;
  string device_id = 2;
}

// Not now, on the first launch's sign-in step, while
// `ClaktoryAccount.skippable`: SKIPPED from then on, and a code waiting is
// dropped. Answered with Ack; ERROR_CODE_INVALID_REQUEST when it isn't
// skippable.
message SkipAccountSignIn {}

// This computer's own app signs in to this Claktory's account as a device
// without an emailed code (#529): the Claktory, signed in, asks its account
// service for a one-time code for the app's account key
// (claktory-account API.md, POST /v1/devices/vouch), and the app signs in
// with it through the service's own POST /v1/devices/sign-in/verify, signed
// by that key. From then on the app is a device signed in to the account,
// as a phone that signed in itself is: other Claktories of the account take
// its device assertions. Only this computer's own app may ask: from any
// other device ERROR_CODE_UNAUTHORIZED; ERROR_CODE_SIGN_IN_REQUIRED while
// this Claktory isn't signed in; ERROR_CODE_UNREACHABLE or
// ERROR_CODE_RATE_LIMITED when the service can't answer. Answered with
// DeviceVouched, to the asker only. Apps ask only on a computer whose own
// Claktory is signed in, and never again by themselves after the service
// said device_removed.
message VouchDevice {
  // The app's account key: Ed25519, its public half in base64url, as
  // POST /v1/devices/sign-in/start takes it.
  string account_key = 1;
  // The app's name, system and version, as sign-in/start takes them
  // ("Matt's MacBook", "macos", "v0.1.20").
  string name = 2;
  string platform = 3;
  string version = 4;
}

// The answer to VouchDevice. Either `request_id` and `code`, or `refused`.
message DeviceVouched {
  // For POST /v1/devices/sign-in/verify at `service`, signed by the account
  // key: single use, until `expires_ms`. Never shown or kept.
  string request_id = 1;
  string code = 2;
  // When the code stops working, in ms since 1970.
  int64 expires_ms = 3;
  // This Claktory's account service ("https://account.claktory.com"): the
  // app signs in there, not at claktory.com unless it's that one.
  string service = 4;
  // The account's email, as this Claktory is signed in with it.
  string email = 5;
  // The service said no, and why, for the app to act on:
  // "device_removed": the key was removed from the account; don't ask
  //   again unless the person asks.
  // "key_of_another_account": the key last signed in to another account;
  //   make a new key and ask once more.
  // "unavailable": the service can't vouch (one from before it): carry on
  //   as before, without asking again until the app restarts.
  // Empty when it vouched.
  string refused = 6;
  // With `refused`: what the service said, in words for the person.
  string message = 7;
}

// The account service to use; empty for claktory.com's. Only while signed
// out. Answered with Ack.
message SetAccountService {
  string url = 1;
}

// The vault's recovery key, to note down. Answered with RecoveryKey, to the
// asker only; logged in the vault's uses.
message ShowRecoveryKey {}

// Starts checking that the person saved the recovery key: they type back
// one group of it, picked at random each time. Answered with
// RecoveryKeyCheck, to the asker only. The check belongs to this device and
// the current recovery key, lasts 10 minutes, and replaces this device's
// last one.
message CheckRecoveryKey {}

message RecoveryKeyCheck {
  // Given back in ConfirmRecoveryKey.
  string check_id = 1;
  // Which group of the key to type, counting from 1: in "K7QM-2XPA-…",
  // group 2 is 2XPA.
  uint32 group = 2;
  // How many groups the key has: 8.
  uint32 groups = 3;
}

// The group RecoveryKeyCheck asked for, as the person typed it: case, spaces
// and dashes don't matter, and 0, 1 and 8 read as O, I and B. Answered with
// Ack, and VaultState.recovery_key_unconfirmed turns false on every device.
// A wrong group is ERROR_CODE_WRONG_PROOF, and the check stays to try
// again; after 5 wrong groups in an hour (from any device) everything is
// ERROR_CODE_RATE_LIMITED, its message saying how long to wait. A check
// that ran out, is another device's or is from before the recovery key
// changed is ERROR_CODE_INVALID_REQUEST: CheckRecoveryKey again. Nothing
// typed is logged.
message ConfirmRecoveryKey {
  string check_id = 1;
  string typed = 2;
}

// How this Claktory is arranged: where agents are, whom they can message,
// which secrets they have, what data they read and write, and their
// extensions that grant reach or power. Computed by the backend from the
// same rules agents follow, so the app only lays it out. Nodes are sorted by
// id and edges by from_id, to_id and kind, so the same Claktory gives the
// same map.
message ClaktoryMap {
  repeated MapNode nodes = 1;
  repeated MapEdge edges = 2;
}

message MapNode {
  // Unique in the map and the same every time: "workspace",
  // "project:<project id>", "folder:<project id>/<folder id>",
  // "agent:<agent id>", "secret:<secret id>", "data:records" (Claktory's
  // records), "data:agent:<agent id>" (an agent's own database) and
  // "app:<app id>".
  string id = 1;
  MapNodeKind kind = 2;
  // A name to show: the agent's, project's, folder's or secret's;
  // "Workspace", "Claktory's records", or "<agent name>'s database".
  string label = 3;
  // A line about it: an agent's role, a project's, folder's or database's
  // path, a secret's description; may be empty.
  string detail = 4;
  // The node it sits under, as in the sidebar: a folder under its project,
  // an agent under the agent it's nested under, else its folder, else its
  // project, else the workspace; an agent's database under the agent.
  // Empty at the top: the workspace, projects, admin agents (wherever they
  // are), secrets and Claktory's records.
  string parent_id = 5;
  // An admin agent: sees and messages every agent.
  bool admin = 6;
  // An agent's color (Agent.color); empty for other nodes.
  string color = 7;
  // An agent's extensions that grant reach or power, in a fixed order.
  repeated MapBadge badges = 8;
  // The id of what it stands for, to open it: the agent's, project's,
  // folder's (within project_id) or secret's id; for an agent's database,
  // the agent's. Empty for the workspace and Claktory's records.
  string ref_id = 9;
  // The project a folder or an agent (or its database) is in; empty
  // otherwise.
  string project_id = 10;
  // An app's icon, as AppInfo.icon; empty for other nodes.
  string icon = 11;
}

enum MapNodeKind {
  MAP_NODE_KIND_UNSPECIFIED = 0;
  // The workspace folder: agents in no project.
  MAP_NODE_KIND_WORKSPACE = 1;
  MAP_NODE_KIND_PROJECT = 2;
  // One of a project's folders.
  MAP_NODE_KIND_FOLDER = 3;
  MAP_NODE_KIND_AGENT = 4;
  // A secret in the vault (its name, never values).
  MAP_NODE_KIND_SECRET = 5;
  // A database: an agent's own, or Claktory's records.
  MAP_NODE_KIND_DATA = 6;
  // An app installed (see AppInfo): label its name, detail its description
  // (or why it's in trouble), ref_id its id; at the top.
  MAP_NODE_KIND_APP = 7;
  // A pipe to another Claktory, in History only (the Map draws pipes from
  // Workspace.pipes): id "pipe:<id>", parent_id its project's node,
  // label its name only when it was named on this side (otherwise "Pipe"),
  // detail "Another Claktory". Never anything of the other side's.
  MAP_NODE_KIND_PIPE = 8;
}

// An extension an agent has on that grants reach or power.
message MapBadge {
  // Stable: "agents:admin" (sees and messages every agent), "secrets:give"
  // (gives secrets to agents), "tasks:see_all" (sees and stops every
  // agent's tasks), "web", "tree" (own checkout: lands on the main branch),
  // "database", "database:factory" (Claktory's records), "memory:factory"
  // (the Claktory manual: can change Claktory's settings).
  string key = 1;
  // To show, e.g. "Web".
  string label = 2;
  // An icon name, as Extension.icon.
  string icon = 3;
}

message MapEdge {
  // Node ids.
  string from_id = 1;
  string to_id = 2;
  MapEdgeKind kind = 3;
  // MESSAGES only: each can message the other. Such a pair is one edge,
  // from the lower id.
  bool both_ways = 4;
  // APP: the scopes given, by their labels ("Send you Telegram messages ·
  // Read your messages to the bot"); HEARS: the events heard, the same way.
  // Empty for other kinds.
  string label = 5;
}

enum MapEdgeKind {
  MAP_EDGE_KIND_UNSPECIFIED = 0;
  // An agent can message another (and see it): same project, its "also"
  // list, or an admin agent.
  MAP_EDGE_KIND_MESSAGES = 1;
  // From a secret to an agent that has it, or to an app.
  MAP_EDGE_KIND_SECRET = 2;
  // From an agent to a folder of its project it can read but not change
  // (the project's own folder is the project's node), or to Claktory's
  // records.
  MAP_EDGE_KIND_READS = 3;
  // From an agent to the folder it works in (the workspace's, a project's
  // or a project folder's node), or to its own database.
  MAP_EDGE_KIND_WRITES = 4;
  // From an app to an agent given scopes of it.
  MAP_EDGE_KIND_APP = 5;
  // From an app to an agent that hears its events.
  MAP_EDGE_KIND_HEARS = 6;
  // From an agent to its lead (Agent.lead_id). Only leads set in agents'
  // settings: an admin agent leading everyone isn't drawn.
  MAP_EDGE_KIND_LEAD = 7;
  // In History only: from an agent to a pipe it's a member of; label
  // "Leads" for the pipe's lead.
  MAP_EDGE_KIND_PIPE = 8;
}

// ---- History (#458, history-replay.md) ----
//
// The Map's History mode plays this Claktory back from its first day. The
// backend decides what existed when, who could message whom and what's a
// chapter; the app filters by time and draws. Nothing here carries message
// text, card titles or anything of another Claktory's.

// Answered with HistoryOverview: everything that ever existed, when, and
// how busy each hour was. Asked when History opens and again after
// HistoryChanged.
message GetHistoryOverview {
  // Empty: the whole Claktory. A project's id: histogram, message_count,
  // cursors and the busiest hour's chapter count only its events, those
  // whose sender or a recipient was in it at the time (a node's project
  // over time is its labels' project_id; the person counts through the
  // recipients, a pipe in its project, apps in none). Everything else
  // stays whole, so the timeline and node indexes are the same in every
  // view.
  string project_id = 1;
}

// When something existed. Before HistoryOverview.recording_since_ms what
// History knows is reconstructed (inferred): drawn dotted.
message HistoryInterval {
  int64 from_ms = 1;
  // 0: still.
  int64 to_ms = 2;
  bool inferred = 3;
}

// A node's name and place from a moment on: renames and moves.
message HistoryLabel {
  int64 at_ms = 1;
  string label = 2;
  string detail = 3;
  string parent_id = 4;
  string project_id = 5;
}

message HistoryNode {
  // As the Map has it, at its latest (a deleted agent's under its last
  // name).
  MapNode node = 1;
  repeated HistoryInterval present = 2;
  // Oldest first.
  repeated HistoryLabel labels = 3;
}

message HistoryEdge {
  MapEdge edge = 1;
  repeated HistoryInterval present = 2;
}

enum HistoryChapterKind {
  HISTORY_CHAPTER_KIND_UNSPECIFIED = 0;
  // Recording began: from here on History is exact.
  HISTORY_CHAPTER_KIND_RECORDING = 1;
  HISTORY_CHAPTER_KIND_PROJECT = 2;
  // Agents joined.
  HISTORY_CHAPTER_KIND_AGENTS = 3;
  HISTORY_CHAPTER_KIND_PIPE = 4;
  HISTORY_CHAPTER_KIND_APP = 5;
  HISTORY_CHAPTER_KIND_SECRET = 6;
  // A new version of Claktory first ran.
  HISTORY_CHAPTER_KIND_RELEASE = 7;
  // A checklist goal was done.
  HISTORY_CHAPTER_KIND_GOAL = 8;
  // The busiest hour.
  HISTORY_CHAPTER_KIND_BUSIEST = 9;
}

message HistoryChapter {
  int64 at_ms = 1;
  HistoryChapterKind kind = 2;
  // Plain words, with names, written by the backend.
  string title = 3;
  // MapNode ids, to frame.
  repeated string node_ids = 4;
}

// Where GetHistoryEvents can start to reach a moment.
message HistoryCursor {
  // The first event after it.
  int64 at_ms = 1;
  bytes cursor = 2;
}

message HistoryOverview {
  int64 start_ms = 1;
  int64 end_ms = 2;
  // Before it, what History shows is reconstructed; 0 before anything
  // was recorded.
  int64 recording_since_ms = 3;
  // Append-only: a node keeps its index (as HistoryEvents names it) from
  // the first overview that has it on, across HistoryChanged and restarts;
  // new ones only ever come at the end.
  repeated HistoryNode nodes = 4;
  // In no particular order.
  repeated HistoryEdge edges = 5;
  // Events (every HistoryEventKind; runs not) per hour, hour 0 starting
  // at start_ms floored to the hour (UTC).
  repeated uint32 histogram = 6;
  repeated HistoryChapter chapters = 7;
  uint64 message_count = 8;
  // Goes up when the overview changes (HistoryChanged).
  uint64 history_version = 9;
  // One every 10,000 events.
  repeated HistoryCursor cursors = 10;
}

// Answered with HistoryEvents: events in time order from after_cursor.
message GetHistoryEvents {
  // Empty: from the first.
  bytes after_cursor = 1;
  // 0: no end.
  int64 until_ms = 2;
  // 0: 20,000; at most 50,000.
  uint32 limit = 3;
  // Also when agents worked (HistoryEvents.run_*).
  bool include_runs = 4;
  // Empty: every event. A project's id: only its events (as
  // GetHistoryOverview.project_id counts them, each whole, every recipient
  // kept) and the runs of agents in it when the run began; start from that
  // project's cursors. A page can then hold fewer than limit, even none,
  // with next_cursor set: ask on until it's empty.
  string project_id = 5;
}

enum HistoryEventKind {
  HISTORY_EVENT_KIND_UNSPECIFIED = 0;
  // An agent's message to agents.
  HISTORY_EVENT_KIND_AGENT = 1;
  // The person's message to an agent.
  HISTORY_EVENT_KIND_PERSON = 2;
  // An agent asks the person: a card, a proposal to Rivet, a secret.
  HISTORY_EVENT_KIND_CARD = 3;
  HISTORY_EVENT_KIND_PROPOSAL = 4;
  HISTORY_EVENT_KIND_SECRET_REQUEST = 5;
  // A pipe's message reaching an agent, and an agent's going out on it.
  HISTORY_EVENT_KIND_PIPE_IN = 6;
  HISTORY_EVENT_KIND_PIPE_OUT = 7;
  // What wakes an agent: its task ending, its monitor, Claktory itself.
  HISTORY_EVENT_KIND_TASK = 8;
  HISTORY_EVENT_KIND_MONITOR = 9;
  HISTORY_EVENT_KIND_CLAKTORY = 10;
  // An app's event to an agent (Telegram, say): from the app's node.
  HISTORY_EVENT_KIND_APP = 11;
}

// Events, columnar. Node indexes: 0 is the person ("You"), i >= 1 is
// HistoryOverview.nodes[i - 1]. PERSON, TASK, MONITOR and CLAKTORY go from 0
// to the agent; CARD, PROPOSAL and SECRET_REQUEST from the agent to 0;
// PIPE_IN from the pipe's node, PIPE_OUT to it (from 0 when the person
// wrote it); APP from the app's node. Pushed to a watching connection:
// events only, never runs.
message HistoryEvents {
  int64 base_ms = 1;
  // One each per event:
  // ms from the previous event (the first: from base_ms).
  repeated sint64 dt = 2;
  repeated uint32 from = 3;
  repeated HistoryEventKind kind = 4;
  // 1: quiet; 2: a reply; (flags >> 2) & 7: its intent (0 none, 1
  // handoff, 2 decision_request, 3 decision, 4 status).
  repeated uint32 flags = 5;
  // How many of `to` are its (at least 1).
  repeated uint32 to_count = 6;
  // Each event's to_count recipients, in a row.
  repeated uint32 to = 7;
  // Runs, by start (include_runs): the agent's node, ms from the previous
  // run's start (the first: from base_ms), and how long (0: running).
  repeated uint32 run_node = 8;
  repeated sint64 run_start = 9;
  repeated uint64 run_ms = 10;
  // Empty: nothing more up to until_ms. Otherwise opaque: ask from it.
  bytes next_cursor = 11;
}

// Answered with Ack. While on, new events come as HistoryEvents and a
// changed overview as HistoryChanged; off, or the connection ending, stops
// them.
message WatchHistory {
  bool on = 1;
  // Empty: every event. A project's id: only its events, as
  // GetHistoryEvents.project_id; another project's watches again from now.
  string project_id = 2;
}

message HistoryChanged {
  uint64 history_version = 1;
}

// ---- Connecting services (one-click secrets; docs/CONNECTORS.md) ----
//
// The person connects a service's account (Cloudflare, AWS) by approving
// Claktory on the service's own site: the app opens the page, catches where
// the browser comes back and hands it to the backend (StartConnect,
// FinishConnect), which signs in itself and keeps the tokens in the vault as
// a connection (SecretInfo.connection). A connection is given to no one:
// agents get secrets made from it with narrower access (DeriveSecret,
// SecretInfo.export), given as any other.

// A service Claktory can connect.
message Connector {
  // "cloudflare", "aws".
  string id = 1;
  string name = 2;
  // What a connection gives, one sentence.
  string description = 3;
  // The access to ask for, one preselected.
  repeated ConnectorAccess accesses = 4;
  // What to ask the person before connecting (AWS: the access portal URL
  // and region), sent in StartConnect.fields.
  repeated ConnectorField fields = 5;
  ConnectorFlowKind flow = 6;
  // BROWSER: where the browser may come back to, "{port}" any port; the app
  // makes a receiver for one and sends it, port filled in, as
  // StartConnect.redirect_uri: "http://127.0.0.1:{port}/oauth/cloudflare"
  // (a loopback listener on a Mac), "com.claktory.app:/oauth/cloudflare"
  // (ASWebAuthenticationSession; com.claktory.app.dev for Claktory Dev).
  repeated string redirect_uris = 7;
  // The variables an agent given a secret made from it gets.
  repeated string variables = 8;
  // What the person needs first, one or two sentences; empty if nothing.
  string setup_note = 9;
  // Where to read about it; empty if nowhere.
  string setup_url = 10;
  // PASTE: the service's page that makes the token, with what it needs
  // filled in, as ConnectStarted.url also gives it.
  string token_url = 11;
}

message ConnectorAccess {
  string id = 1;
  // "Deploy websites".
  string label = 2;
  // What it lets Claktory do, a sentence for the person.
  string why = 3;
  // Exactly what's asked of the service: scopes or permissions.
  repeated string scopes = 4;
  bool preselected = 5;
}

message ConnectorField {
  // The key in StartConnect.fields: "start_url", "region".
  string id = 1;
  string label = 2;
  string placeholder = 3;
  string hint = 4;
  bool optional = 5;
}

enum ConnectorFlowKind {
  CONNECTOR_FLOW_KIND_UNSPECIFIED = 0;
  // The app opens the service's page and catches where the browser comes
  // back (FinishConnect).
  CONNECTOR_FLOW_KIND_BROWSER = 1;
  // The app opens a page with a code filled in; the backend asks the service
  // until the person approves. No FinishConnect.
  CONNECTOR_FLOW_KIND_DEVICE = 2;
  // The app opens the service's page that makes a token (ConnectStarted.url)
  // and asks the person to paste the token it shows, sent in
  // FinishConnect.token. The app never shows it again nor keeps it.
  CONNECTOR_FLOW_KIND_PASTE = 3;
}

// An agent's proposal to connect a service (secrets_propose_connection),
// shown in its conversation after the call and at the top of Settings →
// Secrets while it waits. The person connects it (StartConnect with its id)
// or dismisses it (DismissConnectProposal); the entry is sent again then.
// The connection made for it is given to no one, the agent included: an
// admin agent such as Rivet checks it against the proposal and gives the
// agent a secret made from it with the least access the work needs.
message ConnectProposal {
  string id = 1;
  // The agent that proposes it.
  string agent_id = 2;
  // One of VaultState.connectors.
  string connector_id = 3;
  // The ConnectorAccess it asks for; empty for the preselected one.
  string access_id = 4;
  // What it's for, in the agent's words.
  string purpose = 5;
  // The access it needs, in the agent's words: permissions, and what on
  // (zones, accounts, roles).
  string access = 6;
  // Why it needs it.
  string reason = 7;
  ConnectProposalState state = 8;
  int64 created_ms = 9;
  // When it was connected or dismissed; 0 while pending.
  int64 decided_ms = 10;
  // The person's comment on dismissing; may be empty.
  string comment = 11;
  // CONNECTED: the connection made for it.
  string secret_id = 12;
  string secret_name = 13;
  // The exact permissions it asks for, where the service takes them (AWS):
  // each an Allow statement. The connection is made with exactly these, and
  // the backend refuses one that reaches more. Empty for the others.
  repeated PolicyStatement statements = 14;
  // AWS: the region it's for ("eu-central-1"); empty for the others.
  string region = 15;
  // DISMISSED by a reply (DismissConnectProposal.reply): nothing was
  // connected, and `comment` is what the person said instead. Shown as
  // replied.
  bool replied = 16;
}

// One Allow statement of a permissions policy (AWS IAM): the actions, on the
// resources, under the condition.
message PolicyStatement {
  // "ec2:RunInstances", "s3:GetObject"; wildcards as IAM takes them
  // ("ec2:Describe*").
  repeated string actions = 1;
  // ARNs, or "*" (for actions that take no resource).
  repeated string resources = 2;
  // IAM's Condition block as compact JSON, such as
  // {"StringEquals":{"aws:RequestedRegion":"eu-central-1"}}; empty for
  // none. Shown to the person as it is.
  string condition = 3;
}

enum ConnectProposalState {
  CONNECT_PROPOSAL_STATE_UNSPECIFIED = 0;
  CONNECT_PROPOSAL_STATE_PENDING = 1;
  CONNECT_PROPOSAL_STATE_CONNECTED = 2;
  CONNECT_PROPOSAL_STATE_DISMISSED = 3;
}

// Starts connecting a service. The flow belongs to the device that asked:
// only it can finish it, and unpairing it, or a restart of the backend, ends
// it. The connection is named after the service and account ("Cloudflare
// (matt@example.com)"); UpdateSecret renames it (name and description only).
message StartConnect {
  string connector_id = 1;
  // One of its accesses; empty for the preselected one.
  string access_id = 2;
  // Its fields' values, by ConnectorField.id.
  map<string, string> fields = 3;
  // The proposal it answers; empty if none.
  string proposal_id = 4;
  // BROWSER: the receiver the app made, one of the connector's
  // redirect_uris with the port filled in. Empty for DEVICE.
  string redirect_uri = 5;
  // A connection to connect again in place (it needs reconnecting, say);
  // empty for a new one. The account must be the same.
  string secret_id = 6;
  // With proposal_id: the person's comment, told as theirs ("Matt's note:
  // …") to the agent that proposed it once it's connected. May be empty;
  // 2,000 characters at most.
  string comment = 7;
}

message ConnectStarted {
  string flow_id = 1;
  // The page to open: the service's sign-in (BROWSER), its verification
  // page with the code filled in (DEVICE), or its page that makes a token
  // (PASTE).
  string url = 2;
  // DEVICE: the code that page shows, for the person to check.
  string user_code = 3;
  // When the flow ends if not finished, in ms since 1970.
  int64 expires_ms = 4;
}

// Where the browser came back to (BROWSER): the whole URL, as it is, with
// its code and state or the service's error. Or the token the person
// pasted (PASTE). Only the device that started the flow can finish it.
message FinishConnect {
  string flow_id = 1;
  string callback_url = 2;
  // PASTE: the token, as pasted. The backend checks it with the service
  // before keeping it; one the service doesn't accept leaves the flow
  // WAITING with ConnectFlow.error saying why, to paste another.
  string token = 3;
}

// Stops a flow, or removes an ended one from VaultState.flows.
message CancelConnect {
  string flow_id = 1;
}

message ConnectFlow {
  string id = 1;
  string connector_id = 2;
  // The device it was started on.
  string device_name = 3;
  ConnectFlowState state = 4;
  // FAILED: why, a sentence for the person. WAITING (PASTE): why the token
  // pasted last didn't work; empty before one is.
  string error = 5;
  // CONNECTED: the connection (SecretInfo.id).
  string secret_id = 6;
  // The proposal it answers; empty if none.
  string proposal_id = 7;
  int64 started_ms = 8;
  int64 expires_ms = 9;
}

enum ConnectFlowState {
  CONNECT_FLOW_STATE_UNSPECIFIED = 0;
  // Waiting for the person, in the browser (PASTE: for the token; `error`
  // says why the last one pasted didn't work).
  CONNECT_FLOW_STATE_WAITING = 1;
  // Signing in with what the browser brought back (PASTE: checking the
  // token with the service).
  CONNECT_FLOW_STATE_EXCHANGING = 2;
  // Reading the account and what was granted.
  CONNECT_FLOW_STATE_CHECKING = 3;
  CONNECT_FLOW_STATE_CONNECTED = 4;
  CONNECT_FLOW_STATE_FAILED = 5;
  CONNECT_FLOW_STATE_EXPIRED = 6;
  CONNECT_FLOW_STATE_CANCELLED = 7;
}

message DismissConnectProposal {
  string proposal_id = 1;
  string comment = 2;
  // Submit (#370): `comment` is the person's reply, needed. Nothing is
  // connected: the proposal closes DISMISSED with ConnectProposal.replied,
  // and the agent is told the reply.
  bool reply = 3;
}

// A connected service's account, as the service said it was granted.
message SecretConnection {
  string connector_id = 1;
  // Whose: "matt@example.com", "d-1234567890 (us-east-1)".
  string account = 2;
  // What it can do, sentences.
  repeated string access = 3;
  // Exactly what the service granted.
  repeated string scopes = 4;
  // What it reaches: "Cloudflare account Acme", "AWS 123456789012 · ReadOnly".
  repeated string resources = 5;
  ConnectionStatus status = 6;
  // NEEDS_RECONNECT: why, a sentence.
  string problem = 7;
  // When it needs connecting again, in ms since 1970; 0 if unknown.
  int64 expires_ms = 8;
  // When its tokens were last refreshed or checked.
  int64 checked_ms = 9;
  // The proposal it was made for; empty if none.
  string proposal_id = 10;
}

enum ConnectionStatus {
  CONNECTION_STATUS_UNSPECIFIED = 0;
  CONNECTION_STATUS_READY = 1;
  // The service no longer accepts it: connect again (StartConnect.secret_id).
  CONNECTION_STATUS_NEEDS_RECONNECT = 2;
}

// A secret made from a connection, with narrower access.
message SecretExport {
  // The connection (SecretInfo.id).
  string connection_id = 1;
  // What it can do, sentences.
  repeated string access = 2;
  // Exactly: the service's permissions.
  repeated string permissions = 3;
  // What on: accounts, zones, roles.
  repeated string resources = 4;
  // When it stops working, in ms since 1970; 0 if never. Claktory renews it
  // before then while the connection lasts.
  int64 expires_ms = 5;
  // Each command gets a fresh short-lived credential (AWS).
  bool per_use = 6;
}

// What a secret can be made of from a connection (accounts, zones, roles,
// permissions), and the rules for picking (ConnectChoices.rules).
message ListConnectChoices {
  string secret_id = 1;
}

message ConnectChoices {
  string secret_id = 1;
  repeated ConnectChoice choices = 2;
  // How to pick, a sentence or two for the person: "Pick one account, at
  // least one permission, and zones of that account (none: all of them)."
  string rules = 3;
}

message ConnectChoice {
  // "account", "zone", "role", "permission".
  string kind = 1;
  // What DeriveSecret takes.
  string id = 2;
  string label = 3;
  // The choice it belongs to (a zone's or role's account); empty if none.
  string parent = 4;
  // Permissions: what it allows, a sentence.
  string why = 5;
}

// Makes a secret from a connection, given to no one yet (GrantSecret).
message DeriveSecret {
  // The connection.
  string secret_id = 1;
  // The new secret's name and description.
  string name = 2;
  string description = 3;
  // ConnectChoice ids.
  repeated string permissions = 4;
  repeated string resources = 5;
  // When it should stop working, in ms since 1970; 0 for the connector's
  // default (renewed before then while the connection lasts).
  int64 expires_ms = 6;
}

// Sets how much this device zooms the whole app (Settings.zoom): the
// device this connection is, never another. 1.0, or 0, is actual size;
// otherwise 0.5 to 2.0 (finite), or it's refused. Answered with Ack.
message SetZoom {
  double zoom = 1;
}

// Sets how many bytes of this Claktory's files this device keeps for its
// viewers (Settings.file_cache): the device this connection is, never
// another. 0 is the default (1 GB); otherwise 100,000,000 to
// 100,000,000,000, or it's refused. Answered with Ack.
message SetFileCache {
  uint64 bytes = 1;
}

// Turns Needs you's focus mode on or off (#514) for the device this
// connection is, never another (Settings.focus_mode). Answered with Ack.
message SetFocusMode {
  bool on = 1;
}

// Follows one conversation for this connection without selecting it
// (#514: focus mode's Context), beside the selected one: nothing else
// changes (the selection, `unseen`, what's read). One at a time: a new one
// replaces the last; no target stops watching. Its snapshot comes first,
// as selecting it sends it, with ServerMessage.watched, then its changes
// (see ServerMessage.watched); then the Ack. Earlier entries: LoadEntries,
// LoadChatEntries or LoadPipeMessages, as for any. NOT_FOUND for an
// unknown agent, chat or pipe.
message WatchTranscript {
  oneof target {
    string agent_id = 1;
    string chat_id = 2;
    string pipe_id = 3;
  }
}

// The device a card was decided from (Entry.answered_on,
// NeedsYouRecord.answered_on; #514).
message AnsweredOn {
  // As Welcome.device_id gives it: "local" for this computer's app.
  string device_id = 1;
  // Its name then ("Matt's iPhone"; this computer's name for "local"),
  // kept after the device is removed.
  string device_name = 2;
  // When, in ms since 1970.
  int64 at_ms = 3;
}

// Removes a connection and the secrets made from it.
message DisconnectService {
  string secret_id = 1;
  // Also revoke it at the service. Tokens made from it are deleted at the
  // service either way, where it can.
  bool revoke = 2;
}

// ---- Usage ----

// Asks for the tokens agents' model calls used in a time range, by provider,
// model, account and agent, for the Usage pane: not in the Workspace, asked
// again to refresh. Calls are counted per UTC hour, so the range's ends are
// rounded down to whole hours.
message LoadUsage {
  // From, in ms since 1970; 0 for since the first call counted.
  int64 since_ms = 1;
  // To, exclusive; 0 for now.
  int64 until_ms = 2;
  // The series' step: a whole number of hours, such as 3600000 or 86400000;
  // 0 for no series. At most 5,000 buckets.
  int64 bucket_ms = 3;
  // Where the person's days start (minutes east of UTC), for day buckets.
  int32 utc_offset_minutes = 4;
}

message UsageReport {
  // The range as applied: for all time, the first counted call's hour.
  int64 since_ms = 1;
  int64 until_ms = 2;
  // One per provider × model × account × agent with any use in the range;
  // every grouping of them adds up.
  repeated UsageRow rows = 3;
  // Every bucket of the range, empty ones too, oldest first.
  repeated UsageBucket series = 4;
  // When counting by agent (and account) began: earlier use has agent_id and
  // account_id ""; 0 if nothing's been counted by agent yet.
  int64 agents_since_ms = 5;
  // When the runs UsageBucket.working_agents comes from begin: the first
  // run's start; 0 if there's been none.
  int64 working_since_ms = 6;
}

message UsageRow {
  // "anthropic".
  string provider_id = 1;
  // "claude-opus-4-5", as the provider named it.
  string model = 2;
  // The provider account that answered (Account.id); "" when unknown.
  string account_id = 3;
  // Its label as Settings shows it (an email, a key's name); "" when unknown
  // or signed out.
  string account_label = 4;
  // "" for calls from before agents were counted.
  string agent_id = 5;
  // The agent's name at its latest counted call, so a deleted one still
  // reads right.
  string agent_name = 6;
  UsageTokens tokens = 7;
  // Model calls.
  uint64 requests = 8;
}

message UsageTokens {
  uint64 input = 1;
  uint64 output = 2;
  uint64 cache_read = 3;
  uint64 cache_write = 4;
}

message UsageBucket {
  int64 start_ms = 1;
  // All providers together.
  UsageTokens tokens = 2;
  // How many different agents made a model call in the bucket (chats
  // aren't agents). 0 before agents were counted (UsageReport.agents_since_ms).
  uint32 active_agents = 3;
  // How many agents were working at once, on average over the bucket: the
  // time their runs took in it (start to end), over the bucket's length,
  // or the length so far for the bucket now in progress. 0 before runs
  // were kept (UsageReport.working_since_ms).
  double working_agents = 4;
}

// ---- Apps ----
//
// An app is an integration Claktory runs once, for every agent: a Telegram
// bot, say. It runs sandboxed (a WebAssembly component in Claktory's apps
// host), reaches only the hosts the person approved, and keeps its own
// state and secrets (vault secrets given to it, never to agents). It offers
// agents tools, grouped into scopes the person gives agents (GrantApp), and
// events, which reach the agents subscribed to them (SubscribeApp) that
// have the event's scope.

message AppInfo {
  // Lowercase letters and digits ("telegram"); its tools' names start with
  // it and "_".
  string id = 1;
  string name = 2;
  string version = 3;
  // Who made it, as its manifest says ("claktory").
  string publisher = 4;
  AppTier tier = 5;
  // A Lucide icon name; empty for the default.
  string icon = 6;
  AppState state = 7;
  // About the state, a sentence for the person: why it's paused or couldn't
  // start (the last error); empty when there's nothing to say.
  string state_detail = 8;
  repeated AppScopeSpec scopes = 9;
  repeated AppEventKind events = 10;
  // The hosts it may reach over HTTPS ("api.telegram.org").
  repeated string hosts = 11;
  // The agents given scopes of it.
  repeated AppGrant grants = 12;
  // One for each of its event kinds that some agent hears.
  repeated AppSubscription subscriptions = 13;
  // What its setup asks for, done or not.
  repeated AppSetupItem setup = 14;
  // The app's own line for the person, as it sets it: how to finish its
  // setup, or what's wrong ("To link your Telegram, open
  // https://t.me/…"). Plain text; addresses in it are links. Empty for none.
  string status = 15;
  string description = 16;
  int64 installed_ms = 17;
  // Its publisher's signing key, as "ed25519:" and its first 16 base64
  // characters.
  string publisher_key = 18;
  // The views the person can open (OpenAppView), the first being its main
  // one; empty for an app with none.
  repeated AppViewSpec views = 19;
  // The data it can be given to read, each granted or not (GrantAppSource):
  // Claktory's records, and an agent's own database for each agent it asks
  // for (every agent, when it asks for any).
  repeated AppDataSource sources = 20;
  // One of Claktory's own apps that this release ships (BundledApp):
  // Claktory installs it by itself, granting it nothing, and updates it
  // when a newer one ships with nothing new to approve.
  bool bundled = 21;
  // Its manifest asks to read files the person chooses ([[data]] kind
  // "file"): show "Add a file…", which gives one with GrantAppSource
  // (APP_DATA_KIND_FILE says how a file's id reads). `sources` lists only
  // the files given.
  bool reads_files = 22;
}

// Data an app reads, only once the person grants it, and always read
// only: SQL it runs in Claktory, one statement at a time. Agents' memory,
// pipes and comments on files are never readable.
message AppDataSource {
  // "activity", "conversations", "agent:<agent id>", "file:<place>:<path>"
  // (APP_DATA_KIND_FILE), or "factory-records" (all of Claktory's records:
  // offered no more, and listed only where it was granted before);
  // GrantAppSource names it.
  string id = 1;
  AppDataKind kind = 2;
  // AGENT_DATABASE: whose. In AppPermissions, "*" when the app asks for
  // any agent's (the person chooses which once it's installed).
  string agent_id = 3;
  // For the person: "Claktory's records", "Lea's database".
  string label = 4;
  // Why the app asks, as its manifest says; may be empty.
  string reason = 5;
  // Always false in AppPermissions: installing grants nothing.
  bool granted = 6;
  // What it holds, a line for the person: "Runs, background tasks,
  // monitors, checklist counts and token use. No message text."
  string holds = 7;
  // It holds people's words (what you and your agents wrote, or whatever an
  // agent keeps in its database): conversations, an agent's database, and
  // all of Claktory's records. Shown apart, and when the app can reach the
  // internet, the card says this data could leave this computer.
  bool private = 8;
  // In AppInfo.sources, granted: who gave it and when (AppGrant.given).
  AppAccessGiven given = 9;
}

enum AppDataKind {
  APP_DATA_KIND_UNSPECIFIED = 0;
  // Claktory's records (factory.db): agents, runs, usage, messages, tasks…
  APP_DATA_KIND_FACTORY_RECORDS = 1;
  // An agent's own database (its Database extension's).
  APP_DATA_KIND_AGENT_DATABASE = 2;
  // Activity: runs, background tasks, monitors, checklist items, messages
  // and token use, as ids, agents, times, states and counts; never their
  // text.
  APP_DATA_KIND_ACTIVITY = 3;
  // Conversations: the messages your agents got, from you, other agents
  // and events, with their text.
  APP_DATA_KIND_CONVERSATIONS = 4;
  // A CSV or TSV file the person (or Rivet, on a card) chose, read as one
  // table, `rows`, at every query. AppDataSource.id is
  // "file:<place>:<path>": the place "workspace", a project's id or
  // "<project id>/<folder id>", the path in that folder with "/" between
  // names (no name starting with "."), such as
  // "file:web-site:reports/bugs.csv"; label "reports/bugs.csv in Web Site",
  // holds the file's full path. Another path is another source. In
  // AppPermissions, one entry with id "file:*" says the app reads files
  // the person chooses. Give one with GrantAppSource (source_id the id):
  // it's refused, saying why, when the file can't be read by an app (a
  // symbolic link or a hidden name in its path, inside Claktory's own
  // folder but its workspace, not a regular file, several hard links, over
  // 10 MB).
  APP_DATA_KIND_FILE = 5;
}

// Grants the app the data source `source_id` (AppDataSource.id), or takes
// it back: its next query sees the change. Answered with Ack.
message GrantAppSource {
  string app_id = 1;
  string source_id = 2;
  bool granted = 3;
}

// Pins an installed app to the dock at `position` among the pinned ones (0
// first; past the end, or below 0, last), moving it if it's pinned already;
// or, with `pinned` false, unpins it. Answered with Ack. Installing an app
// with views pins it last, once: one the person unpinned stays unpinned
// through updates.
message PinApp {
  string app_id = 1;
  bool pinned = 2;
  int32 position = 3;
}

message AppViewSpec {
  // Lowercase letters, digits, - and _.
  string id = 1;
  // For the pane's header or the screen's bar ("Charts").
  string title = 2;
}

// ---- App views ----
//
// An app with views shows them as surfaces: A2UI v1.0
// (https://a2ui.org/specification/v1.0-a2ui/) messages, with components
// from Claktory's own catalog ("https://claktory.com/a2ui/catalog/v1"),
// which the backend checks before any app sees them and which apps render
// natively. A surface is one view of one app with one set of params, the
// same for every device showing it; the backend keeps what it shows (the
// components and the data model) and sends it whole to a device that
// opens it, then each change. Surfaces live in the backend's memory: after
// reconnecting, open them again.

// Opens one of an app's views for this connection: answered with
// AppSurface. The same view with the same params is the one surface
// already open, if there is one. Until CloseAppView (or the connection
// ends) this connection gets the surface's AppSurface and AppViewUpdate
// messages. Asked again, it answers a fresh snapshot (after a gap in
// AppViewUpdate.seq, say). NOT_FOUND when there's no such app or view.
message OpenAppView {
  string app_id = 1;
  // AppViewSpec.id; empty for the app's first view.
  string view = 2;
  // A JSON object, or empty; at most 4 KiB.
  string params = 3;
  // The A2UI catalogs this app renders. Without the surface's, the answer
  // is UNSUPPORTED and nothing is opened.
  repeated string catalogs = 4;
}

// This connection no longer shows the surface: answered with Ack. Once no
// connection has shown it for 10 s, the app is told it's closed.
message CloseAppView {
  string surface_id = 1;
}

// Something the person did in a surface: answered with Ack once it's
// checked and handed to the app, not once the app has handled it (what it
// changes comes as AppViewUpdate). NOT_FOUND when the surface isn't open:
// open the view again.
message AppViewAction {
  string surface_id = 1;
  // One A2UI v1.0 renderer message, JSON: {"version":"1.0","action":{name,
  // surfaceId, sourceComponentId, timestamp, context}}, from a component of
  // the surface whose action has that name; or {"version":"1.0","error":
  // {code, message, surfaceId}}. At most 64 KiB.
  string message = 2;
}

message AppSurface {
  // "<app id>-<hex>": unique while the backend runs.
  string surface_id = 1;
  string app_id = 2;
  string view = 3;
  // As a canonical JSON object ("{}" for none).
  string params = 4;
  // AppViewSpec.title.
  string title = 5;
  AppSurfaceState state = 6;
  // Why it's STOPPED, FAILED or CLOSED, a sentence for the person; empty
  // otherwise.
  string error = 7;
  // The catalog its components come from.
  string catalog = 8;
  // The last change folded into `snapshot`: AppViewUpdates after it apply.
  uint64 seq = 9;
  // All it shows now, as one A2UI v1.0 message, JSON: {"version":"1.0",
  // "createSurface":{surfaceId, catalogId, components, dataModel}}. Empty
  // before the app made it (OPENING, STOPPED); kept when FAILED or CLOSED,
  // to show under the error.
  string snapshot = 10;
}

enum AppSurfaceState {
  APP_SURFACE_STATE_UNSPECIFIED = 0;
  // The app is making it.
  APP_SURFACE_STATE_OPENING = 1;
  APP_SURFACE_STATE_OPEN = 2;
  // The app isn't running (turned off, crashed, updating): it opens again
  // by itself when the app runs again.
  APP_SURFACE_STATE_STOPPED = 3;
  // The app sent something invalid, or couldn't open it (`error` says
  // what). It stays so: OpenAppView again opens a new surface.
  APP_SURFACE_STATE_FAILED = 4;
  // The app closed it, or was uninstalled. OpenAppView again for a new one.
  APP_SURFACE_STATE_CLOSED = 5;
  // This app doesn't render the surface's catalog: only in the answer to
  // OpenAppView, which opened nothing.
  APP_SURFACE_STATE_UNSUPPORTED = 6;
}

// One change to what a surface shows.
message AppViewUpdate {
  string surface_id = 1;
  // One more than the change before it. Apply it when it follows the
  // snapshot's seq (or the last update's); ignore it when it isn't newer;
  // when it skips one, OpenAppView again for a fresh snapshot.
  uint64 seq = 2;
  // One A2UI v1.0 message, JSON, as the backend checked it:
  // updateComponents, updateDataModel or deleteSurface (never
  // createSurface: that's the snapshot).
  string message = 3;
}

enum AppTier {
  APP_TIER_UNSPECIFIED = 0;
  // Made by Claktory: signed with Claktory's key.
  APP_TIER_CLAKTORY = 1;
  APP_TIER_VERIFIED = 2;
  APP_TIER_COMMUNITY = 3;
  // Installed from a file, signed by its own developer's key.
  APP_TIER_LOCAL = 4;
}

enum AppState {
  APP_STATE_UNSPECIFIED = 0;
  // Turned off (SetAppRunning).
  APP_STATE_STOPPED = 1;
  APP_STATE_STARTING = 2;
  APP_STATE_RUNNING = 3;
  // Waiting for something in `setup`; it starts once that's done.
  APP_STATE_NEEDS_SETUP = 4;
  // It crashed three times in ten minutes: off until the person starts it
  // again (`state_detail` says why).
  APP_STATE_PAUSED_CRASHED = 5;
  // It crashed and starts again shortly.
  APP_STATE_RESTARTING = 6;
  // Claktory can't run it here: the apps host is missing or failed
  // (`state_detail` says why).
  APP_STATE_UNAVAILABLE = 7;
}

message AppScopeSpec {
  string id = 1;
  // What it lets an agent do, for the person ("Send you Telegram messages").
  string label = 2;
  // The tools it gives.
  repeated string tools = 3;
  // Its tools can hand the agent what the app reads from the sources it's
  // given (Charts' "Change dashboards", with charts_query): the agent reads
  // that data too.
  bool reads_data = 4;
}

message AppEventKind {
  string kind = 1;
  // For the person ("A message you send the bot").
  string label = 2;
  // The scope an agent needs to hear it.
  string scope = 3;
}

message AppGrant {
  string agent_id = 1;
  repeated string scopes = 2;
  // In AppInfo.grants: who gave this agent its scopes as they are, and
  // when; unset when that wasn't recorded (before Claktory kept it, or an
  // edit of the settings file).
  AppAccessGiven given = 3;
}

// Who changed an app's access to what it is, and when: the last recorded
// change that set it (AppInfo's grants and sources).
message AppAccessGiven {
  // The admin agent that applied it (Rivet); empty when the person did,
  // themselves or by approving Rivet's card (by_card).
  string by_agent_id = 1;
  int64 at_ms = 2;
  // The change that set it: UndoAppAccessChange names it.
  string change_id = 3;
  // The person approved it on Rivet's card (AppAccessProposal).
  bool by_card = 4;
}

// Undoes a recorded change to an app's access (AppAccessGiven.change_id,
// NeedsYouRecord.app_change_id): each source, agent's scopes and events it
// changed that are still as it left them go back to what they were before
// it; any changed since is left as it is. The undo is a change of its own,
// recorded, which can be undone in turn. Answered with AppAccessUndone.
message UndoAppAccessChange {
  string change_id = 1;
}

// See ClientMessage.undo_model_change.
message UndoModelChange {
  string change_id = 1;
}

// The CSV and TSV files in the workspace and in every project and project
// folder that the app (AppInfo.reads_files) could be given, newest first,
// at most 200: each place's files, never through a symbolic link, under a
// name starting with ".", in node_modules or target, or (from the
// workspace) in a project's own folder, which lists them itself. Refused
// for an app that doesn't read files.
message ListAppFiles {
  string app_id = 1;
  // Only those whose label has these words (any case); empty for all.
  string query = 2;
}

message AppFiles {
  repeated AppFileChoice files = 1;
  // There were more than shown (past 200, or more than it looks through):
  // say so, and let the person narrow it with the query.
  bool truncated = 2;
}

// A file that could be given. Give it with GrantAppSource (source_id: id),
// which checks it again.
message AppFileChoice {
  // "file:web-site:reports/bugs.csv" (APP_DATA_KIND_FILE).
  string id = 1;
  // "reports/bugs.csv in Web Site".
  string label = 2;
  int64 size_bytes = 3;
  int64 modified_ms = 4;
  // Set when it shows but can't be given, in Claktory's words ("It's over
  // 10 MB, more than an app can read."); show it, and don't offer it.
  string why = 5;
}

message AppAccessUndone {
  // The undo's own change; empty when nothing was left to undo.
  string change_id = 1;
  // What was left as it is because it changed since, a sentence each for
  // the person ("Ingrid's scopes on Charts changed since, so they were
  // left as they are.").
  repeated string kept = 2;
}

message AppSubscription {
  string event_kind = 1;
  repeated string agent_ids = 2;
}

message AppSetupItem {
  AppSetupKind kind = 1;
  // A secret's name, as the manifest gives it ("bot_token").
  string name = 2;
  string label = 3;
  // How to get it, for the person.
  string description = 4;
  bool done = 5;
}

enum AppSetupKind {
  APP_SETUP_KIND_UNSPECIFIED = 0;
  // A secret to paste: SetAppSecret.
  APP_SETUP_KIND_SECRET = 1;
}

// Installs an app from a .clapp: its bytes (`content`, at most 16 MiB), or
// a file on the Claktory's machine (`path`, when `content` is empty). Ask
// first without `approve` for AppPermissions; then again with the same
// file, `approve` and its sha256.
message InstallLocalApp {
  string path = 1;
  bool approve = 2;
  // With `approve`: AppPermissions.sha256, so what's installed is the file
  // the person reviewed.
  string sha256 = 3;
  bytes content = 4;
  // A bundled app's id (BundledApp.id): installs the file this release
  // ships, through the same checks as any file; path and content are
  // ignored. Without `approve`, answered with AppPermissions as usual (its
  // `added` saying what's new for an update); then again with `approve`
  // and its sha256.
  string bundled = 5;
}

// What an app can reach, for the person to approve before it's installed.
message AppPermissions {
  // InstallLocalApp.path; empty for one sent as `content`.
  string path = 1;
  // The file's SHA-256, hex.
  string sha256 = 2;
  string id = 3;
  string name = 4;
  string version = 5;
  string publisher = 6;
  AppTier tier = 7;
  // As AppInfo.publisher_key.
  string publisher_key = 8;
  string description = 9;
  string icon = 10;
  repeated string hosts = 11;
  repeated AppScopeSpec scopes = 12;
  repeated AppEventKind events = 13;
  // The secrets its setup will ask for (`done` false).
  repeated AppSetupItem secrets = 14;
  uint32 memory_mb = 15;
  uint32 storage_mb = 16;
  // When a version of it is installed: that version, and what this one can
  // reach that it couldn't, a sentence each ("Reach example.com."); empty
  // otherwise.
  string installed_version = 17;
  repeated string added = 18;
  // The data it asks to read (none granted yet).
  repeated AppDataSource sources = 19;
}

message SetAppRunning {
  string id = 1;
  bool running = 2;
}

message UninstallApp {
  string id = 1;
  // Keep its stored data, for a later install.
  bool keep_data = 2;
}

// Gives the agent these scopes of the app, in place of what it had; none
// takes the app away from it (and its subscriptions).
message GrantApp {
  string app_id = 1;
  string agent_id = 2;
  repeated string scopes = 3;
}

// The agents that hear the app's events of `event_kind`, in place of those
// that did; each needs the event's scope.
message SubscribeApp {
  string app_id = 1;
  string event_kind = 2;
  repeated string agent_ids = 3;
}

// Keeps the value in the vault as a secret given to the app (never to an
// agent), replacing what it had; it never comes back to a client.
message SetAppSecret {
  string app_id = 1;
  string name = 2;
  string value = 3;
}

// ---- Pipes ----
//
// A pipe is a chat between one of this Claktory's projects and one of
// another Claktory's, both people having approved it. The agents granted it
// (its members) write in it with their pipe tools, the lead hears each
// incoming message as an event, and the person can write in it too. It lives
// in the backend (factory.db), never in config.json, so no agent can make or
// approve one; approvals are the person's only.

message Pipe {
  // This Claktory's id for it (the other side has its own).
  string id = 1;
  // Its name on this side, such as "Website ⇄ Marketing".
  string name = 2;
  // The project at this end.
  string project_id = 3;
  PipeState state = 4;
  // PAUSED: why.
  PipePause paused = 5;
  // ms since 1970.
  int64 created_ms = 6;
  // The other side, as it describes itself; unset while INVITED.
  PipePeer peer = 7;
  // What this side says the pipe is for, in a line: the other side sees it.
  string purpose = 8;
  // This side's prompt for it, added to its members' context after the
  // fixed safety prompt. The other side never sees it.
  string prompt = 9;
  // The agents granted it, by id: they have its tools (the pipe:<id>
  // extension instance).
  repeated string member_ids = 10;
  // The member woken by each incoming message; empty when none is, which
  // Claktory allows only while the pipe has no agents (unanswered_seqs).
  string lead_id = 11;
  PipeLimits limits = 12;
  // Every outgoing message from an agent waits for the person's Send or
  // Discard (PIPE_MESSAGE_STATE_HELD). Off for a new pipe; a pipe made
  // before keeps what it had.
  bool review_outgoing = 13;
  // APPROVAL: the four digits both people must see alike before approving.
  string digits = 14;
  // INVITED: when the invite code stops working, in ms since 1970.
  int64 invite_expires_ms = 15;
  // Whether the other Claktory is connected now, and when it last was (ms
  // since 1970; 0 if never).
  bool online = 16;
  int64 last_seen_ms = 17;
  // Messages from this side not yet delivered ("3 waiting").
  uint32 queued = 18;
  // Something new the person hasn't seen: a message since they last showed
  // the pipe (SelectPipe clears it).
  bool unseen = 19;
  // Messages waiting for the person's decision (held outgoing, held
  // incoming), by PipeMessage.seq: like Agent.waiting_seqs, for "Needs you".
  repeated uint64 waiting_seqs = 20;
  // Members quarantined for it (Agent.quarantined): they can only read and
  // answer it and draft files in its outbox. A liaison agent is, from the
  // moment it's made; so is each member whose role was "Liaison" when
  // quarantine came.
  repeated string quarantined_ids = 21;
  // Members that can run commands on this computer (every member not
  // quarantined): the approval and settings screens warn about each, since
  // a misleading message from the other side could make it reach the
  // person's files, keys and network.
  repeated string can_run_commands_ids = 22;
  // Why the other Claktory can't be reached right now, in a short line
  // ("no answer in time"), while JOINING (each failed try of the join,
  // which keeps retrying until the code expires) or once an established
  // link loses its peer. Empty while it's reachable, and before anything
  // has tried.
  string offline_reason = 23;
  // When reaching it started failing, in ms since 1970; 0 while it's
  // reachable.
  int64 offline_since_ms = 24;
  // Every message from the other side waits for the person's Let in or
  // Discard (PIPE_MESSAGE_STATE_HELD_INCOMING, its note saying why) before
  // any agent can read it, whoever the other side says wrote it; its files
  // stay outside the inbox until then. Off for a new pipe.
  bool review_incoming = 25;
  // The name a new liaison would get now (ApprovePipe.liaison_name,
  // AddPipeLiaison.name): one no agent of the project has, the same until
  // one is taken. Prefill it; the person can change it.
  string suggested_liaison_name = 26;
  // Its folder's name in the project's folder's pipes/, as it is on disk
  // ("acme-launch-ab12cd"): the inbox, the outbox and a deleted liaison's
  // conversation are in it. Text to show; it may be on another computer.
  string folder = 27;
  // Where its liaison forwards finished reports. Unset or an empty
  // recipient: no one.
  PipeForward forward = 28;
  // Its reports' counts, for its settings and the Map.
  PipeReportCounts reports = 29;
  // Messages from the other side that no agent of this side was told of,
  // because the pipe has no lead (it has no agents: a pipe with agents
  // always has one, lead_id). They're the person's to read and answer,
  // counted in Needs you until an agent leads the pipe and is told of them.
  repeated uint64 unanswered_seqs = 30;
  // The other side says its liaison is waiting (#343 U18): it answers
  // later. Only while OPEN. Show it in this side's own words with this
  // side's `name`, never anything the other side wrote: "{name} is waiting
  // until Fri 18:00", or "{name} is waiting" when peer_waiting_until_ms is 0.
  // This side's own liaison's wait is its lead's Agent.usage_wait.
  bool peer_waiting = 31;
  // Until when, in ms since 1970: checked here, in the future and at most
  // 8 days ahead, rounded up to a quarter of an hour by the other side.
  // 0 when there's no known end (out of credit, say) or none that holds.
  int64 peer_waiting_until_ms = 32;
  // The group it's in (Workspace.pipe_groups); empty for none.
  string group_id = 33;
  // APPROVAL: the agent a reply goes to (ApprovePipe.reply, #370): the one
  // whose card started the pipe, else the admin agent with Pipes; empty
  // when there's none (a reply is refused then) and in other states.
  string reply_agent_id = 34;
  // Members that only send to it (#414), among member_ids: pipe_send and
  // pipe_status, never reading it, never woken by what arrives or told
  // what the other side says, never its lead. Any agent of this Claktory,
  // its project's or not (Rivet, say). Never quarantined as well, and not
  // in can_run_commands_ids.
  repeated string send_only_ids = 35;
  // #414: agents that can't be on this pipe in any role (member, sending
  // only, lead): each is another pipe's liaison, made for that pipe alone,
  // with why ("Freya is Partners' liaison: it reads that pipe, so it can't
  // use another."). Shown disabled with the reason, or left out; the
  // backend refuses them whoever asks. Empty for a closed pipe. Limiting
  // an agent on several pipes stays the person's choice (Fugo 32063).
  repeated PipeAgentHeld held_agents = 36;
  // Unused, always empty: limiting an agent is never refused by #414's
  // boundary (Fugo 32063), and a liaison is only ever a new agent.
  repeated PipeAgentHeld cant_limit = 37;
}

enum PipeState {
  PIPE_STATE_UNSPECIFIED = 0;
  // This side made an invite; nobody has used its code yet.
  PIPE_STATE_INVITED = 1;
  // This side used a code and is reaching the other Claktory.
  PIPE_STATE_JOINING = 2;
  // Both Claktories are connected: waiting for this person to approve
  // (ApprovePipe), checking `digits`.
  PIPE_STATE_APPROVAL = 3;
  // This person approved; waiting for the other's.
  PIPE_STATE_WAITING_PEER = 4;
  // Both approved: messages flow.
  PIPE_STATE_OPEN = 5;
  // Nothing flows until it's resumed; `paused` says why.
  PIPE_STATE_PAUSED = 6;
  // Closed by either side, denied, or its invite expired: it keeps its
  // history until deleted, and can't open again.
  PIPE_STATE_CLOSED = 7;
}

enum PipePause {
  PIPE_PAUSE_UNSPECIFIED = 0;
  // This person paused it.
  PIPE_PAUSE_BY_ME = 1;
  // The other side paused it: only they can resume.
  PIPE_PAUSE_BY_PEER = 2;
  // The loop breaker: agents exchanged 10 messages with no person writing
  // on either side, or repeated themselves. Resuming is "Continue".
  PIPE_PAUSE_LOOP = 3;
}

// The other side of a pipe, as it describes itself.
message PipePeer {
  // Its Claktory's name.
  string claktory_name = 1;
  // Its person, as they named themselves, and their email when signed in;
  // either may be empty. Claimed, not checked: see `verified`.
  string owner_name = 2;
  string owner_email = 3;
  // Claktory's account service (claktory.com) vouches, now, that this
  // pipe's Claktory belongs to the account with `verified_email`: both
  // sides are signed in to it, and the statement checked here. It says
  // whose Claktory it is, not who the person is. False: show "Not
  // verified" (or what identity_change says).
  bool verified = 4;
  // The project at its end, and what it says the pipe is for.
  string project_name = 5;
  string purpose = 6;
  // The email the account service vouches for now: with `verified`, or
  // the new one an identity change names; empty when there's none.
  string verified_email = 7;
  // How who it is changed since the person last accepted it (or since it
  // was first verified); NONE when it didn't.
  PipeIdentityChange identity_change = 8;
  // The email it was verified as before the change, for its warning.
  string previous_email = 9;
}

// How a pipe's other side changed from the identity pinned with the pipe.
// Only a statement checked here raises one: while this Claktory can't
// check (signed out, or another account service), nothing changes.
enum PipeIdentityChange {
  PIPE_IDENTITY_CHANGE_NONE = 0;
  // It stopped being vouched for: its statement ran out (a week) or it
  // signed out. "No longer verified"; nothing is held.
  // AcceptPipeIdentity dismisses it.
  PIPE_IDENTITY_CHANGE_LAPSED = 1;
  // The same account, with another email (verified_email; previous_email
  // the old one): a notice, nothing held. AcceptPipeIdentity dismisses it.
  PIPE_IDENTITY_CHANGE_EMAIL_CHANGED = 2;
  // Another account (verified_email, if it's vouched for; previous_email
  // the old one): a warning in red. Until AcceptPipeIdentity, what comes
  // from the other side waits for the person (HELD_INCOMING) and agents
  // can't send to it; the person still can.
  PIPE_IDENTITY_CHANGE_ACCOUNT_CHANGED = 3;
}

message AcceptPipeIdentity {
  string pipe_id = 1;
  // Accepted from an agent's card (AskPerson.pipe_trust, #471 G7): its id.
  // The backend checks the card is still waiting, for this pipe and for
  // the change the pipe shows now.
  string card_id = 2;
}

message PipeLimits {
  // Messages each way an hour, and at most this many in a row at once.
  uint32 messages_per_hour = 1;
  uint32 burst = 2;
  // Megabytes of files sent a day.
  uint32 file_mb_per_day = 3;
  // What's left of them now (read-only: ignored in UpdatePipe).
  uint32 messages_left = 4;
  uint32 file_mb_left = 5;
}

// One message in a pipe, or a line from Claktory about it (approved,
// paused, closed…).
message PipeMessage {
  // Its place in this side's chat, from 1; unique per pipe, never reused.
  uint64 seq = 1;
  // ms since 1970: when it was written (sent, or received).
  int64 timestamp_ms = 2;
  PipeAuthor author = 3;
  string text = 4;
  repeated PipeFile files = 5;
  PipeMessageState state = 6;
  // REFUSED: why, for the person ("It contains your secret AWS."); HELD
  // with files from outside the outbox: which; HELD_INCOMING: why it's held;
  // DISCARDED with `replied`: the person's reply.
  string note = 7;
  // DISCARDED by a reply (DecidePipeMessage.reply): never sent; the person
  // sent it back to its writer with `note`. Shown as sent back.
  bool replied = 8;
  // A Claktory line announcing a website the other side shares with this
  // one ("Ana shares Dashboard."): that share's PipeShare.id, for Open and
  // Copy address on the line while the share is in Workspace.pipe_shares.
  // Empty on every other message.
  string share_id = 9;
}

message PipeAuthor {
  PipeAuthorKind kind = 1;
  // Their agent's or their person's name, or my agent's.
  string name = 2;
  // Their agent's role, as it says; empty otherwise.
  string role = 3;
  // MY_AGENT: its id.
  string agent_id = 4;
}

enum PipeAuthorKind {
  PIPE_AUTHOR_KIND_UNSPECIFIED = 0;
  // An agent on the other side, as it says.
  PIPE_AUTHOR_KIND_THEIR_AGENT = 1;
  // The other side says its person wrote it: "says it's from <name>".
  PIPE_AUTHOR_KIND_THEIR_PERSON = 2;
  PIPE_AUTHOR_KIND_MY_AGENT = 3;
  // This Claktory's person.
  PIPE_AUTHOR_KIND_ME = 4;
  // Claktory, about the pipe: shown as a line, not a bubble.
  PIPE_AUTHOR_KIND_CLAKTORY = 5;
}

message PipeFile {
  string name = 1;
  uint64 size = 2;
  // Where it is on the machine Claktory runs on: in the pipe's outbox for
  // one sent, its inbox for one received.
  string path = 3;
}

enum PipeMessageState {
  PIPE_MESSAGE_STATE_UNSPECIFIED = 0;
  // Outgoing, waiting for the person's Send or Discard (DecidePipeMessage):
  // Review outgoing is on, or it carries files from outside the outbox.
  PIPE_MESSAGE_STATE_HELD = 1;
  // Outgoing, passed: on its way (the other side may be offline).
  PIPE_MESSAGE_STATE_QUEUED = 2;
  // Outgoing, and the other side has it.
  PIPE_MESSAGE_STATE_DELIVERED = 3;
  // Outgoing, and stopped: by Claktory (a secret in it, too big, over the
  // limit) or by the other side. `note` says why. Never sent.
  PIPE_MESSAGE_STATE_REFUSED = 4;
  // Outgoing, and the person discarded it. Never sent.
  PIPE_MESSAGE_STATE_DISCARDED = 5;
  // Incoming, and in: the lead was told.
  PIPE_MESSAGE_STATE_RECEIVED = 6;
  // Incoming over the rate limit: no agent sees it until the person lets
  // it in (DecidePipeMessage).
  PIPE_MESSAGE_STATE_HELD_INCOMING = 7;
}

// Makes an invite for a pipe from `project_id`: the pipe appears as
// INVITED, and the code is answered with PipeInvite to the asker only.
message CreatePipeInvite {
  string project_id = 1;
  // The pipe's name on this side, and what this side says it's for (the
  // other side sees both before accepting).
  string name = 2;
  string purpose = 3;
  // Made from an agent's card (PipeStart.id): it shows the invite made.
  string start_id = 4;
}

message PipeInvite {
  string pipe_id = 1;
  // claktory-pipe://…: for the other person to paste in their Claktory.
  // Works once, until Pipe.invite_expires_ms.
  string code = 2;
}

// Reads an invite code without using it, for the Accept screen: answered
// with PipeInvitePreview; INVALID_REQUEST for a code that isn't one.
message ReadPipeInvite {
  string code = 1;
}

message PipeInvitePreview {
  string code = 1;
  // The inviting side, as the code describes it (`verified` false).
  PipePeer peer = 2;
  // The pipe's name, as the inviter named it.
  string name = 3;
  // When the code stops working, in ms since 1970.
  int64 expires_ms = 4;
}

// Uses an invite code for a pipe to `project_id`: the pipe appears as
// JOINING, selected (Workspace.selected_pipe_id), then APPROVAL once the
// other Claktory answers (or CLOSED, with a line saying why, when it
// can't). Answered with Ack.
message AcceptPipeInvite {
  string code = 1;
  string project_id = 2;
  // Its name on this side; empty takes the inviter's.
  string name = 3;
  // What this side says it's for.
  string purpose = 4;
  // Connected from an agent's card (PipeStart.id): it shows the pipe.
  string start_id = 5;
}

// The person's decision on a pipe in APPROVAL. Approving needs a lead
// among the members, or `liaison_name`. Denying closes it.
message ApprovePipe {
  string pipe_id = 1;
  bool approve = 2;
  repeated string member_ids = 3;
  string lead_id = 4;
  // Makes a liaison agent of that name in the pipe's project (see
  // AddPipeLiaison), a member and the lead.
  string liaison_name = 5;
  // Members to quarantine (Pipe.quarantined_ids), among member_ids; unset
  // quarantines none of them. The liaison is quarantined either way.
  PipeMembers quarantined = 6;
  // Review incoming and Review outgoing (Pipe.review_incoming,
  // Pipe.review_outgoing); unset leaves them as they are (off for a new
  // pipe).
  optional bool review_incoming = 7;
  optional bool review_outgoing = 8;
  // The person's comment, told as theirs ("Matt's note: …") to the lead
  // when approved, or, turned down, to the agent whose card started the
  // pipe (else the admin agent with Pipes); never to the other side. May
  // be empty; 2,000 characters at most.
  string comment = 9;
  // Submit (#370): `comment` is the person's reply, needed; nothing else
  // is read. The pipe stays waiting for approval, unchanged; the agent whose
  // card started it (else the admin agent with Pipes) is told the reply.
  bool reply = 10;
  // Members that only send to it (Pipe.send_only_ids), among member_ids;
  // unset makes none. They may be agents outside the pipe's project; none
  // is the lead or quarantined.
  PipeMembers send_only = 11;
  // Approved from an agent's card (AskPerson.pipe_approval, #471 G1): that
  // card's id (AskPerson.id). Every check of a plain ApprovePipe runs, then
  // the card's: still pending, about this pipe, the pipe waiting for this
  // side's approval with the other side's key the card was asked for. The
  // card is then answered, and its agent told only that the person approved
  // the pipe (never the comment, which goes to the lead as always).
  // Refused otherwise, saying why, and nothing changes. Only with approve.
  string card_id = 12;
}

// Changes a pipe's settings; unset fields stay as they are.
message UpdatePipe {
  string pipe_id = 1;
  optional string name = 2;
  optional string prompt = 3;
  optional string purpose = 4;
  PipeMembers members = 5;
  optional string lead_id = 6;
  PipeLimits limits = 7;
  optional bool review_outgoing = 8;
  // The members quarantined for it (Pipe.quarantined_ids), all of them;
  // ids that aren't members are refused. A member left out is released:
  // it gets its usual tools back. Only the person can
  // send this: no agent tool reaches it.
  PipeMembers quarantined = 9;
  // Pipe.review_incoming. Turning it off lets nothing in: messages already
  // waiting still wait for Let in or Discard.
  optional bool review_incoming = 10;
  // The members that only send to it (Pipe.send_only_ids), all of them;
  // ids that aren't members are refused, and so is one that's quarantined
  // or the lead. A member left out reads the pipe as before. Agents
  // outside the pipe's project may be members only this way.
  PipeMembers send_only = 11;
}

// An agent a pipe can't take as it asks (Pipe.held_agents, Pipe.cant_limit),
// and why, in the backend's words for the person.
message PipeAgentHeld {
  string agent_id = 1;
  string reason = 2;
}

message PipeMembers {
  repeated string agent_ids = 1;
}

// Pauses, resumes (Continue, after the loop breaker), closes or deletes a
// pipe. Delete removes a closed pipe and its history from this side.
message SetPipeState {
  string pipe_id = 1;
  PipeAction action = 2;
}

enum PipeAction {
  PIPE_ACTION_UNSPECIFIED = 0;
  PIPE_ACTION_PAUSE = 1;
  PIPE_ACTION_RESUME = 2;
  PIPE_ACTION_CLOSE = 3;
  PIPE_ACTION_DELETE = 4;
}

// Shows the pipe in every client's main pane (Workspace.selected_pipe_id):
// answered with PipeTranscript, and clears Pipe.unseen.
message SelectPipe {
  string pipe_id = 1;
}

// The person writes in a pipe; it goes out as theirs, unheld.
message SendPipeMessage {
  string pipe_id = 1;
  string text = 2;
}

// The person's decision on a held message: HELD (send or discard it) or
// HELD_INCOMING (let it in, or discard it).
message DecidePipeMessage {
  string pipe_id = 1;
  uint64 seq = 2;
  bool allow = 3;
  // The person's comment, told as theirs ("Matt's note: …") to the agent
  // that wrote a held outgoing message, or to the pipe's lead for a held
  // incoming one; never to the other side. May be empty; 2,000 characters
  // at most.
  string comment = 4;
  // Submit (#370), on a held outgoing message only: `comment` is the
  // person's reply, needed; `allow` is ignored. The message isn't sent: it
  // closes DISCARDED with PipeMessage.replied and the comment as its
  // `note`, and its writer is told to write it again. Refused for a held
  // incoming message.
  bool reply = 5;
}

// A pipe's latest messages, sent when it's selected: at most 200.
message PipeTranscript {
  string pipe_id = 1;
  repeated PipeMessage messages = 2;
  bool has_earlier = 3;
}

// Adds a message or replaces the one with the same seq, in the selected pipe.
message PipeMessageUpdate {
  string pipe_id = 1;
  PipeMessage message = 2;
}

// Earlier messages, answered with PipeMessagePage to the asker only.
message LoadPipeMessages {
  string pipe_id = 1;
  // Messages before this seq (exclusive).
  uint64 before_seq = 2;
  // 0 for 200; 1000 at most.
  uint32 limit = 3;
  // Every message from this seq up to `before_seq`, ignoring `limit`: to
  // jump to an older message (a find's match) and keep what the app holds
  // one run with no gaps.
  optional uint64 from_seq = 4;
}

message PipeMessagePage {
  string pipe_id = 1;
  repeated PipeMessage messages = 2;
  bool has_earlier = 3;
}

// Makes a liaison agent for a pipe: in the pipe's project, with no secrets,
// no web and no messaging, a member and the lead, quarantined for it
// (Agent.quarantined). Answered with Ack; the
// agent shows in Pipe.member_ids and lead_id.
message AddPipeLiaison {
  string pipe_id = 1;
  string name = 2;
}

// An agent ran a command with a secret that asks the person each time
// (SecretInfo.ask_each_time), or after reading a web page
// (Agent.tainted_by_pipes; a pipe, before #346): it didn't run, and waits for
// the person. Allowed, the agent may use the secret in one command; it's
// told either way.
message SecretApproval {
  string agent_id = 1;
  // The secrets it named, by name.
  repeated string secret_names = 2;
  // What it has read, by name: since #346 a web page's site; pipes on
  // older cards. Empty when only ask_each_time_names ask.
  repeated string pipe_names = 3;
  // The command it wanted to run.
  string command = 4;
  SecretApprovalState state = 5;
  // When it was decided, in ms since 1970; 0 while pending.
  int64 decided_ms = 6;
  // Its id, for Claktory's records.
  string id = 7;
  // Where what it read came from: for each pipe it has read, the agents it
  // came through (pipe_names lists the same pipes, for older apps).
  repeated PipeTaint taint = 8;
  // Which of secret_names ask the person each time they're used
  // (SecretInfo.ask_each_time): why it asks, besides pipe_names. A card can
  // ask for both reasons.
  repeated string ask_each_time_names = 9;
  // The command visibly keeps running after it starts (in the background,
  // or with &, nohup, setsid or disown): it has the secrets for as long as
  // it runs ("keeps running after it starts, with AWS").
  bool keeps_running = 10;
  // DENIED by a reply (DecideSecretApproval.reply): nothing ran, and
  // `comment` is what the person said. Shown as replied.
  bool replied = 11;
  // The person's reply, when `replied`.
  string comment = 12;
}

// What an agent has read that may hold someone else's instructions: since
// #346 a web page (kind "browser"), read by the agent itself; a pipe on
// older records. `via_names` are the agents, by name when it asked, that
// what it read came through, first the one that read it (each messaged the
// next); since #346 a mark never spreads, so it's empty on new records.
// "Website ⇄ Marketing" via ["Liaison", "Bruno"]: Liaison read it, told
// Bruno, and Bruno told this agent.
message PipeTaint {
  string pipe_name = 1;
  repeated string via_names = 2;
  // The pipe's Pipe.id, to find who's at its other end; it may be gone.
  string pipe_id = 3;
  // What was read, when it isn't a pipe: "browser", a web page read through
  // browser control, pipe_name then being its site ("https://host[:port]",
  // ASCII). Empty for a pipe. More kinds may come: show pipe_name as the
  // kind names itself.
  string kind = 4;
}

enum SecretApprovalState {
  SECRET_APPROVAL_STATE_UNSPECIFIED = 0;
  SECRET_APPROVAL_STATE_PENDING = 1;
  SECRET_APPROVAL_STATE_ALLOWED = 2;
  SECRET_APPROVAL_STATE_DENIED = 3;
  // Left unanswered 12 hours.
  SECRET_APPROVAL_STATE_EXPIRED = 4;
}

// The person's decision on a SecretApproval entry in an agent's conversation.
message DecideSecretApproval {
  string agent_id = 1;
  // The entry's seq.
  uint64 seq = 2;
  bool allow = 3;
  // The person's comment, told to the agent that asked as
  // theirs ("Matt's note: …"); may be empty. 2,000 characters at most.
  string comment = 4;
  // Submit (#370): `comment` is the person's reply, needed; `allow` is
  // ignored. Nothing runs: it closes DENIED with SecretApproval.replied, and
  // the agent is told the reply.
  bool reply = 5;
}

// An agent's question for the person (its ask_person tool, the Ask
// extension), shown in its conversation after the call: something it's
// blocked on that only the person can give (a decision, an approval,
// access). The person answers it or dismisses it with AnswerAsk; the entry
// is sent again then, and the agent is told in an event (dismissed: to use
// its best judgment). While pending, its seq is in Agent.waiting_seqs. It
// waits until it's decided, across restarts; clearing the agent's
// conversation (/clear) dismisses it without telling the agent.
message AskPerson {
  string id = 1;
  // A short line saying what it needs.
  string title = 2;
  // What it needs and why, in the agent's words (Markdown).
  string body = 3;
  // The agent wants a written answer (AnswerAsk.text is needed to answer).
  // Otherwise answering approves what it asks, with an optional comment.
  bool wants_text = 4;
  AskPersonState state = 5;
  // ANSWERED: the person's answer or comment; may be empty when
  // wants_text is false. DISMISSED: their comment, if they left one.
  string answer = 6;
  // When it was answered or dismissed, in ms since 1970; 0 while pending.
  int64 decided_ms = 7;
  // What the agent had read when it asked (Agent.tainted_by_pipes): what it
  // asks may come from someone else. Since #346 only a web page; pipes, with
  // the agents they came through, on older asks. Empty when it had read
  // none.
  repeated PipeTaint taint = 8;
  // A review ask (#275): the file the agent asks the person to review or
  // comment on, absolute; empty for an ordinary ask. It's one the agent may
  // read and comments support (text up to 2 MB, Markdown, an image, a
  // video, or a PDF up to 64 MB, which comments don't anchor on yet),
  // checked when it asked. The card's Review opens the agent's
  // conversation with the file in a pane (the person's own SetLayout), so
  // comments made there are addressed to the agent. Answering or dismissing
  // it sends the person's unsent comments on the file to the agent, and its
  // event says how many comments they left there since it asked.
  string review_path = 9;
  // What it was answered or dismissed with besides words
  // (AnswerAsk.attachments): the person's drawings on the PDF's pages.
  // Empty while pending.
  repeated Attachment answer_attachments = 10;
  // A procedure, step by step (ask_person's steps): the steps in order;
  // empty for an ordinary ask. `title` says what the whole procedure is
  // for and `body` introduces it; wants_text and review_path are never set
  // with steps. The current step is the first PENDING one: the person
  // answers it (AnswerAsk.step), the agent is told of each step in an
  // event, and the next one becomes current. The last one done makes the
  // ask ANSWERED; a step marked CANT stops it, DISMISSED, and the steps
  // after it stay PENDING (not reached). Pending, it counts once toward
  // the agent's questions waiting.
  repeated AskStep steps = 11;
  // ANSWERED by a reply (AnswerAsk.reply), not an approval: `answer` is
  // the reply. Shown as replied rather than answered.
  bool replied = 12;
  // The agent took it back (ask_withdraw, #407) before the person answered:
  // it no longer applied. state is DISMISSED, so it no longer waits, and
  // decided_ms is when it was withdrawn; `answer` is empty. Shown as
  // withdrawn by the agent, with its reason, never as the person's
  // dismissal; a card the person is answering just closes. AnswerAsk on it
  // is refused ("This question was withdrawn.").
  bool withdrawn = 13;
  // withdrawn: why, in the agent's words (a short line, at most 300
  // characters); show it as the agent's, never as Claktory's.
  string withdraw_reason = 14;
  // Which version of the card this is (#428): 1 as asked, one more each
  // time its agent changes it while it waits (ask_update: its title, body,
  // wants_text, review_path or steps; at most 10 times). The card redraws
  // in place; it doesn't count again in Needs you, and nothing notifies the
  // person again. AnswerAsk.revision names the version answered. 0 from a
  // backend before #428: treat it as 1.
  uint32 revision = 15;
  // When its agent last changed it, in ms since 1970; 0 if it never did
  // (revision 1). Show "Updated · <time>" on the card.
  int64 updated_ms = 16;
  // Why it changed it last, in the agent's words (at most 300 characters);
  // empty if it gave no reason. Show it muted, as the agent's.
  string update_reason = 17;
  // A card whose Approve makes a change an admin agent asked for (#423:
  // pipes_settings, apps_uninstall, models_auto_continue): what Approve
  // does, in Claktory's own words, never the agent's ("Rivet asks to add
  // Cy … on the pipe "Website"."); and the agent's reason, in its own
  // words. Show the description as the card's text and the reason apart,
  // muted, as the agent's ("Rivet's reason: …"), instead of body, which
  // holds both for older apps. Both empty on every other card.
  string action_description = 18;
  string action_reason = 19;
  // The talk on the card so far (#430), oldest first: empty until its
  // agent first answers the person on it (ask_reply). Each ask_reply adds
  // the person's words that closed the round before (their reply, or their
  // comment on approving or dismissing it) and then the agent's answer, and
  // makes the card PENDING again at a new revision, with `answer` and
  // decided_ms cleared: it waits again (Agent.waiting_seqs) and notifies as
  // a new card does. A procedure still on its way whose last step done has
  // the person's comment can be answered too: it stays PENDING at its step,
  // at a new revision, and notifies again. Sort it in Needs you by its last
  // message's at_ms, so it rises. Show the thread above the card's buttons, with Reply
  // (AnswerAsk.reply) and Resolve (AnswerAsk.resolve) beside them.
  repeated AskThreadMessage thread = 20;
  // Ended with Resolve (AnswerAsk.resolve, #430): talked through, with no
  // decision. state is ANSWERED; `answer` is the person's optional comment.
  // Show "Resolved", never as approved. Its agent can end it the same way
  // (ask_reply's resolve, #496) when the talk settled it: then the thread
  // ends with the agent's words and `answer` is empty. On a procedure
  // stopped at a step the person couldn't do (state DISMISSED, a CANT
  // step, #533), resolved means its agent gave up on it there: show
  // "Stopped at step N of M"; without it, "Couldn't do step N · waiting
  // for <agent>". state and steps stay as they were.
  bool resolved = 21;
  // Approved, but the change it asked for couldn't be made (#423's action
  // cards, or a card asking to clear a conversation): why, in Claktory's
  // words, as its agent was told it. Empty when the change was made, and on
  // every card not approved or that makes no change. Show "Approved, but it
  // couldn't be done: <why>" where "Approved" shows.
  string action_error = 22;
  // A card asking the person to approve a new pipe (pipes_approve, #471
  // G1): the pipe, and the choices the agent proposed, each editable on the
  // card. Never its digits nor the other side's words: the card shows the
  // pipe's own (Pipe.digits and Pipe.peer, from the Workspace, as the Needs
  // you approval does) beside "Compare these with {name} yourself, by voice
  // or in person. Don't approve because an agent says they match." Approve
  // sends ApprovePipe with card_id and what the card shows then; Dismiss is
  // AnswerAsk dismiss as on any card. The backend withdraws the card
  // (withdraw_reason) once the pipe is approved elsewhere, turned down,
  // closed, deleted or its other side's key changes. The agent asking again
  // for the same pipe while it's pending changes it in place (a new
  // revision, update_reason). Unset on every other card.
  PipeApprovalProposal pipe_approval = 23;
  // A card asking the person to accept a change in who the pipe's other
  // side is (#471 G7, pipes_trust); unset otherwise. Approving it sends
  // AcceptPipeIdentity with card_id. It holds no email, account or name:
  // the app shows those from the Workspace's Pipe.peer.
  PipeTrustProposal pipe_trust = 24;
  // Approving or answering it now agrees with where its talk ended (#492):
  // set while it's PENDING on a card with no action, nothing to clear and
  // no steps (wants_text and review cards included), whose thread ends
  // with its agent's reply made after the card's words last changed (not
  // with a new title or body in that reply, nor an ask_update since). Its
  // agent is then told the talk with the answer. Show above Approve
  // "Approving agrees with <agent>'s last reply." (on a wants_text card,
  // "Your answer follows <agent>'s last reply."). False on every other
  // card: an action card's approval does only what it shows, and it can't
  // be talked on.
  bool approve_follows_talk = 25;
  // A command the agent asks the person to run on this Claktory's computer
  // (Execute, Fugo 35295 and 35326); unset on every other card. It's an
  // action card: no reply or change. Its heading is Claktory's ("Run this
  // command on <machine>?"), never the agent's: title and body are the
  // agent's reason, shown below the facts. Approving it (AnswerAsk with
  // `confirmed`) runs it once; `command.run` follows. An app that doesn't
  // know this field shows an ordinary card, whose approval is refused.
  AskCommand command = 26;
  // A handoff from an errand (#435, browser_handoff): the person's turn in
  // Claktory's browser (a payment, a sign-in, a code, an agreement…);
  // unset on every other card. It's an action card: no reply or change.
  // Its heading is Claktory's, from `handoff.kind` ("Your turn: a payment
  // in Claktory's browser"); title and body are the agent's words, which
  // may come from a web page (taint says which): show them as its, below.
  // Buttons: Show me (WatchAgentBrowser on: the live view, the person's
  // input), Done (AnswerAsk, approving: the agent carries on from the page
  // as it is) and Can't do this (AnswerAsk dismiss, with their reason as
  // the comment: the errand ends, CANCELLED).
  ErrandHandoff handoff = 27;
  // A code card (#435 W8; set with handoff.kind CODE): the site asks for a
  // code sent to the person. Its heading is Claktory's, "<handoff.origin's
  // host> asks for a code", never the agent's. Show one field for the code
  // only (one-time-code autofill; suggestions, autocorrect and keyboard
  // learning off; spaces and dashes stripped from a paste), no comment
  // field, no mic, no attachments, never kept as a draft. Fill in sends
  // AnswerAsk with the code as `text`: Claktory fills it into the page's
  // field and the agent never sees it. A code that isn't one (letters,
  // digits, spaces and hyphens, at most 16) is refused with an error and
  // the card stays. Can't do this is AnswerAsk dismiss with the reason as
  // the comment. The code is never in the Workspace, the transcript,
  // History, a notification or the card's thread: the answered card's
  // answer is empty.
  bool code = 28;
  // Why it changed last, in Claktory's own words, when Claktory changed it
  // rather than its agent: its review file (review_path) changed while it
  // waited ("This file changed since June asked. Approving means it as it
  // reads now."). Claktory marks it once the file has been quiet for about
  // 30 seconds, as an ask_update would: revision goes up, updated_ms is
  // set, and an answer to the version before is refused, so Approve means
  // the file as it reads now. Show it on the updated line as Claktory's,
  // never as the agent's; update_reason is then empty. '' when its agent
  // made the last change, or none was made. An open review pane shows the
  // file as it reads now.
  string update_note = 29;
}

// What an Execute card runs, where, and how it went.
message AskCommand {
  // Exactly as it runs, byte for byte: shown whole, in monospace, every
  // line, never folded or changed.
  string command = 1;
  // The folder it runs in, absolute.
  string cwd = 2;
  // The computer it runs on, by name ("Matt's Mac Studio").
  string machine = 3;
  // How long it may run before it's stopped, in seconds.
  uint32 timeout_seconds = 4;
  // What to read twice before running it, in Claktory's words; empty for
  // none. Hints, not a complete list. With any, Execute needs a second tap.
  repeated CommandWarning warnings = 5;
  // Unset until the person taps Execute.
  CommandRun run = 6;
}

message CommandWarning {
  CommandWarningKind kind = 1;
  // Claktory's words: "Runs as administrator (sudo).", "Connects to prime2 (ssh)."
  string text = 2;
}

enum CommandWarningKind {
  COMMAND_WARNING_KIND_UNSPECIFIED = 0;
  // sudo, doas.
  COMMAND_WARNING_KIND_ADMIN = 1;
  // ssh, scp, rsync, sftp to another computer (named in the text).
  COMMAND_WARNING_KIND_REMOTE = 2;
  // rm -r, dd, mkfs, diskutil erase or partition, git push --force, git reset --hard.
  COMMAND_WARNING_KIND_DESTRUCTIVE = 3;
  // launchctl, systemctl, crontab, schtasks.
  COMMAND_WARNING_KIND_SERVICES = 4;
  // A download run by a shell (curl … | sh).
  COMMAND_WARNING_KIND_PIPE_TO_SHELL = 5;
  // ~/.factory, ~/.ssh or the keychain (security).
  COMMAND_WARNING_KIND_SENSITIVE = 6;
}

// An Execute card's run.
message CommandRun {
  CommandRunState state = 1;
  // How it exited, when EXITED.
  int32 exit_code = 2;
  // What it printed, stdout and stderr together: the last 64 KB, secrets
  // hidden as [secret NAME/VARIABLE].
  string output = 3;
  // It printed more than `output` holds.
  bool output_truncated = 4;
  int64 started_ms = 5;
  // How long it ran; so far, while RUNNING (updated about every second).
  int64 duration_ms = 6;
  // The device Execute was tapped on.
  string device = 7;
  // Why it didn't start (FAILED_TO_START), or what happened to it
  // (INTERRUPTED), in Claktory's words.
  string error = 8;
  // While RUNNING: what it waits for, in Claktory's words ("Waiting for a
  // fingerprint or password on Matt's Mac Studio (sudo)."): sudo, doas or
  // su in it asks on that Mac's screen (Touch ID) or for a terminal it
  // hasn't got. Shown on the card on every device; '' otherwise.
  string waiting = 9;
}

enum CommandRunState {
  COMMAND_RUN_STATE_UNSPECIFIED = 0;
  COMMAND_RUN_STATE_RUNNING = 1;
  COMMAND_RUN_STATE_EXITED = 2;
  // Stopped at timeout_seconds, with everything it started.
  COMMAND_RUN_STATE_TIMED_OUT = 3;
  COMMAND_RUN_STATE_FAILED_TO_START = 4;
  // Claktory stopped while it ran; it's never run again.
  COMMAND_RUN_STATE_INTERRUPTED = 5;
}

// What an agent proposes for a new pipe on its approval card
// (AskPerson.pipe_approval), agents by id.
message PipeApprovalProposal {
  string pipe_id = 1;
  repeated string member_ids = 2;
  // Among member_ids: those that can run commands on this computer; the
  // others are quarantined.
  repeated string can_run_commands_ids = 3;
  // The lead: an agent among member_ids; else a new liaison of this name.
  string lead_id = 4;
  string liaison_name = 5;
  bool review_incoming = 6;
  bool review_outgoing = 7;
  // Members that only send, among member_ids (never the lead).
  repeated string send_only_ids = 8;
  // This side's settings of the pipe when the card was asked, or last
  // updated by another pipes_approve: filled from the pipe by Claktory,
  // never from the agent. The app compares them with the Workspace's Pipe:
  // when they differ it says the settings changed since, and highlights
  // each choice wider than the pipe now where the pipe narrowed since.
  PipeApprovalBaseline asked_from = 9;
}

// What an agent's card to accept a pipe's identity change is about
// (AskPerson.pipe_trust).
message PipeTrustProposal {
  string pipe_id = 1;
  // The change it was asked for. When Pipe.peer.identity_change differs,
  // the card is stale (the backend withdraws it).
  PipeIdentityChange identity_change = 2;
}

// A pipe's own settings as they were (PipeApprovalProposal.asked_from):
// nothing the other side said.
message PipeApprovalBaseline {
  repeated string member_ids = 1;
  // Among member_ids: those that can't run commands on this computer.
  repeated string quarantined_ids = 2;
  repeated string send_only_ids = 3;
  string lead_id = 4;
  bool review_incoming = 5;
  bool review_outgoing = 6;
}

// One step of a procedure (AskPerson.steps).
// One message of the talk on a card (AskPerson.thread, #430).
message AskThreadMessage {
  // The agent's (ask_reply); false: the person's.
  bool from_agent = 1;
  // In the agent's words or the person's: Markdown, shown as theirs.
  string text = 2;
  int64 at_ms = 3;
  // The person's files on that turn of the talk (#511), as they sent them
  // with it (AnswerAsk.attachments); empty for the agent's turns.
  repeated Attachment attachments = 4;
  // On a procedure, the step that turn is about (#533), 1 for the first:
  // the app shows it above that step. 0 on an ordinary card, and for turns
  // kept before it was recorded.
  uint32 step = 5;
}

// Where the person answered a card from (AnswerAsk.from, #430): the agent
// is told, so it answers them there.
enum AskAnsweredFrom {
  // An app before #430: the agent isn't told where.
  ASK_ANSWERED_FROM_UNSPECIFIED = 0;
  // The agent's conversation.
  ASK_ANSWERED_FROM_CONVERSATION = 1;
  // Needs you.
  ASK_ANSWERED_FROM_NEEDS_YOU = 2;
}

message AskStep {
  // What to do, in the agent's words (Markdown, short; may hold a fenced
  // command, which the card gives a Copy button).
  string text = 1;
  AskStepState state = 2;
  // The person's comment on Done or Can't do this; may be empty.
  string comment = 3;
  // When it was done or marked CANT, ms since 1970; 0 while pending.
  int64 decided_ms = 4;
  // The person's files with that comment (#511); empty for none.
  repeated Attachment comment_attachments = 5;
}

enum AskStepState {
  // Read as PENDING.
  ASK_STEP_STATE_UNSPECIFIED = 0;
  ASK_STEP_STATE_PENDING = 1;
  ASK_STEP_STATE_DONE = 2;
  // The person couldn't do it: the procedure stops here.
  ASK_STEP_STATE_CANT = 3;
}

enum AskPersonState {
  ASK_PERSON_STATE_UNSPECIFIED = 0;
  ASK_PERSON_STATE_PENDING = 1;
  ASK_PERSON_STATE_ANSWERED = 2;
  ASK_PERSON_STATE_DISMISSED = 3;
}

// The person's answer to an AskPerson entry in an agent's conversation, or
// its dismissal. Answered with Ack; refused when it isn't pending, or when
// it wants a written answer and `text` is empty.
message AnswerAsk {
  string agent_id = 1;
  // The entry's seq.
  uint64 seq = 2;
  // Dismiss it instead: the agent is told to use its best judgment.
  bool dismiss = 3;
  // The answer (or, when the ask doesn't want one, an optional comment).
  // Dismissing, the person's optional comment: the agent gets it with the
  // dismissal, and the card keeps it (AskPerson.answer).
  string text = 4;
  // What the person answers (or dismisses) it with besides words: their
  // drawings on a review ask's PDF, one PNG per page named
  // "<pdf stem>-p<page>.png" (paper.pdf, page 3: paper-p3.png), and any
  // files they attach (#511), with every kind of answer: an answer,
  // Approve or Dismiss with its comment, a reply (threaded or not),
  // Resolve, and a step's Done or Can't do this. Files uploaded for this
  // agent first, checked as SendMessage.attachments are: each must be in
  // the agent's uploads folder and still there, or the answer is refused.
  // A reply needs text or at least one file. The card keeps them where
  // they were given (AskPerson.answer_attachments, a turn's
  // AskThreadMessage.attachments, a step's AskStep.comment_attachments),
  // and the agent's event names each by path, a drawing with its page.
  repeated Attachment attachments = 5;
  // A procedure (AskPerson.steps): the step answered, 0-based; it must be
  // the current one, so a second tap can't answer the next. dismiss false
  // is Done, dismiss true is Can't do this (which stops the procedure);
  // `text` is the person's optional comment. Needed for an ask with steps,
  // refused for one without.
  optional uint32 step = 6;
  // Submit (#370): `text` is the person's reply, neither a yes nor a no.
  // The agent is told "Matt replied to your question …" with the reply,
  // and the ask closes ANSWERED with AskPerson.replied; a checklist item
  // it's about counts as answered (no asking again). `text` is needed;
  // `dismiss` is ignored; `attachments` go with it. Refused for a procedure
  // (`step`) and for an ask that wants a written answer (wants_text),
  // whose cards stay as they are, unless the card has a thread
  // (AskPerson.thread, #430): then it's Reply, to answer the agent again.
  bool reply = 7;
  // The card's version the person answered (AskPerson.revision, #428).
  // Another version is refused, "This card changed. Look at it again.",
  // and nothing is answered: the card already shows the new one. Left
  // out (an app before #428), it's taken for the card as it is, unless its
  // agent changed it in the last 30 seconds, when it's refused the same way.
  optional uint32 revision = 8;
  // Resolve (#430): end a card that has a thread (AskPerson.thread) with
  // no decision, talked through. `text` is the person's optional comment;
  // `dismiss` and `reply` are ignored. The card closes ANSWERED with
  // AskPerson.resolved, and its agent is told (quietly without a comment).
  // Refused for a card without a thread.
  bool resolve = 9;
  // Where the person answered from: the agent is told, and asked to answer
  // their words on the card (ask_reply) so they reach them there.
  AskAnsweredFrom from = 10;
  // How many messages of the card's talk (AskPerson.thread) it showed when
  // the person answered (#492); send it with every AnswerAsk. An approval
  // or answer (not a dismissal, reply, resolve or step) of a card with no
  // action is refused when the thread grew since with a reply of its
  // agent's among the new messages: the card already shows it, and the
  // person answers again. Left out (an app before #492), nothing is
  // checked; `revision` still is.
  optional uint32 talk_seen = 11;
  // Approving an Execute card (AskPerson.command): the person saw it as a
  // command card and tapped Execute, and the confirm too when it has
  // warnings. Always set by an app that shows command cards; an approval
  // without it is refused, so an older app that shows only the title and
  // body can't run a command the person never saw.
  bool confirmed = 12;
}

// A chat: a one-off conversation of the person's, beside their agents but
// not one of them. It has no name, folder or extensions; it can search the
// web, read pages and propose to Rivet, and nothing else. Agents can't see
// or message it, and the Map leaves it out. Kept until it's deleted.
message Chat {
  // Never an agent's id.
  string id = 1;
  // From its first exchange (a short model-written title, the first
  // message's opening words until then), or as the person renamed it;
  // empty while it has no message: show "New chat".
  string title = 2;
  // ms since 1970. `updated`: its last message, the person's or its own.
  int64 created = 3;
  int64 updated = 4;
  // WORKING while it replies.
  AgentStatus status = 5;
  // A reply finished since the person last had it open.
  bool unseen = 6;
  // "<provider>/<model id>": the Claktory's default model when it was made,
  // at medium effort, until the person changes it (SetChatModel).
  string model = 7;
  // Entries waiting for the person (a proposal to Rivet), as
  // Agent.waiting_seqs.
  repeated uint64 waiting_seqs = 8;
  // Sent while it replies, not yet read (ChatQueuedMessages lists them).
  uint32 queued_messages = 9;
  // Its model can run (its provider is signed in); otherwise show "No model
  // available".
  bool model_available = 10;
  // As Agent.usage_wait and Agent.usage_wait_until_ms: it waits for an
  // account's usage to reset; StopChat ends the wait.
  string usage_wait = 11;
  int64 usage_wait_until_ms = 12;
  // As Agent.usage_wait_alternative, usage_wait_no_other_provider and
  // usage_switch.
  UsageWaitAlternative usage_wait_alternative = 13;
  bool usage_wait_no_other_provider = 14;
  UsageSwitch usage_switch = 15;
}

// Makes a chat and selects it (Workspace.selected_chat_id, in the Workspace
// before the Ack). With `text`, that's its first message; empty, the chat
// is empty, and an empty chat is deleted as soon as it's left (another chat,
// agent or pipe selected, or another CreateChat).
message CreateChat {
  string text = 1;
  // As SendMessage.client_id.
  string client_id = 2;
}

// Shows the chat in every client's main pane: Ack, then ChatTranscript to
// every client. Clears Chat.unseen.
message SelectChat {
  string chat_id = 1;
}

// The person writes in a chat. While it replies, the message waits
// (ChatQueuedMessages) and is read after its current step.
message SendChatMessage {
  string chat_id = 1;
  string text = 2;
  // As SendMessage.client_id.
  string client_id = 3;
  // A voice message, as SendMessage.attachments and SendMessage.voice:
  // attachments[0] is the recording, uploaded for the chat (StartUpload
  // with agent_id the chat's id; a chat takes only recordings, an audio type
  // up to 100 MB), and `text` is empty or typed with it, as in
  // SendMessage.voice (#425). It waits in the chat's queue
  // (QueuedMessage.transcription) while it's transcribed, then the chat
  // reads its words; a short one with nothing said is dropped. Refused while
  // the speech model is ABSENT or UNSUPPORTED. RetryVoiceMessage and
  // DiscardVoiceMessage take the chat's id as agent_id. A chat takes no
  // other attachments. For a new chat's first one, CreateChat with no text,
  // then upload and send it.
  repeated Attachment attachments = 4;
  bool voice = 5;
}

// Stops the chat's reply, or its wait for usage; what's queued stays.
message StopChat {
  string chat_id = 1;
}

// Deletes a chat and its conversation for good; one that's replying is
// stopped first.
message DeleteChat {
  string chat_id = 1;
}

// Earlier entries of a chat, as LoadEntries for an agent's: answered with
// ChatEntryPage to the asker only.
message LoadChatEntries {
  string chat_id = 1;
  uint64 before_seq = 2;
  uint32 limit = 3;
  optional uint64 from_seq = 4;
}

// Puts a chat on `model` ("<provider>/<model id>", one of
// Workspace.models) from its next model call, while it replies too. It keeps
// its effort when the model has it, else takes the model's default. A chat
// waiting on usage asks again at once, and a switch to another provider
// (Chat.usage_switch) is over. Answered with Ack, or an Error saying why not
// ("No chat \"<id>\".", "That model isn't available.").
message SetChatModel {
  string chat_id = 1;
  string model = 2;
}

// Names a chat; an empty title goes back to the automatic one.
message RenameChat {
  string chat_id = 1;
  string title = 2;
}

// The selected chat's conversation, as Transcript for an agent's.
message ChatTranscript {
  string chat_id = 1;
  repeated Entry entries = 2;
  bool has_earlier = 3;
}

// Adds an entry to a chat's conversation or replaces the one with its seq.
message ChatEntryUpdate {
  string chat_id = 1;
  Entry entry = 2;
}

// Appends streamed text to a chat's entry, as EntryDelta.
message ChatEntryDelta {
  string chat_id = 1;
  uint64 seq = 2;
  string text = 3;
}

// The answer to LoadChatEntries.
message ChatEntryPage {
  string chat_id = 1;
  repeated Entry entries = 2;
  bool has_earlier = 3;
}

// What waits for the selected chat, as QueuedMessages for an agent.
message ChatQueuedMessages {
  string chat_id = 1;
  repeated QueuedMessage messages = 2;
}

// Moving this Claktory to another computer over the network (docs/MOVE.md,
// "The handshake"). The other computer runs `factoryd receive`, which shows
// a code; StartMove with that code dials it. Both computers show six
// digits, the person confirms they match (ConfirmMove here, and on the
// other computer's terminal), and the copy starts by itself while agents
// keep working. Once little changes between rounds, Claktory freezes by
// itself (FreezeMove does it at once), sends the last round, and waits for
// the other computer to set it up; then this copy is put away and the
// other one starts. A failure before that leaves Claktory here as it was.
message Move {
  MovePhase phase = 1;
  // The other computer, as it says: its name ("cloud-box"), system
  // ("linux", "macos"), architecture ("x86_64", "aarch64") and Claktory
  // version. Set from MOVE_PHASE_CONFIRM on; before, from the code.
  string target_machine = 2;
  string target_os = 3;
  string target_arch = 4;
  string target_version = 5;
  // The six digits both computers show, "123 456"; set from
  // MOVE_PHASE_CONFIRM on.
  string digits = 6;
  // The person on the other computer confirmed the digits too.
  bool target_confirmed = 7;
  // Why the other computer can't take this Claktory, in sentences; with
  // any, the move fails (MOVE_PHASE_FAILED).
  repeated string problems = 8;
  // Commands agents use that the other computer doesn't have ("flutter"):
  // a warning, not a failure.
  repeated string missing_tools = 9;
  // Where folders go on the other computer, longest first.
  repeated MovePath map = 10;
  // How much the move carries, as planned.
  uint64 plan_bytes = 11;
  // What the other computer has of it so far, and the whole, after each
  // round.
  uint64 bytes_have = 12;
  uint64 bytes_total = 13;
  // The round under way, from 1; the last one is during MOVE_PHASE_FROZEN.
  uint32 round = 14;
  // What's happening, in a sentence for the person ("Copying round 2…",
  // the other computer's import steps while MOVE_PHASE_IMPORTING).
  string step_text = 15;
  // Why it failed, in a sentence; set in MOVE_PHASE_FAILED.
  string error = 16;
  // CancelMove would call it off now: until the commit (false from
  // MOVE_PHASE_COMMITTING on; true in MOVE_PHASE_FAILED, to dismiss it).
  bool can_cancel = 17;
  // When this last changed, ms since the epoch.
  int64 updated_ms = 18;
  // The agent that started it (Rivet's move_claktory, #243 S1); empty when
  // the person did. Either way only the person confirms the digits here
  // (ConfirmMove): for a move an agent started, every device shows
  // Claktory's own confirm while MOVE_PHASE_CONFIRM, since no agent can.
  string started_by_agent_id = 19;
  // The person confirmed the digits here (ConfirmMove), while
  // MOVE_PHASE_CONFIRM waits for the other computer: every device hides its
  // confirm.
  bool confirmed_here = 20;
  // The address this computer reached the other one at, when it goes
  // directly ("203.0.113.7:4433"), as seen here, not as the other computer
  // says: the person can match it with their server's. Empty through a
  // relay. Set from MOVE_PHASE_CONFIRM on.
  string target_address = 21;
}

message MovePath {
  string from = 1;
  string to = 2;
}

enum MovePhase {
  MOVE_PHASE_UNSPECIFIED = 0;
  // Dialing the other computer.
  MOVE_PHASE_CONNECTING = 1;
  // Both show `digits`: waiting for ConfirmMove here and the person there.
  MOVE_PHASE_CONFIRM = 2;
  // The other computer checks the plan.
  MOVE_PHASE_CHECKING = 3;
  // Copying while agents keep working; FreezeMove ends it now.
  MOVE_PHASE_COPYING = 4;
  // Agents are stopped and the last round goes; only `move` is served.
  MOVE_PHASE_FROZEN = 5;
  // The other computer sets it up and checks it (`step_text` says what).
  MOVE_PHASE_IMPORTING = 6;
  // This copy is put away; telling the other computer to start. No way back.
  MOVE_PHASE_COMMITTING = 7;
  // Moved: the other computer runs this Claktory now.
  MOVE_PHASE_DONE = 8;
  // It didn't go: `error` says why. Claktory runs here as before.
  // CancelMove dismisses it.
  MOVE_PHASE_FAILED = 9;
}

// Starts moving this Claktory to the computer that shows `code` (from
// `factoryd receive` there). Refused with a sentence when the code isn't
// one, the other computer has an older Claktory, a move is already under
// way, or this Claktory can't stop and start itself (not run by its
// service).
message StartMove {
  string code = 1;
}

// The person sees the same digits on both computers (MOVE_PHASE_CONFIRM).
message ConfirmMove {}

// Calls the move off, until the commit: the other computer throws away what
// it has and Claktory carries on here. In MOVE_PHASE_FAILED, dismisses it.
message CancelMove {}

// Freezes now instead of waiting for the copy to settle
// (MOVE_PHASE_COPYING only): agents stop for the last round.
message FreezeMove {}

// The person adds a goal to an agent's checklist: an outcome they want, in
// their words. The agent is told. Answered with Ack.
message AddGoal {
  string agent_id = 1;
  string text = 2;
}

// The person changes one of an agent's goals; unset fields stay as they
// are. The agent is told. Answered with Ack.
message UpdateGoal {
  string agent_id = 1;
  // G1, G2…: Goal.id.
  uint32 goal_id = 2;
  optional string text = 3;
  // OPEN, DONE or DROPPED; UNSPECIFIED leaves it as it is.
  ChecklistStatus status = 4;
  // Removes the goal; items that served it serve none.
  bool remove = 5;
}
// ---- Notifications ----
//
// What notifies is decided in the backend, the same for every device: a new
// Needs-you item (NEEDS_YOU), an agent's notify_person (ALERT), and an
// agent's reply to a message the person sent from a phone or tablet (REPLY;
// from a computer too with `desktop_replies`). Nothing notifies while the
// person is using Claktory on any device (SetActive). Each agent notifies at
// most 6 times an hour; then one more says how many it held back. An agent
// that has read a web page never puts its own words in a notification: it says
// only "<agent> has something for you".

// Something the person should hear of, to every connected app. The backend
// has already applied every rule (kinds, the agent's NotifyMode, quiet
// hours, the hourly cap, and that nobody is using Claktory on any device
// right now), so an app shows it as a notification of the system's unless
// it's in front itself.
message Notify {
  // Unique to this notification.
  string id = 1;
  NotifyKind kind = 2;
  // What it shows, as the person's preview setting allows
  // (NotificationSettings.preview): usually the agent's name, and what it
  // needs or says. `body` may be empty.
  string title = 3;
  string body = 4;
  // What a tap opens: an agent (and `seq`, its Needs-you item), a pipe (and
  // `seq`, its held message) or a chat. All empty for none (TEST): the app
  // just comes forward.
  string agent_id = 5;
  string pipe_id = 6;
  string chat_id = 7;
  uint64 seq = 8;
  // An agent marked its alert urgent and the person lets urgent alerts
  // through: shown as time-sensitive where the system has that.
  bool urgent = 9;
  // When set, it replaces an earlier notification with the same key (an
  // agent's alerts replace its earlier alert) instead of adding one.
  string collapse = 10;
  // Notifications with the same thread are grouped (one per agent, pipe or
  // chat).
  string thread = 11;
  // When it was sent, in ms since 1970.
  int64 sent_ms = 12;
  // A device waiting to be allowed (RemoteAccess.pending_devices'
  // device_id): a tap opens its Needs you item. The notification itself
  // never allows it, and says nothing the device chose (#352 P4).
  string device_id = 13;
  // A website another Claktory started sharing over pipe_id (W2): a tap
  // opens the pipe at that share (PipeShare.id).
  string share_id = 14;
  // ALERT: the alert kept in Needs you (Alert.id); a tap opens it there
  // (and opening it reads it). For an hour's "<agent> sent 3 more", its
  // latest alert. Empty for none (an alert from a backend before them).
  string alert_id = 15;
}

enum NotifyKind {
  NOTIFY_KIND_UNSPECIFIED = 0;
  // Something waits for the person: a question, a request for a secret, a
  // proposal, a held pipe message.
  NOTIFY_KIND_NEEDS_YOU = 1;
  // An agent's notify_person.
  NOTIFY_KIND_ALERT = 2;
  // An agent answered the person's message.
  NOTIFY_KIND_REPLY = 3;
  // SendTestNotification's.
  NOTIFY_KIND_TEST = 4;
}

// What notifications say.
enum NotifyPreview {
  // As FULL.
  NOTIFY_PREVIEW_UNSPECIFIED = 0;
  // Who, and what it says.
  NOTIFY_PREVIEW_FULL = 1;
  // Only who: "Pericolo needs you".
  NOTIFY_PREVIEW_WHO = 2;
  // Just "Claktory has something for you".
  NOTIFY_PREVIEW_NONE = 3;
}

// Whether an agent notifies the person.
enum NotifyMode {
  // As NotificationSettings says for each kind.
  NOTIFY_MODE_DEFAULT = 0;
  // Every kind, even those turned off (still within quiet hours and the
  // hourly cap).
  NOTIFY_MODE_ALWAYS = 1;
  // Never.
  NOTIFY_MODE_NEVER = 2;
}

// When Claktory notifies the person (config.json's `notifications`).
message NotificationSettings {
  // Which kinds notify (NotifyKind): on unless changed, but for
  // desktop_replies, replies to messages sent from a computer, off.
  bool needs_you = 1;
  bool alerts = 2;
  bool replies = 3;
  bool desktop_replies = 4;
  NotifyPreview preview = 5;
  // Quiet hours: nothing notifies from quiet_start to quiet_end, in minutes
  // after midnight in the Claktory's local time (it may run past
  // midnight), but urgent alerts when urgent_breaks_quiet.
  bool quiet_hours = 6;
  uint32 quiet_start = 7;
  uint32 quiet_end = 8;
  bool urgent_breaks_quiet = 9;
  // The push relay devices register with (RegisterNotifications): an https
  // URL; empty for Claktory's own.
  string relay = 10;
  // The time zone quiet hours are in: the Claktory's computer's, as an IANA
  // name ("Europe/Rome"; empty when unknown), and its offset from UTC now,
  // in minutes east. Filled in by the backend; ignored in updates.
  string time_zone = 11;
  int32 utc_offset_minutes = 12;
}

// UpdateSettings.notification_change: each field set replaces that one
// setting (see NotificationSettings); unset fields stay as they are.
message NotificationSettingsChange {
  optional bool needs_you = 1;
  optional bool alerts = 2;
  optional bool replies = 3;
  optional bool desktop_replies = 4;
  optional NotifyPreview preview = 5;
  optional bool quiet_hours = 6;
  optional uint32 quiet_start = 7;
  optional uint32 quiet_end = 8;
  optional bool urgent_breaks_quiet = 9;
  optional string relay = 10;
}

// This connection's app is in front and the person is using it (true), or
// no longer (false: in the background, the screen locked, the computer
// asleep). While any connection is active, nothing notifies; for 2 minutes
// after, nothing is pushed to devices that aren't connected. A connection
// counts as inactive until it says so, and when it closes. Answered with Ack.
message SetActive {
  bool active = 1;
}

// This device gets notifications pushed to it while it isn't connected: its
// handle at the push relay (NotificationSettings.relay), from
// `POST /v1/register`, and the key the backend seals each notification with.
// Registering again replaces both; an empty handle stops the pushes and
// forgets the key. Removing the device forgets them too. Answered with Ack.
message RegisterNotifications {
  // base64url, as the relay gave it.
  string handle = 1;
  // 32 random bytes the device made: AES-256-GCM.
  bytes key = 2;
  PushPlatform platform = 3;
}

enum PushPlatform {
  PUSH_PLATFORM_UNSPECIFIED = 0;
  PUSH_PLATFORM_APNS = 1;
  // An app built for development, on APNs's sandbox.
  PUSH_PLATFORM_APNS_SANDBOX = 2;
  PUSH_PLATFORM_FCM = 3;
}

// Sends a test notification (NOTIFY_KIND_TEST) to every connected app and
// every registered device, whether or not anyone is using Claktory and in
// quiet hours too. Answered with Ack.
message SendTestNotification {}

// ---- Needs you's history ----

// The cards the person decided in the last 30 days (answered, dismissed,
// approved or denied), newest first, a page at a time, and the questions
// and proposals their agents withdrew (WITHDRAWN). Answered with
// NeedsYouHistory. Expired and waiting cards, and withdrawn requests for
// secrets, aren't listed.
message ListNeedsYouHistory {
  // Only cards whose agent's name (as it is now), title, text or the
  // person's reply has it, case aside; "" for all. Past 200 characters
  // it's cut.
  string query = 1;
  // Only cards decided before this, in ms since 1970 (the last page's
  // oldest decided_ms); 0 for the newest.
  int64 before_ms = 2;
  // How many; 0 for 50, at most 200. A page never parts cards decided
  // in the same millisecond, so it may hold a few more.
  uint32 limit = 3;
}

message NeedsYouHistory {
  repeated NeedsYouRecord records = 1;
  // There are more, decided before the last of these.
  bool more = 2;
}

// A card the person decided.
message NeedsYouRecord {
  NeedsYouRecordKind kind = 1;
  // The agent that asked; empty for a chat's card.
  string agent_id = 2;
  // Its name now, or its id once it's deleted.
  string agent_name = 3;
  // The chat whose card it was, for a chat's.
  string chat_id = 4;
  // PIPE_START: the pipe it made, if it made one. PIPE_HELD and PIPE_LOOP:
  // their pipe, to name as the app names pipes (never by a name the other
  // side chose).
  string pipe_id = 5;
  // The card's entry in the agent's (or chat's) conversation, to open it
  // there; 0 when it's no longer in the conversation as loaded (after
  // /clear, say): open the conversation at its end then. PIPE_HELD: the
  // message's seq in its pipe (PipeMessage.seq); PIPE_LOOP: 0.
  uint64 seq = 6;
  // Claktory's own words for it, never what another Claktory wrote: the
  // question's title, the secret's name, the secrets it used, the
  // proposal's first line, what it asked to connect, "Start a pipe".
  string title = 7;
  // PIPE_HELD: the start of the held message (at most 200 characters),
  // which the other side or an agent that read it may have written: show it
  // only inside "from the other Claktory" framing, never as a title. Empty
  // for every other kind.
  string excerpt = 8;
  NeedsYouOutcome outcome = 9;
  // The person's answer or comment, at most 300 characters; never a
  // secret's value.
  string reply = 10;
  int64 asked_ms = 11;
  int64 decided_ms = 12;
  // As on the card: what the agent had read when it asked.
  repeated PipeTaint taint = 13;
  // REPORT_TYPE: the version made (for a deletion, its last), and the one
  // it replaced (unset for a new type).
  ReportSchema report_type = 14;
  ReportSchema report_type_before = 15;
  // REPORT_TYPE: the edit lets more of the other side's words through: a
  // field of text, a list or files that's new or widened (report_type's
  // widened_fields says where, facts included: more choices or a wider
  // range widen what crosses, but carry no words of theirs).
  bool widens = 16;
  // PIPE_FORWARD: the types the change turned on, at the version current
  // then, with every field and cap.
  repeated ReportSchema report_types = 17;
  // APP_ACCESS: the change, for UndoAppAccessChange; empty when there's
  // nothing to undo (a card declined, or one that failed).
  string app_change_id = 18;
  // APP_ACCESS: it was undone since (by a later change).
  bool undone = 19;
  // APP_ACCESS: the app's id.
  string app_id = 20;
  // APP_ACCESS: why, in Rivet's words (apps_set_access's reason): show it
  // as Rivet's, under the title, never as Claktory's; empty for the
  // person's own changes. MODEL: models_set's reason, the same way;
  // CONVERSATION: conversation_fork's or conversation_switch's;
  // WITHDRAWN: why the agent took its question or proposal back.
  // RESOLVED: the agent's last words when it closed the card itself as
  // settled in the talk (ask_reply's resolve, #496): show "<agent> closed
  // it: settled in the talk" with them; empty when the person resolved it.
  string agent_reason = 21;
  // MODEL: the change, for UndoModelChange. `undone` says it was undone.
  string model_change_id = 22;
  // MODEL: the agent whose model or effort changed. CONVERSATION: the
  // agent whose conversation changed. PIPE_MEMBER: the agent let send to
  // the pipe, or stopped.
  string subject_agent_id = 23;
  // MODEL: the subject agent's model or effort changed again since this
  // change (or the agent was deleted), so UndoModelChange would refuse it
  // ("changed since"): show that instead of Undo. False once undone
  // (`undone` says so) and for every other kind.
  bool superseded = 24;
  // QUESTION, REVIEW and PROPOSAL: how many times its agent changed the
  // card before it was decided (#428; ask_update, proposal_update); 0 for
  // none. title is the card as it was last. Show it quietly ("Updated
  // twice"), never as a record of its own.
  uint32 updates = 25;
  // Made with no card of its own because the person approved it in an
  // agent's proposal (ProposalGrant): the proposal's id (Proposal.id), to
  // say "approved in Bruno's proposal" and open it. APP_ACCESS and
  // PROPOSAL_GRANT only; empty otherwise.
  string proposal_id = 26;
  // proposal_id's agent, whose proposal it was (its name is in the
  // workspace, or its id once it's deleted).
  string proposal_agent_id = 27;
  // The proposal's entry in proposal_agent_id's conversation, to open it
  // there; 0 when it's no longer in the conversation as loaded (after
  // /clear, say): open the conversation at its end then.
  uint64 proposal_seq = 28;
  // The device it was decided from, as on its card (Entry.answered_on);
  // unset when not known.
  AnsweredOn answered_on = 29;
  // ALERT: the alert as it was kept (its words empty when withheld).
  Alert alert = 36;
  // QUESTION and REVIEW with steps (a procedure, #533): the step its
  // outcome is about, 1 for the first: the one they couldn't do (Can't do
  // this), the one their words were on when they replied, or the one
  // waiting when it was dismissed, withdrawn or resolved; the last when
  // they did them all. 0 for a card without steps.
  uint32 step = 37;
  // The procedure's number of steps; 0 for a card without steps.
  uint32 steps = 30;
  // Its agent stopped it for good at `step` after Can't do this
  // (ask_reply's resolve, #533 N3): outcome RESOLVED, agent_reason its
  // words. Say "Stopped at step 2 of 4", not "settled in the talk".
  bool step_stopped = 31;
  // SECRET_REQUEST approved: how the agent got the secret. Unset for a
  // dismissal or a reply (outcome and reply say those) and for every other
  // kind.
  NeedsYouSecretOutcome secret_outcome = 32;
  // SECRET_REQUEST given (GAVE, ADDED, GENERATED, IMPORTED): the name of
  // the secret it got, which may differ from `title`, the name the agent
  // asked for. Empty otherwise.
  string secret_given_name = 33;
  // SECRET_REQUEST, GENERATED or IMPORTED: the vault gave the secret to no
  // one (the agent asked so, or the person chose to only import it):
  // "Imported, given to no one". False: given to the agent that asked
  // (agent_id): "Imported, given to Risotto". False for every other
  // outcome and kind.
  bool secret_to_no_one = 34;
}

enum NeedsYouRecordKind {
  NEEDS_YOU_RECORD_KIND_UNSPECIFIED = 0;
  // An agent's question (ask_person).
  NEEDS_YOU_RECORD_KIND_QUESTION = 1;
  // A review ask: a file to review.
  NEEDS_YOU_RECORD_KIND_REVIEW = 2;
  // A request for a secret.
  NEEDS_YOU_RECORD_KIND_SECRET_REQUEST = 3;
  // A command using secrets, asked for once (SecretApproval).
  NEEDS_YOU_RECORD_KIND_SECRET_USE = 4;
  // A proposal to Rivet.
  NEEDS_YOU_RECORD_KIND_PROPOSAL = 5;
  // A proposal to connect a service.
  NEEDS_YOU_RECORD_KIND_CONNECT = 6;
  // An agent's card for starting or accepting a pipe.
  NEEDS_YOU_RECORD_KIND_PIPE_START = 7;
  // A pipe's held message, let through (APPROVED) or discarded (DENIED):
  // an agent's to the other side (agent_id set), or the other side's.
  NEEDS_YOU_RECORD_KIND_PIPE_HELD = 8;
  // A pipe's loop pause the person let carry on (APPROVED).
  NEEDS_YOU_RECORD_KIND_PIPE_LOOP = 9;
  // Rivet's proposal to give an agent access to an app at the person's
  // account (AppGrantProposal): APPROVED when the grant was made, DENIED
  // when the person declined it, FAILED when they approved it but it
  // couldn't be made. agent_id is Rivet, whose conversation shows the card;
  // the title names the agent it was for and the app, as it says now.
  NEEDS_YOU_RECORD_KIND_APP_GRANT = 10;
  // Where reports go changed: a pipe's forward or a project's default was
  // set, or an agent was made a report reader or let go (outcome CHANGED).
  // agent_id is the admin agent that changed it (Rivet), empty when the
  // person did; pipe_id is set for a pipe's forward; title is Claktory's
  // sentence ("Rivet set this pipe's reports to go to Ingrid"). A change
  // of the types a pipe (or a project's new pipes) can forward is one too:
  // report_types holds those it turned on.
  NEEDS_YOU_RECORD_KIND_PIPE_FORWARD = 11;
  // A report type was defined, edited or deleted (outcome CHANGED):
  // agent_id is the admin agent (Rivet), empty for the person; title is
  // Claktory's sentence; report_type and report_type_before are the
  // versions.
  NEEDS_YOU_RECORD_KIND_REPORT_TYPE = 12;
  // A change to what an app reads, which agents use it and what they hear
  // of it: CHANGED when Rivet applied it (agent_id Rivet) or the person
  // did (agent_id empty), from their apps or by undoing another;
  // APPROVED, DENIED or FAILED for Rivet's card (AppAccessProposal).
  // title is Claktory's sentence ("Rivet gave Ingrid Change dashboards on
  // Charts"); app_change_id undoes it; agent_reason is Rivet's why. seq is
  // the apps_set_access call's entry in Rivet's conversation (or its
  // card's); 0 for the person's own change or undo: open Marketplace →
  // Apps at app_id then. One that changed what agents hear counts as a
  // change of their grant (AppGrant.given).
  NEEDS_YOU_RECORD_KIND_APP_ACCESS = 13;
  // An agent (Rivet) put an agent on another model or effort with
  // models_set, which changes what the person spends: outcome CHANGED,
  // agent_id who did it, subject_agent_id whose model it was, title
  // Claktory's sentence ("Rivet put Ingrid on Claude Opus 5 at high effort", "Rivet
  // changed Ingrid's effort to high"), agent_reason its why (models_set's
  // reason; may be empty), model_change_id to undo it (UndoModelChange),
  // undone once undone. seq is the models_set call's entry in its
  // conversation.
  NEEDS_YOU_RECORD_KIND_MODEL = 14;
  // An agent (Rivet) took another agent's conversation back to an earlier
  // message, or switched it to another version, with the Conversations
  // extension (friend bug #9): outcome CHANGED, agent_id who did it,
  // subject_agent_id whose conversation it was, title Claktory's sentence
  // ("Rivet took Mike's conversation back to 14:02", "Rivet switched Mike
  // to another version"), agent_reason its why (may be empty). No Undo:
  // what was set aside is in the subject's other versions. seq is the tool
  // call's entry in the acting agent's conversation. The person's own
  // changes aren't listed.
  NEEDS_YOU_RECORD_KIND_CONVERSATION = 15;
  // An admin agent (Rivet) let an agent only send to a pipe, or stopped
  // it, with pipes_sender (#414): outcome CHANGED, agent_id who did it,
  // subject_agent_id the agent let send or stopped, pipe_id the pipe,
  // title Claktory's sentence ("Rivet let Mike send to this pipe without
  // reading it", "Rivet stopped Mike sending to this pipe"). The
  // person's own changes in the pipe's settings aren't listed.
  NEEDS_YOU_RECORD_KIND_PIPE_MEMBER = 16;
  // An admin agent (Rivet) made a change with no card of its own because
  // the person approved it in an agent's proposal (ProposalGrant): a pipe's
  // settings, an app uninstalled with its data kept, or Continue
  // automatically. Outcome CHANGED, agent_id who made it, title Claktory's
  // sentence (the grant's summary), proposal_id and proposal_agent_id the
  // proposal. A change to an app's access made so is APP_ACCESS, with
  // proposal_id set.
  NEEDS_YOU_RECORD_KIND_PROPOSAL_GRANT = 17;
  // An agent gave up a secret it had, on its own, with secrets_give_up
  // (#449): no card, no approval. Outcome CHANGED, agent_id the agent,
  // title Claktory's sentence ("Mista gave up Cloudflare"), agent_reason
  // its why. seq is the secrets_give_up call's entry in its conversation.
  // Getting it back takes a request, like any other secret.
  NEEDS_YOU_RECORD_KIND_SECRET_GIVEN_UP = 18;
  // An agent gave up access it had, on its own (#236): no card, no
  // approval. Outcome CHANGED, agent_id the agent, title Claktory's
  // sentence ("Mista left the pipe "Launch"", "Mista stopped reading the
  // pipe "Launch"", "Mista stopped leading the pipe "Launch"", "Mista gave
  // up Charts", "Mista gave up messaging Ana"), agent_reason its why. What
  // it gave up: pipe_id (pipe_leave), app_id (apps_give_up) or
  // subject_agent_id, the agent it no longer messages
  // (agents_give_up_reach). seq is the call's entry in its conversation.
  // Getting it back is the person's: in the pipe's settings, the app's, or
  // the agent's.
  NEEDS_YOU_RECORD_KIND_GIVEN_UP = 20;
  // An alert the person read (Alert; ReadAlerts): outcome READ, agent_id
  // the agent that sent it (empty for Claktory's own), title its title
  // (empty when withheld), alert the whole of it, asked_ms when it was
  // sent, decided_ms when it was read, answered_on the device it was read
  // on. seq is the notify_person call's entry in its agent's conversation
  // (0 for Claktory's own, or once it's no longer there).
  NEEDS_YOU_RECORD_KIND_ALERT = 21;
}

enum NeedsYouOutcome {
  NEEDS_YOU_OUTCOME_UNSPECIFIED = 0;
  NEEDS_YOU_OUTCOME_ANSWERED = 1;
  NEEDS_YOU_OUTCOME_DISMISSED = 2;
  NEEDS_YOU_OUTCOME_APPROVED = 3;
  NEEDS_YOU_OUTCOME_DENIED = 4;
  // Approved, but what it asked couldn't be done (APP_GRANT: the account
  // service refused the grant, or the agent was deleted since).
  NEEDS_YOU_OUTCOME_FAILED = 5;
  // A setting changed, rather than a card answered (PIPE_FORWARD).
  NEEDS_YOU_OUTCOME_CHANGED = 6;
  // The person replied with a comment rather than approving or dismissing
  // (#370 Submit): `reply` holds it.
  NEEDS_YOU_OUTCOME_REPLIED = 7;
  // The agent took the card back before the person decided (#407:
  // ask_withdraw, proposal_withdraw; QUESTION, REVIEW and PROPOSAL only):
  // decided_ms is when, agent_reason its reason, and `reply` is empty.
  NEEDS_YOU_OUTCOME_WITHDRAWN = 8;
  // An agent's question talked through on its card and ended with Resolve
  // (#430), without a decision: by the person, or by its agent closing it as
  // settled in the talk (#496; agent_reason holds its words).
  NEEDS_YOU_OUTCOME_RESOLVED = 9;
  // An alert the person read: opened, or Got it (ALERT only).
  NEEDS_YOU_OUTCOME_READ = 10;
}

// How an agent's secret request was approved (NeedsYouRecord.secret_outcome).
enum NeedsYouSecretOutcome {
  NEEDS_YOU_SECRET_OUTCOME_UNSPECIFIED = 0;
  // The person gave it a secret they had (secret_given_name). Also every
  // grant recorded before Claktory told the cases apart.
  NEEDS_YOU_SECRET_OUTCOME_GAVE = 1;
  // The person added a new secret on the card, with its value, and gave it.
  NEEDS_YOU_SECRET_OUTCOME_ADDED = 2;
  // The vault generated it (a key or a password no one sees): given to the
  // agent, or to no one when the request said so.
  NEEDS_YOU_SECRET_OUTCOME_GENERATED = 3;
  // Claktory read it from files on this computer into the vault.
  NEEDS_YOU_SECRET_OUTCOME_IMPORTED = 4;
  // The person approved the need and left it to the admin agent
  // (subject_agent_id) to find a matching secret or collect a new one.
  NEEDS_YOU_SECRET_OUTCOME_ADMIN = 5;
}

// ---- Browser control ----
//
// An agent with the browser extension asks to read a site (a pending
// BrowserSession). The person opens it in Chrome on one of their Macs and
// confirms there; that Mac's app grants it, and from then on the backend
// sends that one connection BrowserCommands and takes only its
// BrowserResults. The Mac relays each command to Claktory's Chrome extension
// through its signed helper. Nothing outlives the connection: when it closes,
// stops its heartbeat, or the backend restarts, the session ends and never
// resumes.

// A Mac app can broker for its Chrome. Sent on every connection, and again
// whenever helper_ready changes; it lasts as long as the connection, which
// brokers as one instance only. Answered with Ack.
message BrowserCapability {
  // The JSON schema of commands and results it speaks: 1.
  uint32 version = 1;
  // The operations it supports: "read", "scroll", and for assist sessions
  // "click", "fill", "navigate".
  repeated string operations = 2;
  // Claktory's helper is connected to the app now (Chrome is running with
  // the extension).
  bool helper_ready = 3;
  // Random, one per launch of the app: a grant names it.
  string broker_instance = 4;
}

// The person confirmed a pending session on this Mac, in Chrome on
// `origin`. Accepted once, while the session is pending, only from a
// connection whose capability carries `broker_instance`, and only for the
// session's own origin. Answered with Ack, or an error saying why.
message BrowserGrant {
  string session_id = 1;
  string broker_instance = 2;
  // The exact origin the extension found the tab on: "https://host[:port]".
  string origin = 3;
  // Random (16 bytes, base64url), made by the app for this grant; every
  // command and heartbeat carries it.
  string lease = 4;
}

// The answer to a BrowserCommand, from the connection it was sent to.
message BrowserResult {
  string session_id = 1;
  uint64 command_id = 2;
  // What the extension answered, as JSON (version 1's schema), at most
  // 64 KiB. Empty with a failure.
  string result_json = 3;
  // Empty, or why there's no result: "no_helper", "outcome_unknown",
  // "paused", "origin_changed", "stale_document", "unsupported_page",
  // "denied" (the person said no to a click, fill or navigation)…
  string failure = 4;
  // How long it took on the Mac, in ms.
  uint32 mac_ms = 5;
}

// The bound Mac is still there: every 5 s while a session is active. A
// session that hears none for 15 s ends as "interrupted".
message BrowserHeartbeat {
  string session_id = 1;
  string lease = 2;
}

// A session should end (see ClientMessage.browser_stop).
message BrowserStop {
  string session_id = 1;
  // Why, in a word, from the bound Mac: "stopped" (the person),
  // "declined", "tab_closed", "origin_changed", "chrome_closed",
  // "helper_gone", "app_quit", "time_limit" or "interrupted"; anything else,
  // and anything from another device, reads "stopped" ("declined" while
  // pending).
  string reason = 2;
}

// A command for the extension, to the bound connection only. One at a time
// per session; the Mac answers with BrowserResult.
message BrowserCommand {
  string session_id = 1;
  // The grant's lease: a command for another grant is refused.
  string lease = 2;
  uint64 command_id = 3;
  // Strictly increasing within a session.
  uint64 sequence = 4;
  // How long the backend waits for the result, in ms from now.
  uint32 deadline_ms = 5;
  // The operation, as JSON (version 1's schema), at most 16 KiB. A click,
  // fill or navigation is shown to the person on the Mac first, bound to
  // its exact JSON, session and sequence, and done only if they allow it
  // there: the backend never sees or sends that decision. One the backend
  // stops waiting for may still have happened (outcome_unknown): it's
  // never sent again.
  string op_json = 6;
}

// The backend ended a session the Mac is bound to: it tears it down.
message BrowserEnded {
  string session_id = 1;
  string reason = 2;
}

// A browser session's status, for every device. Never page data.
message BrowserSession {
  string id = 1;
  // The agent that asked for it.
  string agent_id = 2;
  // What the agent said it's for, at most 500 characters.
  string purpose = 3;
  // The site: "https://host[:port]".
  string origin = 4;
  // "read" (read and scroll), or "assist": the agent may also click, fill
  // and go to another page of the site, each only once the person allows
  // it on the Mac.
  string mode = 5;
  // "pending" (waiting for the person to open the site and confirm on a
  // Mac), "active", or "ended".
  string state = 6;
  // Why it ended: "stopped", "declined", "expired", "time_limit",
  // "idle", "command_limit", "data_limit", "interrupted",
  // "origin_changed", "tab_closed", "agent_changed", "ended" (the agent
  // ended it)…
  string reason = 7;
  // The paired device it's bound to; empty while pending.
  string device_id = 8;
  int64 created_ms = 9;
  // The hard deadline (15 minutes after it started; 5 minutes for a
  // pending one), in ms since 1970.
  int64 deadline_ms = 10;
  // When it ends if no command comes (5 minutes after the last); 0 while
  // pending.
  int64 idle_deadline_ms = 11;
  uint32 commands_used = 12;
  uint32 commands_limit = 13;
  uint64 bytes_returned = 14;
  uint64 bytes_limit = 15;
  int64 ended_ms = 16;
  // The action waiting for the person's review on the Mac, or being done:
  // "click", "fill" or "navigate"; empty when none is.
  string action = 17;
}

// Asks for browser control's log, newest first.
message ListBrowserLog {
  // Only this agent's; empty for every agent's.
  string agent_id = 1;
  // Only entries before this time (ms since 1970), for the next page; 0 for
  // the newest.
  int64 before_ms = 2;
  // The most entries; 0 for 100, at most 500.
  uint32 limit = 3;
  // With before_ms, the last page's oldest entry's id: only entries before
  // it in the log's order (newest first, then the larger id first), so
  // entries sharing a millisecond aren't skipped. 0 for before_ms alone.
  int64 before_id = 4;
}

// Empties browser control's log.
message ClearBrowserLog {}

message BrowserLog {
  repeated BrowserLogEntry entries = 1;
  // There are older entries than these.
  bool more = 2;
}

// What happened in a browser session, kept 7 days: who, where and the
// outcome, never what was typed, which element, a path or page data.
message BrowserLogEntry {
  int64 at_ms = 1;
  string session_id = 2;
  string agent_id = 3;
  // The paired device the session was bound to; empty before it was.
  string device_id = 4;
  // The site: "https://host[:port]".
  string origin = 5;
  // "request" (the agent asked), "grant" (the person agreed on a Mac),
  // "end", or a command: "read", "scroll", "click", "fill", "navigate".
  string op = 6;
  // A command's sequence in its session; 0 for the others.
  uint64 sequence = 7;
  // A request's mode ("read", "assist"); "granted"; why it ended
  // (BrowserSession.reason); a command's "done" or error word ("denied",
  // "expired", "outcome_unknown"…).
  string outcome = 8;
  // Unique in the log, larger for a later entry in the same millisecond:
  // ListBrowserLog.before_id.
  int64 id = 9;
}

// ---- iPad ink layers (docs/ipad-phase3-contract.md §4) ----

// A drawing on one surface of a file, at its latest revision: a PDF's page,
// an image, an excerpt of a text file, or a sketch (an image). One layer per
// surface of each version of the file (`source_sha256`): ink on a new
// version is a new layer, and the old one stays, `outdated`. Its drawing
// and preview are blobs (ReadInkBlob), named by their SHA-256.
message InkLayer {
  // "layer-12", made by the backend.
  string id = 1;
  // The file drawn on, absolute.
  string path = 2;
  // The version of the file it was drawn on.
  string source_sha256 = 3;
  string source_mime = 4;
  uint64 source_size = 5;
  InkSpace space = 6;
  // 1 for the first; the latest kept.
  uint32 revision = 7;
  // The revision this one was saved over; 0 for the first.
  uint32 parent_revision = 8;
  // The PencilKit drawing: format "pencilkit", content_version, sha256, bytes.
  InkBlobRef drawing = 9;
  // Its PNG preview: sha256, bytes, pixel_width, pixel_height.
  InkBlobRef preview = 10;
  // "page_overlay", "oriented_image", "excerpt_rendition" or "blank_canvas".
  string drawing_space = 11;
  // Six numbers: the affine transform from the drawing's space to the
  // document's (a, b, c, d, tx, ty).
  repeated double drawing_to_document = 12;
  // The layer this one was kept beside after a conflict; empty otherwise.
  string conflict_of = 13;
  // Who saved this revision: the device's id (Welcome.device_id) and kind
  // ("tablet", "phone", "desktop"…), and its system's version.
  string device_id = 14;
  string device_kind = 15;
  string os_version = 16;
  int64 updated_ms = 17;
  // The file is now another version than `source_sha256`.
  bool outdated = 18;
}

// The surface a layer is drawn on (the fixtures' `coordinate_space`).
message InkSpace {
  // "pdf_page", "image" or "excerpt_rendition".
  string kind = 1;
  // A PDF's page: 1 to 2000, its box ("crop"), the crop and media boxes
  // (4 numbers each) and its rotation (0, 90, 180 or 270).
  uint32 page_1based = 2;
  string box = 3;
  repeated double crop_box = 4;
  repeated double media_box = 5;
  uint32 rotation = 6;
  // An image: its size as shown (oriented) and as stored, and its EXIF
  // orientation (1 to 8).
  uint32 oriented_width = 7;
  uint32 oriented_height = 8;
  uint32 stored_width = 9;
  uint32 stored_height = 10;
  uint32 exif_orientation = 11;
  // An excerpt: its text, and how it was set.
  string text = 12;
  ExcerptRendition rendition = 13;
  // Every kind: the surface's size, in `units` ("pt" or "px").
  double width = 14;
  double height = 15;
  string units = 16;
}

// How an excerpt's text was set to be drawn on.
message ExcerptRendition {
  string font = 1;
  double font_size = 2;
  double line_height = 3;
  double padding = 4;
}

// A blob a layer refers to.
message InkBlobRef {
  // The drawing's: "pencilkit", and the version of its content.
  string format = 1;
  uint32 content_version = 2;
  string sha256 = 3;
  uint64 bytes = 4;
  // The preview's size, in pixels.
  uint32 pixel_width = 5;
  uint32 pixel_height = 6;
}

message ListInkLayers {
  // Absolute, or from the home folder.
  string path = 1;
}

message InkLayerList {
  string path = 1;
  // The file's SHA-256 now; empty when it can't be read.
  string current_sha256 = 2;
  // Every version's layers, each at its latest revision, newest first.
  repeated InkLayer layers = 3;
}

// A layer's next revision, or a new layer (empty `ink_layer_id`,
// `base_revision` 0). Its blobs are uploaded first (StartUpload with
// UPLOAD_PURPOSE_INK). A new layer needs `source_sha256` to be the file's
// SHA-256 now; a revision keeps its layer's, even once outdated.
message SaveInkLayer {
  string ink_layer_id = 1;
  // The revision this was drawn over: the latest, or it's a conflict.
  uint32 base_revision = 2;
  string path = 3;
  string source_sha256 = 4;
  InkSpace space = 5;
  string drawing_space = 6;
  repeated double drawing_to_document = 7;
  string drawing_sha256 = 8;
  string preview_sha256 = 9;
  uint32 content_version = 10;
  // Made up by the app, one per save: the same again answers the same,
  // and saves nothing twice.
  string client_save_id = 11;
  // Keep this beside that layer, after a conflict: a new layer.
  string conflict_of = 12;
  // The device's system version ("27.2").
  string os_version = 13;
}

// Saved: `revision` is set, and the layer's row and blobs are durable.
// A conflict: `revision` is 0 and `conflict` is the layer as it is now;
// nothing was overwritten.
message InkLayerSaved {
  string client_save_id = 1;
  string ink_layer_id = 2;
  uint32 revision = 3;
  InkLayer conflict = 4;
}

// Deletes a layer, at the revision the app saw. Refused while a review
// item refers to it.
message DeleteInkLayer {
  string ink_layer_id = 1;
  uint32 base_revision = 2;
}

// ---- Where each device was reading (docs/ipad-phase3-contract.md §1) ----

// Replaces this device's record for an agent: the pane in focus and each
// pane's place. Panes the agent's layout doesn't have are left out. With
// `sidebar_hidden` set, it also replaces whether this device hides the
// pinned sidebar; with it set, `agent_id` may be empty to change only that.
message SetPresentation {
  string agent_id = 1;
  // A ViewNode id in the agent's layout; empty for none.
  string focused_leaf_id = 2;
  repeated LeafPlace places = 3;
  optional bool sidebar_hidden = 4;
}

// Where a pane was: for now the page a PDF was on.
message LeafPlace {
  string leaf_id = 1;
  // 1-based; 0 for none.
  uint32 page_1based = 2;
}

// This device's own record: each agent's, and whether it hides the pinned
// sidebar.
message Presentation {
  repeated AgentPresentation agents = 1;
  bool sidebar_hidden = 2;
}

message AgentPresentation {
  string agent_id = 1;
  string focused_leaf_id = 2;
  repeated LeafPlace places = 3;
}

// ---- Sketches (docs/ipad-phase3-contract.md §6) ----

// A blank white PNG, `width` by `height` pixels (1 to 8192 each), at
// `<directory>/<name>.png`, with " 2", " 3"… before the extension when the
// name is taken. `directory` is in one of the person's projects' folders.
message CreateSketch {
  string directory = 1;
  string name = 2;
  uint32 width = 3;
  uint32 height = 4;
}

// The sketch made: where, and its SHA-256 (an ink layer's source_sha256).
message SketchCreated {
  string path = 1;
  string sha256 = 2;
}

// Asks for this Claktory's direct-message leaf (dms-e2ee.md §2, Claktories).
message DmLeafOfferRequest {}

// This Claktory's direct-message leaf, for the person's device to certify:
// a LeafCertificate of kind Claktory naming leaf_id and leaf_signature_key,
// signed with the person's identity key (claktory-dm-crypto's certificate).
// The key is made on the first ask and kept until the Claktory signs in
// again or moves (a new registration epoch, so a new leaf).
message DmLeafOffer {
  // The leaf's Ed25519 signature key, 32 bytes.
  bytes leaf_signature_key = 1;
  // This Claktory at the account service, and its registration's epoch.
  string claktory_id = 2;
  uint64 registration_epoch = 3;
  // "<claktory_id>#<registration_epoch>": what the certificate names.
  string leaf_id = 4;
  // This Claktory's name, for the certificate (one line, 64 at most).
  string name = 5;
  // A certificate for this key is taken already.
  bool enrolled = 6;
}

// The person's device enrolls this Claktory's leaf.
message DmEnrollLeaf {
  // The TLS-encoded LeafCertificate the device signed for the offered key.
  bytes certificate = 1;
  // The device's pins (claktory-dm-crypto's Pins, as JSON), the person's
  // own account's included: what this Claktory trusts about each account.
  bytes pins = 2;
}

// ---- Reports: what a pipe's liaison forwards (pipes-automation.md) ----
//
// A pipe's liaison (quarantined) collects a report from the other side and
// submits it, in fields a schema fixes, to the one agent the person chose
// (the pipe's forward). That agent reads reports: it's contained too. The
// backend checks every field, keeps the report with where it came from, and
// lets the reader read it only through a tool that marks it as having read
// the other side's words. Reading reports in the app affects no agent.

// A kind of report (a report type), one version of it. Its fields are a
// closed set of kinds; its text (name, labels, rules) is shown, never
// obeyed. A type can only narrow what crosses from a liaison to its reader:
// who submits, who reads and where it goes stay the pipe's settings.
message ReportSchema {
  // "bug_report": lowercase letters, digits and _, at most 40. Made by
  // Claktory from the name for a new type (SaveReportType with id empty).
  string id = 1;
  // "Bug report".
  string name = 2;
  repeated ReportField fields = 3;
  // 1, 2…: each edit makes a new version; a version never changes. A
  // report is checked and shown against its own (PipeReport.type_version).
  uint32 version = 4;
  // Claktory's own: it can be edited (a new version) but not deleted.
  bool builtin = 5;
  // Who made this version: empty for the person (or, for a built-in
  // type's first, Claktory), else the admin agent's id (Rivet).
  string by_id = 6;
  int64 at_ms = 7;
  // What the reader can tell the other side about a report of this type
  // (handoff_mark): a few of ACCEPTED, DONE, DECLINED, KNOWN, FIXED,
  // WONT_FIX and NEEDS_INFO, in that order. Their words are Claktory's.
  repeated PipeReportState outcomes = 8;
  // The fields this version added or widened, compared with the version
  // before it: a new field, a higher cap, more choices, a wider range, a
  // fact made text. Empty for version 1 and for an edit that only narrows.
  repeated string widened_fields = 9;
}

// The ceilings every report type stays within (fixed in code): a type may
// set lower ones. SaveReportType is refused past any of them.
message ReportTypeRules {
  // TEXT: bytes per field.
  uint32 text_bytes = 1;
  // TEXT_LIST: items, and bytes per item.
  uint32 list_items = 2;
  uint32 item_bytes = 3;
  // Fields in a type, and of them facts (ENUM, BOOL, VERSION, NUMBER,
  // DATE).
  uint32 fields = 4;
  uint32 facts = 5;
  // ENUM: choices, each lowercase letters, digits and _ (at most 40).
  uint32 choices = 6;
  // ATTACHMENTS: files in a report (at most one such field in a type), and
  // MB each.
  uint32 attachments = 7;
  uint32 attachment_mb = 8;
  // NUMBER: its range stays within -number_abs..number_abs.
  int64 number_abs = 9;
  // Characters in a type's name, a field's label, a field's rule.
  uint32 name_chars = 10;
  uint32 label_chars = 11;
  uint32 rule_chars = 12;
  // Types in this Claktory (not deleted), and enabled on one pipe.
  uint32 types = 13;
  uint32 per_pipe = 14;
  // Field ids that would read as routing ("to", "recipient", "path"…),
  // refused; so is an id with one of routing_tokens between its _s
  // ("forward_note"), or one ending "_to" ("send_to"). A new field's id made
  // from its label is checked the same way, before any _2 is added.
  repeated string reserved_ids = 15;
  // The kinds whose values are the other side's words: reading them marks
  // the reader. Every other kind is a fact.
  repeated ReportFieldType text_kinds = 16;
  // NUMBER and DATE fields in a type: facts are read without marking
  // anyone, so their total width is kept small.
  uint32 numbers = 17;
  uint32 dates = 18;
  // Words that make any field id read as routing (see reserved_ids), alone
  // or with an s ("urls").
  repeated string routing_tokens = 19;
}

// Defines a report type, or edits one. Refused, with the rule in Claktory's
// words, past any ReportTypeRules ceiling, with a reserved or repeated id,
// or an ENUM choice that isn't an id.
message SaveReportType {
  // id empty: a new type. Otherwise a new version of that type. Each
  // field's name is kept; a field with name empty is new, and gets an id
  // made from its label. `fact` is ignored (it follows the kind), and so
  // are caps a kind doesn't use; 0 for a cap is its ceiling. An empty rule
  // gets Claktory's own. version, builtin, by_id, at_ms and widened_fields
  // are ignored.
  ReportSchema type = 1;
  // The version the editor started from; 0 for a new type. Refused when
  // it's no longer the current one (someone else edited it meanwhile).
  uint32 base_version = 2;
}

// Deletes a report type: refused for a built-in one, and while a pipe or a
// project's new pipes can forward it. Its versions stay, for the reports
// that use them.
message DeleteReportType {
  string id = 1;
}

message ReportField {
  // As agents and ReportValue name it: "what_happened".
  string name = 1;
  // Claktory's words for it: "What happened".
  string label = 2;
  // A fact (one of a list, a yes or no, a known release): reading it
  // affects no agent. Otherwise it's text, the other side's own words.
  bool fact = 3;
  ReportFieldType type = 4;
  // ENUM: its choices, as written.
  repeated string choices = 5;
  bool required = 6;
  // TEXT and TEXT_LIST: the most bytes (of each item); 0 for none.
  uint32 max_bytes = 7;
  // TEXT_LIST and ATTACHMENTS: the most items.
  uint32 max_items = 8;
  // Its rule in one line: "Up to 2,000 bytes".
  string rule = 9;
  // NUMBER: its range, within ReportTypeRules.number_abs. Unset in
  // SaveReportType: 0 and 1,000,000.
  optional sint64 min = 10;
  optional sint64 max = 11;
  // The rule was written by whoever defined the type (the person, Rivet,
  // or Claktory for its own types); false when Claktory made it from the
  // kind and caps, to make again on the next save (send rule "" for it).
  // Ignored in SaveReportType: a non-empty rule there is written.
  bool rule_written = 12;
}

enum ReportFieldType {
  REPORT_FIELD_TYPE_UNSPECIFIED = 0;
  REPORT_FIELD_TYPE_TEXT = 1;
  REPORT_FIELD_TYPE_TEXT_LIST = 2;
  REPORT_FIELD_TYPE_ENUM = 3;
  REPORT_FIELD_TYPE_BOOL = 4;
  // A known release ("v0.1.16"), or "unknown".
  REPORT_FIELD_TYPE_VERSION = 5;
  // Files from the pipe's inbox, copied into the report.
  REPORT_FIELD_TYPE_ATTACHMENTS = 6;
  // A whole number within the field's min and max.
  REPORT_FIELD_TYPE_NUMBER = 7;
  // A day, "2026-11-22", from 1900-01-01 to 2999-12-31.
  REPORT_FIELD_TYPE_DATE = 8;
}

// Where a pipe's reports go (Pipe.forward), or a project's default for new
// pipes (Project.report_forward).
message PipeForward {
  // The agent that reads them (Agent.reads_reports); empty for no one.
  string recipient_id = 1;
  // The first of type_ids, for older apps.
  string schema_id = 2;
  // Rises with each change of recipient. A report goes only to the
  // recipient of the revision it was taken under: after a change, those not
  // yet read wait for the person (PIPE_REPORT_STATE_WAITING). A change of
  // types leaves it, and its reports, as they are. 0 for a project's
  // default.
  uint32 revision = 3;
  // Who last changed it: empty for the person, else the admin agent's id
  // (Rivet).
  string set_by_id = 4;
  int64 set_ms = 5;
  ReportLimits limits = 6;
  // The report types its liaison may forward (ReportSchema.id), 1 to
  // ReportTypeRules.per_pipe of them. A type turned off refuses new reports
  // of it; those already forwarded stay as they are.
  repeated string type_ids = 7;
}

// How much a pipe may forward, in the last 24 hours. As kept and shown,
// each is the one in effect; in SetPipeForward, 0 means the default.
message ReportLimits {
  // 6 and 30.
  uint32 per_hour = 1;
  uint32 per_day = 2;
  // Text, in KiB: 64.
  uint32 text_kib_per_day = 3;
  // 3 files of at most 2 MB each, 20 MB in all.
  uint32 attachments_per_report = 4;
  uint32 attachment_mb = 5;
  uint32 attachments_mb_per_day = 6;
}

// A pipe's reports in the last 24 hours, for its settings and the Map.
message PipeReportCounts {
  // Forwarded.
  uint32 today = 1;
  // How many more it can forward now (the hour's and the day's limits).
  uint32 room_today = 2;
  // Not forwarded, for any reason.
  uint32 refused_today = 3;
  // Of those, over a limit: "4 reports over today's limit weren't
  // forwarded".
  uint32 over_limit_today = 4;
  // Waiting because where they go changed (DecidePipeReports), any age.
  uint32 waiting = 5;
}

// Where a pipe's reports go, or (pipe_id empty) a project's default for its
// new pipes. Refused when the recipient doesn't read reports, unless
// make_reader: then it becomes a reader first, as SetReportReader. Reports
// already waiting stay waiting.
message SetPipeForward {
  string pipe_id = 1;
  // With pipe_id empty.
  string project_id = 2;
  // Empty for no one.
  string recipient_id = 3;
  // Older apps: one type. With type_ids and schema_id both empty, the
  // types stay as they are ("bug_report" for a new forward), and so they do
  // when schema_id is one of them already.
  string schema_id = 4;
  bool make_reader = 5;
  // With make_reader: start its conversation fresh (the old one archived,
  // as /clear does).
  bool fresh = 6;
  // Unset keeps what it had; 0 in a field means the default.
  ReportLimits limits = 7;
  // The types its liaison may forward: refused empty while there's a
  // recipient, or past ReportTypeRules.per_pipe. The same recipient keeps
  // the revision.
  repeated string type_ids = 8;
}

// Makes an agent a report reader, or (reads false) lets it go back to its
// usual tools; refused while a forward still names it.
message SetReportReader {
  string agent_id = 1;
  bool reads = 2;
  // Start its conversation fresh (the old one archived, as /clear does),
  // either way.
  bool fresh = 3;
}

// The pipe's waiting reports: send them to its current recipient, or
// discard them.
message DecidePipeReports {
  string pipe_id = 1;
  bool send = 2;
}

// A page of reports, newest first: one pipe's ("Forwarded"), or (pipe_id
// empty) every report forwarded to recipient_id (its "Reports" panel).
message ListPipeReports {
  string pipe_id = 1;
  string recipient_id = 2;
  // The last page's oldest PipeReport.id; 0 for the newest.
  uint64 before_id = 3;
  // 0 for 50; at most 200.
  uint32 limit = 4;
}

message PipeReportPage {
  // As asked (ListPipeReports), to tell answers apart.
  string pipe_id = 1;
  string recipient_id = 2;
  repeated PipeReport reports = 3;
  bool more = 4;
  // The versions its reports use that aren't current any more (an older
  // version, a deleted type's): look a report's type up here by (id,
  // version), else in Workspace.report_schemas.
  repeated ReportSchema schemas = 5;
}

message PipeReport {
  // Claktory's id for it, across pipes.
  uint64 id = 1;
  string pipe_id = 2;
  // Its number in its pipe ("#4"): what the other side is told. 0 for one
  // not forwarded.
  uint32 number = 3;
  PipeReportState state = 4;
  // KNOWN: the pipe's own name for the issue ("A3"), made by Claktory.
  string alias = 5;
  // FIXED: a known release.
  string fixed_in = 6;
  // NEEDS_INFO: the field it needs (ReportField.name).
  string needs_field = 7;
  // REFUSED: why, in a word (missing, too_long, too_many, invalid, version,
  // unknown_field, secret, over_limit, type, …) and the type's field, if
  // one. What was refused is never kept: "type" (a type that's unknown or
  // not on for the pipe) leaves schema_id empty.
  string refused_code = 8;
  string refused_field = 9;
  string schema_id = 10;
  // Its fields, as checked; empty when REFUSED.
  repeated ReportValue values = 11;
  // The liaison that wrote it.
  string liaison_id = 12;
  // The recipient it was taken for.
  string recipient_id = 13;
  int64 received_ms = 14;
  // Its recipient has read its words, and when.
  bool read = 15;
  int64 read_ms = 16;
  // What its liaison had read when it wrote it. Since #346 reading a pipe
  // marks no one, so it's empty on new reports; older ones name the pipe.
  repeated PipeTaint taint = 17;
  repeated ReportAttachment attachments = 18;
  // The version of its type (schema_id) it was checked against.
  uint32 type_version = 19;
}

enum PipeReportState {
  PIPE_REPORT_STATE_UNSPECIFIED = 0;
  // Forwarded; its reader hasn't marked it.
  PIPE_REPORT_STATE_NEW = 1;
  PIPE_REPORT_STATE_ACCEPTED = 2;
  // "Already known as A3".
  PIPE_REPORT_STATE_KNOWN = 3;
  // "Fixed in v0.1.16".
  PIPE_REPORT_STATE_FIXED = 4;
  PIPE_REPORT_STATE_WONT_FIX = 5;
  // "Needs more: steps".
  PIPE_REPORT_STATE_NEEDS_INFO = 6;
  // Not forwarded.
  PIPE_REPORT_STATE_REFUSED = 7;
  // Where it goes changed before it was read: the person sends or discards
  // it (DecidePipeReports).
  PIPE_REPORT_STATE_WAITING = 8;
  // The person discarded it while it waited.
  PIPE_REPORT_STATE_DISCARDED = 9;
  // Its reader did what it asked.
  PIPE_REPORT_STATE_DONE = 10;
  // Its reader won't do what it asked.
  PIPE_REPORT_STATE_DECLINED = 11;
}

message ReportValue {
  // ReportField.name.
  string field = 1;
  // TEXT (the other side's words), ENUM and VERSION.
  string text = 2;
  // TEXT_LIST.
  repeated string items = 3;
  // BOOL.
  bool flag = 4;
  // NUMBER. (DATE is in text: "2026-11-22".)
  sint64 number = 5;
}

// A file a report carries, copied from the pipe's inbox when it was
// submitted.
message ReportAttachment {
  // Its name as shown, cleaned: the other side's words.
  string name = 1;
  uint64 size = 2;
  bool image = 3;
  // Where Claktory keeps it: in the pipe's report store, outside every
  // project, named by Claktory.
  string path = 4;
}

// A liaison's model spending today (Agent.spend).
message ContainedSpend {
  // Its estimated model spend since local midnight, from agent_usage and
  // its models' prices.
  double spent_usd = 1;
  // Its daily cap in dollars (10 unless set).
  double cap_usd = 2;
  // Input, output and cache writes today on models with no price.
  uint64 spent_tokens = 3;
  // The cap for those (1,000,000 unless set).
  uint64 cap_tokens = 4;
  // Past either cap: its pipes' messages wait, they don't wake it.
  bool over = 5;
  // Pipe messages waiting because of that (the quiet count).
  uint32 held_messages = 6;
  // The next local midnight, when the held messages wake it.
  int64 resumes_ms = 7;
}

// A liaison's daily spending cap. 0 means the default.
message SetSpendCap {
  string agent_id = 1;
  double cap_usd = 2;
  uint64 cap_tokens = 3;
}

// One reply to report (ClientMessage.report_reply): an AssistantText entry
// of an agent's conversation, or of a chat's, whose response has finished.
message ReportReply {
  // Whose conversation: an agent's id, or a chat's ("chat:3"); one of them.
  string agent_id = 1;
  string chat_id = 2;
  // The entry (Entry.seq).
  uint64 seq = 3;
  // The person's note, optional: at most 1000 characters.
  string note = 4;
  // false: only show what would be sent; true: send it.
  bool send = 5;
}

// What a report sends, exactly: the app shows this, never its own copy.
// Nothing else goes with it but this computer's platform ("macos-arm64").
message ReplyReport {
  // The reply's text with the vault's values hidden, cut at 16 KB (on a
  // character's boundary).
  string text = 1;
  // The name of the model that wrote it ("Claude Opus 4.5"), or its id
  // when that model is no longer listed.
  string model = 2;
  // This Claktory's version.
  string version = 3;
  // The note as it's sent: control characters but line breaks and tabs
  // removed, trimmed.
  string note = 4;
  // The text was cut at 16 KB.
  bool truncated = 5;
}

// ---- Direct messages through the home Claktory (#451) ----
//
// Each person's always-on Claktory, their home, keeps their direct messages
// for their devices; claktory.com keeps only MLS's control plane (keys,
// key packages, signed device lists, commits, GroupInfo, Welcomes). A
// device hands its MLS messages to its home here, the home sends them to
// the friend's home over iroh (ALPN claktory-dm/1) and serves each of its
// person's leaves what's theirs, in one order per group. The home holds
// only ciphertext and reads only MLS's public framing. Only the person's
// paired devices send these, over their own connection: never an agent or
// Rivet. Behind FACTORY_DMS_PREVIEW until People ships.

// Hands an MLS message to the home: an application message (conversation,
// self group or channel), or a commit claktory.com has just accepted (sent
// right after it's accepted, so the person's other devices and the
// friend's home learn of it at once). Answered with DmFeed holding `sent`;
// a request that isn't an MLS message of a group is an Error
// (INVALID_REQUEST).
message DmSend {
  bytes group_id = 1;
  // The MLS message as the device made it: ciphertext, never opened here.
  bytes envelope = 2;
  // An application message's id, the same on every retry: 22 to 64
  // letters, digits, - and _. Empty for a commit.
  string client_message_id = 3;
  // The sending device's MLS leaf id: its messages and deliveries are
  // told apart by it.
  string leaf_id = 4;
}

// This connection follows its device's groups: answered with DmFeed pages
// up to now, then every new entry for the leaf, and its own messages'
// deliveries, pushed as DmFeed until the connection closes or another
// DmFollow replaces this one.
message DmFollow {
  // This device's MLS leaf id.
  string leaf_id = 1;
  // Where it read to in each group; a group left out starts at the
  // leaf's join.
  repeated DmCursor cursors = 2;
}

message DmCursor {
  bytes group_id = 1;
  // The home's seq in that group (DmEntry.seq).
  uint64 seq = 2;
}

// The device has kept its groups' entries through these seqs: the home may
// let them go once every leaf of the person's in the group has. Answered
// with Ack.
message DmAck {
  string leaf_id = 1;
  repeated DmCursor through = 2;
}

// The routing table, as the device verified it: each friend's home (from
// their signed device list, checked against the device's pin), with the
// groups it may send to this home and receive from it. Replaces the whole
// table. (The person's own other Claktories with a Claktory leaf introduce
// themselves to the home, signed with that leaf's key: they're not listed
// here.) Answered with DmHome; sent to a Claktory that isn't the home yet,
// it's kept for when it is.
message DmRoutes {
  repeated DmRoute routes = 1;
}

message DmRoute {
  // The friend's account.
  string account_id = 1;
  // That home's iroh endpoint id (32 bytes).
  bytes home_endpoint = 2;
  repeated bytes group_ids = 3;
}

message DmFeed {
  // In each group's order, oldest first.
  repeated DmEntry entries = 1;
  // The groups the entries are in, or all the leaf's on DmFollow.
  repeated DmGroupState groups = 2;
  // The answer to DmSend.
  DmReceipt sent = 3;
  // How the person's own messages are getting on.
  repeated DmDelivery deliveries = 4;
  // More pages follow before the device is caught up.
  bool has_more = 5;
}

message DmEntry {
  bytes group_id = 1;
  // The home's number for it in the group: the same on every device of
  // the person's.
  uint64 seq = 2;
  DmEntryKind kind = 3;
  // Its epoch, from its framing.
  uint64 epoch = 4;
  bytes envelope = 5;
  // When the home took it.
  int64 accepted_ms = 6;
  // Sent by one of the person's own leaves.
  bool from_me = 7;
  // The sender's id for it: only on the person's own messages. (Who sent
  // it, an agent's message included, is inside the encrypted content.)
  string client_message_id = 8;
}

enum DmEntryKind {
  DM_ENTRY_KIND_UNSPECIFIED = 0;
  DM_ENTRY_KIND_APPLICATION = 1;
  DM_ENTRY_KIND_COMMIT = 2;
}

message DmGroupState {
  bytes group_id = 1;
  // The epoch the home has the commit for.
  uint64 epoch = 2;
  uint64 last_seq = 3;
  // The home let go of entries past the device's cursor (it was away over
  // 90 days): it joins the group again.
  bool behind = 4;
}

message DmReceipt {
  bytes group_id = 1;
  string client_message_id = 2;
  // The home's seq and time, once stored (STORED, DUPLICATE).
  uint64 seq = 3;
  int64 accepted_ms = 4;
  DmSendResult result = 5;
  // TOO_OLD: the home's epoch.
  uint64 epoch = 6;
  // HOME_FULL, RATE_LIMITED: when to try again.
  int64 retry_after_ms = 7;
}

enum DmSendResult {
  DM_SEND_RESULT_UNSPECIFIED = 0;
  DM_SEND_RESULT_STORED = 1;
  // The same id and envelope again: the first receipt.
  DM_SEND_RESULT_DUPLICATE = 2;
  // A future epoch the home has no commit for yet: stored once it has.
  DM_SEND_RESULT_HELD = 3;
  // The friend has no device in the conversation yet.
  DM_SEND_RESULT_WAITING_FOR_FRIEND = 4;
  // More than 5 epochs behind: encrypt it again at the current epoch.
  DM_SEND_RESULT_TOO_OLD = 5;
  // The same id with another envelope: refused.
  DM_SEND_RESULT_CONFLICT = 6;
  DM_SEND_RESULT_HOME_FULL = 7;
  DM_SEND_RESULT_RATE_LIMITED = 8;
  // This Claktory doesn't take direct messages (it isn't the home, or the
  // preview is off).
  DM_SEND_RESULT_NOT_HOME = 9;
}

message DmDelivery {
  bytes group_id = 1;
  string client_message_id = 2;
  DmDeliveryState state = 3;
  // WAITING: when the friend's home was last reachable (0: never);
  // DELIVERED: when it took it.
  int64 at_ms = 4;
  // BOUNCED: the friend's home's epoch.
  uint64 epoch = 5;
  // The friend's account it's about.
  string account_id = 6;
}

enum DmDeliveryState {
  DM_DELIVERY_STATE_UNSPECIFIED = 0;
  // The home has it and is sending it on.
  DM_DELIVERY_STATE_HELD_BY_HOME = 1;
  // The friend's home took it.
  DM_DELIVERY_STATE_DELIVERED = 2;
  // The friend's home can't be reached.
  DM_DELIVERY_STATE_WAITING = 3;
  // The friend's home can't read it any more (its epoch moved on more
  // than 5): the device encrypts it again, by itself only when members
  // were only removed since, otherwise asking the person first.
  DM_DELIVERY_STATE_BOUNCED = 4;
}

message DmHome {
  // This Claktory takes the person's direct messages.
  bool is_home = 1;
  // Its iroh endpoint id: what the device signs into its list as `home`.
  bytes endpoint_id = 2;
  repeated DmPeer peers = 3;
  // Ciphertext held for the person and friends, in bytes.
  uint64 held_bytes = 4;
  // Taking nothing new: its disk has under 5 GiB free.
  bool intake_paused = 5;
  // When this Claktory became the person's home, in ms since the epoch; 0
  // if it isn't the home (or never knew when). Messages sent before it came
  // through another home, so this one can't vouch they were delivered.
  int64 home_since_ms = 6;
}

message DmPeer {
  string account_id = 1;
  bytes home_endpoint = 2;
  bool reachable = 3;
  int64 last_reachable_ms = 4;
  // Messages waiting to go to it.
  uint32 outbox_count = 5;
  // A cap it reached with this home ("full"), or "turned_away": it doesn't
  // take this home's link at all (it isn't the friend's home any more, or
  // doesn't route this one yet), so the person's device reads the friend's
  // list again and gives the home new routes. Empty if none.
  string refused = 6;
}

// ---- Claktory's browser (#435) ----
//
// One Chrome per Claktory, with a kept profile (signed in to sites as a
// person's browser is), on a private virtual screen nobody sees: on a Linux
// server as its own user, on a Mac in a small VM. Agents use it only
// through errands (Errand): a contained agent drives it with the errands
// extension, within the errand's sites. The person sees it only when they
// ask: Show me on a handoff card, Watch, Take over, or Open. The live view
// is the person's alone: frames and the clipboard go only to the one
// connection watching, and input counts only from it, only during the
// person's turn (PERSONS_TURN, TAKEN_OVER, BROWSING).

message AgentBrowser {
  AgentBrowserState state = 1;
  // The errand using it (Errand.id), or empty.
  string errand_id = 2;
  // Why it can't run on this computer, with what fixes it; unset when it
  // can. While set, state is UNAVAILABLE and nothing starts it.
  AgentBrowserSetup setup = 3;
  // The sites it's signed in to: origins holding cookies
  // ("https://accounts.google.com"), sorted; never a cookie's name or
  // value. Read when it last ran; kept while it's off.
  repeated string signed_in_sites = 4;
  // The device whose connection watches it now (WatchAgentBrowser), by
  // name ("Matt's iPhone"); empty when none does. Its input is the only
  // input that counts. A connection knows it's the one: it sent Watch on
  // and got no AgentBrowserViewMoved since.
  string viewer_device = 5;
  // WARM: when it closes by itself unless used (30 minutes after it was
  // last used), in ms since 1970; 0 otherwise.
  int64 warm_until_ms = 6;
  // Chrome's version ("158.0.8127.88"), once known; empty before.
  string chrome_version = 7;
  // The time zone its pages see, an IANA name ("Europe/London"); empty
  // until set (SetAgentBrowserLocale, or the first device's), when they
  // see the Claktory computer's own. Applies from its next start.
  string time_zone = 8;
  // The languages its pages see, BCP 47 tags in order ("en-GB", "en");
  // empty until set, when they see en-US. Applies from its next start.
  repeated string languages = 9;
  // The identity providers it's signed in to (#435), each with Sign out
  // (SignOutAgentBrowserAccount); empty when none.
  repeated AgentBrowserAccount accounts = 10;
}

// An identity provider Claktory's browser is signed in to (#435 W6), from
// the vault's record of its first sign-in there.
message AgentBrowserAccount {
  // "google", "apple" or "microsoft".
  string provider = 1;
  // As shown: "Google".
  string name = 2;
  // The secret it signed in with (SecretInfo.id), and its name now; empty
  // when the secret is gone.
  string secret_id = 3;
  string secret_name = 4;
  // When it first signed in there, in ms since 1970.
  int64 signed_in_ms = 5;
  // A sign-out is waiting for the errand using the browser to end (or for
  // its next start); the account's fills and sign-in clicks are refused
  // meanwhile.
  bool signing_out = 6;
}

enum AgentBrowserState {
  AGENT_BROWSER_STATE_UNSPECIFIED = 0;
  // Not running. The profile is kept.
  AGENT_BROWSER_STATE_OFF = 1;
  AGENT_BROWSER_STATE_STARTING = 2;
  // Running with no one using it, closing by itself at warm_until_ms.
  AGENT_BROWSER_STATE_WARM = 3;
  // An errand's agent drives it. The view is view-only.
  AGENT_BROWSER_STATE_DRIVEN = 4;
  // An errand handed it to the person (a handoff card waits): Chrome runs
  // with no automation, the agent can't read or act, and the watching
  // connection's input counts.
  AGENT_BROWSER_STATE_PERSONS_TURN = 5;
  // The person took it from the errand's agent (TakeOverAgentBrowser): the
  // agent is paused until HandBackAgentBrowser.
  AGENT_BROWSER_STATE_TAKEN_OVER = 6;
  // The person opened it with no errand (OpenAgentBrowser): theirs to use.
  AGENT_BROWSER_STATE_BROWSING = 7;
  AGENT_BROWSER_STATE_STOPPING = 8;
  // It can't run on this computer: setup says why.
  AGENT_BROWSER_STATE_UNAVAILABLE = 9;
}

// What's missing for Claktory's browser on this computer.
message AgentBrowserSetup {
  // Why, in a sentence ("Chrome isn't installed on this computer.").
  string problem = 1;
  // The command that sets it up, to run once in a terminal on this
  // computer (it asks for the administrator's password): show it whole, in
  // monospace, with Copy. Empty when nothing to run fixes it, or on NixOS.
  string command = 2;
  // On NixOS: the lines to add to the configuration instead, then rebuild.
  string nixos_lines = 3;
  // Nothing on this computer can fix it (an Intel Mac, a Linux kernel too
  // old to contain the browser): problem says so, and what can.
  bool unsupported = 4;
}

// An agent's errand in Claktory's browser: what it's for, and the sites it
// may go to, fixed when it was opened.
message Errand {
  string id = 1;
  // The agent doing it: a contained agent with the errands extension.
  string agent_id = 2;
  // What it's for, in the words of who opened it (one line).
  string purpose = 3;
  // The origins it may go to ("https://play.google.com"), fixed when it
  // was opened; the agent can't change them.
  repeated string sites = 4;
  ErrandState state = 5;
  // Who opened it: an agent's id (its lead), or empty for the person.
  string opened_by = 6;
  // The latest handoff while it waits for the person (PERSONS_TURN);
  // unset otherwise.
  ErrandHandoff handoff = 7;
  int64 created_ms = 8;
  // When it ended (DONE, STOPPED, CANCELLED, FAILED), in ms; 0 before.
  int64 ended_ms = 9;
  // Why it ended, in Claktory's words ("You stopped it.", "Chrome closed
  // unexpectedly."), or for CANCELLED the person's reason, as theirs.
  string end_reason = 10;
}

enum ErrandState {
  ERRAND_STATE_UNSPECIFIED = 0;
  // Its agent drives the browser.
  ERRAND_STATE_RUNNING = 1;
  // Handed to the person: a handoff card waits.
  ERRAND_STATE_PERSONS_TURN = 2;
  // The person took the browser over; the agent waits.
  ERRAND_STATE_TAKEN_OVER = 3;
  // Its agent finished it.
  ERRAND_STATE_DONE = 4;
  // The person stopped it (StopAgentBrowser, Delete browser data).
  ERRAND_STATE_STOPPED = 5;
  // The person answered a handoff with Can't do this.
  ERRAND_STATE_CANCELLED = 6;
  // The browser ended under it (it couldn't start, or closed).
  ERRAND_STATE_FAILED = 7;
}

// A moment only the person can act on, handed to them by an errand's agent.
message ErrandHandoff {
  string errand_id = 1;
  ErrandHandoffKind kind = 2;
  // What to do, in the agent's words (one sentence; it has read web pages,
  // so show it as the agent's, never as Claktory's).
  string what = 3;
  // The page it was handed over on, as Claktory read it: its origin, and
  // its title (control and invisible characters taken out). Show the
  // origin apart from the title, so a title can't pose as a site.
  string origin = 4;
  string title = 5;
  // The card it waits on: the entry's seq in the agent's conversation
  // (its AskPerson).
  uint64 seq = 6;
  // A code card's field takes digits only (#435 W8, Prosciutto 42531): the
  // page's input is type number or tel, inputmode numeric, or its pattern
  // allows only digits. A phone shows the number pad then, the ordinary
  // keyboard otherwise. False on every other handoff.
  bool numeric = 7;
  // An agreement card's words (#435 W8b, R12.2): what the box the person
  // accepts says on the page, its labels as the page has them (at most
  // 1,000 characters, control and invisible characters taken out). They're
  // the site's words: show them fenced as "The site's words", apart from
  // Claktory's. Empty on every other handoff.
  string agreement = 8;
}

enum ErrandHandoffKind {
  ERRAND_HANDOFF_KIND_UNSPECIFIED = 0;
  ERRAND_HANDOFF_KIND_PAYMENT = 1;
  // An identity check ("Verify it's you", a document).
  ERRAND_HANDOFF_KIND_IDENTITY = 2;
  // A code sent by text message or email.
  ERRAND_HANDOFF_KIND_CODE = 3;
  // Accepting an agreement or terms.
  ERRAND_HANDOFF_KIND_AGREEMENT = 4;
  ERRAND_HANDOFF_KIND_CAPTCHA = 5;
  // Signing in to a site: Chrome restarts with no automation first.
  ERRAND_HANDOFF_KIND_SIGN_IN = 6;
  // Anything else, such as a site outside the errand's.
  ERRAND_HANDOFF_KIND_OTHER = 7;
  // Recovery codes a site showed once (#435 W8b): Claktory read them off
  // the page, and the agent never saw them. The card shows them only on
  // ShowRecoveryCodes, and has two answers: I saved them (AnswerAsk,
  // approved, no text) and Keep in Secrets (KeepRecoveryCodes). No
  // dismissing, replying or words: its codes go only when the person says.
  ERRAND_HANDOFF_KIND_RECOVERY_CODES = 8;
  // Turning on two-step sign-in at a site: the person's call. Approved,
  // the agent may turn it on there with codes sent by text message or
  // email only, never an authenticator app or a security key. Can't do
  // this ends the errand.
  ERRAND_HANDOFF_KIND_TWO_STEP = 9;
}

// Starts or stops this connection's live view. One connection watches at a
// time: Watch from another moves the view there, and the connection before
// gets AgentBrowserViewMoved. While watching, it gets AgentBrowserFrame,
// one at a time (the next after its AgentBrowserFrameAck), only when the
// screen changes; its input counts during the person's turn. Refused while
// the browser is OFF or UNAVAILABLE (Open starts it).
message WatchAgentBrowser {
  bool on = 1;
  // The widest frame this device wants, in pixels (about 1280 on a Mac,
  // the phone's width times its scale on a phone); frames are scaled down
  // to it, never up. 0: as the screen is.
  uint32 max_width = 2;
  // A phone's shape, in its logical points (390 × 844): the browser's
  // screen takes that shape during the person's turn, so pages lay out for
  // a phone. 0 × 0 keeps the desktop's.
  uint32 screen_width = 3;
  uint32 screen_height = 4;
  // This device's own time zone (an IANA name, from the platform) and its
  // preferred languages (BCP 47, in order), sent every time: while the
  // browser's own (AgentBrowser.time_zone, .languages) aren't set, the
  // first device's become them. Never overwrites a set one.
  string device_time_zone = 5;
  repeated string device_languages = 6;
}

// The watching connection has the frame `seq`: the next can come.
message AgentBrowserFrameAck {
  uint64 seq = 1;
}

// The person's input, from the watching connection, during their turn
// (PERSONS_TURN, TAKEN_OVER, BROWSING); refused otherwise, and from any
// other connection. At most 4 KB of text per message, and a limited number
// of events per second (more are dropped). Never logged or kept: an
// errand's log says only that the person typed.
message AgentBrowserInput {
  repeated AgentBrowserEvent events = 1;
}

message AgentBrowserEvent {
  oneof event {
    AgentBrowserPointer pointer = 1;
    AgentBrowserWheel wheel = 2;
    AgentBrowserKey key = 3;
    // Typed text, as the keys that make it (a phone's keyboard).
    string text = 4;
    // Pasted text: put on the browser's clipboard, then pasted (Ctrl+V).
    string paste = 5;
  }
}

// A pointer at (x, y), as fractions of frame `frame_seq`'s width and
// height (0 to 1, from its top left), so a resize or a scaled frame can't
// misplace it. A tap is a down then an up.
message AgentBrowserPointer {
  AgentBrowserPointerKind kind = 1;
  float x = 2;
  float y = 3;
  // 1 the main button, 2 the middle, 3 the secondary; 0 on a move.
  uint32 button = 4;
  uint64 frame_seq = 5;
}

enum AgentBrowserPointerKind {
  AGENT_BROWSER_POINTER_KIND_UNSPECIFIED = 0;
  AGENT_BROWSER_POINTER_KIND_MOVE = 1;
  AGENT_BROWSER_POINTER_KIND_DOWN = 2;
  AGENT_BROWSER_POINTER_KIND_UP = 3;
}

// Scrolling at (x, y), fractions of frame `frame_seq` as for a pointer, by
// (dx, dy) in the frame's pixels (positive: right and down).
message AgentBrowserWheel {
  float x = 1;
  float y = 2;
  float dx = 3;
  float dy = 4;
  uint64 frame_seq = 5;
}

// A key pressed or released.
message AgentBrowserKey {
  bool down = 1;
  // The key as the web names it (KeyboardEvent.key: "Enter", "a",
  // "ArrowLeft", "Backspace").
  string key = 2;
  // Held with it: 1 Shift, 2 Control, 4 Alt (Option), 8 Meta (Command).
  uint32 modifiers = 3;
}

// Takes the browser from the errand's agent (DRIVEN → TAKEN_OVER): the
// agent is paused until HandBackAgentBrowser. From the watching connection.
message TakeOverAgentBrowser {}

// Gives it back: TAKEN_OVER → DRIVEN (the agent carries on from the page
// as it is, and is told so), or BROWSING → WARM (the person is done).
message HandBackAgentBrowser {}

// Stops it: the errand ends (STOPPED, its agent told "You stopped the
// browser.") and Chrome closes. The profile is kept.
message StopAgentBrowser {}

// Opens it for the person with no errand (BROWSING), at `url` (http or
// https; empty: where it left off); then WatchAgentBrowser. Refused while
// an errand uses it (watch it instead).
message OpenAgentBrowser {
  string url = 1;
  // As on WatchAgentBrowser.
  string device_time_zone = 2;
  repeated string device_languages = 3;
}

// Sets the time zone and languages Claktory's browser's pages see
// (Settings → Claktory's browser), both replaced; empty: not set (the
// Claktory computer's zone, en-US). The zone must be an IANA name the
// Claktory knows (ListTimeZones); languages BCP 47 tags ("en-GB"), at most
// 8. Applies from the browser's next start. The person's only.
message SetAgentBrowserLocale {
  string time_zone = 1;
  repeated string languages = 2;
}

// The time zones the Claktory knows, for a picker: answered by TimeZones.
message ListTimeZones {}

// IANA names ("Europe/London"), sorted.
message TimeZones {
  repeated string names = 1;
}

// Deletes everything the browser keeps (sign-ins, history, its profile),
// stopping it and any errand first. Confirm in the app first.
message DeleteAgentBrowserData {}

// Signs Claktory's browser out of one identity provider
// (AgentBrowserAccount.provider): its cookies and stored data cleared, now
// or before its next page loads, and the vault's record of the account
// forgotten once that's done. Answered with Ack, or Error with a sentence
// to show. A person's request only.
message SignOutAgentBrowserAccount {
  string provider = 1;
}

// The codes of the recovery-codes card at `seq` in `agent_id`'s
// conversation (an AskPerson whose handoff kind is RECOVERY_CODES), while
// it waits: answered with RecoveryCodes to this connection only, or Error
// with a sentence to show ("These codes are gone: …"). Ask each time the
// card opens or Show is pressed; keep them only while they're on screen.
// A person's request only.
message ShowRecoveryCodes {
  string agent_id = 1;
  uint64 seq = 2;
}

// The site's recovery codes, one per item, in the site's order. Secret:
// show them on the card, copy them only to the clipboard that clears
// itself, and never keep or log them.
message RecoveryCodes {
  string agent_id = 1;
  uint64 seq = 2;
  repeated string codes = 3;
}

// Keep in Secrets on a recovery-codes card: Claktory saves the codes as a
// new secret, "<host> recovery codes" (variable RECOVERY_CODES, one code
// per line), given to no agent, deletes its own copy and closes the card.
// Answered with Ack, or Error with a sentence to show (the vault is
// locked, say), the card still waiting. I saved them is AnswerAsk, approved
// with no text. A person's request only.
message KeepRecoveryCodes {
  string agent_id = 1;
  uint64 seq = 2;
}

// An errand's log (empty: every errand's), the last 7 days.
message ListErrandLog {
  string errand_id = 1;
}

// The person opens an errand for an agent, as a lead does with
// errand_open: the agent must be contained, with the errands extension.
message OpenErrand {
  string agent_id = 1;
  string purpose = 2;
  // Origins ("https://play.google.com"), or hosts, which mean https.
  repeated string sites = 3;
  // What to do, told to the agent with the errand (Markdown).
  string brief = 4;
}

// The person contains an agent for errands, or lifts it (Agent.contained).
// Lifting it turns its errands extension off and ends its errand.
message SetAgentContained {
  string agent_id = 1;
  bool contained = 2;
}

// A frame of the browser's screen, as JPEG, to the watching connection.
message AgentBrowserFrame {
  uint64 seq = 1;
  bytes jpeg = 2;
  uint32 width = 3;
  uint32 height = 4;
  // The page shown: its origin and title, as Claktory read them (control
  // and invisible characters taken out); show the origin apart from the
  // title. Empty in the person's turn when Claktory can't read them.
  string origin = 5;
  string title = 6;
  // A text field has the focus (a driven session knows): bring up the
  // phone's keyboard.
  bool text_field_focused = 7;
  // The browser's screen, in its pixels; the frame may be scaled down
  // from it. Input needs none of it: its positions are fractions.
  uint32 screen_width = 8;
  uint32 screen_height = 9;
}

// Text copied in the browser during the person's turn, to the watching
// connection: put it on the device's clipboard.
message AgentBrowserClipboard {
  string text = 1;
}

// The live view moved to another device's connection: close it here.
message AgentBrowserViewMoved {
  // That device's name.
  string device = 1;
}

message ErrandLog {
  string errand_id = 1;
  // Oldest first.
  repeated ErrandLogEntry entries = 2;
}

// One thing done in an errand, never what was typed or read.
message ErrandLogEntry {
  int64 at_ms = 1;
  string errand_id = 2;
  // Who: the errand's agent, or empty for the person.
  string agent_id = 3;
  // Where: the page's origin, and its path without the query.
  string origin = 4;
  string path = 5;
  // What, in Claktory's words ("Clicked", "Typed 12 characters", "Handed
  // to you: a payment", "You typed").
  string action = 6;
  // How it went: empty when it worked, else why not.
  string outcome = 7;
  // What it was done to: the element's role and name ("button "Next"", at
  // most 80 characters, read from the page: show it as the page's); empty
  // when none.
  string target = 8;
}
