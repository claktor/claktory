id = "charts"
name = "Charts"
version = "0.7.2"
world = "claktory:app@1.1"
publisher = "claktory"
description = "Live charts of what your agents do, such as their runs, messages and tokens. Tell Rivet what you'd like to see."
icon = "chart-column"
storage_mb = 5
memory_mb = 32
instructions = """
Charts shows the person dashboards of live charts. A dashboard is JSON:

{"id": "claktory", "name": "Claktory", "time": {"from": "now-7d", "to": "now"}, "refresh_s": 30,
 "variables": [{"name": "agent", "label": "Agent", "query": {"source": "activity", "sql": "SELECT agent, MAX(agent_name) FROM agent_usage GROUP BY agent"}}],
 "panels": [{"id": "runs", "title": "Runs", "grid": {"x": 0, "y": 0, "w": 6, "h": 8},
   "query": {"source": "activity", "sql": "SELECT (started / $step) * $step AS time, COUNT(*) AS runs FROM runs WHERE started >= $from AND started < $to AND ($agent = '' OR agent = $agent) GROUP BY 1 ORDER BY 1"},
   "viz": {"kind": "timeseries", "x": "time", "unit": "runs"}}],
 "_rev": 3}

- A query is one read-only SQLite statement (SELECT or WITH) against a source charts_list names as granted: activity (your agents' runs, messages, tasks, monitors, checklist items and token use: ids, agents, times, states and counts, never text: runs, messages, tasks, monitors, monitor_events, checklist_items, checklist_events, agent_usage, model_usage, agent_presence) agent:<id> (an agent's own database) or file:<place>:<path> (a CSV or TSV file as one table, rows, with the header's names as columns, read again at every query). A column it doesn't hold is refused.
- Values are bound, never written into the SQL: $from and $to are the range shown in milliseconds ($from_s and $to_s in seconds), $now is now, $step (and $step_s) a bucket that gives at most about 100 of them, and $<name> each variable's chosen value, "" for All. Don't use ?.
- A variable's query answers its options: the value, then what shows (optional).
- viz.kind is stat (a number from the last column, its rows a spark line; reduce says which: last, sum, mean, max or min. a stat that leaves it out keeps what it showed: a new one shows the last, one kept before reduce existed its total), timeseries, bars, stackedBars, pie, scatter, heatmap (a grid colored by value: x its columns, series_by its rows, y its value column; in the order the rows first give them, so sort in SQL), map (a world map: a dot on each country, sized and colored by value; location names the column of ISO country codes, two or three letters (the first text column if not), y the value column (the last numeric one if not); rows it can't place, such as "Hidden", and empty values are listed in words under it, never drawn) or table. x names the column across (the first if not), y the columns to draw (every other numeric one if not), series_by a column whose values make the series (then y names one at most). color is palette, agent (series are agents' ids: their colors and names), signal or muted. columns, for a table: [{"name", "title", "format": "text"|"number"|"time"}].
- How a chart draws, each optional (leave it out for the default): line_width 0–10 px (1; 0 draws points only), fill 0–100, the area under a line's opacity in percent (0), points auto|always|never (auto: when far enough apart), point_size 1–40 px (5), min and max for the value axis (fitted to the data with some room when left out), decimals 0–10 (as many as needed), legend true|false (shown, even for one series). A map takes thresholds and color as a stat does (green to red by value when it has neither), decimals, legend, and size_min and size_max, its dots' radius in px from the smallest value to the largest (2 and 15, 1–40). A stat also takes thresholds, its colors by its value: [{"color": "green"}, {"color": "red", "value": 80}], the first the base with no value, then ascending values, at most 10 (green, red from 80 when left out); color_mode value|background|solid|none (value); graph area|none (area: its spark line); decimals; and color, one fixed color instead of thresholds. A stat kept before reduce existed, with neither, shows green. Colors are names: green, yellow, semi-dark-yellow, blue, orange, red, purple, their dark- shades (dark-green, dark-yellow, dark-blue, dark-orange, dark-red, dark-purple) and text. unit none, short (1.2 K), percent, percentunit (0.5 as 50%), bytes, ms or s formats numbers in that unit; other text is shown after them.
- grid: 12 columns; panels with the same y share a row; w 1–12, h 1–13 in Grafana's rows (30 points each and 8 between: 4 is 144 points, 8 is 296, Grafana's default and Charts' when you leave h out).
- Change a dashboard with charts_get, then charts_put of the whole of it with the _rev you read: a put on a revision someone has changed since is refused. Every put keeps the version before it (charts_get with previous: true). Try a query with charts_query before putting it (with "dashboard": its id, when it uses the dashboard's variables).
- The person's dashboards are arranged the same on every device: Charts opens on the home one (the first if none), and the starred ones come first in its dashboards' menu, then the rest, each in the person's order. When they ask ("make Cards my home dashboard", "star Bugs", "put Costs first"), charts_put with home, starred (all of them) or order (those to list first), no dashboard needed; charts_list says how they're arranged now.
"""

[[scopes]]
id = "view"
label = "See dashboards"
tools = ["charts_list", "charts_get"]
reads_data = false

[[scopes]]
id = "edit"
label = "Change dashboards, and read what Charts reads"
reads_data = true
tools = ["charts_list", "charts_get", "charts_put", "charts_delete", "charts_query"]

[[tools]]
name = "charts_list"
description = "Lists the dashboards (id, name, panels, variables, _rev) in the person's order, the one Charts opens on and the starred ones, and the data sources Charts reads, and whether the person granted each."
parameters = { type = "object", properties = {} }

[[tools]]
name = "charts_get"
description = "A dashboard's whole definition, as JSON, or its previous version."
parameters = { type = "object", required = ["id"], properties = { id = { type = "string", description = "The dashboard's id." }, previous = { type = "boolean", description = "The version before the current one (or before it was deleted)." } } }

[[tools]]
name = "charts_put"
description = "Keeps a whole dashboard, new or changed, after checking it; the version it replaces is kept. Send the _rev you read so a change made since isn't lost. Says which panels' queries fail. Also, with or without a dashboard, arranges the person's dashboards: home, starred, order."
parameters = { type = "object", properties = { home = { type = "string", description = "The dashboard Charts opens on, on every device; \"\" for the first." }, starred = { type = "array", items = { type = "string" }, description = "All the starred dashboards' ids: first in the dashboards' menu." }, order = { type = "array", items = { type = "string" }, description = "Dashboard ids to list first, in this order; the others follow as they were." }, dashboard = { type = "object", description = "The whole dashboard: id, name, time, refresh_s, variables, panels, and _rev when changing one.", required = ["id", "name"], properties = { id = { type = "string", description = "Lowercase letters, digits, - and _." }, name = { type = "string" }, time = { type = "object", properties = { from = { type = "string" }, to = { type = "string" } } }, refresh_s = { type = "integer", minimum = 10, maximum = 86400 }, variables = { type = "array", maxItems = 4, items = { type = "object", required = ["name", "query"], properties = { name = { type = "string" }, label = { type = "string" }, default = { type = "string" }, query = { type = "object", required = ["source", "sql"], properties = { source = { type = "string" }, sql = { type = "string" } } } } } }, panels = { type = "array", maxItems = 24, items = { type = "object", required = ["id", "title", "query", "viz"], properties = { id = { type = "string" }, title = { type = "string" }, grid = { type = "object", properties = { x = { type = "integer" }, y = { type = "integer" }, w = { type = "integer" }, h = { type = "integer", minimum = 1, maximum = 13, description = "Grafana's rows: 30 points each and 8 between (8 is 296 points)." } } }, query = { type = "object", required = ["source", "sql"], properties = { source = { type = "string" }, sql = { type = "string" } } }, viz = { type = "object", required = ["kind"], properties = { kind = { type = "string", enum = ["stat", "timeseries", "bars", "stackedBars", "pie", "scatter", "heatmap", "map", "table"] }, unit = { type = "string" }, x = { type = "string" }, y = { type = "array", items = { type = "string" } }, series_by = { type = "string" }, color = { type = "string", description = "palette, agent, signal or muted; for a stat or a map also a color name, one fixed color" }, columns = { type = "array", items = { type = "object" } }, line_width = { type = "number", minimum = 0, maximum = 10 }, fill = { type = "number", minimum = 0, maximum = 100 }, points = { type = "string", enum = ["auto", "always", "never"] }, point_size = { type = "number", minimum = 1, maximum = 40 }, min = { type = "number" }, max = { type = "number" }, decimals = { type = "integer", minimum = 0, maximum = 10 }, legend = { type = "boolean" }, reduce = { type = "string", enum = ["last", "sum", "mean", "max", "min"] }, thresholds = { type = "array", maxItems = 10, items = { type = "object", required = ["color"], properties = { color = { type = "string", enum = ["green", "yellow", "semi-dark-yellow", "blue", "orange", "red", "purple", "dark-green", "dark-yellow", "dark-blue", "dark-orange", "dark-red", "dark-purple", "text"] }, value = { type = "number" } } } }, color_mode = { type = "string", enum = ["value", "background", "solid", "none"] }, graph = { type = "string", enum = ["area", "none"] }, location = { type = "string", description = "A map's column of ISO country codes." }, size_min = { type = "number", minimum = 1, maximum = 40 }, size_max = { type = "number", minimum = 1, maximum = 40 } } } } } }, _rev = { type = "integer" } } } } }

[[tools]]
name = "charts_delete"
description = "Deletes a dashboard. Its last version is kept: charts_get with previous: true, then charts_put, brings it back."
parameters = { type = "object", required = ["id"], properties = { id = { type = "string" } } }

[[tools]]
name = "charts_query"
description = "Runs one read-only SQL statement against a granted source, bound as a panel's is ($from, $to, $step, your variables), and answers at most 200 rows, tab-separated."
parameters = { type = "object", required = ["source", "sql"], properties = { source = { type = "string", description = "activity, agent:<id> or file:<place>:<path>." }, sql = { type = "string" }, from = { type = "string", description = "The range's start: now-7d (the default), now-24h, or milliseconds." }, to = { type = "string", description = "Its end: now (the default)." }, dashboard = { type = "string", description = "A dashboard whose variables the SQL uses, each at its default (\"\" for All), so a panel's query runs as it is." }, variables = { type = "object", description = "Values for $names in the SQL, such as {\"agent\": \"rivet\"}; they win over the dashboard's." } } }

[[views]]
id = "main"
title = "Charts"

[[data]]
kind = "activity"
reason = "To chart when your agents run, how many messages and tasks they have, and the tokens they use."

[[data]]
kind = "agent-database"
agent = "*"
reason = "To chart what an agent keeps in its own database."

[[data]]
kind = "file"
reason = "To chart a CSV or TSV file you or your agents keep, such as a list of bugs."
