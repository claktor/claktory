[package]
name = "claktory-speech"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true
description = "Claktory's speech recognition: turns a voice recording into text on this computer, for factoryd and for agents."

[dependencies]
rubato = "5.1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
symphonia = { version = "0.6.1", default-features = false, features = ["isomp4", "aac", "wav", "pcm", "mp3", "flac", "ogg", "vorbis", "adpcm", "aiff", "caf"] }
transcribe-cpp = "=0.4.2"

[dev-dependencies]
tempfile = "3.27.0"
