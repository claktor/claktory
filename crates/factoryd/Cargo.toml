[package]
name = "factoryd"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
# Vault backups (`vault/backup.rs`): age, to an X25519 or SSH key.
age = { version = "0.12", features = ["ssh"] }
# The tunnel's compressed streams (`claktory/2`, remote.rs): zstd, as the app's.
async-compression = { version = "0.4.52", features = ["tokio", "zstd"] }
# AWS connections' receipts (connectors/aws_stack.rs): RSA-OAEP and AES-GCM;
# already linked through rustls.
aws-lc-rs = { version = "1.19", default-features = false, features = ["aws-lc-sys"] }
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
base64 = "0.23"
bytes = "1.12.2"
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
# The account service's API and its cryptography (`account.rs`), without the server.
claktory-account = { path = "../claktory-account", default-features = false }
# Direct messages end to end: this Claktory's leaf (`user_apps::dms::leaf`).
claktory-dm-crypto = { path = "../claktory-dm-crypto" }
dom_smoothie = "0.19"
ed25519-dalek = "3"
factory-agent = { version = "0.1.0", path = "../factory-agent" }
openmls = "=0.9.2"
factory-protocol = { version = "0.1.0", path = "../factory-protocol" }
futures-util = "0.3.34"
getrandom = "0.4"
globset = "0.4"
hkdf = "0.13"
hmac = "0.13"
htmd = "0.6"
# Websites shared over pipes, as the receiving side opens them
# (`pipes/share_listener.rs`): an HTTP/1.1 server on 127.0.0.1 and a client
# over the pipe's stream; already linked through reqwest.
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
ignore = "0.4.34"
# The private tunnel (remote.rs): pinned, the same as the app's (app/rust); ring, as the
# process default, and no portmapper, so Factory never asks the router to open a port.
iroh = { version = "=1.5.0", default-features = false, features = ["tls-ring", "fast-apple-datapath"] }
# Phone-sized previews of images (previews.rs, #379): decoded and resized
# here (already linked through factory-agent), encoded as WebP by libwebp,
# built from its source.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
libwebp-sys = "0.14"
jiff = "1"
libc = "0.2"
pdf-extract = "0.12"
png = "0.18"
primp = "2"
prost = "0.14.6"
pulldown-cmark = { version = "0.13.6", default-features = false }
# `factoryd pair` shows the code as a QR code in the terminal; no image formats.
qrcode = { version = "0.15", default-features = false, features = ["std"] }
# Passwords the vault generates (`vault/generate.rs`): the system's random numbers, unbiased uniform choice.
rand = { version = "0.10", default-features = false, features = ["std", "sys_rng"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.43.0", features = ["bundled", "hooks"] }
# ring is the process default (main.rs), and the tunnel's (iroh, tls-ring).
rustls = { version = "0.23", features = ["ring"] }
scraper = "0.29"
serde = { version = "1.0.229", features = ["derive"] }
# Keys the vault generates (`vault/generate.rs`, #252): OpenSSH's formats, ed25519.
ssh-key = { version = "=0.7.0-rc.12", default-features = false, features = ["std", "ed25519", "getrandom"] }
serde_json = "1.0.154"
sha2 = "0.11"
similar = { version = "3.2.1", default-features = false, features = ["std"] }
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "fs", "sync", "process", "signal"] }
tokio-tungstenite = "0.30.0"
# Vault backups hold a tar (`vault/backup.rs`).
tar = "0.4"
# The person's initials (person.rs), by grapheme; already linked through iroh.
unicode-segmentation = "1"
# Reports' text, normalised before it's kept (pipes/handoff/schema.rs).
unicode-normalization = "0.1"
# Browser sessions' sites, spelled as Chrome does (`browser/origin.rs`); already linked through reqwest.
url = "2"
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zeroize = "1.9"
# Move bundles (move_bundle.rs); already linked through async-compression.
zstd = "0.14"
toml = "1.2.1"

[build-dependencies]
# The lid-closed helper's XPC client (native/lid_xpc.c, #371), on macOS.
cc = "1"

[features]
# QA only: the Anthropic subscription at qa-model on this computer, for
# claktory-qa's sandboxes (factory-agent's qa-provider; scripts/qa.sh builds
# with it, a release can't).
qa-provider = ["factory-agent/qa-provider"]

[dev-dependencies]
# A local account service to sign in at (tests/all/account.rs).
claktory-account = { path = "../claktory-account" }
# Its user-apps worker, for app grants (tests/all/app_grants.rs).
claktory-user-apps = { path = "../claktory-user-apps" }
# tests/tls.rs: a TLS server with a certificate of its own, and the other
# crypto provider beside ring.
rcgen = "0.14"
tokio-rustls = "0.26"
# tests/all/remote.rs: relays and an address lookup on this machine, for the
# tunnel's default relay and devices paired while n0's were the default.
iroh = { version = "=1.5.0", default-features = false, features = ["tls-ring", "fast-apple-datapath", "test-utils"] }
