AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Claktory: lets your agents do only what the rules below allow, in this
  account. Creates a user that can do nothing but take on one role; that
  role, with exactly those rules; and a small function that sets up the role
  and gives Claktory the user's key, encrypted so only your Claktory can read
  it. Delete this stack to take Claktory's access away. (claktory-aws-v1)

# The contract with Claktory's backend (crates/factoryd/src/connectors/): the
# parameters below; the receipt in Outputs, "claktory-aws-v1." and a compact
# JWE (RSA-OAEP-256, A256GCM) sealed to PublicKeyJwk; the broker user's one
# inline policy claktory-broker and the role's one inline policy
# claktory-capability, one statement (Sid StatementN) per slot in use. The
# backend checks what this stack made against what was proposed before it
# keeps anything. Tests: node --test crates/factoryd/aws/seal-test.js

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: {default: "What your agents may do. Each rule allows its actions on its resources, and only when its condition holds."}
        Parameters:
          - Actions1
          - Resources1
          - Condition1
          - Actions2
          - Resources2
          - Condition2
          - Actions3
          - Resources3
          - Condition3
          - Actions4
          - Resources4
          - Condition4
          - Actions5
          - Resources5
          - Condition5
          - Actions6
          - Resources6
          - Condition6
          - Actions7
          - Resources7
          - Condition7
          - Actions8
          - Resources8
          - Condition8
          - Actions9
          - Resources9
          - Condition9
          - Actions10
          - Resources10
          - Condition10
      - Label: {default: "From your Claktory (leave these as they are)"}
        Parameters: [FlowId, ProposalHash, PublicKeyJwk]
    ParameterLabels:
      Actions1: {default: "Rule 1: actions"}
      Resources1: {default: "Rule 1: resources"}
      Condition1: {default: "Rule 1: condition"}
      Actions2: {default: "Rule 2: actions"}
      Resources2: {default: "Rule 2: resources"}
      Condition2: {default: "Rule 2: condition"}
      Actions3: {default: "Rule 3: actions"}
      Resources3: {default: "Rule 3: resources"}
      Condition3: {default: "Rule 3: condition"}
      Actions4: {default: "Rule 4: actions"}
      Resources4: {default: "Rule 4: resources"}
      Condition4: {default: "Rule 4: condition"}
      Actions5: {default: "Rule 5: actions"}
      Resources5: {default: "Rule 5: resources"}
      Condition5: {default: "Rule 5: condition"}
      Actions6: {default: "Rule 6: actions"}
      Resources6: {default: "Rule 6: resources"}
      Condition6: {default: "Rule 6: condition"}
      Actions7: {default: "Rule 7: actions"}
      Resources7: {default: "Rule 7: resources"}
      Condition7: {default: "Rule 7: condition"}
      Actions8: {default: "Rule 8: actions"}
      Resources8: {default: "Rule 8: resources"}
      Condition8: {default: "Rule 8: condition"}
      Actions9: {default: "Rule 9: actions"}
      Resources9: {default: "Rule 9: resources"}
      Condition9: {default: "Rule 9: condition"}
      Actions10: {default: "Rule 10: actions"}
      Resources10: {default: "Rule 10: resources"}
      Condition10: {default: "Rule 10: condition"}
      FlowId: {default: "Connection request"}
      ProposalHash: {default: "Fingerprint of the rules"}
      PublicKeyJwk: {default: "Your Claktory's one-time key"}

Parameters:
  FlowId:
    Type: String
    AllowedPattern: "^[A-Za-z0-9_-]{22,64}$"
    Description: The connection request in your Claktory that this stack answers.
  ProposalHash:
    Type: String
    AllowedPattern: "^[0-9a-f]{64}$"
    Description: A fingerprint (SHA-256) of the rules your Claktory asked for, so it can check that nothing changed.
  PublicKeyJwk:
    Type: String
    MinLength: 500
    MaxLength: 1000
    Description: The public half of a key your Claktory made for this request only. The user's key is encrypted with it, so only your Claktory can read it.
  Actions1:
    Type: CommaDelimitedList
    Description: What rule 1 allows, such as ec2:RunInstances. Rule 1 is required.
  Resources1:
    Type: CommaDelimitedList
    Description: The resources (ARNs) rule 1's actions may act on. * means all resources.
  Condition1:
    Type: String
    Default: ""
    MaxLength: 4096
    Description: When rule 1 applies, as an IAM condition in JSON. Empty means always.
  Actions2:
    Type: CommaDelimitedList
    Default: ""
    Description: What rule 2 allows, such as ec2:RunInstances.
  Resources2:
    Type: CommaDelimitedList
    Default: ""
    Description: The resources (ARNs) rule 2's actions may act on. * means all resources.
  Condition2:
    Type: String
    Default: ""
    MaxLength: 4096
    Description: When rule 2 applies, as an IAM condition in JSON. Empty means always.
  Actions3:
    Type: CommaDelimitedList
    Default: ""
    Description: What rule 3 allows, such as ec2:RunInstances.
  Resources3:
    Type: CommaDelimitedList
    Default: ""
    Description: The resources (ARNs) rule 3's actions may act on. * means all resources.
  Condition3:
    Type: String
    Default: ""
