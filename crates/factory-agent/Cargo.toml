[package]
name = "factory-agent"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
aho-corasick = "1"
base64 = "0.23"
bytes = "1"
futures-util = { version = "0.3", default-features = false }
hashbrown = "0.17"
http = "1"
indexmap = { version = "2", features = ["serde"] }
libc = "0.2"
parking_lot = "0.12"
rand = "0.10"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
# TLS for the WebSocket transport, with its crypto named (ring, as reqwest's): with
# more than one provider in the build (factoryd's aws-lc-rs), rustls can't pick one.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.11"
shlex = "2"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "process", "io-util", "io-std", "time", "fs", "signal"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tokio-util = "0.7"
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }
webpki-roots = "1"
zeroize = "1"

[dev-dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }

[lints.clippy]
disallowed_types = "deny"
unwrap_used = "deny"
