[package]
name = "claktory-dm-crypto"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true
description = "End-to-end encryption for Claktory's direct messages: MLS (OpenMLS), the identity and leaf certificates, the shared validation every endpoint runs, and the storage and envelopes the delivery service and endpoints share (dms-e2ee.md)."

[dependencies]
# Pinned: storage values are OpenMLS's own serialization, so an upgrade is a
# deliberate slice of its own (dms-e2ee.md §3).
openmls = "=0.9.2"
openmls_libcrux_crypto = "=0.4.0"
openmls_traits = "=0.6.0"
base64 = "0.23"
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
ed25519-dalek = "3"
getrandom = "0.4"
hkdf = "0.13"
hpke-rs = { version = "=0.7.0", features = ["libcrux"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
thiserror = "2"
tls_codec = { version = "0.5", features = ["derive", "serde", "std"] }
zeroize = "1.9"
