[package]
name = "claktory-relay"
description = "Claktory's relay (relay.claktory.com): iroh-relay, forwarding only to or from a Claktory signed in to an account (#450). Blind: it carries only end-to-end-encrypted traffic."
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
http = "1"
iroh-base = { version = "=1.5.0", default-features = false, features = ["key", "relay"] }
iroh-metrics = { version = "1.0.3", default-features = false, features = ["service"] }
# Claktory's copy (vendor/iroh-relay, through [patch.crates-io]): its
# forwarding hook is what this relay is about.
iroh-relay = { version = "=1.5.0", default-features = false, features = ["server"] }
n0-error = "1"
rustls = { version = "0.23.46", default-features = false, features = ["ring"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "time", "fs", "sync"] }
toml = "1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
webpki_types = { package = "rustls-pki-types", version = "1.12" }

[dev-dependencies]
iroh-dns = "1.5.0"
n0-future = "0.3"
tempfile = "3"
