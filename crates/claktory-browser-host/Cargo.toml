[package]
name = "claktory-browser-host"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true
description = "Claktory's browser helper: the native-messaging host Chrome starts for Claktory's extension, relaying a session between it and the Claktory app on this Mac."

[features]
# The Dev build: Claktory Dev's host name, socket folder, extension and app,
# and, only while this binary is signed ad hoc, a peer pinned by cdhash.
dev = []

[dependencies]
libc = "0.2.191"
serde_json = "1.0.154"
sha2 = "0.11"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
core-foundation-sys = "0.8.7"

[dev-dependencies]
tempfile = "3.27.0"
