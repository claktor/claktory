[package]
name = "claktory-apps-test-guest"
version = "0.1.0"
edition = "2024"
publish = false
description = "A claktory:app@1 app for the host's tests: each tool exercises one thing the host provides."

# Its own workspace: the tests build it for wasm32-wasip2.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.63"
wasi = "0.14"

[profile.release]
opt-level = "s"
panic = "abort"
