[package]
name = "claktory-apps"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true
description = "Runs Claktory's apps: WebAssembly components, each in its own sandbox, for factoryd."

[dependencies]
factory-protocol = { path = "../factory-protocol" }
http = "1.5.0"
http-body-util = "0.1"
prost = "0.14.6"
rusqlite = { version = "0.43.0", features = ["bundled"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "time", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# Only what running components needs: no GC, threads, WAT, profiling,
# caches or debugging support, which roughly halve the binary.
wasmtime = { version = "50.0.3", default-features = false, features = ["async", "component-model", "cranelift", "parallel-compilation", "runtime", "std"] }
wasmtime-wasi = { version = "50.0.3", default-features = false, features = ["p2"] }
wasmtime-wasi-http = { version = "50.0.3", default-features = false, features = ["default-send-request", "p2"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-util", "time", "sync", "net", "process"] }
