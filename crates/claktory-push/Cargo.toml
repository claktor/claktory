[package]
name = "claktory-push"
description = "Claktory's push relay: sends sealed notifications to phones through Apple (APNs) and Google (FCM) on Claktories' behalf. It holds the push keys and sees only ciphertext. One binary with SQLite."
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
aws-lc-rs = { version = "1.19", default-features = false, features = ["aws-lc-sys"] }
base64 = "0.23"
bytes = "1.12.2"
getrandom = "0.4"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
jiff = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
