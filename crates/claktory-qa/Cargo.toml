[package]
name = "claktory-qa"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
factory-protocol = { path = "../factory-protocol" }
# For the settings file a sandbox starts with: Claktory's own defaults.
factoryd = { path = "../factoryd" }
futures-util = "0.3.34"
libc = "0.2"
prost = "0.14.6"
prost-reflect = { version = "0.16.5", features = ["serde"] }
regex = "1"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time"] }
tokio-tungstenite = "0.30.0"

[build-dependencies]
prost = "0.14.6"
protox = "0.10.0"
