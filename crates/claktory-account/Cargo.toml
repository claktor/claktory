[package]
name = "claktory-account"
description = "Claktory's account service: email sign-in, machine tokens, the vault's service share, check-ins and the relay allowlist. One binary with SQLite; anyone can run their own."
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[features]
default = ["server"]
# The service itself. Without it the crate is only `protocol`: the API's
# types and its cryptography, for clients such as factoryd.
server = [
  "dep:bytes",
  "dep:claktory-user-apps",
  "dep:form_urlencoded",
  "dep:http-body-util",
  "dep:hyper",
  "dep:hyper-util",
  "dep:jiff",
  "dep:maxminddb",
  "dep:reqwest",
  "dep:rusqlite",
  "dep:tokio",
  "dep:tracing",
  "dep:tracing-subscriber",
]

[[bin]]
name = "claktory-account"
required-features = ["server"]

[dependencies]
base64 = "0.23"
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
curve25519-dalek = "5"
ed25519-dalek = "3"
getrandom = "0.4"
hkdf = "0.13"
hmac = "0.13"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
zeroize = "1.9"

bytes = { version = "1.12.2", optional = true }
claktory-user-apps = { path = "../claktory-user-apps", default-features = false, optional = true }
form_urlencoded = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }
hyper = { version = "1", features = ["server", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
jiff = { version = "1", optional = true }
maxminddb = { version = "0.33", features = ["mmap"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
rusqlite = { version = "0.43.0", features = ["bundled"], optional = true }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "fs", "sync", "signal"], optional = true }
tracing = { version = "0.1.44", optional = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"], optional = true }

[dev-dependencies]
# Device lists signed as a person's device signs them (hostile test 24).
claktory-dm-crypto = { path = "../claktory-dm-crypto" }
claktory-user-apps = { path = "../claktory-user-apps" }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3"
