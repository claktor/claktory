# The Android build tuple: every tool the Android app is built with, pinned.
# One file, read by the Gradle build (settings/app), the doctor/verify
# scripts and the artifact verifier (tools/check_artifact.py), so a build on
# another machine either uses exactly these or refuses. Why each value is
# what it is: DESIGN.md, "The build tuple". Change one only deliberately, in
# its own commit, with a clean native-assets build and the verifier passing.

# Flutter / Dart (app/.metadata's revision; the iPhone and Mac use the same).
flutter.version=3.50.0
flutter.revision=ab2912035e160d9cad6306df307576da6128ebdb
dart.version=3.14.0

# Rust: app/rust/rust-toolchain.toml's channel (Tomás's file).
rust.channel=1.97.1
rust.targets=aarch64-linux-android,x86_64-linux-android

# JDK: Temurin 21 LTS, at a path the scripts name explicitly (never an IDE's
# bundled JDK, never JAVA_HOME as found). Gradle never provisions one itself.
jdk.major=21
jdk.vendor=Eclipse Adoptium

# Gradle wrapper, with its distribution's checksum (gradle-wrapper.properties).
gradle.version=9.5.0
gradle.sha256=553c78f50dafcd54d65b9a444649057857469edf836431389695608536d6b746

# Android Gradle Plugin (built-in Kotlin) and the Kotlin it compiles with.
agp.version=9.3.3
kotlin.version=2.4.20

# SDK levels. minSdk also reaches the Rust/C build (Flutter passes it to the
# native-assets hook as targetNdkApi), so one number for all of them.
android.minSdk=24
android.compileSdk=36
android.targetSdk=36
android.buildTools=36.0.0
android.ndk=28.2.13676358

# ABIs the app ships: 64-bit only. armeabi-v7a is deliberately absent.
android.abis=arm64-v8a,x86_64

# 16 KiB pages: ELF LOAD alignment and APK zip alignment of native libraries.
android.pageSize=16384

# Release tooling used to check artifacts: bundletool-all-<version>.jar from
# google/bundletool's GitHub release (the Maven artifact is a library with
# no main class).
bundletool.version=1.18.3
