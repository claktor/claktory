org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Flutter 3.50's template: the old DSL, and Kotlin through its own plugin.
android.newDsl=false
android.builtInKotlin=false
# The build never installs anything itself: a missing NDK, platform or JDK
# fails the build instead (DESIGN.md §1; the toolchain is Matt-approved and
# installed by DevOps).
android.builder.sdkDownload=false
org.gradle.java.installations.auto-download=false
org.gradle.java.installations.auto-detect=false
