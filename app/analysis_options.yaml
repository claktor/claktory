include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - macos/**
    # Generated by scripts/gen-proto.sh.
    - lib/protocol/**
    # Generated by flutter_rust_bridge_codegen generate.
    - lib/tunnel/**
    - ios/**
    # The Android host: Kotlin and Gradle, no Dart.
    - android/**
    # The Windows host: C++ and CMake, no Dart.
    - windows/**
