# The Rust the app's tunnel builds with (hook/build.dart, through
# native_toolchain_rust, which needs a pinned version): the Mac (both
# architectures), iPhones, and the iOS Simulator on either Mac.
[toolchain]
channel = "1.97.1"
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-apple-ios",
  "aarch64-apple-ios-sim",
  "x86_64-apple-ios",
]
