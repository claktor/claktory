[package]
name = "claktory_tunnel"
version = "0.1.0"
edition = "2024"
publish = false

# Its own workspace: it builds with the app (hook/build.dart), not with crates/.
[workspace]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[lib]
# cdylib for the app (a native asset), rlib for its tests.
crate-type = ["cdylib", "rlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
# Pinned: the backend uses the same iroh (docs: private-tunnel.md).
iroh = { version = "=1.5.0", default-features = false, features = ["tls-ring", "fast-apple-datapath"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time"] }
anyhow = "1"
# claktory/2: the tunnel's streams compressed (zstd), as the backend's (crates/factoryd).
async-compression = { version = "0.4.52", features = ["tokio", "zstd"] }
hex = "0.4"

# Android: the raw JNI calls of the bootstrap (src/android.rs), the version
# iroh's own DNS resolver already brings.
[target.'cfg(target_os = "android")'.dependencies]
jni-sys = "0.4"
# The resolver iroh uses, to count the DNS servers it reads (src/android.rs).
n0-dns-resolver = { version = "0.1", default-features = false }

# The tunnel's and iroh's logs into logcat (src/android.rs).
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "registry"] }

# The same, for android.rs's tests on this computer.
[dev-dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "registry"] }
