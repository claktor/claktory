[package]
name = "claktory_tunnel"
version = "0.1.0"
edition = "2024"
publish = false

# Its own workspace: it builds with the app (hook/build.dart), not with crates/.
[workspace]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[lib]
# cdylib for the app (a native asset), rlib for its tests.
crate-type = ["cdylib", "rlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
# Pinned: the backend uses the same iroh (docs: private-tunnel.md). Its
# fast Apple datapath (sendmsg_x/recvmsg_x, private xnu calls looked up with
# dlsym) only for the Mac, below: never in the App Store's iPhone and iPad app.
iroh = { version = "=1.5.0", default-features = false, features = ["tls-ring"] }
# BBR3, the congestion controller iroh's QUIC offers in place of Cubic (row 129);
# iroh's own version.
noq-proto = { version = "=1.5.0", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time"] }
anyhow = "1"
# claktory/2: the tunnel's streams compressed (zstd), as the backend's (crates/factoryd).
async-compression = { version = "0.4.52", features = ["tokio", "zstd"] }
hex = "0.4"
# Direct messages end to end (dms-e2ee.md, E4): MLS, certificates and the
# sealed store's schema, shared with the worker and factoryd. Its rusqlite
# is bundled SQLite, so every platform keeps the same database.
claktory-dm-crypto = { path = "../../crates/claktory-dm-crypto" }
# dm.rs's own rows and values (pins, the retry cache), at the versions
# claktory-dm-crypto uses.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
zeroize = "1.9"
# Group ids in the self group's contents, as the worker writes them.
base64 = "0.23"
# The store's own connection (dm/store.rs): the same rusqlite as
# claktory-dm-crypto, so one bundled SQLite in the app.
rusqlite = { version = "0.43.0", features = ["bundled"] }
# Only for OpenMLS's group id (dm.rs, forgetting a group): the same version
# claktory-dm-crypto pins.
openmls = "=0.9.2"

# Android: the raw JNI calls of the bootstrap (src/android.rs), the version
# iroh's own DNS resolver already brings.
[target.'cfg(target_os = "android")'.dependencies]
jni-sys = "0.4"
# The resolver iroh uses, to count the DNS servers it reads (src/android.rs).
n0-dns-resolver = { version = "0.1", default-features = false }

# The tunnel's and iroh's logs into logcat (src/android.rs).
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "registry"] }

# The same, for android.rs's tests on this computer.
[dev-dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "registry"] }
# A relay on this computer, for tunnel.rs's tests of the fall back to it
# (test-utils: only the tests build it, never the app).
iroh = { version = "=1.5.0", default-features = false, features = ["tls-ring", "test-utils"] }
# iroh's UDP socket itself, and a socket option iroh doesn't set, for
# udp_rebind's tests of the vendored netwatch (#490).
netwatch = "=0.20.2"
socket2 = "0.6"

# The Mac's tunnel keeps iroh's fast datapath, as factoryd's does. Features
# on a target's own dependency reach only that target's build (resolver 2),
# so the iPhone, iPad and Android builds go without it.
[target.'cfg(target_os = "macos")'.dependencies]
iroh = { version = "=1.5.0", default-features = false, features = ["tls-ring", "fast-apple-datapath"] }

# The Windows app's check of whom it reached on this PC (src/api/windows.rs):
# the TCP table with its processes, and a process's user. Already in the
# tree through tokio.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_Threading",
] }

# iroh's DNS resolver, Claktory's copy of 0.1.1 (vendor/README.md): on iOS
# it reads the system's DNS servers through libresolv rather than
# SystemConfiguration's dynamic store, which isn't API there. Only this
# workspace sees it; factoryd keeps crates.io's.
[patch.crates-io]
n0-dns-resolver = { path = "vendor/n0-dns-resolver" }
# iroh, Claktory's copy of 1.5.0, the backend's own (../../vendor/README.md):
# no relay TLS handshake every ~22 s (n0-computer/iroh#4523) and a relay
# health ping of at least 3 s. Drop it with the root Cargo.toml's.
iroh = { path = "../../vendor/iroh" }
# noq-udp, Claktory's copy of 1.5.0, the backend's own (../../vendor/README.md,
# #392): on Apple platforms an IPv4 source goes as IP_PKTINFO, which macOS
# reads, so a Mac answers from the address it was reached at, not its
# route's (a Mac on two networks, Wi-Fi and Ethernet, say: Matt's MacBook,
# Bruno 36927). Drop it with the root Cargo.toml's.
noq-udp = { path = "../../vendor/noq-udp" }
# netwatch, Claktory's copy of 0.20.2, the backend's own (../../vendor/README.md,
# #490): a socket whose rebind failed after a network change (a phone moving
# from Wi-Fi to cellular, a Mac waking) tries again at its next send instead
# of staying closed, on the relay only, until the app restarts. Drop it with
# the root Cargo.toml's.
netwatch = { path = "../../vendor/netwatch" }
