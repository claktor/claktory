# The secret check publishing runs (scripts/check-secrets.sh) before Factory's
# source goes public: gitleaks' own rules (API keys, tokens and private keys of
# every kind), plus Factory's below. Every exception is listed here, with why,
# so a reviewer sees each one in the diff that adds it. Keep them narrow: a
# value or a kind of line, never a whole file or folder.

title = "Factory"

[extend]
useDefault = true

# Files that hold credentials or someone's data, whatever is in them.
[[rules]]
id = "private-file"
description = "A file that holds credentials or personal data (.env, a private key, a sign-in or credentials file, a database)"
path = '''(?i)(?:^|/)(?:\.env(?:\.[^/]*)?|\.envrc|id_(?:rsa|dsa|ecdsa|ed25519)(?:\.pub)?|[^/]*\.(?:pem|key|p8|p12|pfx|jks|keystore|ppk|mobileprovision|provisionprofile|kdbx|asc|gpg)|\.netrc|\.npmrc|\.pypirc|\.git-credentials|\.htpasswd|auth\.json|credentials(?:\.json)?|service-account[^/]*\.json|factory\.db|[^/]*\.sqlite3?|[^/]*\.db)$'''

# A path in a real home folder says whose machine it came from, and often what
# is on it. Tests and docs use /Users/me and /Users/x.
[[rules]]
id = "home-path"
description = "A path in someone's home folder"
regex = '''/(?:Users|home)/[A-Za-z0-9._-]+'''
keywords = ["/users/", "/home/"]

[[rules.allowlists]]
description = "Placeholder home folders in tests and docs (mex is the prefix-boundary case beside me: /Users/me must not move /Users/mex; someone and myself are the Android build checks' made-up homes, myself being the literal text Flutter's debug engine carries; a is the app's shared-build test's made-up home, app/test/hook_shared_build_test.dart since 9b5a7d73; ann is the made-up home in factoryd's annotations/embeds.rs tests, since 833c59aed)"
regexTarget = "match"
regexes = ['''^/(?:Users|home)/(?:me|mex|x|a|ann|you|user|runner|linuxbrew|Shared|someone|myself)$''']

[[rules.allowlists]]
description = "The Map tests' made-up home folder in the fixture's sample paths (workspace, projects, factory.db): not this machine's home, nothing real behind it; new fixtures use /Users/me"
condition = "AND"
paths = ['''^app/test/map_fixture\.dart$''']
regexTarget = "match"
regexes = ['''^/Users/matt$''']

[[rules.allowlists]]
description = "The vault import card's test fixtures as first committed (e66975c8): a made-up /Users/matt home in app/test/secrets_test.dart's sample files (release.p12, key.properties, a right-to-left-override .ssh name), not this machine's home, nothing real behind it. That commit only: they were fixed to /Users/me in c3f3577f"
condition = "AND"
commits = ["e66975c869821b1f651e500c8262227aaea3e5c2"]
paths = ['''^app/test/secrets_test\.dart$''']
regexTarget = "match"
regexes = ['''^/Users/matt$''']

[[rules.allowlists]]
description = "Execute cards' environment test as first committed (b1f8c3ac): a made-up HOME of /Users/matt among factoryd's sample variables in crates/factoryd/src/command_cards.rs, not this machine's home, nothing real behind it. That commit only: it was fixed to /Users/me later (Bruno 37069)"
condition = "AND"
commits = ["b1f8c3ac4e1968c4324b8b32f8ae802d9ae863b1"]
paths = ['''^crates/factoryd/src/command_cards\.rs$''']
regexTarget = "match"
regexes = ['''^/Users/matt$''']

[[rules.allowlists]]
description = "c3f3577f's commit message names the made-up home its fix replaced in those fixtures: that one subject line, exactly"
regexTarget = "line"
regexes = ['''secrets_test: import-card fixtures use the placeholder home /Users/me, not /Users/matt \(check-secrets home-path rule\)''']

# The MLS working group's public interoperability vectors for RFC 9420
# (github.com/mlswg/mls-implementations, test-vectors/), suite 1 only, which
# claktory-dm-crypto's tests run (Fugo's condition for E1): their private keys
# and secrets are published test values, in hex.
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "RFC 9420's published interop vectors (mlswg/mls-implementations test-vectors at 2034fe72, suite 1) in claktory-dm-crypto's tests: the vectors' own test keys and secrets, lowercase hex, in those files only"
condition = "AND"
paths = ['''^crates/claktory-dm-crypto/tests/vectors/rfc9420/[a-z-]+\.json$''']
regexTarget = "secret"
regexes = ['''^[0-9a-f]{16,}$''']

[[rules.allowlists]]
description = "Cargo.lock (the workspace's and the app's Rust, app/rust) lists libcrux's crates (libcrux-secrets, then libcrux-sha3), which the generic rule reads as a key named secrets: crate names in the lock file only"
condition = "AND"
paths = ['''^(?:app/rust/)?Cargo\.lock$''']
regexTarget = "secret"
regexes = ['''^libcrux-[a-z0-9-]+$''']

[[rules.allowlists]]
description = "app/android/DESIGN.md names the Android Keystore alias of the direct-message keys, claktory.dm.v1, after the words 'key of their own': an alias, no key material"
condition = "AND"
paths = ['''^app/android/DESIGN\.md$''']
regexTarget = "secret"
regexes = ['''^claktory\.dm\.v1$''']

[[rules.allowlists]]
description = "Web search's fixtures as first committed (a11d340e, before Giorno's scrub 9ad0b811): Ecosia's and Yahoo's public page identifiers (DataDome client key, Braze SDK key, Tag Manager environment, Yahoo's hashKey), never credentials of ours. That commit, and 58bd5c9f, the public repository's v0.1.17 commit, which published them as they were then (a release's public history is scanned too). Those commits only: the fixtures as they are now are zeroed, and their guard test refuses new ones"
condition = "AND"
commits = ["a11d340e08ed655643f277fdba1677a62a0805e8", "58bd5c9f5540f527e2c84f496f05b920855e38e0"]
paths = ['''^crates/factoryd/tests/fixtures/web/(?:ecosia|yahoo)-results\.html$''']
regexTarget = "secret"
regexes = ['''^(?:32FD9D46AF889F2B9903ED03CE0B3C|ce0dc535-dc9e-42a0-afe7-a88335a378d4|yQLXq56VlYmlCpsDKUq5-Q|b8de5b4c1b8afc8e080b5914d595c6da)$''']

[[rules.allowlists]]
description = "The browser runner's wire test (crates/factoryd/src/browser_runner/wire.rs, since 0960b442): a made-up download GUID written in upper case, one of the values the test checks is refused (GUIDs must be lower case); no credential"
condition = "AND"
paths = ['''^crates/factoryd/src/browser_runner/wire\.rs$''']
regexTarget = "secret"
regexes = ['''^3F1C9A2E-0B6D-4E8F-9A1B-2C3D4E5F6A7B$''']

[[rules.allowlists]]
description = "Yahoo's result page names a page module, assetKey \"stickyHeaderV2\", which the generic rule reads as a key: a module name, in web search's Yahoo fixture only (#257)"
condition = "AND"
paths = ['''^crates/factoryd/tests/fixtures/web/yahoo-results\.html$''']
regexTarget = "secret"
regexes = ['''^stickyHeaderV2$''']

# Exceptions. One here, at the top level, names exact values only: given
# paths, gitleaks (8.30) skips those files whole, whatever its condition. One
# that holds only in some files goes under its rule, as above, where the
# paths and the values must both match.

[[allowlists]]
description = "Sec-WebSocket-Key: a random nonce each WebSocket handshake sends, never a credential (RFC 6455's sample in crates/factoryd/tests/origin.rs, recorded handshakes in the Codex WebSocket fixtures)"
regexTarget = "line"
regexes = ['''(?i)sec-websocket-key''']

[[allowlists]]
description = "The Codex test fixtures' fake ChatGPT token: an unsigned JWT (alg none, signature 'sig') for the made-up account acct_123"
regexTarget = "secret"
regexes = ['''^eyJhbGciOiJub25lIn0\.eyJodHRwczovL2FwaS5vcGVuYWkuY29tL2F1dGgiOnsiY2hhdGdwdF9hY2NvdW50X2lkIjoiYWNjdF8xMjMifX0\.sig$''']

[[allowlists]]
description = "The secrets tests' made-up values (vault, bash's secrets and the pipes test's outbox file): a fake Stripe-shaped key, a fake Resend key and AWS's documented sample secret key, cut short, with a dash variant for a file's content; they only check that values are hidden in output, sealed on disk and refused through a pipe"
regexTarget = "secret"
regexes = ['''^(?:sk_live_4f9a8b7c6d5e4f3a2b1c|re_123456789abcdef|wJalrXUtnFEMI[/-]K7MDENG)$''']

[[allowlists]]
description = "Made-up tokens in tests: the hex digits in order, alone (the pairing tests' example both the backend and the app work the four-digit approval number out from, #132) or after a short prefix (the vault tests' fake keys, asc- and hz-)"
regexTarget = "secret"
regexes = ['''^(?:[a-z]{2,3}-)?0123456789abcdef$''']

[[allowlists]]
description = "The Android credential tests' made-up secrets (CredentialStoreTest.kt, KeystoreStoreTest.kt): base64 of the plain words iroh-key-secret and iroh-instrumentation, values the tests check never appear unsealed on disk; no credential behind them"
regexTarget = "secret"
regexes = ['''^(?:aXJvaC1rZXktc2VjcmV0|aXJvaC1pbnN0cnVtZW50YXRpb24=)$''']

[[allowlists]]
description = "The account-root ceremony test's service key (crates/claktory-account/src/protocol.rs, a_statement_signed_with_openssl_as_the_ceremony_does_holds, since 97fc7f2c): the bytes 0x00 to 0x1f in order, base64url, standing in for a service's Ed25519 public key in a key statement. A public key's place, counting bytes, no private material; the statement's real keys come from the service, never the repository"
regexTarget = "secret"
regexes = ['''^AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8$''']

[[allowlists]]
description = "Development-history commits (move docs, re-pathing code and app tests, #217 cycle) that carried this machine's user name and home paths before the v0.1.14 cut fixed the files to placeholder homes. The public repository receives one squashed tree per release, never this history; these commits' trees were never published. Exact commits only, nothing after the fix may use this."
commits = [
  "2328b697fb0c386b1575dd118f6034df1bb095a8",
  "0a25d1cbcaac2f2a541e35cb5352948a53f44b8a",
  "329ff9b097d1982351dcb81ae43f11490931c3ce",
  "edf589a42a22e181f2891445f3889504b66600c7",
  "ed65977625b7639ec63805d9f6bc2abc0b2387d2",
  "b0de673ad11f298bf55cc822dfb2e6fdd1e05555",
  "94266178fd45504f72941283f6891f43c6f821a8",
  "6345f3678176965a600332e446880180c2954558",
]
[[allowlists]]
description = "People's device-name tests (app/test/chat_test.dart, app/test/messages_setup_test.dart) as first written in 4b32c16c: a made-up device named after this machine's user, a label only, no path or credential; renamed to Ana's Mac Studio right after. That commit only: the files as they are now are checked like any other."
condition = "AND"
commits = ["4b32c16c86ccbea009c2685d9613ef1bf4f1a2f4"]
paths = ['''^app/test/(?:chat|messages_setup)_test\.dart$''']
[[allowlists]]
description = "Move S3's report test (crates/factoryd/tests/all/move_rivet.rs) as first written: a made-up mapping from /Users/matt to /root, the person's name rather than this machine's home, fixed to /Users/me right after. These two commits only; the file as it is now is checked like any other."
commits = [
  "84a077dd9ed34b9dd33e045befb29ecd2a58d8b4",
  "33f7b58a8fbd65fea5e7d25c598465b6ef64fdae",
]
[[allowlists]]
description = "The redactor tests' made-up PEM keys (crates/factory-agent/src/secrets.rs, a_pem_keys_armor_stays_and_its_body_is_hidden): an OpenSSH armor around only the format's fixed header (openssh-key-v1, cipher none, one key) or around the words 'ssh-ed25519 … Claktory Test Key Only Fake Key' in base64, written with \\n escapes in a Rust string; no key material"
regexTarget = "secret"
regexes = ['''^-----BEGIN OPENSSH PRIVATE KEY-----\\n(?:b3BlbnNzaC1rZXktdjEAAAAABG5vbmUA\\nAAAEbm9uZQAAAAAAAAABAAAAMwAAAAtz\\n-----END|c3NoLWVkMjU1MTkAAAAgQ2xha3Rvcnkg\\n(?:VGVzdCBLZXkgT25seSBGYWtlIEtleQ==\\n-----END|";\n))''']
[[allowlists]]
description = "scripts/sign-clapp.sh's check for an OpenSSH key file: the armor line as a grep pattern, followed by the script's own shell and Python (which converts the key it's given), not a key"
regexTarget = "secret"
regexes = ['''^-----BEGIN OPENSSH PRIVATE KEY-----' "\$key"; then\n  python3 - "\$key" "\$work/key\.pem" <<'PY'\n''']
[[allowlists]]
description = "The recovery key tests' made-up key (app/test/recovery_key_test.dart): the alphabet and digits in order, in the recovery key's groups of four"
regexTarget = "secret"
regexes = ['''^ABCD-EFGH-JKLM-NPQR-STUV-WXYZ-2345-6789$''']
